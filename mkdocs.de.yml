site_name: BaseHarbor
site_description: Sichere, modulare, selbst gehostete Backend-Infrastruktur für unabhängige Anwendungen.
site_url: https://mcpdev80.github.io/baseharbor/de/
repo_url: https://github.com/mcpdev80/baseharbor
repo_name: mcpdev80/baseharbor
docs_dir: docs/de
site_dir: site/de

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Zum hellen Modus wechseln

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra:
  alternate:
    - name: English
      link: /baseharbor/
      lang: en
    - name: Deutsch
      link: /baseharbor/de/
      lang: de

nav:
  - Start: index.md
  - Einstieg: repository-application-workflow.md
  - Anwendungsvertrag: application-contract.md
  - CLI: cli.md
  - Control Plane: runtime-compose.md
  - Secrets: secrets-and-openbao.md
  - Backup & Restore: backup-and-restore.md
  - Releases: releases.md
  - Architektur: architecture.md
  - Roadmap: roadmap.md
