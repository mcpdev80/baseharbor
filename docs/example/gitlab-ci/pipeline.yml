# GitLab CI consumption example (documentation)
#
# Illustrates how a GitLab CI pipeline consumes an already produced BaseHarbor
# release. It is documentation, not a BaseHarbor test gate: it builds nothing,
# contains no secrets, and does not trigger a real environment.
#
# Replace <X.Y.Z> with the release the acceptance gate accepted, and set the
# masked variable BASEHARBOR_API_KEY in the project settings, not here.

variables:
  BASEHARBOR_VERSION: "<X.Y.Z>"
  BASEHARBOR_IMAGE: "ghcr.io/mcpdev80/baseharbor-runtime:<X.Y.Z>"
  TARGET: "docker"

stages:
  - verify
  - seed
  - accept
  - teardown

.default:
  image: "${BASEHARBOR_IMAGE}"
  tags:
    - shared

inspect:
  extends: .default
  stage: verify
  script:
    - "baha version"
    - "baha --no-input app inspect . --plain"
    - "baha --no-input app inspect . -o json > inspection.json"
    - "test -s inspection.json"

plan:
  extends: .default
  stage: verify
  needs: ["inspect"]
  script:
    - "baha --no-input app plan -o json > plan.json"
    - "test -s plan.json"

seed:
  extends: .default
  stage: seed
  needs: ["plan"]
  script:
    - "printf '%s' \"$BASEHARBOR_API_KEY\" | baha --no-input app secret set API_KEY --stdin"

accept:
  extends: .default
  stage: accept
  needs: ["seed"]
  when: on_manual
  script:
    - "baha --no-input app preflight"
    - "timeout 300 baha --no-input app apply --yes"
    - "timeout 120 baha --no-input app status -o json > status.json"
    - "test -s status.json"
    - "baha --no-input app env dev --format json"
    - "baha --no-input app creds postgres"

teardown:
  extends: .default
  stage: teardown
  needs: ["accept"]
  when: always
  script:
    - "baha --no-input app down --yes"
