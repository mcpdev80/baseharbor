site_name: BaseHarbor
site_description: Secure, modular, self-hosted backend infrastructure for independent applications.
site_url: https://mcpdev80.github.io/baseharbor/
repo_url: https://github.com/mcpdev80/baseharbor
repo_name: mcpdev80/baseharbor
docs_dir: docs
site_dir: site
exclude_docs: |
  de/**
  internal/**

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra:
  alternate:
    - name: English
      link: /baseharbor/
      lang: en
    - name: Deutsch
      link: /baseharbor/de/
      lang: de

nav:
  - Home: index.md
  - Tutorial:
      - Getting started: tutorials/getting-started.md
  - How-to:
      - Environments: how-to/environments.md
      - PostgreSQL: how-to/postgres.md
      - Cache: how-to/cache.md
      - Secrets: how-to/secrets.md
      - Dynamic application secrets: how-to/dynamic-application-secrets.md
      - Object storage: how-to/object-storage.md
      - Observability: how-to/observability.md
      - Developer access: how-to/developer-access.md
      - Backup & restore: how-to/backup-restore.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Targets and deployment destinations: explanation/targets.md
      - Application contract: explanation/application-contract.md
      - Providers: explanation/providers.md
      - Security: explanation/security.md
      - Authentication: explanation/authentication.md
  - Reference:
      - CLI: reference/cli.md
      - Manifest: reference/manifest.md
      - MCP: reference/mcp.md
      - Errors: reference/errors.md
      - Application secret API: reference/application-secret-api.md
      - Authentication & API errors: reference/authentication-and-api-errors.md
      - Backup & restore: reference/backup-and-restore.md
      - PostgreSQL & migrations: reference/postgresql-and-migrations.md
      - Compose runtime: reference/runtime-compose.md
      - Runtime Resource API: reference/runtime-resource-api.md
      - Runtime secret broker: reference/runtime-secret-broker.md
      - Secrets & OpenBao: reference/secrets-and-openbao.md
      - Releases: reference/releases.md
  - Specifications:
      - Overview: spec/README.md
      - Application Contract v1: spec/application-contract-v1.md
      - Provider Contract v1: spec/provider-contract-v1.md
      - Reconciliation v1: spec/reconciliation-v1.md
      - Machine Interface v1: spec/machine-interface-v1.md
      - Security invariants: spec/security-invariants.md
      - Input resolution: spec/input-resolution.md
      - Control-plane runtime: spec/control-plane-runtime.md
      - Application Runtime Broker: spec/application-runtime-broker.md
      - Application runtime identity: spec/application-runtime-identity.md
      - Runtime broker security: spec/runtime-secret-broker-security.md
  - Decisions: decisions/index.md
  - Release notes: releases/index.md
  - Roadmap: roadmap.md
  - Documentation style: STYLE_GUIDE.md
