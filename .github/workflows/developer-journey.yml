name: developer-journey

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailflow-happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
      BASEHARBOR_STATE_DIR: /tmp/baseharbor-developer-journey/runtime

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build exact BaseHarbor CLI under test
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/baha ./cmd/baha

      - name: Build exact runtime broker image under test
        run: |
          mkdir -p /tmp/baseharbor-runtime-image
          cp /tmp/baha /tmp/baseharbor-runtime-image/baha
          cp deploy/control-plane/Dockerfile.binary /tmp/baseharbor-runtime-image/Dockerfile
          docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" /tmp/baseharbor-runtime-image

      - name: Occupy common control-plane ports
        run: |
          docker run -d --name baseharbor-port-5432 -p 127.0.0.1:5432:80 nginx:alpine
          docker run -d --name baseharbor-port-8200 -p 127.0.0.1:8200:80 nginx:alpine

      - name: Clone reference application from main
        run: git clone --depth 1 --branch main https://github.com/mcpdev80/MAILFLOW-AI_MAILING.git /tmp/mailflow

      - name: Prove one-command startup with generated secrets and safe port recovery
        working-directory: /tmp/mailflow
        run: |
          umask 077
          /tmp/baha app plan | tee /tmp/developer-journey-plan.out
          grep -q 'SECRET_KEY' /tmp/developer-journey-plan.out

          /tmp/baha up --yes --recovery-file /tmp/developer-journey-openbao-recovery.json | tee /tmp/developer-journey-up.out
          grep -q 'Application repository detected: mailflow' /tmp/developer-journey-up.out
          grep -q 'OpenBao is not initialized; bootstrapping managed secrets' /tmp/developer-journey-up.out
          grep -q 'Converging application backend and workload' /tmp/developer-journey-up.out
          grep -q 'Application mailflow is ready' /tmp/developer-journey-up.out

          test -f /tmp/developer-journey-openbao-recovery.json
          test -f "$BASEHARBOR_STATE_DIR/runtime.env"
          test -f "$BASEHARBOR_STATE_DIR/compose.yaml"
          ! grep -q '^BASEHARBOR_POSTGRES_PORT=5432$' "$BASEHARBOR_STATE_DIR/runtime.env"
          ! grep -q '^BASEHARBOR_OPENBAO_PORT=8200$' "$BASEHARBOR_STATE_DIR/runtime.env"
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

          /tmp/baha app status | tee /tmp/developer-journey-status.out
          grep -Eq '^\[OK\] workload/api +running health=healthy$' /tmp/developer-journey-status.out
          grep -Eq '^\[OK\] workload/edge +running .*exposure=http://127\.0\.0\.1:80 HTTP 30[1278].*exposure=https://127\.0\.0\.1:443 HTTP 2[0-9][0-9]$' /tmp/developer-journey-status.out
          grep -Eq '^\[OK\] workload/web +running$' /tmp/developer-journey-status.out
          grep -Eq '^\[OK\] workload/worker +running$' /tmp/developer-journey-status.out
          grep -Fq '[OK] workload          4/4 selected Compose service(s) ready' /tmp/developer-journey-status.out

          /tmp/baha app doctor | tee /tmp/developer-journey-doctor.out
          grep -q 'Application runtime is healthy' /tmp/developer-journey-doctor.out
          grep -Eq '^\[OK\] api +running health=healthy$' /tmp/developer-journey-doctor.out
          grep -Eq '^\[OK\] edge +running .*exposure=http://127\.0\.0\.1:80 HTTP 30[1278].*exposure=https://127\.0\.0\.1:443 HTTP 2[0-9][0-9]$' /tmp/developer-journey-doctor.out

          /tmp/baha app show | tee /tmp/developer-journey-show.out
          grep -Fq 'Application: mailflow' /tmp/developer-journey-show.out
          grep -Fq 'Environment: production' /tmp/developer-journey-show.out
          grep -Fq 'Status: READY' /tmp/developer-journey-show.out
          grep -Eq '^  PostgreSQL +default +healthy$' /tmp/developer-journey-show.out
          grep -Eq '^  Valkey +default +healthy$' /tmp/developer-journey-show.out
          grep -Eq '^  api +running health=healthy$' /tmp/developer-journey-show.out
          grep -Eq '^  edge +running .*exposure=http://127\.0\.0\.1:80 HTTP 30[1278].*exposure=https://127\.0\.0\.1:443 HTTP 2[0-9][0-9]$' /tmp/developer-journey-show.out
          grep -Eq '^  required +1$' /tmp/developer-journey-show.out
          grep -Eq '^  ready +1$' /tmp/developer-journey-show.out
          ! grep -Fq 'SECRET_KEY' /tmp/developer-journey-show.out
          ! grep -Fq 'postgres://' /tmp/developer-journey-show.out
          ! grep -Fq 'redis://' /tmp/developer-journey-show.out

      - name: Verify real repository workload and managed backends
        working-directory: /tmp/mailflow
        run: |
          workload_project=baseharbor-workload-mailflow-production
          services=$(docker ps --filter "label=com.docker.compose.project=$workload_project" --format '{{.Label "com.docker.compose.service"}}' | sort)
          printf '%s\n' "$services"
          printf '%s\n' "$services" | grep -qx 'api'
          printf '%s\n' "$services" | grep -qx 'edge'
          printf '%s\n' "$services" | grep -qx 'web'
          printf '%s\n' "$services" | grep -qx 'worker'

          api_id=$(docker ps --filter "label=com.docker.compose.project=$workload_project" --filter 'label=com.docker.compose.service=api' -q)
          test -n "$api_id"
          docker exec "$api_id" python -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{64}", os.environ["SECRET_KEY"]); assert "@postgres:5432/" in os.environ["DATABASE_URL"]; assert "@valkey:6379/0" in os.environ["REDIS_URL"]'

      - name: Verify MailFlow app-owned HTTP and TLS exposure
        working-directory: /tmp/mailflow
        run: |
          curl --fail --silent --show-error --head --resolve localhost:80:127.0.0.1 http://localhost/ | tee /tmp/mailflow-http-headers.out
          grep -Eq '^HTTP/.* 30[1278]' /tmp/mailflow-http-headers.out
          curl --fail --silent --show-error --insecure --location --resolve localhost:443:127.0.0.1 https://localhost/ --output /tmp/mailflow-home.html
          test -s /tmp/mailflow-home.html
          openssl s_client -connect 127.0.0.1:443 -servername localhost </dev/null 2>/tmp/mailflow-tls.err | grep -q 'BEGIN CERTIFICATE'

      - name: Prove restart lifecycle preserves application state contract
        working-directory: /tmp/mailflow
        run: |
          /tmp/baha app down | tee /tmp/developer-journey-down.out
          grep -q 'Persistent data is preserved' /tmp/developer-journey-down.out
          test -z "$(docker ps -q --filter label=com.docker.compose.project=baseharbor-workload-mailflow-production)"

          /tmp/baha up --yes | tee /tmp/developer-journey-restart.out
          grep -q 'Application mailflow is ready' /tmp/developer-journey-restart.out
          /tmp/baha app doctor | grep -q 'Application runtime is healthy'

      - name: Diagnostics on failure
        if: failure()
        working-directory: /tmp/mailflow
        run: |
          printf '%s\n' '--- BaseHarbor control plane ---'
          docker ps -a --filter label=com.docker.compose.project=baseharbor || true
          printf '%s\n' '--- MailFlow workload ---'
          docker ps -a --filter label=com.docker.compose.project=baseharbor-workload-mailflow-production || true
          printf '%s\n' '--- MailFlow backend ---'
          docker ps -a --filter label=com.docker.compose.project=baseharbor-mailflow-production || true
          /tmp/baha app status || true
          /tmp/baha app doctor || true
          /tmp/baha app show || true

      - name: Cleanup
        if: always()
        working-directory: /tmp/mailflow
        run: |
          /tmp/baha app destroy --yes || true
          if [ -f "$BASEHARBOR_STATE_DIR/compose.yaml" ] && [ -f "$BASEHARBOR_STATE_DIR/runtime.env" ]; then
            docker compose --project-name baseharbor --file "$BASEHARBOR_STATE_DIR/compose.yaml" --env-file "$BASEHARBOR_STATE_DIR/runtime.env" down -v || true
          fi
          docker rm -f baseharbor-port-5432 baseharbor-port-8200 || true
          rm -f /tmp/developer-journey-openbao-recovery.json
