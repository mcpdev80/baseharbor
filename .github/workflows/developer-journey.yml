name: developer-journey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailflow-happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
      BASEHARBOR_STATE_DIR: /tmp/baseharbor-developer-journey/runtime

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build exact BaseHarbor artifacts
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/baha ./cmd/baha
          mkdir -p /tmp/baseharbor-runtime-image
          cp /tmp/baha /tmp/baseharbor-runtime-image/baha
          cp deploy/control-plane/Dockerfile.binary /tmp/baseharbor-runtime-image/Dockerfile
          docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" /tmp/baseharbor-runtime-image

      - name: Prepare realistic host constraints and MailFlow
        run: |
          docker run -d --name baseharbor-port-5432 -p 127.0.0.1:5432:80 nginx:alpine
          docker run -d --name baseharbor-port-8200 -p 127.0.0.1:8200:80 nginx:alpine
          git clone --depth 1 --branch main https://github.com/mcpdev80/MAILFLOW-AI_MAILING.git /tmp/mailflow

      - name: Prove current developer journey
        working-directory: /tmp/mailflow
        run: |
          set -euo pipefail
          umask 077

          /tmp/baha app plan | tee /tmp/journey-plan.out
          grep -q 'SECRET_KEY' /tmp/journey-plan.out

          /tmp/baha up --yes --recovery-file /tmp/journey-openbao-recovery.json | tee /tmp/journey-up.out
          grep -q 'Application repository detected: mailflow' /tmp/journey-up.out
          grep -q 'application and requested infrastructure verified' /tmp/journey-up.out
          test -f /tmp/journey-openbao-recovery.json
          test -f "$BASEHARBOR_STATE_DIR/runtime.env"
          ! grep -q '^BASEHARBOR_POSTGRES_PORT=5432$' "$BASEHARBOR_STATE_DIR/runtime.env"
          ! grep -q '^BASEHARBOR_OPENBAO_PORT=8200$' "$BASEHARBOR_STATE_DIR/runtime.env"

          /tmp/baha app status | tee /tmp/journey-status.out
          grep -Eq '^  READY +workload/api +running health=healthy$' /tmp/journey-status.out
          grep -Eq '^  READY +workload/edge +running exposure=http://localhost:8080 HTTP 30[1278]$' /tmp/journey-status.out
          grep -Eq '^ +exposure=https://localhost:8443 HTTP 2[0-9][0-9]$' /tmp/journey-status.out
          grep -Eq '^  READY +workload/web +running$' /tmp/journey-status.out
          grep -Eq '^  READY +workload/worker +running$' /tmp/journey-status.out
          grep -Eq '^  READY +workload +4/4 selected Compose service\(s\) ready$' /tmp/journey-status.out

          /tmp/baha app doctor | tee /tmp/journey-doctor.out
          grep -q '^READY$' /tmp/journey-doctor.out

          /tmp/baha app show | tee /tmp/journey-show.out
          grep -Fq 'Application: mailflow' /tmp/journey-show.out
          grep -Fq 'Environment: dev' /tmp/journey-show.out
          grep -Fq 'Status: READY' /tmp/journey-show.out
          grep -Eq '^  required +5$' /tmp/journey-show.out
          grep -Eq '^  ready +5$' /tmp/journey-show.out
          ! grep -Fq 'SECRET_KEY' /tmp/journey-show.out
          ! grep -Fq 'postgres://' /tmp/journey-show.out
          ! grep -Fq 'redis://' /tmp/journey-show.out

          workload_project=baseharbor-workload-mailflow-dev
          services=$(docker ps --filter "label=com.docker.compose.project=$workload_project" --format '{{.Label "com.docker.compose.service"}}' | sort)
          for service in api edge web worker; do printf '%s\n' "$services" | grep -qx "$service"; done

          curl --fail --silent --show-error --head --resolve localhost:8080:127.0.0.1 http://localhost:8080/ | grep -Eq '^HTTP/.* 30[1278]'
          curl --fail --silent --show-error --insecure --location --resolve localhost:8443:127.0.0.1 https://localhost:8443/ --output /tmp/mailflow-home.html
          test -s /tmp/mailflow-home.html
          openssl s_client -connect 127.0.0.1:8443 -servername localhost </dev/null 2>/tmp/mailflow-tls.err | grep -q 'BEGIN CERTIFICATE'

          /tmp/baha app down | tee /tmp/journey-down.out
          grep -q 'persistent data preserved' /tmp/journey-down.out
          test -z "$(docker ps -q --filter label=com.docker.compose.project=baseharbor-workload-mailflow-dev)"

          /tmp/baha up --yes | tee /tmp/journey-restart.out
          grep -q 'application and requested infrastructure verified' /tmp/journey-restart.out
          /tmp/baha app doctor | grep -q '^READY$'

      - name: Diagnostics on failure
        if: failure()
        working-directory: /tmp/mailflow
        run: |
          docker ps -a || true
          /tmp/baha app status || true
          /tmp/baha app doctor || true
          /tmp/baha app show || true

      - name: Cleanup
        if: always()
        working-directory: /tmp/mailflow
        run: |
          /tmp/baha app destroy --yes || true
          if [ -f "$BASEHARBOR_STATE_DIR/compose.yaml" ] && [ -f "$BASEHARBOR_STATE_DIR/runtime.env" ]; then
            docker compose --project-name baseharbor --file "$BASEHARBOR_STATE_DIR/compose.yaml" --env-file "$BASEHARBOR_STATE_DIR/runtime.env" down -v || true
          fi
          docker rm -f baseharbor-port-5432 baseharbor-port-8200 || true
          rm -f /tmp/journey-openbao-recovery.json
