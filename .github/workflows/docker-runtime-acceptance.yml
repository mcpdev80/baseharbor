name: "Runtime · Docker Core"

run-name: "Runtime · Docker Core · ${{ inputs.ref || github.ref_name }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: release/v0.4.21
        type: string

  push:
    branches:
      - 'runtime-validation/docker/**'

concurrency:
  group: ${{ github.workflow }}-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-runtime:
    if: github.event_name != 'push' || !startsWith(github.ref_name, 'runtime-validation/docker/provider-ha/')
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
      BASEHARBOR_PROVIDER_VALKEY_SCOPE: application
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 75

    steps:
      - name: Checkout requested ref
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build BaseHarbor
        id: build
        run: go build -trimpath -o /tmp/baha ./cmd/baha

      - name: Diagnose runner rootless Docker prerequisites
        id: runtime_diagnostics
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          {
            runner_uid="$(id -u)"
            printf 'Runner UID: %s\n' "$runner_uid"
            expected_socket="/run/user/$runner_uid/docker.sock"
            if [ -S "$expected_socket" ]; then
              printf 'Expected rootless socket: present (socket)\n'
            elif [ -e "$expected_socket" ] || [ -L "$expected_socket" ]; then
              printf 'Expected rootless socket: present (not a socket)\n'
            else
              printf 'Expected rootless socket: absent\n'
            fi
            if command -v systemctl >/dev/null 2>&1 && command -v timeout >/dev/null 2>&1; then
              timeout --signal=TERM --kill-after=2s 10s systemctl --user show docker.service \
                -p LoadState -p ActiveState -p SubState -p FragmentPath --no-pager || \
                printf 'User Docker service metadata unavailable (status %s)\n' "$?"
            else
              printf 'User Docker service metadata unavailable (systemctl or timeout missing)\n'
            fi
          } 2>&1 | tee /tmp/docker-runner-diagnostics.txt

      - name: Verify selected rootless Docker before cleanup
        id: runtime_preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -gt 0
          test "$(id -u)" -le 65000
          /tmp/baha doctor --json > /tmp/docker-engine-preflight.json
          endpoint="$(python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/docker-engine-preflight.json').read_text())
          engine = report.get('docker_engine') or {}
          endpoint = engine.get('endpoint', '')
          if (engine.get('verified') is not True or engine.get('mode') != 'rootless'
                  or not engine.get('daemon_id') or not endpoint.startswith('unix:///')
                  or any(c in endpoint for c in '\r\n\x00')):
              raise SystemExit('Selected rootless Docker is unavailable or unverifiable; repair its daemon/socket before retrying. No engine fallback.')
          print(endpoint)
          PYTHON
          )"
          export DOCKER_HOST="$endpoint"
          export DOCKER_CONTEXT=
          docker --host "$endpoint" compose version
          printf 'DOCKER_HOST=%s\nDOCKER_CONTEXT=\n' "$endpoint" >> "$GITHUB_ENV"

      - name: Reset persistent runner state
        id: reset
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Verify Docker runtime detection
        id: runtime_detection
        shell: bash
        run: |
          set -euo pipefail
          /tmp/baha doctor --json | tee /tmp/docker-doctor.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path('/tmp/docker-doctor.json').read_text())
          engine = report.get('docker_engine') or {}
          original = json.loads(Path('/tmp/docker-engine-preflight.json').read_text()).get('docker_engine') or {}
          checks = report.get('checks') or []
          names = [check.get('name') for check in checks]
          if (engine.get('verified') is not True or engine.get('mode') != 'rootless'
                  or engine.get('endpoint') != os.environ['DOCKER_HOST']
                  or not engine.get('daemon_id')
                  or engine.get('daemon_id') != original.get('daemon_id')
                  or len(names) != len(set(names))
                  or not {'os', 'Docker engine', 'core-deployment'} <= set(names)
                  or any(check.get('ready') is not True for check in checks)
                  or report.get('ready') is not False):
              raise SystemExit('Docker prerequisite failed: require the verified rootless engine and an absent Core after runner reset.')
          PYTHON

      - name: Run runtime integration tests serially
        id: runtime_integration
        env:
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
        run: go test -p 1 ./cmd/baha ./internal/application -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestRepositoryBuildWorkloadRebuildsSourceChangesInCI|TestMultiInstanceComposeLifecycleInCI)$' -count=1 -v

      - name: Capture Docker control-plane diagnostics
        if: failure() && steps.runtime_integration.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Docker control-plane diagnostics"
          docker ps -a || true
          docker logs bh-local-shared-postgres-1 2>&1 || true
          docker logs bh-local-shared-openbao-1 2>&1 || true
          echo "::endgroup::"

      - name: Reset runtime state before recovery test
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Verify control-plane recovery
        id: recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real workload log ingestion
        id: log_ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real trace ingestion
        id: trace_ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - name: Cleanup Docker runtime
        id: cleanup
        if: always() && steps.runtime_preflight.outcome == 'success'
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Generate Docker runtime evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/docker-runtime-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Runner reset	${{ steps.reset.outcome }}	Docker state reset before validation
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runner diagnostics	${{ steps.runtime_diagnostics.outcome }}	Read-only UID, socket type and user-service metadata; not runtime acceptance
          Engine preflight	${{ steps.runtime_preflight.outcome }}	Verified selected rootless Docker and Compose before cleanup
          Runtime detection	${{ steps.runtime_detection.outcome }}	Structured Doctor verifies the same engine and absent Core after reset
          Runtime integration	${{ steps.runtime_integration.outcome }}	real repository and Compose lifecycle integration
          Control-plane recovery	${{ steps.recovery.outcome }}	operator-held recovery/unseal behavior
          Log ingestion	${{ steps.log_ingestion.outcome }}	real workload logs into managed Loki
          Trace ingestion	${{ steps.trace_ingestion.outcome }}	real OTLP trace into managed Tempo
          EOF
          cat >>"$rows" <<EOF
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Docker runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/docker-runtime-evidence/logs"
          cp /tmp/docker-*.txt /tmp/docker-*.json "$RUNNER_TEMP/docker-runtime-evidence/logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/docker-runtime-evidence" \
            "BaseHarbor Docker Runtime Evidence" \
            "docker-runtime-acceptance" \
            "$EVIDENCE_REF" \
            "$(git rev-parse HEAD)" \
            "$rows"

      - name: Upload Docker runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-runtime-evidence
          if-no-files-found: error
          retention-days: 30


  provider-ha:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/docker/provider-ha/')
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(contains(github.ref_name, '/control-plane/') && '["control-plane"]' || contains(github.ref_name, '/keycloak/') && '["keycloak"]' || contains(github.ref_name, '/mongodb/') && '["mongodb"]' || contains(github.ref_name, '/valkey/') && '["valkey"]' || contains(github.ref_name, '/rabbitmq/') && '["rabbitmq"]' || contains(github.ref_name, '/seaweedfs/') && '["seaweedfs"]' || contains(github.ref_name, '/otel/') && '["otel"]' || contains(github.ref_name, '/prometheus/') && '["prometheus"]' || contains(github.ref_name, '/loki/') && '["loki"]' || contains(github.ref_name, '/tempo/') && '["tempo"]' || contains(github.ref_name, '/gateway/') && '["gateway"]' || '["rabbitmq","valkey","mongodb","seaweedfs","gateway"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
      BASEHARBOR_PROVIDER_VALKEY_SCOPE: application

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Docker runtime
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Run provider HA acceptance
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.provider }}" in
            rabbitmq)
              export BASEHARBOR_RABBITMQ_HA_ACCEPTANCE=1
              test_package=./internal/application
              test_name=TestRabbitMQHARuntimeFailoverAcceptanceInCI
              ;;
            valkey)
              export BASEHARBOR_VALKEY_HA_ACCEPTANCE=1
              test_package=./internal/application
              test_name=TestValkeyHARuntimeFailoverAcceptanceInCI
              ;;
            mongodb)
              export BASEHARBOR_MONGODB_HA_ACCEPTANCE=1
              test_package=./internal/application
              test_name=TestMongoDBHARuntimeFailoverAcceptanceInCI
              ;;
            control-plane)
              export BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE=true
              test_package=./cmd/baha
              test_name=TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile
              test_timeout=18m
              ;;
            keycloak)
              export BASEHARBOR_KEYCLOAK_HA_ACCEPTANCE=1
              test_package=./internal/identityprovider
              test_name=TestKeycloakHARuntimeFailoverAcceptanceInCI
              test_timeout=16m
              ;;
            seaweedfs)
              export BASEHARBOR_SEAWEEDFS_HA_ACCEPTANCE=1
              test_package=./internal/objectstorage
              test_name=TestSeaweedFSHARuntimeFailoverAcceptanceInCI
              ;;
            otel)
              export BASEHARBOR_OTEL_HA_ACCEPTANCE=1
              test_package=./internal/telemetry
              test_name=TestOTelHARuntimeFailoverAcceptanceInCI
              ;;
            prometheus)
              export BASEHARBOR_PROMETHEUS_HA_ACCEPTANCE=1
              test_package=./internal/metrics
              test_name=TestPrometheusHARuntimeFailoverAcceptanceInCI
              ;;
            loki)
              export BASEHARBOR_LOKI_HA_ACCEPTANCE=1
              test_package=./internal/logs
              test_name=TestLokiHARuntimeFailoverAcceptanceInCI
              ;;
            tempo)
              export BASEHARBOR_TEMPO_HA_ACCEPTANCE=1
              test_package=./internal/traces
              test_name=TestTempoHARuntimeFailoverAcceptanceInCI
              test_timeout=16m
              ;;
            gateway)
              export BASEHARBOR_GATEWAY_ACCEPTANCE=1
              test_package=./internal/devgateway
              test_name=TestGatewayRuntimeContinuityAcceptanceInCI
              ;;
            *)
              exit 2
              ;;
          esac
          test_timeout="${test_timeout:-10m}"
          go test "$test_package" -run "^${test_name}$" -count=1 -timeout "$test_timeout" -v

      - name: Cleanup Docker runtime
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker
