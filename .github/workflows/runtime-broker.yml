name: "Runtime · Broker"

run-name: "Runtime · Broker · ${{ inputs.mode }} · ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Broker validation mode
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - performance
      ref:
        description: Git ref or commit SHA to test
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    if: inputs.mode == 'acceptance'
    timeout-minutes: 30
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
      BASEHARBOR_TARGET: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare verified rootless runtime
        # The setuptool's systemd unit follows XDG_CONFIG_HOME at generation
        # time; clear the job-pinned state dirs so docker.service lands in
        # ~/.config/systemd/user where the user manager loads it.
        env:
          XDG_CONFIG_HOME: ''
          XDG_DATA_HOME: ''
        run: bash scripts/ci-core-rootless-runtime.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate broker fixture helpers
        run: python3 -m unittest scripts/test_ci_broker_project.py scripts/test_ci_broker_docs_url.py scripts/test_ci_broker_typed_consent.py scripts/test_ci_broker_mtls_rejection.py scripts/test_ci_podman_typed_consent.py -q

      - name: Build BaseHarbor and package exact tested binary
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/baha ./cmd/baha
          mkdir -p /tmp/baseharbor-runtime-image
          cp /tmp/baha /tmp/baseharbor-runtime-image/baha
          cp deploy/control-plane/Dockerfile.binary /tmp/baseharbor-runtime-image/Dockerfile
          docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" /tmp/baseharbor-runtime-image

      - name: Bootstrap isolated control plane
        run: |
          workdir=$(mktemp -d)
          printf '%s\n' "$workdir" > /tmp/baseharbor-broker-workdir
          cd "$workdir"
          rm -rf "$XDG_CONFIG_HOME/baseharbor" "$XDG_DATA_HOME/baseharbor"
          /tmp/baha target create ci --provider docker --access local-docker --reference local --scope default --default >/dev/null
          /tmp/baha up --control-plane-only --yes --postgres-port 15432 --openbao-port 18200
          # 'baha up' already bootstraps an uninitialized managed trust plane
          # (repository_up.go:198). Gate the explicit bootstrap on the ACTUAL
          # initialization state; a second initialize would hit the write-once
          # guard ("OpenBao is already initialized").
          if /tmp/baha openbao status --json 2>/dev/null | grep -q '"initialized":false'; then
            /tmp/baha openbao bootstrap --recovery-file "$workdir/openbao-recovery.json"
          fi
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

      - name: Create two isolated secret applications
        run: |
          set -eo pipefail
          workdir=$(cat /tmp/baseharbor-broker-workdir)
          cd "$workdir"

          apply_with_current_consent() {
            local plan consent result
            plan=$(mktemp)
            chmod 600 "$plan"
            /tmp/baha app plan "$1" -o json >"$plan" || { rm -f "$plan"; return 1; }
            consent=$(python3 "$GITHUB_WORKSPACE/scripts/ci-broker-typed-consent.py" "$plan") || { rm -f "$plan"; return 1; }
            rm -f "$plan"
            if [ "$consent" = none ]; then
              unset consent
              env -u BASEHARBOR_PROVIDER_CHANGE_CONSENT /tmp/baha --no-input app apply "$1"
              return $?
            fi
            BASEHARBOR_PROVIDER_CHANGE_CONSENT="$consent" /tmp/baha --no-input app apply "$1" || { result=$?; unset consent; return "$result"; }
            unset consent
          }
          record_project() {
            local app="$1"
            /tmp/baha app status "$app" -o json | python3 "$GITHUB_WORKSPACE/scripts/ci-broker-project.py" "$app" >"/tmp/${app}-project"
          }

          /tmp/baha app create broker-demo --sql --require-secret BOOTSTRAP_SECRET
          set +e
          apply_with_current_consent broker-demo >/tmp/broker-demo-required.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -Fq "Required application secret BOOTSTRAP_SECRET is missing." /tmp/broker-demo-required.out
          printf '%s' 'bootstrap-a' | /tmp/baha app secret set broker-demo BOOTSTRAP_SECRET --stdin
          apply_with_current_consent broker-demo | tee /tmp/broker-demo-apply.out
          grep -Eq "READY +runtime-broker +mTLS identity verified" /tmp/broker-demo-apply.out
          record_project broker-demo
          docs_url=$(python3 "$GITHUB_WORKSPACE/scripts/ci-broker-docs-url.py" /tmp/broker-demo-apply.out)
          application_env=$(/tmp/baha app env broker-demo --path)
          broker_ca="$(dirname "$application_env")/bindings/runtime-identity/ca.pem"
          curl --fail --silent --show-error --noproxy 127.0.0.1 \
            --cacert "$broker_ca" "$docs_url" >/tmp/broker-demo-docs.html
          /tmp/baha app status broker-demo | tee /tmp/broker-demo-status.out
          grep -q "runtime-broker.*mTLS readiness verified" /tmp/broker-demo-status.out
          grep -F "Swagger/OpenAPI" /tmp/broker-demo-status.out | grep -Fq "$docs_url"
          /tmp/baha app status broker-demo --verbose | tee /tmp/broker-demo-status-verbose.out
          grep -q "Runtime artifact" /tmp/broker-demo-status-verbose.out
          grep -q "image id" /tmp/broker-demo-status-verbose.out
          /tmp/baha app doctor broker-demo | grep -q "^READY$"

          /tmp/baha app create other-demo --sql --require-secret BOOTSTRAP_SECRET
          set +e
          apply_with_current_consent other-demo >/tmp/other-demo-required.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -Fq "Required application secret BOOTSTRAP_SECRET is missing." /tmp/other-demo-required.out
          printf '%s' 'bootstrap-b' | /tmp/baha app secret set other-demo BOOTSTRAP_SECRET --stdin
          apply_with_current_consent other-demo | grep -q "application and requested infrastructure verified"
          record_project other-demo

      - name: Prove dynamic secret create resolve rotate and wrong-token rejection
        run: |
          workdir=$(cat /tmp/baseharbor-broker-workdir)
          cd "$workdir"
          project=$(cat /tmp/broker-demo-project)
          broker_id=$(docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=broker' -q)
          test -n "$broker_id"

          ref=$(docker exec "$broker_id" sh -ec '
            token=$(cat /run/secrets/runtime-token)
            base=https://baseharbor-secrets:8443/runtime/v1/apps/broker-demo/secret-refs
            create=$(curl --fail --silent --show-error \
              --cacert /run/baseharbor/identity/ca.pem \
              --cert /run/secrets/probe-client-cert \
              --key /run/secrets/probe-client-key \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d "{\"value\":\"provider-key-v1\"}" "$base")
            printf "%s" "$create" | sed -n "s/.*\"ref\":\"\([^\"]*\)\".*/\1/p"
          ')
          test -n "$ref"
          printf '%s\n' "$ref" > /tmp/broker-demo-secret-ref

          docker exec -e REF="$ref" "$broker_id" sh -ec '
            token=$(cat /run/secrets/runtime-token)
            base=https://baseharbor-secrets:8443/runtime/v1/apps/broker-demo/secret-refs
            mtls="--cacert /run/baseharbor/identity/ca.pem --cert /run/secrets/probe-client-cert --key /run/secrets/probe-client-key"

            resolved=$(curl --fail --silent --show-error $mtls \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve")
            printf "%s" "$resolved" | grep -q "\"value\":\"provider-key-v1\""

            rotated=$(curl --fail --silent --show-error $mtls -X PUT \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\",\"value\":\"provider-key-v2\"}" "$base/resolve")
            printf "%s" "$rotated" | grep -q "\"configured\":true"

            resolved=$(curl --fail --silent --show-error $mtls \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve")
            printf "%s" "$resolved" | grep -q "\"value\":\"provider-key-v2\""

            code=$(curl --silent --output /tmp/wrong-token.out --write-out "%{http_code}" $mtls \
              -H "Authorization: Bearer definitely-wrong" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve")
            test "$code" = 401
          '

      - name: Prove cross-app mTLS identity is rejected before authorization
        run: |
          target_project=$(cat /tmp/broker-demo-project)
          other_project=$(cat /tmp/other-demo-project)
          target_id=$(docker ps --filter "label=com.docker.compose.project=$target_project" --filter 'label=com.docker.compose.service=broker' -q)
          other_id=$(docker ps --filter "label=com.docker.compose.project=$other_project" --filter 'label=com.docker.compose.service=broker' -q)
          test -n "$target_id"
          test -n "$other_id"
          target_ip=$(docker inspect "$target_id" --format '{{with index .NetworkSettings.Networks "baseharbor-ci-secrets"}}{{.IPAddress}}{{end}}')
          other_ip=$(docker inspect "$other_id" --format '{{with index .NetworkSettings.Networks "baseharbor-ci-secrets"}}{{.IPAddress}}{{end}}')
          test -n "$target_ip"
          test -n "$other_ip"
          test "$target_ip" != "$other_ip"
          for entry in "$target_id:$target_ip" "$other_id:$other_ip"; do
            id=${entry%%:*}
            ip=${entry#*:}
            docker exec "$id" curl --fail --silent --show-error \
              --resolve "baseharbor-secrets:8443:$ip" \
              --cacert /run/baseharbor/identity/ca.pem \
              --cert /run/secrets/probe-client-cert --key /run/secrets/probe-client-key \
              https://baseharbor-secrets:8443/readyz >/dev/null
          done
          docker cp "$target_id:/run/baseharbor/identity/ca.pem" /tmp/broker-target-ca.pem
          docker cp /tmp/broker-target-ca.pem "$other_id:/tmp/broker-target-ca.pem"
          docker cp "$target_id:/run/secrets/probe-client-cert" /tmp/broker-target-cert.pem
          docker cp "$other_id:/run/secrets/probe-client-cert" /tmp/broker-other-cert.pem
          ! cmp -s /tmp/broker-target-cert.pem /tmp/broker-other-cert.pem
          set +e
          docker exec "$other_id" curl --fail --silent --show-error \
            --resolve "baseharbor-secrets:8443:$target_ip" \
            --cacert /tmp/broker-target-ca.pem \
            --cert /run/secrets/probe-client-cert \
            --key /run/secrets/probe-client-key \
            --output /dev/null --write-out '%{remote_ip}|%{ssl_verify_result}|%{http_code}' \
            https://baseharbor-secrets:8443/readyz >/tmp/cross-app-meta 2>/tmp/cross-app.err
          code=$?
          set -e
          python3 "$GITHUB_WORKSPACE/scripts/ci-broker-mtls-rejection.py" \
            "$target_ip" "$code" /tmp/cross-app-meta /tmp/cross-app.err

      - name: Prove broker lifecycle and same dynamic secret ref survives restart
        run: |
          set -eo pipefail
          workdir=$(cat /tmp/baseharbor-broker-workdir)
          cd "$workdir"
          ref=$(cat /tmp/broker-demo-secret-ref)
          test -n "$ref"

          project=$(cat /tmp/broker-demo-project)
          application_env=$(/tmp/baha app env broker-demo --path)
          case "$application_env" in /*/application.env) ;; *) echo "unexpected application environment path" >&2; exit 1 ;; esac
          client_cert="$(dirname "$application_env")/bindings/runtime-identity/client-cert.pem"
          client_before=$(sha256sum "$client_cert" | awk '{print $1}')
          down_plan_file=$(mktemp)
          chmod 600 "$down_plan_file"
          if /tmp/baha --no-input app down broker-demo >"$down_plan_file" 2>/tmp/broker-down-plan-error.txt; then
            echo "app down unexpectedly succeeded without typed provider consent" >&2
            exit 1
          fi
          down_consent=$(python3 "$GITHUB_WORKSPACE/scripts/ci-podman-typed-consent.py" scope-output "$down_plan_file")
          rm -f "$down_plan_file"
          BASEHARBOR_PROVIDER_CHANGE_CONSENT="$down_consent" /tmp/baha app down broker-demo | tee /tmp/broker-down.out
          unset down_consent
          grep -q "runtime-broker.*stopped" /tmp/broker-down.out
          test -z "$(docker ps -q --filter "label=com.docker.compose.project=$project")"

          up_plan_file=$(mktemp)
          chmod 600 "$up_plan_file"
          /tmp/baha app plan broker-demo -o json >"$up_plan_file"
          up_consent=$(python3 "$GITHUB_WORKSPACE/scripts/ci-broker-typed-consent.py" "$up_plan_file")
          rm -f "$up_plan_file"
          if [ "$up_consent" = none ]; then
            env -u BASEHARBOR_PROVIDER_CHANGE_CONSENT /tmp/baha --no-input app up broker-demo | grep -q "runtime and requested infrastructure verified"
          else
            BASEHARBOR_PROVIDER_CHANGE_CONSENT="$up_consent" /tmp/baha --no-input app up broker-demo | grep -q "runtime and requested infrastructure verified"
          fi
          unset up_consent
          /tmp/baha app status broker-demo | grep -q "runtime-broker.*mTLS readiness verified"
          client_after=$(sha256sum "$client_cert" | awk '{print $1}')
          test "$client_before" = "$client_after"

          broker_id=$(docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=broker' -q)
          test -n "$broker_id"
          docker exec -e REF="$ref" "$broker_id" sh -ec '
            token=$(cat /run/secrets/runtime-token)
            base=https://baseharbor-secrets:8443/runtime/v1/apps/broker-demo/secret-refs
            resolved=$(curl --fail --silent --show-error \
              --cacert /run/baseharbor/identity/ca.pem \
              --cert /run/secrets/probe-client-cert \
              --key /run/secrets/probe-client-key \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve")
            printf "%s" "$resolved" | grep -q "\"value\":\"provider-key-v2\""
          '

      - name: Prove delete is permanent for the same ref
        run: |
          ref=$(cat /tmp/broker-demo-secret-ref)
          project=$(cat /tmp/broker-demo-project)
          broker_id=$(docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=broker' -q)
          test -n "$broker_id"
          docker exec -e REF="$ref" "$broker_id" sh -ec '
            token=$(cat /run/secrets/runtime-token)
            base=https://baseharbor-secrets:8443/runtime/v1/apps/broker-demo/secret-refs
            mtls="--cacert /run/baseharbor/identity/ca.pem --cert /run/secrets/probe-client-cert --key /run/secrets/probe-client-key"
            curl --fail --silent --show-error $mtls -X DELETE \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve"
            code=$(curl --silent --output /tmp/deleted.out --write-out "%{http_code}" $mtls \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"ref\":\"$REF\"}" "$base/resolve")
            test "$code" = 404
          '

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/baseharbor-broker-workdir ]; then
            workdir=$(cat /tmp/baseharbor-broker-workdir)
            cd "$workdir"
            /tmp/baha app destroy broker-demo --yes || true
            /tmp/baha app destroy other-demo --yes || true
            docker compose --project-name baseharbor-ci --file "$XDG_DATA_HOME/baseharbor/targets/ci/runtime/compose.yaml" --env-file "$XDG_DATA_HOME/baseharbor/targets/ci/runtime/runtime.env" down -v || true
          fi


  performance:
    runs-on: ubuntu-latest
    if: inputs.mode == 'performance'
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:perf
      BASEHARBOR_TARGET: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare verified rootless runtime
        # The setuptool's systemd unit follows XDG_CONFIG_HOME at generation
        # time; clear the job-pinned state dirs so docker.service lands in
        # ~/.config/systemd/user where the user manager loads it.
        env:
          XDG_CONFIG_HOME: ''
          XDG_DATA_HOME: ''
        run: bash scripts/ci-core-rootless-runtime.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build exact static broker binary
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/baha ./cmd/baha
          mkdir -p /tmp/baseharbor-runtime-image
          cp /tmp/baha /tmp/baseharbor-runtime-image/baha
          cp deploy/control-plane/Dockerfile.binary /tmp/baseharbor-runtime-image/Dockerfile
          docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" /tmp/baseharbor-runtime-image

      - name: Bootstrap performance application
        run: |
          set -eo pipefail
          apply_with_current_consent() {
            local plan consent result
            plan=$(mktemp)
            chmod 600 "$plan"
            /tmp/baha app plan "$1" -o json >"$plan" || { rm -f "$plan"; return 1; }
            consent=$(python3 "$GITHUB_WORKSPACE/scripts/ci-broker-typed-consent.py" "$plan") || { rm -f "$plan"; return 1; }
            rm -f "$plan"
            if [ "$consent" = none ]; then
              unset consent
              env -u BASEHARBOR_PROVIDER_CHANGE_CONSENT /tmp/baha --no-input app apply "$1"
              return $?
            fi
            BASEHARBOR_PROVIDER_CHANGE_CONSENT="$consent" /tmp/baha --no-input app apply "$1" || { result=$?; unset consent; return "$result"; }
            unset consent
          }
          workdir=$(mktemp -d)
          printf '%s\n' "$workdir" >/tmp/baseharbor-perf-workdir
          cd "$workdir"
          rm -rf "$XDG_CONFIG_HOME/baseharbor" "$XDG_DATA_HOME/baseharbor"
          /tmp/baha target create ci --provider docker --access local-docker --reference local --scope default --default >/dev/null
          /tmp/baha up --control-plane-only --yes --postgres-port 15432 --openbao-port 18200
          # 'baha up' already bootstraps an uninitialized managed trust plane
          # (repository_up.go:198). Gate the explicit bootstrap on the ACTUAL
          # initialization state; a second initialize would hit the write-once
          # guard ("OpenBao is already initialized").
          if /tmp/baha openbao status --json 2>/dev/null | grep -q '"initialized":false'; then
            /tmp/baha openbao bootstrap --recovery-file "$workdir/openbao-recovery.json"
          fi
          /tmp/baha app create perf-demo --sql --require-secret BOOTSTRAP_SECRET
          set +e
          apply_with_current_consent perf-demo >/tmp/perf-required.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -Fq "Required application secret BOOTSTRAP_SECRET is missing." /tmp/perf-required.out
          printf '%s' 'bootstrap' | /tmp/baha app secret set perf-demo BOOTSTRAP_SECRET --stdin
          apply_with_current_consent perf-demo | grep -q "application and requested infrastructure verified"
          /tmp/baha app status perf-demo -o json | python3 "$GITHUB_WORKSPACE/scripts/ci-broker-project.py" perf-demo >/tmp/perf-demo-project

      - name: Measure 200 real mTLS secret resolves
        run: |
          project=$(cat /tmp/perf-demo-project)
          broker_id=$(docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=broker' -q)
          test -n "$broker_id"
          docker exec "$broker_id" sh -ec '
            token=$(cat /run/secrets/runtime-token)
            base=https://baseharbor-secrets:8443/runtime/v1/apps/perf-demo/secret-refs
            mtls="--cacert /run/baseharbor/identity/ca.pem --cert /run/secrets/probe-client-cert --key /run/secrets/probe-client-key"
            created=$(curl --fail --silent --show-error $mtls \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "{\"value\":\"perf-secret\"}" "$base")
            ref=$(printf "%s" "$created" | sed -n "s/.*\"ref\":\"\([^\"]*\)\".*/\1/p")
            test -n "$ref"

            : >/tmp/latencies
            i=1
            while [ "$i" -le 200 ]; do
              result=$(curl --silent --show-error --output /tmp/resolve.out --write-out "%{http_code} %{time_total}" $mtls \
                -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
                -d "{\"ref\":\"$ref\"}" "$base/resolve")
              code=${result%% *}
              latency=${result#* }
              test "$code" = 200
              grep -q "\"value\":\"perf-secret\"" /tmp/resolve.out
              printf "%s\n" "$latency" >>/tmp/latencies
              i=$((i + 1))
            done

            sort -n /tmp/latencies >/tmp/latencies.sorted
            p50=$(sed -n "100p" /tmp/latencies.sorted)
            p95=$(sed -n "190p" /tmp/latencies.sorted)
            p99=$(sed -n "198p" /tmp/latencies.sorted)
            max=$(tail -1 /tmp/latencies.sorted)
            printf "secret resolve latency seconds: p50=%s p95=%s p99=%s max=%s\n" "$p50" "$p95" "$p99" "$max"

            awk -v v="$p95" "BEGIN { exit !(v < 0.100) }"
            awk -v v="$p99" "BEGIN { exit !(v < 0.250) }"
          '

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/baseharbor-perf-workdir ]; then
            cd "$(cat /tmp/baseharbor-perf-workdir)"
            /tmp/baha app destroy perf-demo --yes || true
            docker compose --project-name baseharbor-ci --file "$XDG_DATA_HOME/baseharbor/targets/ci/runtime/compose.yaml" --env-file "$XDG_DATA_HOME/baseharbor/targets/ci/runtime/runtime.env" down -v || true
          fi
          rm -rf "$XDG_CONFIG_HOME/baseharbor" "$XDG_DATA_HOME/baseharbor"

