name: app-backup-restore-acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  app-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:app-backup-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build BaseHarbor control-plane image
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Prove CLI destroy recreate restore
        env:
          BASEHARBOR_APP_BACKUP_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestAppBackupRestoreCLIRealDisasterRecovery$' -count=1 -v
