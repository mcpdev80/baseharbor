name: "Runtime Neutrality Conformance"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-runtime-neutrality-conformance'
    paths:
      - '.ci/runtime-neutrality-conformance-trigger'

permissions:
  contents: read

jobs:
  conformance:
    name: Core · Runtime Neutrality Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/providerconformance/runtime_neutrality_test.go internal/runtime/architecture_boundary_test.go
          git diff --exit-code -- internal/providerconformance/runtime_neutrality_test.go internal/runtime/architecture_boundary_test.go

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/providerconformance ./internal/runtime ./internal/runtimebroker ./internal/runtimeexecutor ./internal/providerui -run TestDoesNotExist -count=1

      - name: Run architecture and provider conformance
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/providerconformance ./internal/runtime -count=1
