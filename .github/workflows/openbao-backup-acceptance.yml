name: openbao-backup-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openbao-backup:
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prove application secret destroy recreate restore
        env:
          BASEHARBOR_OPENBAO_BACKUP_ACCEPTANCE: "true"
        run: go test ./internal/openbao -run '^TestApplicationSecretBackupRestoreRealOpenBao$' -count=1 -v
