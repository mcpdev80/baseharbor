name: "PoC · Podman Quadlet Providers"

on:
  push:
    branches:
      - 'runtime-validation/quadlet/providers/**'

permissions:
  contents: read

jobs:
  providers:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset persistent Podman state
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Verify Quadlet-only runtime
        shell: bash
        run: |
          set -euo pipefail
          podman info >/dev/null
          generator=""
          for candidate in             "$(command -v podman-system-generator 2>/dev/null || true)"             /usr/lib/systemd/system-generators/podman-system-generator             /usr/libexec/podman/quadlet
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              generator="$candidate"
              break
            fi
          done
          test -n "$generator"
          "$generator" --user --dryrun >/dev/null

          cat >"$RUNNER_TEMP/baseharbor-no-compose" <<'EOF'
          #!/bin/sh
          echo "podman compose is forbidden in Quadlet provider acceptance" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-no-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/baseharbor-no-compose" >> "$GITHUB_ENV"

      - name: Format and unit test log provider
        run: |
          test -z "$(gofmt -l internal/logs/render.go internal/logs/loki_test.go)"
          go test ./internal/logs -run '^(TestPodmanJournalConfigAcceptsComposeAndQuadletWorkloadNames)$' -count=1 -v

      - name: Verify real Loki ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Reset between providers
        if: always()
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Verify real Tempo ingestion
        if: success()
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - name: Cleanup
        if: always()
        run: bash scripts/ci-runtime-reset.sh podman
