name: targeted-podman-runtime-integration

on:
  push:
    branches:
      - 'runtime-validation/podman-targeted/**'

permissions:
  contents: read

jobs:
  runtime-integration:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 30
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Reset Podman state
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Run failing runtime integration segment only
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/baha ./internal/application \
            -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestMultiInstanceComposeLifecycleInCI)$' \
            -count=1 -v

      - name: Cleanup Podman state
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman
