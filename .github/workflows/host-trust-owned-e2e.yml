name: Host trust owned-CA E2E

on:
  pull_request:
    branches: [release/v0.4.24]
    paths:
      - 'internal/hosttrust/**'
      - 'cmd/baha/trust*.go'
      - 'cmd/baha/runtime_destroy_all*.go'
      - '.github/workflows/host-trust-owned-e2e.yml'
  push:
    branches: [work/v0.4.24-core-ha-updates]
    paths:
      - 'internal/hosttrust/**'
      - 'cmd/baha/trust*.go'
      - 'cmd/baha/runtime_destroy_all*.go'
      - '.github/workflows/host-trust-owned-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-trust-owned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  atomic-host-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check ownership and symlink safety
        run: go test ./internal/hosttrust
      - name: Compile host-trust E2E
        run: go test -c -o /tmp/baseharbor-host-trust-e2e ./internal/hosttrust
      - name: Real Ubuntu trust-store install, remove, second remove
        run: sudo env BASEHARBOR_HOST_TRUST_E2E=1 /tmp/baseharbor-host-trust-e2e -test.run '^TestPrivilegedSystemHostTrustInstallUninstallE2E$' -test.v
