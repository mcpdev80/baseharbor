name: runtime-broker-diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:diag
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build exact static broker binary
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/baha ./cmd/baha
          mkdir -p /tmp/baseharbor-runtime-image
          cp /tmp/baha /tmp/baseharbor-runtime-image/baha
          cp deploy/control-plane/Dockerfile.binary /tmp/baseharbor-runtime-image/Dockerfile
          docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" /tmp/baseharbor-runtime-image

      - name: Bootstrap one isolated application
        run: |
          workdir=$(mktemp -d)
          printf '%s\n' "$workdir" >/tmp/baseharbor-diag-workdir
          cd "$workdir"
          mkdir -p .baseharbor/runtime
          chmod 700 .baseharbor .baseharbor/runtime
          cat >.baseharbor/runtime/runtime.env <<'EOF'
          BASEHARBOR_POSTGRES_DB=baseharbor
          BASEHARBOR_POSTGRES_USER=baseharbor
          BASEHARBOR_POSTGRES_PASSWORD=diag-control-plane
          BASEHARBOR_POSTGRES_PORT=15432
          BASEHARBOR_OPENBAO_PORT=18200
          EOF
          chmod 600 .baseharbor/runtime/runtime.env
          /tmp/baha up
          /tmp/baha openbao bootstrap --recovery-file "$workdir/openbao-recovery.json"
          /tmp/baha app create broker-diag --postgres --require-secret BOOTSTRAP_SECRET
          set +e
          /tmp/baha app apply broker-diag >/tmp/diag-required.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "required secrets check failed" /tmp/diag-required.out
          printf '%s' 'bootstrap-only' | /tmp/baha app secret set broker-diag BOOTSTRAP_SECRET --stdin

          set +e
          /tmp/baha app apply broker-diag >/tmp/diag-apply.out 2>&1
          apply_code=$?
          set -e
          test "$apply_code" -ne 0

          project=baseharbor-broker-broker-diag-dev
          broker_id=$(docker ps -a --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=broker' -q | head -1)
          test -n "$broker_id"

          echo "broker_state=$(docker inspect "$broker_id" --format '{{.State.Status}}')"
          docker exec "$broker_id" sh -ec '
            test -f /run/secrets/openbao-credentials
            mode=$(stat -c "%a" /run/secrets/openbao-credentials)
            role_count=$(grep -c "^OPENBAO_ROLE_ID=" /run/secrets/openbao-credentials || true)
            secret_count=$(grep -c "^OPENBAO_SECRET_ID=" /run/secrets/openbao-credentials || true)
            printf "credential_mode=%s role_fields=%s secret_fields=%s\n" "$mode" "$role_count" "$secret_count"
            curl --silent --output /dev/null --write-out "openbao_health_http=%{http_code}\n" http://openbao:8200/v1/sys/health || true
            role_id=$(sed -n "s/^OPENBAO_ROLE_ID=//p" /run/secrets/openbao-credentials)
            secret_id=$(sed -n "s/^OPENBAO_SECRET_ID=//p" /run/secrets/openbao-credentials)
            payload=$(printf "{\"role_id\":\"%s\",\"secret_id\":\"%s\"}" "$role_id" "$secret_id")
            curl --silent --output /dev/null --write-out "approle_login_http=%{http_code}\n" -H "Content-Type: application/json" -d "$payload" http://openbao:8200/v1/auth/approle/login || true
          '
          docker logs "$broker_id" 2>&1 | tail -50 || true
          cat /tmp/diag-apply.out

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/baseharbor-diag-workdir ]; then
            cd "$(cat /tmp/baseharbor-diag-workdir)"
            /tmp/baha app destroy broker-diag --yes || true
            docker compose --project-name baseharbor --file .baseharbor/runtime/compose.yaml --env-file .baseharbor/runtime/runtime.env down -v || true
          fi
