name: Core893 trusted policy qualification (temporary)
on:
  pull_request:
    branches:
      - review/v0.4.26-893-exact-coverage
    paths:
      - '.github/workflows/core-893-policy-pilot.yml'
jobs:
  exact-policy:
    name: Core893 exact immutable policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify trusted planner and required fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_pr_gate_plan.py scripts/test_pr_diff_base.py -v
          python3 -m py_compile scripts/pr-gate-plan.py scripts/pr-diff-base.py
          bash scripts/ci-workflow-policy.sh
