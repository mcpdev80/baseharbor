name: "Stable Identity Targeted"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-stable-identity'
    paths:
      - '.ci/stable-identity-trigger'

permissions:
  contents: read

jobs:
  identity:
    name: Core · Stable Identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/stableid/id.go internal/application/identity.go internal/application/manifest.go internal/application/manifest_parse.go internal/application/manifest_render.go internal/application/manifest_validation.go internal/application/manifest_test.go internal/application/store.go internal/application/backup_metadata.go internal/application/recovery_metadata.go internal/applicationbackup/manifest.go internal/applicationbackup/archive.go cmd/baha/app_init_wizard.go cmd/baha/app_backup_metadata.go cmd/baha/app_backup_restore_data.go cmd/baha/app_recovery_metadata.go internal/deployment/deployment_store.go internal/deployment/target_test.go internal/capability/registry.go internal/capability/registry_test.go internal/application/provider_registry.go internal/application/provider_registry_test.go internal/evidence/model.go cmd/baha/app_status_result.go cmd/baha/app_doctor_result.go cmd/baha/app_doctor_collect.go cmd/baha/app_evidence.go cmd/baha/app_evidence_helpers.go cmd/baha/app_context.go cmd/baha/app_backup_restore.go cmd/baha/runtime_destroy_all.go
          git diff --exit-code -- internal/stableid internal/application internal/deployment internal/capability internal/evidence cmd/baha/app_status_result.go cmd/baha/app_doctor_result.go cmd/baha/app_doctor_collect.go cmd/baha/app_evidence.go cmd/baha/app_evidence_helpers.go cmd/baha/app_context.go cmd/baha/app_backup_restore.go cmd/baha/runtime_destroy_all.go
      - name: Compile identity packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/stableid ./internal/capability ./internal/application ./internal/applicationbackup ./internal/deployment ./internal/evidence ./cmd/baha -run TestDoesNotExist -count=1
      - name: Run identity tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/capability ./internal/application ./internal/applicationbackup ./internal/deployment ./internal/evidence -count=1
      - name: Run focused CLI identity tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run 'Test.*(Deployment|ApplicationContext|CreateTarget|RepositoryApplication|Incomplete)' -count=1
