name: "Stable Identity Targeted"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-stable-identity'
    paths:
      - '.ci/stable-identity-trigger'

permissions:
  contents: read

jobs:
  identity:
    name: Core · Stable Identity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/stableid/id.go internal/application/identity.go internal/application/manifest.go internal/application/manifest_parse.go internal/application/manifest_render.go internal/application/manifest_validation.go internal/application/manifest_test.go internal/deployment/deployment_store.go internal/deployment/target_test.go
          git diff --exit-code -- internal/stableid internal/application internal/deployment
      - name: Compile identity packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/stableid ./internal/application ./internal/deployment ./cmd/baha -run TestDoesNotExist -count=1
      - name: Run identity tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application ./internal/deployment -count=1
      - name: Run focused CLI identity tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run 'Test.*(Deployment|ApplicationContext|CreateTarget|RepositoryApplication|Incomplete)' -count=1
