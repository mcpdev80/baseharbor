name: Temporary one-shot workstation renewal formatting
on:
  push:
    branches:
      - feat/0427-zero-friction-core-workstation-onboarding
    paths:
      - .github/workflows/temporary-onboarding-renew-format.yml
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/0427-zero-friction-core-workstation-onboarding
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: One format commit, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            cmd/baha/workstation_onboarding_remote_native_test.go
            cmd/baha/management_remote_renew.go
            cmd/baha/management_remote_connection.go
            internal/workstationenrollment/http/production_handler.go
            internal/workstationenrollment/http/delegated_renew_test.go
            internal/controlplaneruntime/server_run.go
            internal/controlplaneruntime/workstation_auth.go
          )
          gofmt -w "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
          git rm .github/workflows/temporary-onboarding-renew-format.yml
          git add -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "style(onboard): normalize and verify workstation renewal sources"
          git push origin HEAD:feat/0427-zero-friction-core-workstation-onboarding
