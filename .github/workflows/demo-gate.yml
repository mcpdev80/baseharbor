name: demo-gate

on:
  workflow_call:
    inputs:
      ref:
        description: BaseHarbor ref or commit SHA to test
        required: true
        type: string
      runtime:
        description: Container runtime
        required: true
        type: string
      gate:
        description: Demo acceptance gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: demo-${{ inputs.gate }}-${{ inputs.runtime }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - baseharbor
      - ${{ inputs.runtime }}
    timeout-minutes: 60
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ inputs.runtime }}
      DEMO_GATE: ${{ inputs.gate }}
      ARTIFACT_DIR: /tmp/baseharbor-demo-${{ inputs.runtime }}-${{ inputs.gate }}

    steps:
      - name: Checkout BaseHarbor
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset runtime state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "${{ inputs.runtime }}"

      - name: Run demo gate
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          workdir="/tmp/baseharbor-demo-${BASEHARBOR_TEST_RUNTIME}-${DEMO_GATE}-repo"
          rm -rf "$workdir" "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          cd "$workdir"
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME="$BASEHARBOR_TEST_RUNTIME" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh "$DEMO_GATE"

      - name: Cleanup runtime state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "${{ inputs.runtime }}"

      - name: Generate gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/demo-gate-evidence"
          rows="$RUNNER_TEMP/demo-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested BaseHarbor ref
          Go setup	${{ steps.setup_go.outcome }}	Go from go.mod; remote cache disabled
          Runtime reset	${{ steps.reset.outcome }}	Clean ${{ inputs.runtime }} runner state
          Demo ${{ inputs.gate }}	${{ steps.demo.outcome }}	Selected product-contract gate
          Cleanup	${{ steps.cleanup.outcome }}	Runner returned to clean state
          EOF
          mkdir -p "$out/demo"
          cp -a "$ARTIFACT_DIR/." "$out/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$out" \
            "BaseHarbor Demo Gate Evidence" \
            "demo/${{ inputs.runtime }}/${{ inputs.gate }}" \
            "${{ inputs.ref }}" \
            "${{ steps.candidate.outputs.sha || github.sha }}" \
            "$rows"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-${{ inputs.runtime }}-${{ inputs.gate }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-gate-evidence
          if-no-files-found: error
          retention-days: 30
