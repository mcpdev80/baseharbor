name: "PoC · Podman Quadlet Workload"

on:
  push:
    branches:
      - 'runtime-validation/quadlet/**'

permissions:
  contents: read

jobs:
  quadlet-demo:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 30
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      QUADLET_PREFIX: bha-quadlet-poc

    steps:
      - name: Checkout BaseHarbor
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify rootless Quadlet prerequisites
        shell: bash
        run: |
          set -euo pipefail
          podman version
          podman info --format 'cgroups={{.Host.CgroupsVersion}} rootless={{.Host.Security.Rootless}}'
          test "$(podman info --format '{{.Host.CgroupsVersion}}')" = "v2"

          runtime_dir="/run/user/$(id -u)"
          test -d "$runtime_dir"
          test -S "$runtime_dir/bus"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          systemctl --user show-environment >/dev/null

          generator="$(command -v podman-system-generator || true)"
          if [ -z "$generator" ]; then
            generator=/usr/lib/systemd/system-generators/podman-system-generator
          fi
          test -x "$generator"
          echo "QUADLET_GENERATOR=$generator" >> "$GITHUB_ENV"

      - name: Unit test Quadlet renderer
        run: go test ./internal/runtime -run '^TestRenderComposeServiceQuadlet' -count=1 -v

      - name: Build Quadlet renderer
        run: go build -trimpath -o /tmp/baseharbor-quadlet-poc ./cmd/quadlet-poc

      - name: Clone pristine demo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baseharbor-quadlet-demo
          git clone --depth 1 https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-quadlet-demo

      - name: Render demo workloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baseharbor-quadlets
          mkdir -p /tmp/baseharbor-quadlets

          /tmp/baseharbor-quadlet-poc \
            --compose /tmp/baseharbor-quadlet-demo/compose.yaml \
            --service demo-app \
            --prefix "$QUADLET_PREFIX" \
            --out /tmp/baseharbor-quadlets

          /tmp/baseharbor-quadlet-poc \
            --compose /tmp/baseharbor-quadlet-demo/companion-app/compose.yaml \
            --service companion-app \
            --prefix "$QUADLET_PREFIX" \
            --out /tmp/baseharbor-quadlets

          ls -la /tmp/baseharbor-quadlets
          for file in /tmp/baseharbor-quadlets/*.build /tmp/baseharbor-quadlets/*.container; do
            echo "--- $file"
            cat "$file"
          done

      - name: Validate generated Quadlets
        shell: bash
        run: |
          set -euo pipefail
          QUADLET_UNIT_DIRS=/tmp/baseharbor-quadlets "$QUADLET_GENERATOR" --user --dryrun >/tmp/quadlet-dryrun.txt 2>&1
          cat /tmp/quadlet-dryrun.txt
          grep -q "$QUADLET_PREFIX-demo-app.service" /tmp/quadlet-dryrun.txt
          grep -q "$QUADLET_PREFIX-companion-app.service" /tmp/quadlet-dryrun.txt

      - name: Install and run Quadlet workloads
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          units_dir="${XDG_CONFIG_HOME:-$HOME/.config}/containers/systemd"
          mkdir -p "$units_dir" /tmp/quadlet-evidence

          elapsed_ms() {
            local start_ns="$1" end_ns="$2"
            echo $(( (end_ns - start_ns) / 1000000 ))
          }

          wait_http() {
            local url="$1"
            for _ in $(seq 1 50); do
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi
              sleep 0.1
            done
            return 1
          }

          cleanup() {
            set +e
            systemctl --user stop "$QUADLET_PREFIX-demo-app.service" "$QUADLET_PREFIX-companion-app.service" >/dev/null 2>&1
            podman compose --project-name bha-compose-benchmark --file /tmp/baseharbor-quadlet-demo/compose.yaml stop demo-app >/dev/null 2>&1
            podman compose --project-name bha-compose-benchmark --file /tmp/baseharbor-quadlet-demo/compose.yaml rm -f demo-app >/dev/null 2>&1
            rm -f \
              "$units_dir/$QUADLET_PREFIX-demo-app.build" \
              "$units_dir/$QUADLET_PREFIX-demo-app.container" \
              "$units_dir/$QUADLET_PREFIX-demo-app.env" \
              "$units_dir/$QUADLET_PREFIX-companion-app.build" \
              "$units_dir/$QUADLET_PREFIX-companion-app.container" \
              "$units_dir/$QUADLET_PREFIX-companion-app.env"
            systemctl --user daemon-reload >/dev/null 2>&1
            podman rm -f "$QUADLET_PREFIX-demo-app" "$QUADLET_PREFIX-companion-app" >/dev/null 2>&1
          }
          trap cleanup EXIT
          cleanup

          cp /tmp/baseharbor-quadlets/* "$units_dir/"
          chmod 600 "$units_dir/$QUADLET_PREFIX-"*.env 2>/dev/null || true

          begin="$(date +%s%N)"
          systemctl --user daemon-reload
          end="$(date +%s%N)"
          reload_ms="$(elapsed_ms "$begin" "$end")"

          begin="$(date +%s%N)"
          systemctl --user start "$QUADLET_PREFIX-demo-app.service" "$QUADLET_PREFIX-companion-app.service"
          end="$(date +%s%N)"
          cold_start_ms="$(elapsed_ms "$begin" "$end")"

          systemctl --user is-active "$QUADLET_PREFIX-demo-app.service"
          systemctl --user is-active "$QUADLET_PREFIX-companion-app.service"
          wait_http http://127.0.0.1:8080/health
          wait_http http://127.0.0.1:8081/health

          systemctl --user status "$QUADLET_PREFIX-demo-app.service" --no-pager > /tmp/quadlet-evidence/demo-app-running.txt
          systemctl --user status "$QUADLET_PREFIX-companion-app.service" --no-pager > /tmp/quadlet-evidence/companion-running.txt
          podman inspect "$QUADLET_PREFIX-demo-app" "$QUADLET_PREFIX-companion-app" > /tmp/quadlet-evidence/inspect-running.json

          systemctl --user stop "$QUADLET_PREFIX-demo-app.service" "$QUADLET_PREFIX-companion-app.service"

          printf 'runtime\tcycle\tstart_ms\tstatus_ms\tstop_ms\n' > /tmp/quadlet-evidence/benchmark.tsv

          for cycle in 1 2 3; do
            begin="$(date +%s%N)"
            systemctl --user start "$QUADLET_PREFIX-demo-app.service"
            wait_http http://127.0.0.1:8080/health
            end="$(date +%s%N)"
            q_start="$(elapsed_ms "$begin" "$end")"

            begin="$(date +%s%N)"
            systemctl --user is-active "$QUADLET_PREFIX-demo-app.service" >/dev/null
            podman inspect "$QUADLET_PREFIX-demo-app" >/dev/null
            end="$(date +%s%N)"
            q_status="$(elapsed_ms "$begin" "$end")"

            begin="$(date +%s%N)"
            systemctl --user stop "$QUADLET_PREFIX-demo-app.service"
            end="$(date +%s%N)"
            q_stop="$(elapsed_ms "$begin" "$end")"

            printf 'quadlet\t%s\t%s\t%s\t%s\n' "$cycle" "$q_start" "$q_status" "$q_stop" >> /tmp/quadlet-evidence/benchmark.tsv
          done

          for cycle in 1 2 3; do
            begin="$(date +%s%N)"
            (
              cd /tmp/baseharbor-quadlet-demo
              podman compose --project-name bha-compose-benchmark --file compose.yaml up -d --build --no-deps demo-app >/dev/null
            )
            wait_http http://127.0.0.1:8080/health
            end="$(date +%s%N)"
            c_start="$(elapsed_ms "$begin" "$end")"

            begin="$(date +%s%N)"
            (
              cd /tmp/baseharbor-quadlet-demo
              podman compose --project-name bha-compose-benchmark --file compose.yaml ps --format json >/dev/null
            )
            end="$(date +%s%N)"
            c_status="$(elapsed_ms "$begin" "$end")"

            begin="$(date +%s%N)"
            (
              cd /tmp/baseharbor-quadlet-demo
              podman compose --project-name bha-compose-benchmark --file compose.yaml stop demo-app >/dev/null
              podman compose --project-name bha-compose-benchmark --file compose.yaml rm -f demo-app >/dev/null
            )
            end="$(date +%s%N)"
            c_stop="$(elapsed_ms "$begin" "$end")"

            printf 'podman-compose\t%s\t%s\t%s\t%s\n' "$cycle" "$c_start" "$c_status" "$c_stop" >> /tmp/quadlet-evidence/benchmark.tsv
          done

          {
            printf 'phase\tmilliseconds\n'
            printf 'daemon_reload\t%s\n' "$reload_ms"
            printf 'quadlet_cold_start_two_workloads_with_build\t%s\n' "$cold_start_ms"
          } > /tmp/quadlet-evidence/timing.tsv

          cat /tmp/quadlet-evidence/timing.tsv
          cat /tmp/quadlet-evidence/benchmark.tsv

          trap - EXIT
          cleanup

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! podman container exists "$QUADLET_PREFIX-demo-app"
          ! podman container exists "$QUADLET_PREFIX-companion-app"

      - name: Upload Quadlet PoC evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-quadlet-poc-${{ github.run_id }}
          path: |
            /tmp/quadlet-evidence/
            /tmp/quadlet-dryrun.txt
          if-no-files-found: warn
