name: gofmt-branch-fix

on:
  push:
    branches: [feat/app-init-wizard]
    paths:
      - .github/workflows/gofmt-branch-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/app-init-wizard
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format wizard
        run: gofmt -w cmd/baha/app_init_wizard.go cmd/baha/app_init_wizard_test.go cmd/baha/commands.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/baha/app_init_wizard.go cmd/baha/app_init_wizard_test.go cmd/baha/commands.go
          git commit -m 'chore: gofmt app init wizard'
          git push origin HEAD:feat/app-init-wizard
