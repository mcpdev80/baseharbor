name: targeted-podman-demo

on:
  push:
    branches:
      - 'runtime-validation/podman-demo/**'

permissions:
  contents: read

jobs:
  podman-demo:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 45
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      ARTIFACT_DIR: /tmp/baseharbor-demo-podman-targeted

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Podman state
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Run external demo acceptance only
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          rm -rf /tmp/baseharbor-demo-podman-targeted-repo "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-demo-podman-targeted-repo
          cd /tmp/baseharbor-demo-podman-targeted-repo
          BASEHARBOR_SOURCE_REF="$candidate_sha" \
            BASEHARBOR_TEST_RUNTIME=podman \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Cleanup Podman state
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman
