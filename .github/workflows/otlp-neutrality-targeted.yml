name: "OTLP Runtime Neutrality"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-otlp-neutrality*'
    paths:
      - '.ci/otlp-neutrality-trigger'

permissions:
  contents: read

jobs:
  otlp:
    name: Core · OTLP Runtime Neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/telemetry internal/application/telemetry_binding.go
          if ! git diff --exit-code -- internal/telemetry internal/application/telemetry_binding.go; then
            echo "OTLP neutrality scope requires gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/telemetry ./internal/application -run '^$' -count=1

      - name: Run OTLP focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/telemetry -count=1
          go test ./internal/application -run 'OTLP|Telemetry' -count=1
