name: "Release · Publish"

run-name: "Release · ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or recover
        required: true
        type: string
      pre_release_run_id:
        description: Successful Pre-Release run to consume; leave empty to auto-discover by tag SHA
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  approval:
    name: consume-pre-release-approval
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      tag_sha: ${{ steps.gate.outputs.tag_sha }}
      pre_release_run_id: ${{ steps.gate.outputs.pre_release_run_id }}
      approval_artifact: ${{ steps.gate.outputs.approval_artifact }}
      legacy_pre_release: ${{ steps.gate.outputs.legacy_pre_release }}
      tested_sha: ${{ steps.gate.outputs.tested_sha }}
      demo_sha: ${{ steps.gate.outputs.demo_sha }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and consume successful Pre-Release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          MANUAL_RUN_ID: ${{ inputs.pre_release_run_id }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be valid SemVer with a v prefix." >&2
            exit 1
          fi

          git fetch origin main --tags --force
          tag_sha="$(git rev-list -n 1 "${tag}^{commit}")"
          test -n "${tag_sha}"

          git merge-base --is-ancestor "${tag_sha}" origin/main || {
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          }

          version="${tag#v}"
          git show "${tag_sha}:CHANGELOG.md" | grep -Fq "## [${version}]" || {
            echo "CHANGELOG.md must contain ## [${version}] at the tagged commit." >&2
            exit 1
          }
          git cat-file -e "${tag_sha}:docs/releases/${tag}.md" || {
            echo "Release notes docs/releases/${tag}.md are missing at the tagged commit." >&2
            exit 1
          }

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          compatible_candidate() {
            candidate_sha="$1"

            git cat-file -e "${candidate_sha}^{commit}" 2>/dev/null || return 1

            unexpected="$(git diff --name-only "${candidate_sha}" "${tag_sha}" -- | grep -Ev '^(\.github/workflows/(pre-release|release|runtime-image|supplemental-release-validation)\.yml|docs/release-audits/v[0-9]+\.[0-9]+\.[0-9]+\.md)$' || true)"
            if [ -n "${unexpected}" ]; then
              return 1
            fi
            return 0
          }

          if [ -n "${MANUAL_RUN_ID:-}" ]; then
            run_id="${MANUAL_RUN_ID}"
            run_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/runs/${run_id}")"

            test "$(jq -r '.conclusion' <<<"${run_json}")" = "success" || {
              echo "Selected Pre-Release run is not successful." >&2
              exit 1
            }
            test "$(jq -r '.path' <<<"${run_json}")" = ".github/workflows/pre-release.yml" || {
              echo "Selected run is not the Pre-Release workflow." >&2
              exit 1
            }

            tested_sha="$(jq -r '.head_sha' <<<"${run_json}")"
            compatible_candidate "${tested_sha}" || {
              echo "Selected Pre-Release content is not compatible with release tag SHA ${tag_sha}." >&2
              echo "Only these post-validation files may differ:" >&2
              echo "  .github/workflows/pre-release.yml" >&2
              echo "  .github/workflows/release.yml" >&2
              echo "  .github/workflows/runtime-image.yml" >&2
              echo "  .github/workflows/supplemental-release-validation.yml" >&2
              echo "  docs/release-audits/vX.Y.Z.md" >&2
              echo "Actual changed files:" >&2
              git diff --name-only "${tested_sha}" "${tag_sha}" -- >&2 || true
              exit 1
            }
          else
            runs_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/pre-release.yml/runs?status=success&per_page=100")"

            run_id=""
            run_json=""
            tested_sha=""

            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [ -n "${candidate_id}" ] || continue
              if compatible_candidate "${candidate_sha}"; then
                run_id="${candidate_id}"
                tested_sha="${candidate_sha}"
                run_json="$(jq -c --argjson id "${candidate_id}" '.workflow_runs[] | select(.id == $id)' <<<"${runs_json}")"
                break
              fi
            done < <(jq -r '.workflow_runs | sort_by(.run_number) | reverse[] | [.id, .head_sha] | @tsv' <<<"${runs_json}")

            test -n "${run_id}" || {
              echo "No successful compatible Pre-Release found for tag SHA ${tag_sha}." >&2
              exit 1
            }
          fi

          if [ "${tested_sha}" != "${tag_sha}" ]; then
            echo "Using CI-only descendant handoff:"
            echo "  tested SHA: ${tested_sha}"
            echo "  tag SHA:    ${tag_sha}"
            echo "  allowed post-validation changes:"
            git diff --name-only "${tested_sha}" "${tag_sha}" --
          fi

          artifacts_json="$(curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/actions/runs/${run_id}/artifacts?per_page=100")"

          approval_artifact="$(jq -r '
            [.artifacts[]
             | select(.expired == false)
             | select(.name | startswith("pre-release-approval-"))]
            | first
            | .name // empty
          ' <<<"${artifacts_json}")"

          if [ -z "${approval_artifact}" ]; then
            approval_artifact="$(jq -r '
              [.artifacts[]
               | select(.expired == false)
               | select(.name | startswith("pre-release-gate-evidence-"))]
              | first
              | .name // empty
            ' <<<"${artifacts_json}")"
            test -n "${approval_artifact}" || {
              echo "Pre-Release run has no immutable approval or combined gate evidence artifact." >&2
              exit 1
            }
            legacy_pre_release="true"
            echo "Using legacy combined gate evidence from Pre-Release run ${run_id}."
          else
            legacy_pre_release="false"
          fi

          if [ "${legacy_pre_release}" = "false" ]; then
            approval_dir="${RUNNER_TEMP}/pre-release-approval"
            rm -rf "${approval_dir}"
            mkdir -p "${approval_dir}"
            gh run download "${run_id}" -n "${approval_artifact}" -D "${approval_dir}"
            approval_json="$(find "${approval_dir}" -type f -name release-approved.json -print -quit)"
            test -n "${approval_json}" || {
              echo "Pre-Release approval artifact does not contain release-approved.json." >&2
              exit 1
            }
            demo_sha="$(jq -r '.demo_sha // empty' "${approval_json}")"
            test -n "${demo_sha}" || {
              echo "Pre-Release approval does not attest an exact baseharbor-demo SHA." >&2
              exit 1
            }
          else
            demo_sha="legacy-unpinned"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "tag_sha=${tag_sha}" >> "${GITHUB_OUTPUT}"
          echo "pre_release_run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "approval_artifact=${approval_artifact}" >> "${GITHUB_OUTPUT}"
          echo "legacy_pre_release=${legacy_pre_release}" >> "${GITHUB_OUTPUT}"
          echo "tested_sha=${tested_sha}" >> "${GITHUB_OUTPUT}"
          echo "demo_sha=${demo_sha}" >> "${GITHUB_OUTPUT}"

  supplemental:
    name: release-only-checks-not-covered-by-pre-release
    needs: approval
    runs-on: ubuntu-latest
    outputs:
      validation_run_id: ${{ steps.coverage.outputs.run_id }}
      validation_artifact: ${{ steps.coverage.outputs.artifact }}
      reused_validation: ${{ steps.coverage.outputs.covered }}
    steps:
      - name: Reuse successful supplemental validation when available
        id: coverage
        if: needs.approval.outputs.legacy_pre_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ needs.approval.outputs.tag_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/supplemental-release-validation.yml/runs?status=success&head_sha=${TAG_SHA}&per_page=20")"

          run_id="$(jq -r --arg sha "${TAG_SHA}" '
            [.workflow_runs[]
             | select(.head_sha == $sha)
             | select(.conclusion == "success")]
            | sort_by(.run_number)
            | last
            | .id // empty
          ' <<<"${runs_json}")"

          if [ -z "${run_id}" ]; then
            echo "covered=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          artifacts_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs/${run_id}/artifacts?per_page=100")"

          artifact="$(jq -r '
            [.artifacts[]
             | select(.expired == false)
             | select(.name | startswith("supplemental-release-validation-"))]
            | first
            | .name // empty
          ' <<<"${artifacts_json}")"

          test -n "${artifact}" || {
            echo "Successful supplemental validation run ${run_id} has no evidence artifact." >&2
            exit 1
          }

          echo "covered=true" >> "${GITHUB_OUTPUT}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "Reusing supplemental validation run ${run_id} for ${TAG_SHA}."

      - name: Explain complete Pre-Release coverage
        if: needs.approval.outputs.legacy_pre_release != 'true'
        run: echo "All release checks were already covered by the approved Pre-Release."

      - name: Explain supplemental evidence reuse
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered == 'true'
        run: echo "Recovery, Loki/Alloy and Tempo checks are covered by supplemental validation run ${{ steps.coverage.outputs.run_id }}."

      - name: Checkout approved tag for fallback checks
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered != 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.approval.outputs.tag }}

      - name: Set up Go for fallback checks
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify control-plane restart and operator-held unseal recovery
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered != 'true'
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real Loki and Alloy workload log ingestion
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered != 'true'
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real OpenTelemetry to Tempo trace ingestion
        if: needs.approval.outputs.legacy_pre_release == 'true' && steps.coverage.outputs.covered != 'true'
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

  runtime-image:
    name: publish-runtime-image
    needs:
      - approval
      - supplemental
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/runtime-image.yml
    with:
      ref: ${{ needs.approval.outputs.tag }}
      version_tag: ${{ needs.approval.outputs.tag }}
    secrets: inherit

  release:
    name: publish-release
    needs:
      - approval
      - supplemental
      - runtime-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved tagged source
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.approval.outputs.tag }}
          fetch-depth: 0

      - name: Verify approved SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.approval.outputs.tag_sha }}"

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes docs/releases/${{ needs.approval.outputs.tag }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        id: attest_archives
        uses: actions/attest@v4
        with:
          subject-path: 'dist/baseharbor_linux_*.tar.gz'

      - name: Attest checksum manifest
        id: attest_checksums
        uses: actions/attest@v4
        with:
          subject-path: 'dist/checksums.txt'

      - name: Generate release evidence
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/release-evidence.tsv"
          cat >"$rows" <<EOF
          Pre-Release approval	success	run ${{ needs.approval.outputs.pre_release_run_id }}, artifact ${{ needs.approval.outputs.approval_artifact }}; includes Quadlet-only Podman validation
          Pre-Release tested SHA	success	${{ needs.approval.outputs.tested_sha }}
          Pre-Release demo SHA	success	${{ needs.approval.outputs.demo_sha }}
          Approved tag/SHA	success	${{ needs.approval.outputs.tag }} -> ${{ needs.approval.outputs.tag_sha }}
          Supplemental release-only checks	${{ needs.supplemental.result }}	reused run ${{ needs.supplemental.outputs.validation_run_id || 'none' }}, artifact ${{ needs.supplemental.outputs.validation_artifact || 'fallback' }}
          Runtime image publish	${{ needs.runtime-image.result }}	multi-arch runtime image and attestation
          GoReleaser publish	${{ steps.goreleaser.outcome }}	release archives and GitHub release
          Archive attestation	${{ steps.attest_archives.outcome }}	artifact provenance
          Checksum attestation	${{ steps.attest_checksums.outcome }}	checksum provenance
          EOF
          mkdir -p "$RUNNER_TEMP/release-evidence/dist"
          cp dist/checksums.txt "$RUNNER_TEMP/release-evidence/dist/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/release-evidence"             "BaseHarbor Final Release Evidence"             "release/publish"             "${{ needs.approval.outputs.tag }}"             "${{ needs.approval.outputs.tag_sha }}"             "$rows"

      - name: Upload release evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: release-gate-evidence
    if: always()
    needs:
      - approval
      - supplemental
      - runtime-image
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence generator
        uses: actions/checkout@v7.0.1

      - name: Generate combined release evidence
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/release-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Pre-Release handoff	${{ needs.approval.result }}	run ${{ needs.approval.outputs.pre_release_run_id }}, tested ${{ needs.approval.outputs.tested_sha }}, demo ${{ needs.approval.outputs.demo_sha }}; guided + deterministic external acceptance already proven
          Supplemental release-only checks	${{ needs.supplemental.result }}	reused run ${{ needs.supplemental.outputs.validation_run_id || 'none' }}
          Runtime image publish	${{ needs.runtime-image.result }}	multi-arch runtime image and attestation
          Release publish	${{ needs.release.result }}	archives, GitHub release and attestations
          EOF
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/release-gate-evidence"             "BaseHarbor Final Release Gate Evidence"             "release/combined"             "${{ needs.approval.outputs.tag || github.ref_name }}"             "${{ needs.approval.outputs.tag_sha || github.sha }}"             "$rows"

      - name: Upload combined release-gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-gate-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce complete release
        shell: bash
        run: |
          test "${{ needs.approval.result }}" = "success"
          test "${{ needs.supplemental.result }}" = "success"
          test "${{ needs.runtime-image.result }}" = "success"
          test "${{ needs.release.result }}" = "success"
