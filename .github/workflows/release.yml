name: release

on:
  # Tag creation is intentional: push-tag workflows are skipped when the tagged commit contains [skip ci].
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or recover
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  runtime-image:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/runtime-image.yml
    secrets: inherit

  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release_ref
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be valid SemVer with a v prefix: vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_ref.outputs.tag }}
          fetch-depth: 0

      - name: Validate release tag and source
        shell: bash
        env:
          TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }
          version="${TAG#v}"
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md must contain a ## [${version}] release section before tagging." >&2
            exit 1
          }
          notes="docs/releases/${TAG}.md"
          test -s "${notes}" || {
            echo "Human-readable release notes are required at ${notes}." >&2
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release source
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes docs/releases/${{ steps.release_ref.outputs.tag }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: 'dist/baseharbor_linux_*.tar.gz'

      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: 'dist/checksums.txt'
