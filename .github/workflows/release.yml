name: "Release v0.4.26 - Owner-authorized publication"
on:
  push:
    branches: [release-publish/v0.4.26-owner-20261026]
permissions: {}
concurrency:
  group: publish-v0.4.26-owner
  cancel-in-progress: false
jobs:
  authorize:
    if: github.repository == 'mcpdev80/baseharbor' && github.actor_id == '22537373'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 640981588d8b9255fbe7db8ca26796db1da09eb2
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact promoted source and record the Owner release decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=640981588d8b9255fbe7db8ca26796db1da09eb2
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git rev-parse HEAD^{tree})" = d7c63770a31b082ab7fc1c9fd254e4918efafc59
          test "$(gh api repos/mcpdev80/baseharbor/git/ref/heads/main --jq .object.sha)" = "$source_sha"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = {
              "schema": "baseharbor.owner-release-decision/v1",
              "tag": "v0.4.26",
              "source_sha": "640981588d8b9255fbe7db8ca26796db1da09eb2",
              "source_tree": "d7c63770a31b082ab7fc1c9fd254e4918efafc59",
              "develop_sha": "433a5702c9735ffbf1e9fffe7a7ae513b1c5c396",
              "owner": "mcpdev80", "decision_date": "2026-10-26",
              "decision": "Publish implemented v0.4.26 despite incomplete or failing CI by explicit Owner instruction.",
              "complete_pre_release_approval": False,
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(os.environ["RUNNER_TEMP"], "owner-release-decision.json").write_text(json.dumps(value, indent=2) + "\n")
          PY
          if gh api repos/mcpdev80/baseharbor/git/ref/tags/v0.4.26 > "$RUNNER_TEMP/tag.json" 2> "$RUNNER_TEMP/tag-error"; then
            object_type="$(jq -r .object.type "$RUNNER_TEMP/tag.json")"
            object_sha="$(jq -r .object.sha "$RUNNER_TEMP/tag.json")"
            if [ "$object_type" = tag ]; then
              gh api "repos/mcpdev80/baseharbor/git/tags/$object_sha" > "$RUNNER_TEMP/tag-object.json"
              object_type="$(jq -r .object.type "$RUNNER_TEMP/tag-object.json")"
              object_sha="$(jq -r .object.sha "$RUNNER_TEMP/tag-object.json")"
            fi
            test "$object_type" = commit
            test "$object_sha" = "$source_sha"
          else
            grep -Fq '(HTTP 404)' "$RUNNER_TEMP/tag-error"
            tag_object="$(gh api --method POST repos/mcpdev80/baseharbor/git/tags -f tag=v0.4.26 -f object="$source_sha" -f type=commit -f message='BaseHarbor v0.4.26: explicit Owner release decision; complete pre-release approval not claimed.' --jq .sha)"
            gh api --method POST repos/mcpdev80/baseharbor/git/refs -f ref=refs/tags/v0.4.26 -f sha="$tag_object"
          fi
          cat "$RUNNER_TEMP/owner-release-decision.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: owner-release-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-release-decision.json
          if-no-files-found: error
          retention-days: 90
  runtime:
    needs: authorize
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: mcpdev80/baseharbor/.github/workflows/runtime-image.yml@640981588d8b9255fbe7db8ca26796db1da09eb2
    with:
      ref: 640981588d8b9255fbe7db8ca26796db1da09eb2
      version_tag: v0.4.26
  archives:
    needs: [authorize, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.4.26
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release source and prepare truthful release notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 640981588d8b9255fbe7db8ca26796db1da09eb2
          cp docs/releases/v0.4.26.md "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ## Release decision
          Published on 26 October 2026 by explicit Owner decision despite incomplete or failing CI.
          A successful complete pre-release qualification is not claimed.
          Source: 640981588d8b9255fbe7db8ca26796db1da09eb2 (the exact implemented v0.4.26 develop tree).
          NOTES
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify published archive checksums
        working-directory: dist
        run: sha256sum -c checksums.txt --ignore-missing
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'dist/baseharbor_linux_*.tar.gz'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/checksums.txt
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: owner-release-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-decision
      - name: Publish the actual Owner decision and verify expected assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.4.26 "$RUNNER_TEMP/owner-decision/owner-release-decision.json" --clobber
          gh api repos/mcpdev80/baseharbor/releases/tags/v0.4.26 > "$RUNNER_TEMP/published-release.json"
          jq -e '.draft == false and .prerelease == false' "$RUNNER_TEMP/published-release.json"
          for name in baseharbor_linux_amd64.tar.gz baseharbor_linux_arm64.tar.gz checksums.txt owner-release-decision.json; do
            jq -e --arg name "$name" 'any(.assets[]; .name == $name and .size > 0)' "$RUNNER_TEMP/published-release.json"
          done
          echo 'Published v0.4.26 binaries, checksums, provenance and runtime image under the recorded Owner decision.' >> "$GITHUB_STEP_SUMMARY"
