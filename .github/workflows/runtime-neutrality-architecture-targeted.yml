name: "Runtime Neutrality Architecture"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-runtime-neutrality-architecture'
    paths:
      - '.ci/runtime-neutrality-architecture-trigger'

permissions:
  contents: read

jobs:
  architecture:
    name: Core · Runtime Neutrality Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/providerconformance/runtime_neutrality_test.go
          git diff --exit-code -- internal/providerconformance/runtime_neutrality_test.go
      - name: Run architecture boundaries
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/runtime ./internal/providerconformance -count=1
      - name: Compile control plane packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/runtimebroker ./internal/runtimeexecutor ./internal/providerui ./cmd/baha -run TestDoesNotExist -count=1
