name: "Maintenance · v0.4.15 gofmt 2"

on:
  push:
    branches:
      - 'maintenance/v0415-gofmt-2'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd internal spec
          rm -f .github/workflows/v0415-gofmt-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: gofmt token service access changes"
          git push
