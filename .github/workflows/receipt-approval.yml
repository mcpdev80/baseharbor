# Dormant Owner-approval consumption path for the public-contracts receipt pilot.
#
# PR2 proves the end-to-end flow: producer, writer, published receipt, live
# verifier, and the sole Owner approval edit. This workflow stays disabled in
# every PR until a maintainer explicitly enables it for the accepted consumption
# path (PR3 cuts over only that path). Nothing here is active: the job-level
# never-true guard skips the job, no trigger is armed, and no required check is
# added. Existing workflows and required checks are unchanged.
#
# The approval is the single allowed edit that replaces `approved: null` in a
# live-verified, unapproved receipt with the Owner identity, a UTC timestamp and
# the receipt commit. The verifier checks GITHUB_ACTOR and
# GITHUB_TRIGGERING_ACTOR, then re-runs the live GitHub witness once before any
# write. Fork and contributor jobs receive no Planning write token; the job
# runs only on protected source in a clean runner.
#
# Run manually (workflow_dispatch) on protected main:
#
#   python3 scripts/receipt_verifier.py approve \
#     --planning <planning checkout> \
#     --revision <full Planning commit with evidence/receipt-plans/public-contracts.json> \
#     --receipt evidence/receipts/public-contracts/<run>-<attempt>.json \
#     --candidate <full tested integration SHA> \
#     --plan <full Planning revision>
#
# Exit code is nonzero when the receipt is blocked.
#
# The workflow runs inside the baseharbor checkout but the receipt and plan live
# in the Planning repo, so it re-checks Planning read-only under planning/ and
# points --planning there. The verifier approves in place and writes one commit
# inside the Planning clone; because this workflow cannot push Planning without a
# write token, it stops after emitting planning/approve-<run>-<attempt>.patch as
# an artifact. The Owner applies it to their own Planning clone with `git am`
# (or a later PAT-backed refactor pushes it) and publishes by an ordinary
# fast-forward push.

name: receipt-approval

on:
  workflow_dispatch:
    inputs:
      receipt_path:
        description: Receipt path relative to the Planning checkout
        type: string
        required: false
      candidate_sha:
        description: Full tested integration SHA the receipt must bind
        type: string
        required: false
      plan_revision:
        description: Full Planning revision carrying evidence/receipt-plans/public-contracts.json
        type: string
        required: false

permissions:
  contents: write

jobs:
  approve:
    # Owner-gated shadow dispatch: runs only on manual workflow_dispatch by the
    # Owner (mcpdev80) so the approval consumption path activates without
    # arming any other trigger or adding a required check. Chain replayed
    # manually; producer already proven.
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mcpdev80'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Checkout Planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          path: planning

      - name: Resolve Planning revision for the receipt
        run: echo "PLANNING_REVISION=$(git -C planning rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Approve the receipt
        run: |
          python3 scripts/receipt_verifier.py approve \
            --planning "$GITHUB_WORKSPACE/planning" \
            --revision "$PLANNING_REVISION" \
            --receipt "$RECEIPT_PATH" \
            --candidate "$RECEIPT_CANDIDATE" \
            --plan "$RECEIPT_PLAN"
        env:
          RECEIPT_PATH: ${{ inputs.receipt_path || 'evidence/receipts/public-contracts/123-1.json' }}
          RECEIPT_CANDIDATE: ${{ inputs.candidate_sha || '' }}
          RECEIPT_PLAN: ${{ inputs.plan_revision || '' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/main

      - name: Upload approve-commit patch
        uses: actions/upload-artifact@v4
        with:
          name: approve-commit-patch
          path: planning/approve-*.patch
          if-no-files-found: warn
          retention-days: 1
