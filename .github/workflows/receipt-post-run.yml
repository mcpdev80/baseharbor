name: "Receipt · Post-Run Evidence"

# Migration candidate: authenticate producer plans, then publish a distinct
# merge receipt after the actual Owner merge. Existing V1 approval and retained
# verification remain available for historical receipts; no V1 approval is
# synthesized from the merge.

on:
  workflow_run:
    workflows: ["CI · Source & Quality"]
    types:
      - completed
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

jobs:
  # Step 1: Capture producer identity and authenticated context.
  # We DO NOT check out PR-controlled code in this job. The controller
  # Python comes from the immutable reviewed CI repo (develop/main).
  producer_context:
    name: "Capture Producer Context"
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      producer_eligible: ${{ steps.eligibility.outputs.producer_eligible }}
      source_closed: ${{ steps.eligibility.outputs.source_closed }}
      run_base_sha: ${{ steps.eligibility.outputs.run_base_sha }}
      workflow_id: ${{ steps.facts.outputs.workflow_id }}
      head_sha: ${{ steps.facts.outputs.head_sha }}
      candidate_sha: ${{ steps.facts.outputs.candidate_sha }}
      base_sha: ${{ steps.facts.outputs.base_sha }}
      pr_number: ${{ steps.facts.outputs.pr_number }}
    steps:
      - name: Extract authenticated facts from workflow_run
        id: facts
        run: |
          set -euo pipefail
          # workflow_id must come from the authenticated run context,
          # NOT from run.id (which is the Workflow Run ID, not the
          # workflow definition ID). The producer's workflow_id identifies
          # the reviewed ci.yml definition.
          WORKFLOW_ID="${{ github.event.workflow_run.workflow_id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "workflow_id=${WORKFLOW_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          # The candidate and base SHAs and the PR number are resolved from
          # authenticated GitHub API objects in extract_plan, not invented
          # here. The PR number is taken from the authenticated run object's
          # base_ref via the PR API below; workflow_run.base_ref alone is not
          # sufficient to drive task resolution.
          echo "candidate_sha=" >> "$GITHUB_OUTPUT"
          echo "base_sha=" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "Producer context captured: workflow_id=${WORKFLOW_ID} head=${HEAD_SHA} run=${RUN_ID}"

      - name: Probe producer eligibility (trusted-pr-plan artifact present)
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          # Non-PR producer runs (push to main/develop) are a CLEAN SKIP, never a
          # failure. This #1233 early-guard is folded into the #1227 eligibility
          # probe so the single coherent flow keeps it. It runs AFTER the
          # authenticated artifact lookup (so a failed/incomplete API — the
          # #1218 accident class — still hard-fails before any event
          # classification), but BEFORE the run-to-PR association: a non-PR run
          # carries no bound PR, so the probe would otherwise fail closed on the
          # empty pull_requests array.
          set +e
          EVENT="$(gh api "repos/mcpdev80/baseharbor/actions/runs/$RUN_ID" --jq '.event' 2>/dev/null)"
          EVENT_RC=$?
          set -e
          if [ "${EVENT_RC}" -ne 0 ]; then
            echo "producer run event lookup failed (rc=${EVENT_RC}): not classifiable, failing closed" >&2
            exit 1
          fi
          # Only a POSITIVE, authenticated non-PR trigger (e.g. push/schedule) is
          # a CLEAN SKIP. An empty/missing value (a malformed or partially
          # truncated run object) is NOT a classifiable event — it must not be
          # treated as a non-PR run. It falls through to the authenticated
          # run-to-PR association below, which fails closed on an empty or
          # ambiguous pull_requests array. This preserves the #1233 non-PR skip
          # without re-introducing the #1218 class of phantom-skip on a
          # non-classifiable event.
          if [ -n "${EVENT}" ] && [ "${EVENT}" != "pull_request" ]; then
            echo "producer run triggered by '${EVENT}' (not 'pull_request'): CLEAN SKIP, producer_eligible=false" >&2
            echo "producer_eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run-to-PR association: independently resolved and validated. The
          # run object's pull_requests[] carries the binding PR number; exactly
          # one non-null entry is required, an absent or ambiguous lookup is a
          # fail-closed ERROR (never a phantom skip). The authenticated run
          # object's head_sha and base ref are bound here and re-checked against
          # the immutable PR object below.
          set +e
          RUN_PR_JSON="$(gh api "repos/mcpdev80/baseharbor/actions/runs/$RUN_ID" --jq '.pull_requests' 2>/dev/null)"
          RUN_PR_RC=$?
          set -e
          if [ "${RUN_PR_RC}" -ne 0 ]; then
            echo "run PR association API failed (rc=${RUN_PR_RC}): not absence, failing closed" >&2
            exit 1
          fi
          RUN_PR_NUMBER="$(printf '%s' "${RUN_PR_JSON}" | jq -r 'map(select(.number != null) | .number) | length' 2>/dev/null)"
          classify_closed_run() {
            # Authenticate the closed run before routing; a pilot also proves
            # the actual Owner merge and candidate before any publication.
            helper_dir="$(mktemp -d)"
            trap 'rm -rf "$helper_dir"' EXIT
            gh api "repos/mcpdev80/baseharbor/contents/scripts/receipt_closed_run.py?ref=062108fab519aed7207ae9ea1c61a6c3505bb325" --jq .content | base64 -d > "$helper_dir/receipt_closed_run.py"
            gh api "repos/mcpdev80/baseharbor/contents/scripts/receipt_verifier.py?ref=062108fab519aed7207ae9ea1c61a6c3505bb325" --jq .content | base64 -d > "$helper_dir/receipt_verifier.py"
            git init -q "$helper_dir/product"
            git -C "$helper_dir/product" remote add origin "https://github.com/mcpdev80/baseharbor.git"
            PYTHONPATH="$helper_dir" python3 "$helper_dir/receipt_closed_run.py" --classify "$RUN_ID" "$helper_dir/product"
            echo "producer_eligible=false" >> "$GITHUB_OUTPUT"
            echo "source_closed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${RUN_PR_NUMBER}" = "0" ]; then
            classify_closed_run
          fi
          if [ "${RUN_PR_NUMBER}" != "1" ]; then
            echo "run $RUN_ID has ${RUN_PR_NUMBER} (expected exactly 1) bound PR: ambiguous/absent association, failing closed" >&2
            exit 1
          fi
          PR="$(printf '%s' "${RUN_PR_JSON}" | jq -r 'map(select(.number != null) | .number)[0]')"
          if [[ ! "${PR}" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid run PR number: failing closed" >&2
            exit 1
          fi
          # Authenticate the original and current PR identities before any
          # ineligibility/superseded outcome. Missing facts are never a skip.
          RUN_HEAD="$(gh api "repos/mcpdev80/baseharbor/actions/runs/$RUN_ID" --jq '.head_sha')"
          RUN_BASE="$(printf '%s' "${RUN_PR_JSON}" | jq -er '.[0].base.sha')"
          RUN_TARGET="$(printf '%s' "${RUN_PR_JSON}" | jq -er '.[0].base.ref')"
          PR_DATA="$(gh api "repos/mcpdev80/baseharbor/pulls/$PR")"
          PR_STATE="$(printf '%s' "$PR_DATA" | jq -er '.state')"
          PR_HEAD="$(printf '%s' "$PR_DATA" | jq -er '.head.sha')"
          LIVE_BASE="$(printf '%s' "$PR_DATA" | jq -er '.base.sha')"
          LIVE_TARGET="$(printf '%s' "$PR_DATA" | jq -er '.base.ref')"
          for sha in "$RUN_HEAD" "$RUN_BASE" "$PR_HEAD" "$LIVE_BASE"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" == 0000000000000000000000000000000000000000 ]]; then
              echo "missing or malformed run/PR SHA: failing closed" >&2
              exit 1
            fi
          done
          if [[ "$PR_STATE" != open && "$PR_STATE" != closed ]] ||
             [[ -z "$RUN_TARGET" || -z "$LIVE_TARGET" ]]; then
            echo "invalid run/PR state or target: failing closed" >&2
            exit 1
          fi
          if [[ "$PR_STATE" == closed ]]; then
            classify_closed_run
          fi
          if [[ "$PR_HEAD" != "$RUN_HEAD" ||
                "$LIVE_BASE" != "$RUN_BASE" || "$LIVE_TARGET" != "$RUN_TARGET" ]]; then
            echo "authenticated PR run has been superseded; no receipt" >&2
            echo "producer_eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RUN_TARGET" != develop ]]; then
            echo "PR target $RUN_TARGET is outside develop receipt production" >&2
            echo "producer_eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every PR run needs its trusted plan. Without it we cannot determine
          # whether the receipt gate applies, so API errors and absence fail closed.
          # Resolve the run/PR association before examining the plan.
          # Artifact listing: explicit pagination (--paginate) so a truncated
          # page cannot hide the artifact; gh's own exit code gates the probe.
          set +e
          ART_LIST="$(gh api "repos/mcpdev80/baseharbor/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[].name' 2>/dev/null)"
          ART_RC=$?
          set -e
          if [ "${ART_RC}" -ne 0 ]; then
            echo "trusted-pr-plan artifact API failed (rc=${ART_RC}): not absence, failing closed" >&2
            exit 1
          fi
          HAS_ARTIFACT="$(printf '%s\n' "${ART_LIST}" | grep -qx "trusted-pr-plan" && echo true || echo false)"
          # Complete changed-file set for the authenticated run, derived from an
          # IMMUTABLE run-bound head+base pair via the authenticated compare
          # endpoint (${RUN_BASE}..${RUN_HEAD}): paginated, concatenated,
          # deduplicated — a truncated page cannot hide a contracts/ touch.
          # gh's own exit code gates it, and the returned files correspond to
          # this exact immutable base..head diff, never the mutable live PR base.
          set +e
          CONTRACT_FILES="$(gh api "repos/mcpdev80/baseharbor/compare/${RUN_BASE}..${RUN_HEAD}" --paginate --jq '.files[].filename' 2>/dev/null | sort -u)"
          CONTRACT_RC=$?
          set -e
          if [ "${CONTRACT_RC}" -ne 0 ]; then
            echo "PR base..head compare API failed (rc=${CONTRACT_RC}) against immutable base ${RUN_BASE}: not absence, failing closed" >&2
            exit 1
          fi
          # Fail closed when the compare payload is unusable: a missing,
          # non-array, null, or empty files field, or an API failure, must never
          # read as a clean no-contracts file set. A truncated page that omits
          # the files field entirely is treated as unusable, never absent.
          set +e
          CONTRACT_SHAPE="$(gh api "repos/mcpdev80/baseharbor/compare/${RUN_BASE}..${RUN_HEAD}?shape=files" --jq '.files' 2>/dev/null)"
          CONTRACT_SHAPE_RC=$?
          set -e
          if [ "${CONTRACT_SHAPE_RC}" -ne 0 ] || [ -z "${CONTRACT_SHAPE}" ] || [ "${CONTRACT_SHAPE}" = "null" ]; then
            echo "compare files field missing/null or API failed (rc=${CONTRACT_SHAPE_RC}): failing closed" >&2
            exit 1
          fi
          # A non-array files field (object, string, number) is unusable: the
          # file set cannot be enumerated from it. Reject anything that does
          # not start with '[' so a malformed compare response fails closed.
          case "${CONTRACT_SHAPE}" in
            \[*)
              :
              ;;
            *)
              echo "compare files field is not an array ('${CONTRACT_SHAPE:0:32}'): failing closed" >&2
              exit 1
              ;;
          esac
          HAS_CONTRACT_TOUCH="$(printf '%s\n' "${CONTRACT_FILES}" | grep -q '^contracts/' && echo true || echo false)"
          if [ "${HAS_ARTIFACT}" = true ]; then
            echo "producer_eligible=true" >> "$GITHUB_OUTPUT"
            echo "run_base_sha=${RUN_BASE}" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_CONTRACT_TOUCH}" = true ]; then
            # A contracts change without a trusted plan is an integrity error.
            echo "contracts/ touch without trusted-pr-plan artifact on run $RUN_ID (PR=$PR): integrity error, failing closed" >&2
            exit 1
          else
            echo "trusted-pr-plan artifact missing on PR run $RUN_ID (PR=$PR); cannot determine selected gates, failing closed" >&2
            exit 1
          fi

  # Step 2: Download the trusted-pr-plan artifact from the producer CI,
  # extract candidate_sha/integration_sha, and determine the PR->task mapping.
  extract_plan:
    name: "Extract Trusted Plan & Map PR->Task"
    if: github.event.workflow_run.conclusion == 'success' && needs.producer_context.outputs.producer_eligible == 'true'
    needs: producer_context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      workflow_id: ${{ steps.plan.outputs.workflow_id }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      run_id: ${{ steps.plan.outputs.run_id }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      public_contracts_selected: ${{ steps.plan.outputs.public_contracts_selected }}
      source_closed: ${{ steps.plan.outputs.source_closed }}
    steps:
      - name: Checkout immutable controller (reviewed CI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reviewed controller pin as the publication job; scripts are
          # read-only here so receipt_verifier resolves at import time.
          ref: dd8fb61d614b59252c9d29121380b5893d006828
          persist-credentials: false

      - name: Download trusted-pr-plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          # D1 principle: authenticated (Actions API) beats asserted (webhook
          # payload, which omits run_attempt). One API call against the
          # authenticated RUN_ID resolves the real attempt.
          ATTEMPT="$(gh api repos/mcpdev80/baseharbor/actions/runs/$RUN_ID --jq .run_attempt)"
          # The workflow-definition id is an authenticated Actions API field,
          # distinct from the authenticated workflow run id (RUN_ID). Source it
          # directly; do not let the plan artifact invent it (Owner 2026-10-27).
          WORKFLOW_DEFINITION_ID="${{ github.event.workflow_run.workflow_id }}"
          # Preserve the attempt-1 pilot restriction on the AUTHENTICATED run
          # context: an Actions rerun (attempt != 1) is rejected explicitly and
          # never relabelled as attempt 1 (Owner correction 2026-10-27, D1).
          if [ "${ATTEMPT}" != "1" ]; then
            echo "authenticated run_attempt ${ATTEMPT} is not 1; refusing non-attempt-1 producer run" >&2
            exit 1
          fi
          # Non-PR producer runs (push to main/develop, e.g. runtime-validation
          # probe runs) carry no bound PR and never upload a trusted-pr-plan
          # artifact. Their 'Trusted Plan' job is skipped, so no plan fixture
          # exists to download. This is a CLEAN SKIP, never a failure: emit the
          # bounded no-op and let the publication job stay a no-op too. This is
          # the ONLY artifact-absence case that skips cleanly — a real PR run
          # (pull_request, base_ref PR-resolvable, exactly one bound PR) without
          # the artifact is an INTEGRITY ERROR and keeps the hard exit below
          # (rv1221b / #1218 fail-closed contract-impact guard).
          set +e
          SOURCE_EVENT="$(gh api "repos/mcpdev80/baseharbor/actions/runs/$RUN_ID" --jq '.event' 2>/dev/null)"
          SOURCE_EVENT_RC=$?
          set -e
          if [ "${SOURCE_EVENT_RC}" -eq 0 ] && [ -n "${SOURCE_EVENT}" ] && [ "${SOURCE_EVENT}" != "pull_request" ]; then
            echo "source run $RUN_ID triggered by '${SOURCE_EVENT}' (not 'pull_request'): no receipt, non-PR producer run; CLEAN SKIP" >&2
            echo "no receipt: non-PR source run" >> "$GITHUB_STEP_SUMMARY"
            echo "workflow_definition_id=$WORKFLOW_DEFINITION_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Download with an explicit token, repository and artifact name; the
          # producer uploads pr-plan.json directly as the artifact; gh run
          # download unpacks the artifact zip, yielding pr-plan.json.
          echo "Downloading trusted-pr-plan artifact from run $RUN_ID attempt $ATTEMPT (workflow_id=$WORKFLOW_DEFINITION_ID)"
          gh api repos/mcpdev80/baseharbor/actions/runs/$RUN_ID/artifacts > /dev/null 2>&1 \
            || { echo "cannot list producer artifacts; refusing" >&2; exit 1; }
          AID=$(gh api repos/mcpdev80/baseharbor/actions/runs/$RUN_ID/artifacts \
                  --jq '.artifacts[] | select(.name == "trusted-pr-plan") | .id' | head -n1)
          test -n "$AID" || { echo "trusted-pr-plan artifact missing; refusing" >&2; exit 1; }
          gh api "repos/mcpdev80/baseharbor/actions/artifacts/$AID/zip" \
               --method GET > plan.zip.tmp \
            || { echo "artifact download failed; refusing" >&2; exit 1; }
          test -s plan.zip.tmp
          mv plan.zip.tmp plan.zip
          test -f plan.zip
          echo "workflow_definition_id=$WORKFLOW_DEFINITION_ID" >> "$GITHUB_OUTPUT"

      - name: Decode pr-plan and extract candidate_sha
        id: plan
        env:
          GH_WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/scripts
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_BASE: ${{ needs.producer_context.outputs.run_base_sha }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          # The workflow-definition id is an authenticated Actions API field,
          # distinct from the authenticated workflow run id. Source it directly
          # and bind it against the producer run's workflow_id (Owner 2026-10-27,
          # D1: run identity separated from workflow-definition identity).
          WORKFLOW_DEFINITION_ID="${{ github.event.workflow_run.workflow_id }}"
          # Resolve the PR number from the authenticated run's base_ref via the
          # PR API, not from an invented workflow_run field.
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          PR_NUMBER="${PR_NUMBER:-}"
          BASE_REF="${{ github.event.workflow_run.base_ref }}"
          if [[ "$BASE_REF" =~ refs/pull/([0-9]+)/merge ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
          fi
          # Parse the trusted-pr-plan JSON with Python and emit machine-readable
          # outputs. The plan object is DATA here: no shell sourcing of
          # artifact-derived strings, no source/eval on any artifact value, and
          # no fallback facts. The heredoc redirects on the Python invocation
          # (Owner correction 2026-10-27, D3).
          export GH_TOKEN="${GH_WORKFLOW_TOKEN}"
          ATTEMPT_RESOLVED="$(gh api repos/mcpdev80/baseharbor/actions/runs/${RUN_ID} --jq .run_attempt)"
          # The controller is pinned and initially shallow. Fetch the
          # authenticated run head and base so its existing identity verifier
          # can compare the producer workflow before classifying a no-receipt.
          git fetch --no-tags --depth=1 origin "$RUN_HEAD" "$RUN_BASE"
          RUN_ID="${RUN_ID}" WORKFLOW_DEFINITION_ID="${WORKFLOW_DEFINITION_ID}" PR_NUMBER="${PR_NUMBER}" RUN_ATTEMPT="${ATTEMPT_RESOLVED}" python3 - <<'PY' > plan.txt
          import zipfile, os
          import receipt_verifier as rv
          with zipfile.ZipFile("plan.zip") as z:
              entries = z.infolist()
              if (len(entries) != 1 or entries[0].filename != "pr-plan.json"
                      or not 0 < entries[0].file_size <= 65536):
                  raise ValueError("invalid trusted plan archive")
              plan = rv.decode(z.read(entries[0]), 65536)
          # Authoritative run/workflow ids come from the authenticated Actions
          # context (env), not from the producer plan; extract_facts forwards the
          # supplied values (never the plan's own spoofed id) and derives the
          # artifact size from the real downloaded file, never a fake constant.
          ARTIFACT_SIZE = rv.artifact_size_from_path("plan.zip")
          out = rv.extract_facts(plan, artifact_size=ARTIFACT_SIZE,
                                 run_id=int(os.environ["RUN_ID"]),
                                 workflow_id=int(os.environ["WORKFLOW_DEFINITION_ID"]),
                                 attempt=int(os.environ.get("RUN_ATTEMPT", "1")))
          # A no-receipt decision is allowed only on a complete, resolved
          # trusted plan bound to the authenticated run head and base.
          if (plan.get("coverage_status") != "resolved"
                  or not isinstance(plan.get("selected_gates"), list)
                  or any(not isinstance(g, str) for g in plan["selected_gates"])
                  or out["head_sha"] != os.environ["RUN_HEAD"]
                  or out["base_sha"] != os.environ["RUN_BASE"]):
              raise ValueError("unresolved, malformed or mismatched trusted plan")
          rv.producer_identity(".", {"head_sha": out["head_sha"],
                                     "base_sha": out["base_sha"]})
          print("public_contracts_selected=%s" % str(
              "integration/static/public-contracts" in plan["selected_gates"]).lower())
          print("workflow_id=%s" % out["workflow_id"])
          print("head_sha=%s" % out["head_sha"])
          print("candidate_sha=%s" % out["candidate_sha"])
          print("base_sha=%s" % out["base_sha"])
          print("run_id=%s" % out["run_id"])
          print("pr_number=%s" % (os.environ.get("PR_NUMBER", "") or ""))
          PY
          public_contracts_selected="$(grep '^public_contracts_selected=' plan.txt | cut -d= -f2-)"
          workflow_id="$(grep '^workflow_id=' plan.txt | cut -d= -f2-)"
          head_sha="$(grep '^head_sha=' plan.txt | cut -d= -f2-)"
          candidate_sha="$(grep '^candidate_sha=' plan.txt | cut -d= -f2-)"
          base_sha="$(grep '^base_sha=' plan.txt | cut -d= -f2-)"
          run_id="$(grep '^run_id=' plan.txt | cut -d= -f2-)"
          pr_number="$(grep '^pr_number=' plan.txt | cut -d= -f2-)"
          # Bind the candidate to GitHub's current synthetic merge ref. Head
          # and base were authenticated above; drift or an unavailable ref must
          # block publication rather than classify a different candidate.
          if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              echo "invalid run-bound PR number" >&2
              exit 1
          fi
          set +e
          merge_sha="$(gh api "repos/mcpdev80/baseharbor/git/ref/pull/${pr_number}/merge" --jq '.object.sha')"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ] || [ "${candidate_sha}" != "${merge_sha}" ]; then
              current="$(gh api "repos/mcpdev80/baseharbor/pulls/${pr_number}")"
              state="$(printf '%s' "$current" | jq -er '.state')"
              head="$(printf '%s' "$current" | jq -er '.head.sha')"
              base="$(printf '%s' "$current" | jq -er '.base.sha')"
              target="$(printf '%s' "$current" | jq -er '.base.ref')"
              for sha in "$head" "$base"; do
                  if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" == 0000000000000000000000000000000000000000 ]]; then
                      echo "invalid current PR identity" >&2; exit 1
                  fi
              done
              if [[ ( "$state" == closed || ( "$state" == open &&
                  ( "$head" != "$RUN_HEAD" || "$base" != "$RUN_BASE" || "$target" != develop ) ) ) && -n "$target" ]]; then
                  if [[ "$state" == closed && "$public_contracts_selected" == true ]]; then
                      echo "closed public-contracts producer routed to authenticated receipt handling" >&2
                      echo "source_closed=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "authenticated PR run has been superseded; no receipt" >&2
                  echo "public_contracts_selected=false" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              echo "merge ref unavailable or candidate mismatch for current PR" >&2
              exit 1
          fi
          # Bind the artifact workflow_id to the authenticated Actions API value;
          # they must be equal, so a spoofed/absent definition id fails closed.
          if [ "${workflow_id}" != "${WORKFLOW_DEFINITION_ID}" ]; then
              echo "artifact workflow_id ${workflow_id} != authenticated ${WORKFLOW_DEFINITION_ID}" >&2
              exit 1
          fi
          echo "public_contracts_selected=${public_contracts_selected}" >> "$GITHUB_OUTPUT"
          echo "workflow_id=${workflow_id}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "Plan extracted: candidate=$candidate_sha base=$base_sha head=$head_sha run=$run_id wf_id=${workflow_id} pr=${pr_number}"
          if [ "$public_contracts_selected" = true ]; then
            echo "Receipt pending: authenticated Owner merge has not yet been processed." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

  # The prior V1 publisher required a separate Owner dispatch and task link.
  # Existing V1 receipts and the approval consumer stay readable; new
  # post-merge evidence uses the closed_receipt job below.

  closed_receipt:
    name: "Receipt · Merged Candidate"
    needs: [producer_context, extract_plan]
    if: always() && github.event_name == 'workflow_run' && (needs.producer_context.outputs.source_closed == 'true' || needs.extract_plan.outputs.source_closed == 'true' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: receipt-merged-candidate-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.write.outputs.decision }}
      receipt: ${{ steps.write.outputs.receipt }}
      publication: ${{ steps.write.outputs.publication }}
      candidate: ${{ steps.write.outputs.candidate }}
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 062108fab519aed7207ae9ea1c61a6c3505bb325
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          ref: main
          path: planning
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PLANNING_RECEIPT_WRITE_TOKEN }}
      - name: Authenticate, publish, and consume merged receipt
        id: write
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNING_RECEIPT_WRITE_TOKEN: ${{ secrets.PLANNING_RECEIPT_WRITE_TOKEN }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          git -C planning config user.name "codeman-runtime"
          git -C planning config user.email "codeman-runtime@users.noreply.github.com"
          args=()
          if [ "$SOURCE_EVENT" = push ]; then args+=(--push); fi
          PYTHONPATH=scripts python3 scripts/receipt_closed_run.py "${args[@]}" "$SOURCE_RUN" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/planning" | tee "$RUNNER_TEMP/receipt-result"
          decision="$(sed -n 's/^decision: //p' "$RUNNER_TEMP/receipt-result")"
          case "$decision" in
            receipt)
              binding="$(sed -n 's/^receipt: //p' "$RUNNER_TEMP/receipt-result")"
              publication="${binding%%:*}"
              receipt="${binding#*:}"
              candidate="$(sed -n 's/^candidate: //p' "$RUNNER_TEMP/receipt-result")"
              [[ "$publication" =~ ^[0-9a-f]{40}$ && "$candidate" =~ ^[0-9a-f]{40}$ ]]
              [[ "$receipt" =~ ^evidence/receipts/public-contracts/merge-[0-9]+-1\.json$ ]]
              echo "publication=$publication" >> "$GITHUB_OUTPUT"
              echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
              echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
              ;;
            nonpilot|no-pr|pending) ;;
            *) echo 'missing or ambiguous receipt decision' >&2; exit 1 ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

  merged_receipt_consumer:
    name: "Receipt · Merged Evidence Consumer"
    needs: [closed_receipt]
    if: needs.closed_receipt.outputs.decision == 'receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 062108fab519aed7207ae9ea1c61a6c3505bb325
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout published Planning evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          ref: ${{ needs.closed_receipt.outputs.publication }}
          path: planning
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate published merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ needs.closed_receipt.outputs.receipt }}
          PUBLICATION: ${{ needs.closed_receipt.outputs.publication }}
          CANDIDATE: ${{ needs.closed_receipt.outputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$PUBLICATION" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECEIPT" =~ ^evidence/receipts/public-contracts/merge-[0-9]+-1\.json$ ]]
          PYTHONPATH=scripts python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import receipt_verifier as rv
          planning, receipt = Path('planning'), os.environ['RECEIPT']
          raw = rv.blob(planning, os.environ['PUBLICATION'], receipt)
          evidence = rv.merge_receipt(raw)
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', evidence['head'], evidence['base'],
                          evidence['candidate'], evidence['merge']], check=True)
          rv.retained_merge(planning, os.environ['PUBLICATION'], receipt,
                            os.environ['CANDIDATE'], product=Path('.'))
          PY

  reconcile_receipts:
    name: "Receipt · Reconcile Develop History"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
    concurrency:
      group: receipt-history-reconciliation
      cancel-in-progress: false
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 062108fab519aed7207ae9ea1c61a6c3505bb325
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Planning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          ref: main
          path: planning
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PLANNING_RECEIPT_WRITE_TOKEN }}
      - name: Verify every unprocessed develop commit before advancing cursor
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNING_RECEIPT_WRITE_TOKEN: ${{ secrets.PLANNING_RECEIPT_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git -C planning config user.name "codeman-runtime"
          git -C planning config user.email "codeman-runtime@users.noreply.github.com"
          PYTHONPATH=scripts python3 scripts/receipt_closed_run.py --reconcile \
            0bbab29b13d9e6792a63daf2733f13aac3c66fec \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/planning"
