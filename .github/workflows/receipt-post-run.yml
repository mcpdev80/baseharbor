name: "Receipt · Post-Run Writer"

# Production wiring: after a successful producer CI run, automatically
# write the bounded plan fixture (tasklink), publish an unapproved receipt
# to Planning, and return the exact introduction/publication commits.
# No manual run/SHA/patch step — all facts come from the authenticated
# workflow_run context and the producer's trusted-pr-plan artifact.

on:
  workflow_run:
    workflows: ["CI · Source & Quality"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  # Step 1: Verify producer identity and extract authenticated facts.
  # We DO NOT check out PR-controlled code in this job. The controller
  # Python comes from the immutable reviewed CI repo (develop/main).
  verify_producer:
    name: "Verify Producer & Extract Facts"
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      workflow_id: ${{ steps.facts.outputs.workflow_id }}
      head_sha: ${{ steps.facts.outputs.head_sha }}
      candidate_sha: ${{ steps.facts.outputs.candidate_sha }}
      base_sha: ${{ steps.facts.outputs.base_sha }}
      pr_number: ${{ steps.facts.outputs.pr_number }}
    steps:
      - name: Extract authenticated facts from workflow_run
        id: facts
        run: |
          set -euo pipefail
          # workflow_id must come from the authenticated run context,
          # NOT from run.id (which is the Workflow Run ID, not the
          # workflow definition ID). The producer's workflow_id identifies
          # the reviewed ci.yml definition.
          echo "workflow_id=${{ github.event.workflow_run.workflow_id }}" >> "$GITHUB_OUTPUT"
          # head_sha: the commit that triggered the producer CI.
          echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          # candidate_sha and base_sha come from the producer's
          # trusted-pr-plan artifact (see verify_producer below).
          # We default to head_sha/base_ref here and refine in the
          # next step after artifact download.
          echo "candidate_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${{ github.event.workflow_run.base_sha }}" >> "$GITHUB_OUTPUT"
          # The PR number is extracted from the workflow_run base_ref.
          # For pull_request events, base_ref is refs/pull/<num>/merge.
           BASE_REF="${{ github.event.workflow_run.base_ref }}"
           if [[ "$BASE_REF" =~ refs/pull/([0-9]+)/merge ]]; then
             echo "pr_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
           else
             echo "pr_number=" >> "$GITHUB_OUTPUT"
           fi
           echo "Producer verified: workflow_id=$workflow_id head=$head_sha pr=$pr_number"

  # Step 2: Download the trusted-pr-plan artifact from the producer CI,
  # extract candidate_sha/integration_sha, and determine the PR->task mapping.
  extract_plan:
    name: "Extract Trusted Plan & Map PR->Task"
    if: github.event.workflow_run.conclusion == 'success'
    needs: verify_producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      workflow_id: ${{ steps.plan.outputs.workflow_id }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - name: Download trusted-pr-plan artifact
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          ATTEMPT="${{ github.event.workflow_run.run_attempt }}"
          # The workflow-definition id is an authenticated Actions API field,
          # distinct from the authenticated workflow run id (RUN_ID). Source it
          # directly; do not let the plan artifact invent it (Owner 2026-10-27).
          WORKFLOW_DEFINITION_ID="${{ github.event.workflow_run.workflow_id }}"
          echo "Downloading trusted-pr-plan artifact from run $RUN_ID attempt $ATTEMPT (workflow_id=$WORKFLOW_DEFINITION_ID)"
          # gh run download resolves the artifact by authenticated name from the
          # producer run. It fails closed (non-zero) on any transport or
          # missing-artifact error, so the workflow never continues without it.
          gh run download "$RUN_ID" -n trusted-pr-plan --pattern '*.zip'
          test -f plan.zip
          echo "workflow_definition_id=$WORKFLOW_DEFINITION_ID" >> "$GITHUB_OUTPUT"

      - name: Decode pr-plan and extract candidate_sha
        id: plan
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          # The workflow-definition id is an authenticated Actions API field,
          # distinct from the authenticated workflow run id. Source it directly
          # and bind it against the producer run's workflow_id (Owner 2026-10-27,
          # D1: run identity separated from workflow-definition identity).
          WORKFLOW_DEFINITION_ID="${{ github.event.workflow_run.workflow_id }}"
          # Strictly parse the trusted-pr-plan JSON with Python and emit
          # machine-readable outputs. The plan object is DATA here: no shell
          # sourcing of artifact-derived strings, no source/eval on any
          # artifact value, and no fallback facts. The heredoc redirects on
          # the Python invocation (Owner correction 2026-10-27, D3).
           python3 - <<'PY' > plan.txt
          import json, zipfile, sys, re
          with zipfile.ZipFile("plan.zip") as z:
              with z.open("pr-plan.json") as f:
                  plan = json.loads(f.read())
          def is40hex(v):
              return isinstance(v, str) and re.fullmatch(r"[0-9a-f]{40}", v) is not None
          def is_pos_int(v):
              return isinstance(v, int) and v > 0
          # run_id is the authenticated workflow run id (distinct from the
          # workflow definition id). attempt must be 1; an Actions rerun is
          # not relabelled as attempt 1.
          q_ok = is_pos_int(plan.get("run_id"))
          if not q_ok:
              sys.exit("missing or invalid run_id (positive int)")
          attempt = plan.get("attempt")
          q_ok = attempt == 1
          if not q_ok:
              sys.exit("source attempt is not 1 (attempt=%r); not a pilot attempt 1" % (attempt,))
          hs = plan.get("head_sha")
          isha = plan.get("integration_sha")
          bs = plan.get("target_base_sha")
          q_ok = is40hex(hs)
          if not q_ok:
              sys.exit("missing or malformed head_sha (need 40 lowercase hex)")
          q_ok = bool(isha)
          if not q_ok:
              sys.exit("missing required integration_sha")
          q_ok = is40hex(isha)
          if not q_ok:
              sys.exit("missing or malformed integration_sha (need 40 lowercase hex)")
          q_ok = is40hex(bs)
          if not q_ok:
              sys.exit("missing or malformed target_base_sha (need 40 lowercase hex)")
          out = {
              "workflow_id": str(int(plan.get("workflow_id", 0))),
              "head_sha": hs,
              "candidate_sha": isha,
              "base_sha": bs,
          }
          print("\n".join(f"{k}={v}" for k, v in out.items()))
          PY
          workflow_id="$(grep '^workflow_id=' plan.txt | cut -d= -f2-)"
          head_sha="$(grep '^head_sha=' plan.txt | cut -d= -f2-)"
          candidate_sha="$(grep '^candidate_sha=' plan.txt | cut -d= -f2-)"
          base_sha="$(grep '^base_sha=' plan.txt | cut -d= -f2-)"
          # Bind the artifact workflow_id to the authenticated Actions API value;
          # they must be equal, so a spoofed/absent definition id fails closed.
          if [ "${workflow_id}" != "${WORKFLOW_DEFINITION_ID}" ]; then
              echo "artifact workflow_id ${workflow_id} != authenticated ${WORKFLOW_DEFINITION_ID}" >&2
              exit 1
          fi
          echo "workflow_id=${workflow_id}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
           echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
           echo "Plan extracted: candidate=$candidate_sha base=$base_sha head=$head_sha run=$RUN_ID wf_id=${workflow_id}"

  # Step 3: Write plan fixture (tasklink) and publish the receipt.
  # This is the ONLY step with contents:write — and it runs the IMMUTABLE
  # controller Python from the reviewed CI repo, NOT PR-controlled code.
  publish_receipt:
    name: "Publish Receipt to Planning"
    if: github.event.workflow_run.conclusion == 'success'
    needs: [verify_producer, extract_plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      WORKFLOW_ID: ${{ needs.extract_plan.outputs.workflow_id }}
      HEAD_SHA: ${{ needs.extract_plan.outputs.head_sha }}
      CANDIDATE_SHA: ${{ needs.extract_plan.outputs.candidate_sha }}
      BASE_SHA: ${{ needs.extract_plan.outputs.base_sha }}
      PR_NUMBER: ${{ needs.verify_producer.outputs.pr_number }}
    steps:
      - name: Checkout immutable controller (reviewed CI)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CRITICAL: We check out the immutable reviewed CI controller scripts
          # by their full reviewed commit SHA — NOT mutable develop and NOT the
          # PR head. Pinning the exact SHA prevents PR-controlled code from
          # running in the credential-bearing controller; the scripts are
          # reviewed, protected, and identical across all invocations.
          ref: 839e5cc9fa9b3da3908ee65f26596c2b3dfaaca7
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Planning (for publication)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: planning
          token: ${{ secrets.PLANNING_RECEIPT_WRITE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Automatic task-link (plan fixture)
        id: plan_commit
        env:
          PLANNING_ROOT: ${{ github.workspace }}/planning
        shell: bash
        run: |
           set -euo pipefail
           echo "Writing plan fixture with task link..."
           echo "  workflow_id=$WORKFLOW_ID"
           echo "  head_sha=$HEAD_SHA"
           echo "  candidate_sha=$CANDIDATE_SHA"
           echo "  base_sha=$BASE_SHA"
           echo "  pr_number=$PR_NUMBER"
           # The tasklink script writes the bounded plan fixture through the ONE
           # authoritative PR->task resolver (CODE-AUDIT F4). The task is NOT
           # caller-supplied (--task); it is auto-resolved from the trusted PR
           # via --pr-number. A caught resolver error fails closed — it is never
           # an authorization to fall back to a hardcoded task (F4). The commit
           # the tasklink returns is the real Planning plan revision the writer
           # consumes as --plan (never the candidate SHA, never a run.id).
           #
           # The CLI emits diagnostics on stdout and returns the result commit
           # as its final line; the plan revision is that last 40-hex line
           # only — never parsed from arbitrary progress text (Owner
           # correction 2026-10-27).
           RESULT="$(python3 scripts/receipt_tasklink.py \
             --planning "$PLANNING_ROOT" \
             --workflow-id "$WORKFLOW_ID" \
             --head "$HEAD_SHA" \
             --candidate "$CANDIDATE_SHA" \
             --base "$BASE_SHA" \
             --pr-number "$PR_NUMBER")"
           PLAN_COMMIT="$(printf '%s\n' "$RESULT" \
             | grep -E '^[0-9a-f]{40}$' | tail -n 1)"
           if [ -z "${PLAN_COMMIT}" ]; then
             echo "tasklink did not return a valid plan commit SHA" >&2
             exit 1
           fi
           echo "plan_revision=${PLAN_COMMIT}" >> "$GITHUB_OUTPUT"
           echo "Plan fixture written at $PLAN_COMMIT. Verifying..."
           ls -la "$PLANNING_ROOT/evidence/receipt-plans/"

      - name: Publish receipt to Planning
        env:
          PLANNING_ROOT: ${{ github.workspace }}/planning
          # run-id for the receipt is the authenticated workflow RUN (the
          # live workflow run id), never the workflow definition id
          # (workflow_id). load_plan() requires a Planning commit, never the
          # tested candidate SHA — the writer's --plan is the plan fixture's
          # Planning commit below.
          RUN_ID: ${{ needs.extract_plan.outputs.run_id }}
          PLAN_REVISION: ${{ steps.plan_commit.outputs.plan_revision }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing receipt..."
          echo "  run_id=$RUN_ID"
          echo "  attempt=1"
          echo "  plan_revision=$PLAN_REVISION"
          # The writer invokes the immutable controller Python.
          # It creates a canonical 6-field receipt, verifies it live,
          # and publishes via ordinary fast-forward push to Planning.
          # Identity comes from the authenticated run context only; no
          # GITHUB_* values are overridden — the writer's own context is the
          # verification source (Owner review: remove all GITHUB_* overrides).
          python3 scripts/receipt_writer.py \
            --planning "$PLANNING_ROOT" \
            --plan "$PLAN_REVISION" \
            --run "$RUN_ID" \
            --attempt 1 \
            --publish
          echo "Receipt published. Verifying durable state..."
          ls -la "$PLANNING_ROOT/evidence/receipts/"

      - name: Report publication result
        if: always()
        run: |
          set -euo pipefail
          echo "## Receipt Publication Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Workflow ID:** ${{ needs.extract_plan.outputs.workflow_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Head SHA:** ${{ needs.extract_plan.outputs.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Candidate SHA:** ${{ needs.extract_plan.outputs.candidate_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Base SHA:** ${{ needs.extract_plan.outputs.base_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR Number:** ${{ needs.verify_producer.outputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Conclusion:** ${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Status:** ✅ Published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** ❌ Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
