name: "Receipt · Post-Run Writer"

# DORMANT: PR2 content. Does NOT activate PR1 (work/r27-minimal-receipt).
# Manual activation requires a separate PR that removes this guard.
if: false

on:
  workflow_run:
    workflows: ["CI · Source & Quality"]
    types:
      - completed
  # Tag-trigger without activation: receipt-post-run.yml must be enabled
  # in a dedicated PR before any automatic invocation is possible.
  # tag: 'r27-*'

permissions:
  contents: read
  actions: read

jobs:
  post_run_writer:
    name: "Receipt · Writer (dormant)"
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Resolve planning repo and task reference
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The post-run writer reads the task reference from the PR plan
          # artifact published by the CI workflow. This step only documents
          # the CLI path; the actual writer invocation lives in the
          # receipt_writer.py module and is exercised by focused tests.
          echo "Task reference path: evidence/receipt-plans/public-contracts.json"
          echo "CLI entry: python3 scripts/receipt_writer.py --planning <planning-repo> --plan <plan-revision> --run <run-id> --attempt <attempt>"
          echo "Dormant: this workflow must be activated by a separate PR2 commit."
          # Automatic gate-plan/task-link: the task reference is extracted
          # from the plan JSON (field "task") and emitted to the summary
          # for traceability. No new production script or service is created.
          echo "## Receipt post-run writer (dormant)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Entry point: `scripts/receipt_writer.py`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Receipt path: `evidence/receipts/public-contracts/<run-id>-<attempt>.json`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Task reference: `<plan>.task` field (format `tasks/<slug>.md`)" >> "$GITHUB_STEP_SUMMARY"
