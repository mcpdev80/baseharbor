name: cancel-stale-runtime-validation

on:
  push:
    branches:
      - 'runtime-maintenance/cancel-stale/**'

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale:
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    steps:
      - name: Cancel stale Podman validation runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 35723600861 35723606245 35723748759 35723752908; do
            echo "Cancelling stale run $id"
            code="$(curl -sS -o /tmp/cancel-$id.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/actions/runs/$id/cancel")"
            case "$code" in
              202|409) ;;
              *)
                echo "cancel $id returned HTTP $code" >&2
                cat /tmp/cancel-$id.out >&2 || true
                exit 1
                ;;
            esac
          done
