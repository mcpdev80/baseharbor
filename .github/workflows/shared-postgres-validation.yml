name: "Validation · Shared PostgreSQL"

run-name: "Validation · Shared PostgreSQL · ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git ref or commit SHA to test
        required: true
        type: string
  push:
    branches:
      - runtime-validation/shared-postgres
  workflow_dispatch:

concurrency:
  group: shared-postgres-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Docker runner state
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Check focused formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_postgres_integration_test.go
            internal/application/postgres_backup.go
            internal/application/backend_tls.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || {
            echo "gofmt required:" >&2
            echo "$bad" >&2
            exit 1
          }

      - name: Run shared provider unit tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedPostgres|TestVerifySharedPostgres|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry|TestPostgresBackup|TestPostgresRestore|TestDumpPostgres|TestRestorePostgres)'

      - name: Build affected CLI packages
        run: go test ./cmd/baha ./internal/capability -run '^$'

      - name: Run two-application shared PostgreSQL integration
        env:
          BASEHARBOR_SHARED_POSTGRES_INTEGRATION: "1"
        run: go test -p 1 ./internal/application -count=1 -run '^TestSharedPostgresTwoApplicationIsolationBackupRestoreDestroy$' -v

      - name: Cleanup Docker runner state
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker
