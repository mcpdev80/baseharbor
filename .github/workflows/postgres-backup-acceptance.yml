name: postgres-backup-acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASEHARBOR_POSTGRES_BACKUP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Prove multi-instance PostgreSQL destroy recreate restore
        run: go test ./internal/application -run '^TestPostgresBackupDisasterRecovery$' -count=1 -v
