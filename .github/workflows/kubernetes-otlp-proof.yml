name: "Kubernetes OTLP Proof"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-kubernetes-otlp'
    paths:
      - '.ci/kubernetes-otlp-trigger'

permissions:
  contents: read

jobs:
  static:
    name: OTLP · Static Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/providers/runtime/kubernetes/core_otlp_integration_test.go internal/telemetry internal/application/telemetry_binding.go
          if ! git diff --exit-code -- internal/providers/runtime/kubernetes/core_otlp_integration_test.go internal/telemetry internal/application/telemetry_binding.go; then
            echo "OTLP Kubernetes proof requires gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes ./internal/telemetry ./internal/application -run '^$' -count=1

      - name: Run focused OTLP contract tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/telemetry ./internal/application -run 'OTLP|Telemetry' -count=1

  otlp:
    needs: static
    name: Kubernetes · OTLP Core Seam
    runs-on: [self-hosted, Linux, X64, baseharbor, k3s]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run OTLP Core seam proof on k3s
        shell: bash
        env:
          BASEHARBOR_KUBERNETES_OTLP_TEST: "1"
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes -run '^TestKubernetesCoreOTLPLifecycle$' -count=1 -v

      - name: Cleanup and assert proof cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(kubectl config view --minify -o 'jsonpath={..namespace}')"
          namespace="${namespace:-default}"
          selector='app.kubernetes.io/managed-by=baseharbor,baseharbor.io/application=bh-core-otlp-proof'
          kubectl delete deployment,service,configmap,secret -n "$namespace" -l "$selector" --ignore-not-found=true --wait=true >/dev/null 2>&1 || true
          remaining="$(kubectl get deployment,service,configmap,secret -n "$namespace" -l "$selector" --no-headers 2>/dev/null || true)"
          test -z "$remaining" || {
            echo "OTLP proof left BaseHarbor-owned resources:" >&2
            echo "$remaining" >&2
            exit 1
          }
