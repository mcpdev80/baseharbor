name: wizard-symbol-fix

on:
  push:
    branches: [feat/app-init-wizard]
    paths:
      - .github/workflows/wizard-symbol-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/app-init-wizard
      - name: Rename wizard-local terminal helper
        run: |
          sed -i 's/readerIsTerminal/appInitReaderIsTerminal/g' cmd/baha/app_init_wizard.go
          gofmt -w cmd/baha/app_init_wizard.go
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/baha/app_init_wizard.go
          git commit -m 'fix: avoid duplicate terminal helper symbol'
          git push origin HEAD:feat/app-init-wizard
