name: "Acceptance · Observability Full Stack"

run-name: "Acceptance · Observability Full Stack · ${{ inputs.ref || github.ref_name }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git ref or commit SHA to test
        required: true
        type: string
      all_runtimes:
        description: Run Docker and Podman jobs when used as a release gate
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: develop
        type: string
      all_runtimes:
        description: Run both Docker and rootless Podman acceptance jobs
        required: false
        default: true
        type: boolean
  push:
    branches:
      - 'runtime-validation/observability/**'

concurrency:
  # Run-unique, non-cancelling orchestrator group (card 0428-249 accepted edit
  # set): evidence jobs below key on the resolver-verified candidate SHA.
  group: observability-orchestrator-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Accepted edit set (card 0428-249): one resolver turns a branch-shaped input
  # into a verified 40-hex SHA; the evidence jobs assert checkout equality.
  resolve_candidate:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE_REF"
          candidate_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  docker:
    needs: resolve_candidate
    concurrency:
      group: observability-${{ needs.resolve_candidate.outputs.candidate_sha }}-docker-${{ github.run_id }}
      cancel-in-progress: false
    if: ${{ inputs.all_runtimes || !contains(github.ref_name, '/podman/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_OBSERVABILITY_ACCEPTANCE: "1"
      # Fresh hosted runners have no pre-provisioned shared backends; a first-time
      # shared backend needs two-stage operator consent an unattended acceptance
      # journey cannot give. Pin application placement (update_core_isolated_test.go:34).
      BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
      BASEHARBOR_PROVIDER_VALKEY_SCOPE: application
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:observability-ci

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_candidate.outputs.candidate_sha }}
      - name: Assert exact candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install verified ORAS for native Core bootstrap
        run: bash scripts/ci-install-oras.sh

      - name: Reset persistent runner state
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Build runtime image from tested checkout
        shell: bash
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .

      - name: Publish verified runtime image to isolated OCI registry
        shell: bash
        run: bash scripts/ci-local-oci-registry.sh publish "$BASEHARBOR_RUNTIME_IMAGE" localhost:5000/baseharbor-runtime:observability-ci

      - name: Run focused full-stack observability acceptance
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/baha -run '^TestObservabilityFullStackAcceptanceInCI$' -count=1 -v

      - name: Show observability diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a || true
          echo "::group::docker-log-config"
          for id in $(docker ps -aq); do
            docker inspect --format '{{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} log={{json .HostConfig.LogConfig}}' "$id" || true
          done
          echo "::endgroup::"
          for id in $(docker ps -aq); do
            project="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id" 2>/dev/null || true)"
            case "$project" in
              baseharbor*)
                echo "::group::$project/$id"
                docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$id" || true
                docker logs "$id" || true
                echo "::endgroup::"
                ;;
            esac
          done

      - name: Clean up isolated OCI registry
        if: always()
        shell: bash
        run: bash scripts/ci-local-oci-registry.sh cleanup

      - name: Cleanup persistent runner state
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  podman:
    needs: resolve_candidate
    concurrency:
      group: observability-${{ needs.resolve_candidate.outputs.candidate_sha }}-podman-${{ github.run_id }}
      cancel-in-progress: false
    if: ${{ inputs.all_runtimes || contains(github.ref_name, '/podman/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      BASEHARBOR_OBSERVABILITY_ACCEPTANCE: "1"
      BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
      BASEHARBOR_PROVIDER_VALKEY_SCOPE: application
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:observability-ci

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_candidate.outputs.candidate_sha }}
      - name: Assert exact candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install verified ORAS for native Core bootstrap
        run: bash scripts/ci-install-oras.sh

      - name: Reset persistent runner state
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Build runtime image from tested checkout
        shell: bash
        run: podman build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .

      - name: Publish verified runtime image to isolated OCI registry
        shell: bash
        run: bash scripts/ci-local-oci-registry.sh publish "$BASEHARBOR_RUNTIME_IMAGE" localhost:5000/baseharbor-runtime:observability-ci

      - name: Verify Quadlet-only runtime
        shell: bash
        run: |
          set -euo pipefail
          podman info >/dev/null
          generator=""
          for candidate in \
            "$(command -v podman-system-generator 2>/dev/null || true)" \
            /usr/lib/systemd/system-generators/podman-system-generator \
            /usr/libexec/podman/quadlet
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              generator="$candidate"
              break
            fi
          done
          test -n "$generator"
          verify_unit_dir="$RUNNER_TEMP/observability-quadlet-verify"
          rm -rf "$verify_unit_dir"
          mkdir -p "$verify_unit_dir"
          QUADLET_UNIT_DIRS="$verify_unit_dir" "$generator" --user --dryrun >/dev/null

          mkdir -p "$RUNNER_TEMP/baseharbor-runtime-path"
          cat >"$RUNNER_TEMP/baseharbor-runtime-path/docker" <<'EOF'
          #!/bin/sh
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-runtime-path/docker"
          echo "$RUNNER_TEMP/baseharbor-runtime-path" >> "$GITHUB_PATH"

          cat >"$RUNNER_TEMP/baseharbor-no-compose" <<'EOF'
          #!/bin/sh
          echo "podman compose is forbidden in Quadlet observability acceptance" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-no-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/baseharbor-no-compose" >> "$GITHUB_ENV"

      - name: Run focused full-stack observability acceptance
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/baha -run '^TestObservabilityFullStackAcceptanceInCI$' -count=1 -v

      - name: Show Quadlet observability diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}"
          systemctl --user --failed --no-pager || true
          systemctl --user list-units 'baseharbor*' --all --no-pager || true
          for unit in $(systemctl --user list-units 'baseharbor*' --all --no-legend --plain 2>/dev/null | awk '{print $1}'); do
            [ -n "$unit" ] || continue
            systemctl --user status "$unit" --no-pager -l || true
            journalctl --user -u "$unit" -n 80 --no-pager || true
          done
          podman ps -a || true

      - name: Clean up isolated OCI registry
        if: always()
        shell: bash
        run: bash scripts/ci-local-oci-registry.sh cleanup

      - name: Cleanup persistent runner state
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh podman
