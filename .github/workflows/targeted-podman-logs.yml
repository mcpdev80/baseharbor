name: targeted-podman-logs

on:
  push:
    branches:
      - 'runtime-validation/podman-logs/**'

permissions:
  contents: read

jobs:
  logs:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      BASEHARBOR_LOGS_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Podman state
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Run Loki ingestion only
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Capture Podman diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          podman ps -a
          podman ps -a --format json
          for id in $(podman ps -aq); do
            echo "--- $id labels"
            podman inspect "$id" --format '{{json .Config.Labels}}'
            echo "--- $id logs"
            podman logs "$id" || true
          done

      - name: Cleanup Podman state
        if: always()
        run: bash scripts/ci-runtime-reset.sh podman
