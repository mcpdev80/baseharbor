name: "Kubernetes Core Services Proof"

run-name: "${{ github.event.head_commit.message }}"

on:
  workflow_dispatch:
  push:
    branches:
      - 'runtime-validation/targeted-kubernetes-core-services*'
    paths:
      - '.ci/kubernetes-core-services-trigger'

permissions:
  contents: read

jobs:
  postgres:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'runtime-validation/targeted-kubernetes-core-services-postgres')
    name: Kubernetes · PostgreSQL Core Seam
    runs-on: [self-hosted, Linux, X64, baseharbor, k3s]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/providers/runtime/kubernetes internal/application)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run PostgreSQL Core seam proof on k3s
        shell: bash
        env:
          BASEHARBOR_KUBERNETES_CORE_SERVICES_TEST: "1"
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes             -run '^TestKubernetesCorePostgresSemanticProbe$'             -count=1 -v

      - name: Assert proof cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(kubectl config view --minify -o 'jsonpath={..namespace}')"
          namespace="${namespace:-default}"
          remaining="$(kubectl get deployment,service -n "$namespace"             -l 'app.kubernetes.io/managed-by=baseharbor,baseharbor.io/application=bh-core-postgres-proof'             --no-headers 2>/dev/null || true)"
          test -z "$remaining" || {
            echo "PostgreSQL proof left BaseHarbor-owned resources:" >&2
            echo "$remaining" >&2
            exit 1
          }


  openbao:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'runtime-validation/targeted-kubernetes-core-services-openbao')
    name: Kubernetes · OpenBao Core Seam
    runs-on: [self-hosted, Linux, X64, baseharbor, k3s]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/providers/runtime/kubernetes internal/openbao)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run OpenBao Core seam proof on k3s
        shell: bash
        env:
          BASEHARBOR_KUBERNETES_CORE_SERVICES_TEST: "1"
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes             -run '^TestKubernetesCoreOpenBaoPostgresStorageAndPKI$'             -count=1 -v

      - name: Assert proof cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(kubectl config view --minify -o 'jsonpath={..namespace}')"
          namespace="${namespace:-default}"
          remaining="$(kubectl get deployment,service,configmap,secret -n "$namespace"             -l 'app.kubernetes.io/managed-by=baseharbor,baseharbor.io/application=bh-core-openbao-proof'             --no-headers 2>/dev/null || true)"
          test -z "$remaining" || {
            echo "OpenBao proof left BaseHarbor-owned resources:" >&2
            echo "$remaining" >&2
            exit 1
          }


  identity:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'runtime-validation/targeted-kubernetes-core-services-identity')
    name: Kubernetes · Keycloak Identity Core Seam
    runs-on: [self-hosted, Linux, X64, baseharbor, k3s]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/providers/runtime/kubernetes internal/identityprovider internal/application)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run Keycloak identity Core seam proof on k3s
        shell: bash
        env:
          BASEHARBOR_KUBERNETES_CORE_SERVICES_TEST: "1"
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes             -run '^TestKubernetesCoreKeycloakIdentityLifecycle$'             -count=1 -v

      - name: Cleanup and assert proof cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(kubectl config view --minify -o 'jsonpath={..namespace}')"
          namespace="${namespace:-default}"
          selector='app.kubernetes.io/managed-by=baseharbor,baseharbor.io/application=bh-core-identity-proof'
          kubectl delete deployment,service,configmap,secret -n "$namespace"             -l "$selector" --ignore-not-found=true --wait=true >/dev/null 2>&1 || true
          remaining="$(kubectl get deployment,service,configmap,secret -n "$namespace"             -l "$selector" --no-headers 2>/dev/null || true)"
          test -z "$remaining" || {
            echo "Identity proof left BaseHarbor-owned resources:" >&2
            echo "$remaining" >&2
            exit 1
          }
