name: "Object Storage Runtime Neutrality"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-object-storage-neutrality*'
    paths:
      - '.ci/object-storage-neutrality-trigger'

permissions:
  contents: read

jobs:
  object-storage:
    name: Core · Object Storage Runtime Neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/objectstorage internal/application/object_storage_runtime.go
          if ! git diff --exit-code -- internal/objectstorage internal/application/object_storage_runtime.go; then
            echo "Object-storage neutrality scope requires gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile object-storage packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/objectstorage ./internal/application -run '^$' -count=1

      - name: Run object-storage focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/objectstorage -count=1
          go test ./internal/application -run 'ObjectStorage|SeaweedFS' -count=1
