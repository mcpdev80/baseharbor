name: release-pin-evidence
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.26)'
        required: true
        default: 'v0.4.26'

jobs:
  pin-evidence:
    runs-on: ubuntu-latest
    env:
      CORE_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      CONNECTOR_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      DEMO_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate refs
        run: |
          set -euo pipefail
          re='^[0-9a-f]{40}$'
          for var in CORE_REF CONNECTOR_REF DEMO_REF; do
            val="${!var}"
            if ! [[ "$val" =~ $re ]]; then
              echo "error: $var is not a 40-hex SHA: $val" >&2
              exit 1
            fi
          done
          tag="${{ inputs.tag }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag is not a valid release tag: $tag" >&2
            exit 1
          fi

      - name: strip release tag
        id: strip_tag
        run: |
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"

      - name: run ecosystem_release_pins.py
        run: |
          set -euo pipefail
          echo "Running ecosystem_release_pins.py..."
          echo "CORE_REF=$CORE_REF"
          echo "CONNECTOR_REF=$CONNECTOR_REF"
          echo "DEMO_REF=$DEMO_REF"
          echo "RELEASE_VERSION=$RELEASE_VERSION"
          echo "GH_TOKEN is set: $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          python3 scripts/ecosystem_release_pins.py \
            --core "$CORE_REF" \
            --tag "${RELEASE_VERSION}" \
            --connector "$CONNECTOR_REF" \
            --demo "$DEMO_REF" \
            --output "docs/releases/${RELEASE_VERSION}.consumer-pins.json" 2>&1 || {
            echo "SCRIPT FAILED with exit code $?"
            echo "Trying gh api directly..."
            gh api repos/mcpdev80/baseharbor-node-connector/contents/integration-candidate.json?ref=$CONNECTOR_REF 2>&1 || echo "GH API FAILED"
            exit 1
          }

      - name: upload consumer pins artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-pins-${{ env.RELEASE_VERSION }}
          path: docs/releases/*.consumer-pins.json
          retention-days: 30

      - name: evidence summary
        run: |
          set -euo pipefail
          pins_file="docs/releases/${RELEASE_VERSION}.consumer-pins.json"
          if [ -f "$pins_file" ]; then
            echo "pin-evidence: SUCCESS tag=$RELEASE_VERSION"
            echo "pin-evidence: run_id=$GITHUB_RUN_ID"
            echo "pin-evidence: artifact=consumer-pins-$RELEASE_VERSION"
            echo "pin-evidence: sha=$(git rev-parse HEAD)"
          else
            echo "pin-evidence: FAILED no pins file generated" >&2
            exit 1
          fi
