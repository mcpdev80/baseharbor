name: release-pin-evidence
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.26)'
        required: true
        default: 'v0.4.26'

jobs:
  pin-evidence:
    runs-on: ubuntu-latest
    env:
      CORE_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      CONNECTOR_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      DEMO_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate refs
        run: |
          set -euo pipefail
          re='^[0-9a-f]{40}$'
          for var in CORE_REF CONNECTOR_REF DEMO_REF; do
            val="${!var}"
            if ! [[ "$val" =~ $re ]]; then
              echo "error: $var is not a 40-hex SHA: $val" >&2
              exit 1
            fi
          done
          tag="${{ inputs.tag }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag is not a valid release tag: $tag" >&2
            exit 1
          fi

      - name: strip release tag
        id: strip_tag
        run: |
          echo "TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${{ inputs.tag }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"

      - name: run generate_consumer_pins.py
        env:
          CONSOLE_REF: '1861ed07888a1ec22c218ca491d23ee54f48e261'
        run: |
          set -euo pipefail
          echo "CORE_REF=$CORE_REF"
          echo "CONNECTOR_REF=$CONNECTOR_REF"
          echo "CONSOLE_REF=$CONSOLE_REF"
          echo "DEMO_REF=$DEMO_REF"
          echo "RELEASE_TAG=$RELEASE_TAG"
          python3 scripts/generate_consumer_pins.py

      - name: upload consumer pins artifact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-pins-${{ env.RELEASE_VERSION }}
          path: docs/releases/*.consumer-pins.json
          retention-days: 30

      - name: evidence summary
        run: |
          set -euo pipefail
          pins_file="docs/releases/${RELEASE_VERSION}.consumer-pins.json"
          if [ -f "$pins_file" ]; then
            echo "pin-evidence: SUCCESS tag=$RELEASE_VERSION"
            echo "pin-evidence: run_id=$GITHUB_RUN_ID"
            echo "pin-evidence: artifact=consumer-pins-$RELEASE_VERSION"
            echo "pin-evidence: sha=$(git rev-parse HEAD)"
          else
            echo "pin-evidence: FAILED no pins file generated" >&2
            exit 1
          fi
