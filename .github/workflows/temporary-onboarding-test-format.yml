name: Temporary one-shot onboarding integration test formatting
on:
  push:
    branches:
      - feat/0427-zero-friction-core-workstation-onboarding
    paths:
      - .github/workflows/temporary-onboarding-test-format.yml
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/0427-zero-friction-core-workstation-onboarding
          persist-credentials: true
      - name: Apply gofmt and delete one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/workstationenrollment/http/production_handler_restart_test.go cmd/baha/onboarding_command.go
          test -z "$(gofmt -l internal/workstationenrollment/http/production_handler_restart_test.go cmd/baha/onboarding_command.go)"
          git rm .github/workflows/temporary-onboarding-test-format.yml
          git add -- internal/workstationenrollment/http/production_handler_restart_test.go cmd/baha/onboarding_command.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(onboard): gofmt native onboarding and renewal integration coverage"
          git push origin HEAD:feat/0427-zero-friction-core-workstation-onboarding
