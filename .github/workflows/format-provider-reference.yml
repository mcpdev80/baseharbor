name: "Maintenance · Format Provider Reference"

on:
  push:
    branches:
      - feature/v0417-managed-identity-ui
    paths:
      - .ci/format-provider-reference-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/v0417-managed-identity-ui
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format provider reference
        run: |
          gofmt -w internal/capability/reference.go
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/capability/reference.go
          git commit -m "style(providers): format reference descriptors"
          git push origin HEAD:feature/v0417-managed-identity-ui
