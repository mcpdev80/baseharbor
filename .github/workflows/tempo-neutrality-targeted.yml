name: "Tempo Runtime Neutrality Targeted"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-tempo-neutrality'
    paths:
      - '.ci/tempo-neutrality-trigger'

permissions:
  contents: read

jobs:
  tempo:
    name: Core · Tempo Runtime Neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/traces/tempo.go internal/traces/realization.go
          if ! git diff --exit-code -- internal/traces/tempo.go internal/traces/realization.go; then
            echo "Tempo runtime-neutrality changes require gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/traces ./internal/telemetry ./internal/application ./internal/capability -run '^$' -count=1

      - name: Run Tempo focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/traces -count=1
