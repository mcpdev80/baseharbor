name: targeted-podman-demo-lifecycle

on:
  push:
    branches:
      - 'runtime-validation/podman-demo-lifecycle/**'

permissions:
  contents: read

jobs:
  demo-lifecycle:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 45
    env:
      BASEHARBOR_TEST_RUNTIME: podman

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Podman state
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Run external demo lifecycle only
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ARTIFACT_DIR: /tmp/baseharbor-demo-podman-lifecycle
          BASEHARBOR_INSTALL_DIR: /tmp/baseharbor-demo-podman-bin
        run: |
          set -euo pipefail
          rm -rf /tmp/baseharbor-demo-podman-lifecycle-repo "$ARTIFACT_DIR" "$BASEHARBOR_INSTALL_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-demo-podman-lifecycle-repo
          cd /tmp/baseharbor-demo-podman-lifecycle-repo
          export DEMO_ROOT="$PWD"
          export BAHA="$BASEHARBOR_INSTALL_DIR/baha"
          export BASEHARBOR_STATE_DIR=/tmp/baseharbor-demo-podman-lifecycle-state
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" BASEHARBOR_TEST_RUNTIME=podman bash scripts/install-baseharbor.sh
          mkdir -p "$ARTIFACT_DIR"
          : > "$ARTIFACT_DIR/results.tsv"
          bash tests/lifecycle/run.sh

      - name: Cleanup Podman state
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman
