name: integration-gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Integration gate to run
        required: true
        default: all
        type: choice
        options:
          - all
          - postgres-valkey
          - s3
          - openbao

permissions:
  contents: read

jobs:
  postgres-valkey:
    if: ${{ inputs.gate == 'all' || inputs.gate == 'postgres-valkey' }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 20
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build baha
        run: go build -o /tmp/baha ./cmd/baha
      - name: Verify application PostgreSQL and Valkey lifecycle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          export XDG_CONFIG_HOME="$workdir/xdg-config"
          export XDG_DATA_HOME="$workdir/xdg-data"
          export BASEHARBOR_TARGET=ci
          /tmp/baha target create ci --provider docker --access local-docker --reference local --scope default --default >/dev/null
          /tmp/baha app create ci-demo --sql --cache
          /tmp/baha app plan ci-demo | grep -q "dedicated PostgreSQL service"
          /tmp/baha app plan ci-demo | grep -q "authenticated Valkey service"
          /tmp/baha app preflight ci-demo | grep -q "Preflight passed"
          /tmp/baha app apply ci-demo | grep -q "application and requested infrastructure verified"
          /tmp/baha app status ci-demo --verbose | grep -q "authenticated SELECT 1 succeeded"
          /tmp/baha app status ci-demo --verbose | grep -q "authenticated PING returned PONG"
          /tmp/baha app doctor ci-demo | grep -q "^READY$"
          test -f $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml
          ! grep -q "ports:" $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml

          docker compose --project-name baseharbor-ci-ci-demo-dev --file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml --env-file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env exec -T postgres psql -U baseharbor -d ci_demo_dev -c "CREATE TABLE lifecycle_probe (value text NOT NULL); INSERT INTO lifecycle_probe VALUES ('preserved');"
          docker compose --project-name baseharbor-ci-ci-demo-dev --file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml --env-file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env exec -T valkey sh -ec 'VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli set lifecycle_probe preserved' | grep -q '^OK$'
          env_hash_before=$(sha256sum $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env | awk '{print $1}')

          /tmp/baha app down ci-demo | grep -q "persistent data preserved"
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-ci-demo-dev)"
          docker volume inspect baseharbor-ci-ci-demo-dev_postgres-data >/dev/null
          docker volume inspect baseharbor-ci-ci-demo-dev_valkey-data >/dev/null

          /tmp/baha app up ci-demo | grep -q "runtime and requested infrastructure verified"
          env_hash_after=$(sha256sum $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env | awk '{print $1}')
          test "$env_hash_before" = "$env_hash_after"
          /tmp/baha app status ci-demo --verbose | grep -q "authenticated SELECT 1 succeeded"
          /tmp/baha app status ci-demo --verbose | grep -q "authenticated PING returned PONG"
          docker compose --project-name baseharbor-ci-ci-demo-dev --file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml --env-file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env exec -T postgres psql -U baseharbor -d ci_demo_dev -tAc "SELECT value FROM lifecycle_probe" | grep -q '^preserved$'
          docker compose --project-name baseharbor-ci-ci-demo-dev --file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/compose.yaml --env-file $XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev/state/ci-demo/runtime/runtime.env exec -T valkey sh -ec 'VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli get lifecycle_probe' | grep -q '^preserved$'

          /tmp/baha app destroy ci-demo | grep -q "No changes were made"
          test -d "$XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev"
          docker volume inspect baseharbor-ci-ci-demo-dev_postgres-data >/dev/null
          docker volume inspect baseharbor-ci-ci-demo-dev_valkey-data >/dev/null

          /tmp/baha app destroy ci-demo --yes | grep -q "permanently deleted"
          test ! -e "$XDG_DATA_HOME/baseharbor/targets/ci/deployments/ci-demo/dev"
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-ci-demo-dev)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=baseharbor-ci-ci-demo-dev)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=baseharbor-ci-ci-demo-dev)"

  s3:
    if: ${{ inputs.gate == 'all' || inputs.gate == 's3' }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 20
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build baha
        run: go build -o /tmp/baha ./cmd/baha
      - name: Verify S3 object-storage lifecycle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          export XDG_CONFIG_HOME="$workdir/xdg-config"
          export XDG_DATA_HOME="$workdir/xdg-data"
          export BASEHARBOR_TARGET=ci
          /tmp/baha target create ci --provider docker --access local-docker --reference local --scope default --default >/dev/null
          /tmp/baha app create s3-demo --s3-bucket assets
          /tmp/baha app plan s3-demo | grep -q "isolated S3 bucket assets"
          /tmp/baha app preflight s3-demo | grep -q "Preflight passed"
          /tmp/baha --verbose app apply s3-demo 2>&1 | tee /tmp/s3-apply.out
          grep -Eq '\[VERIFIED\][[:space:]]+object-storage[[:space:]]+assets authenticated S3 Put/Get' /tmp/s3-apply.out

          provider_dir="$XDG_DATA_HOME/baseharbor/targets/ci/providers/seaweedfs"
          test -f "$provider_dir/compose.yaml"
          test -f "$provider_dir/runtime.env"
          ! grep -Eq 'ACCESS_KEY|SECRET_KEY|AWS_' "$provider_dir/runtime.env"
          grep -q 'server -s3 -iam=true' "$provider_dir/compose.yaml"
          test -n "$(docker ps -q --filter label=com.docker.compose.project=baseharbor-object-storage-ci)"

          /tmp/baha app env s3-demo | tee /tmp/s3-env.out
          grep -q '^AWS_ACCESS_KEY_ID=<masked>$' /tmp/s3-env.out
          grep -q '^AWS_SECRET_ACCESS_KEY=<masked>$' /tmp/s3-env.out
          grep -q '^S3_BUCKET=bh-s3-demo-dev-assets$' /tmp/s3-env.out
          test "$(stat -c '%a' $XDG_DATA_HOME/baseharbor/targets/ci/deployments/s3-demo/dev/state/s3-demo/runtime/bindings/object-storage-s3/assets/access_key_id)" = "600"
          test "$(stat -c '%a' $XDG_DATA_HOME/baseharbor/targets/ci/deployments/s3-demo/dev/state/s3-demo/runtime/bindings/object-storage-s3/assets/secret_access_key)" = "600"

          /tmp/baha app status s3-demo | grep -q "authenticated S3 Put/Get"
          /tmp/baha app doctor s3-demo | grep -q "^READY$"

          /tmp/baha app down s3-demo | grep -q "persistent data preserved"
          test -n "$(docker ps -q --filter label=com.docker.compose.project=baseharbor-object-storage-ci)"
          /tmp/baha app up s3-demo | grep -q "runtime and requested infrastructure verified"
          /tmp/baha app status s3-demo | grep -q "authenticated S3 Put/Get"

          /tmp/baha app destroy s3-demo --yes | grep -q "permanently deleted"
          test ! -e "$XDG_DATA_HOME/baseharbor/targets/ci/deployments/s3-demo/dev"
          test -n "$(docker ps -q --filter label=com.docker.compose.project=baseharbor-object-storage-ci)"

          docker compose --project-name baseharbor-object-storage-ci --file "$provider_dir/compose.yaml" --env-file "$provider_dir/runtime.env" down -v
          rm -rf "$XDG_CONFIG_HOME/baseharbor" "$XDG_DATA_HOME/baseharbor"

  openbao:
    if: ${{ inputs.gate == 'all' || inputs.gate == 'openbao' }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 30
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build baha
        run: go build -o /tmp/baha ./cmd/baha
      - name: Build runtime broker image
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify OpenBao bootstrap, required secrets, generated secrets and manual unseal lifecycle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          export XDG_CONFIG_HOME="$workdir/xdg-config"
          export XDG_DATA_HOME="$workdir/xdg-data"
          export BASEHARBOR_TARGET=ci
          /tmp/baha target create ci --provider docker --access local-docker --reference local --scope default --default >/dev/null
          runtime_dir="$XDG_DATA_HOME/baseharbor/targets/ci/runtime"
          /tmp/baha up --control-plane-only --yes --postgres-port 15432 --openbao-port 18200 | grep -q "control-plane runtime started"

          set +e
          /tmp/baha openbao status >/tmp/openbao-before.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "not initialized" /tmp/openbao-before.out

          recovery="$workdir/openbao-recovery.json"
          /tmp/baha openbao bootstrap --recovery-file "$recovery" | tee /tmp/openbao-bootstrap.out
          test "$(stat -c '%a' "$recovery")" = "600"
          test "$(stat -c '%a' $runtime_dir/openbao-admin.env)" = "600"
          ! grep -q 'root_token' "$recovery"
          ! grep -Eq 'ROOT|UNSEAL' $runtime_dir/openbao-admin.env
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

          /tmp/baha app create required-demo --sql --require-secret API_TOKEN
          /tmp/baha app show required-demo | tee /tmp/required-show.out
          grep -q 'Application: required-demo' /tmp/required-show.out
          grep -q 'Status: NOT READY' /tmp/required-show.out
          grep -Eq '^  required +1$' /tmp/required-show.out
          ! grep -q 'API_TOKEN' /tmp/required-show.out
          ! grep -q 'postgres://' /tmp/required-show.out
          /tmp/baha app plan required-demo | grep -q "secret:API_TOKEN"
          /tmp/baha app preflight required-demo | tee /tmp/required-preflight.out
          grep -Eq 'API_TOKEN[[:space:]]+unknown - secret scope not materialized yet[[:space:]]+baha app secret set API_TOKEN --stdin' /tmp/required-preflight.out

          set +e
          /tmp/baha app apply required-demo >/tmp/required-missing.out 2>&1
          required_code=$?
          set -e
          test "$required_code" -eq 1
          grep -q "required secrets check failed" /tmp/required-missing.out
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-required-demo-dev)"

          /tmp/baha app preflight required-demo >/tmp/required-preflight-missing.out 2>&1 || true
          grep -Eq 'API_TOKEN[[:space:]]+missing - user input required[[:space:]]+baha app secret set API_TOKEN --stdin' /tmp/required-preflight-missing.out
          grep -q "No application secrets have been configured yet." /tmp/required-preflight-missing.out

          printf '%s' 'integration-secret' | /tmp/baha app secret set required-demo API_TOKEN --stdin
          /tmp/baha app apply required-demo | grep -q "application and requested infrastructure verified"
          /tmp/baha app status required-demo | tee /tmp/required-status.out
          grep -Eq 'required-secret/API_TOKEN[[:space:]]+present and usable' /tmp/required-status.out
          grep -q '^READY$' /tmp/required-status.out
          /tmp/baha app doctor required-demo | tee /tmp/required-doctor.out
          grep -Eq 'API_TOKEN[[:space:]]+present and usable' /tmp/required-doctor.out
          grep -q "^READY$" /tmp/required-doctor.out

          /tmp/baha app down required-demo | grep -q "persistent data preserved"
          /tmp/baha app secret delete required-demo API_TOKEN --yes | grep -q "permanently deleted"
          set +e
          /tmp/baha app up required-demo >/tmp/required-up-missing.out 2>&1
          required_up_code=$?
          set -e
          test "$required_up_code" -eq 1
          grep -q "required application secrets" /tmp/required-up-missing.out
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-required-demo-dev)"

          printf '%s' 'integration-secret-2' | /tmp/baha app secret set required-demo API_TOKEN --stdin
          /tmp/baha app up required-demo | grep -q "runtime and requested infrastructure verified"
          /tmp/baha app destroy required-demo --yes | grep -q "permanently deleted"

          mkdir generated-app
          cd generated-app
          cat > baseharbor.yaml <<'EOF'
          version: 1
          app:
            name: generated-demo
            environment: dev
          services:
            postgres:
              enabled: true
            redis:
              enabled: false
            secrets:
              enabled: true
          secrets:
            required:
              - name: SECRET_KEY
                generate:
                  type: random
                  length: 64
              - name: EXTERNAL_TOKEN
          EOF

          /tmp/baha app preflight | tee /tmp/generated-preflight-before.out
          grep -q "SECRET_KEY" /tmp/generated-preflight-before.out
          grep -q "EXTERNAL_TOKEN" /tmp/generated-preflight-before.out

          set +e
          /tmp/baha app apply >/tmp/generated-first-apply.out 2>&1
          generated_code=$?
          set -e
          test "$generated_code" -eq 1
          grep -Eq '\[OK\][[:space:]]+generated-secret[[:space:]]+SECRET_KEY materialized in managed secret storage' /tmp/generated-first-apply.out
          grep -q "required secrets check failed" /tmp/generated-first-apply.out
          grep -q "EXTERNAL_TOKEN" /tmp/generated-first-apply.out

          /tmp/baha app preflight >/tmp/generated-preflight-after.out 2>&1 || true
          grep -Eq 'SECRET_KEY[[:space:]]+present[[:space:]]+-' /tmp/generated-preflight-after.out
          grep -Eq 'EXTERNAL_TOKEN[[:space:]]+missing - user input required[[:space:]]+baha app secret set EXTERNAL_TOKEN --stdin' /tmp/generated-preflight-after.out

          /tmp/baha app secret list | grep -q '^SECRET_KEY$'
          printf '%s' 'external-integration-token' | /tmp/baha app secret set EXTERNAL_TOKEN --stdin
          /tmp/baha app apply | tee /tmp/generated-second-apply.out
          grep -q "application and requested infrastructure verified" /tmp/generated-second-apply.out
          ! grep -q "generated-secret" /tmp/generated-second-apply.out
          /tmp/baha app status | tee /tmp/generated-status.out
          grep -Eq 'required-secret/SECRET_KEY[[:space:]]+present and usable' /tmp/generated-status.out
          grep -Eq 'required-secret/EXTERNAL_TOKEN[[:space:]]+present and usable' /tmp/generated-status.out
          /tmp/baha app doctor | grep -q "^READY$"
          /tmp/baha app destroy --yes | grep -q "permanently deleted"
          cd "$workdir"
          docker compose --project-name baseharbor-ci --file "$runtime_dir/compose.yaml" --env-file "$runtime_dir/runtime.env" restart openbao
          for i in $(seq 1 20); do
            set +e
            docker compose --project-name baseharbor-ci --file "$runtime_dir/compose.yaml" --env-file "$runtime_dir/runtime.env" exec -T openbao bao status >/dev/null 2>&1
            code=$?
            set -e
            if [ "$code" -eq 2 ]; then
              break
            fi
            sleep 1
          done
          test "$code" -eq 2

          set +e
          /tmp/baha openbao status >/tmp/openbao-sealed.out 2>&1
          status_code=$?
          set -e
          test "$status_code" -eq 1
          grep -q "sealed" /tmp/openbao-sealed.out

          /tmp/baha openbao unseal --recovery-file "$recovery" | grep -q "manager AppRole authentication succeeded"
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

          docker compose --project-name baseharbor-ci --file "$runtime_dir/compose.yaml" --env-file "$runtime_dir/runtime.env" down -v
