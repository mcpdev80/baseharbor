name: "Exposure Runtime Neutrality"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-exposure-neutrality*'
    paths:
      - '.ci/exposure-neutrality-trigger'

permissions:
  contents: read

jobs:
  exposure:
    name: Core · Exposure Runtime Neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/exposure cmd/baha/app_exposure.go
          if ! git diff --exit-code -- internal/exposure cmd/baha/app_exposure.go; then
            echo "Exposure neutrality scope requires gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/exposure ./cmd/baha -run '^$' -count=1

      - name: Run exposure tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/exposure -count=1
          go test ./cmd/baha -run 'Exposure|ManagedExposure' -count=1
