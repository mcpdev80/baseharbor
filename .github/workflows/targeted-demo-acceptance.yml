name: "Targeted Atomic Gate"

run-name: "${{ inputs.runtime }} · ${{ inputs.gate }} · ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: BaseHarbor ref or commit SHA to test
        required: true
        default: release/v0.4.20
        type: string
      demo_ref:
        description: Exact baseharbor-demo commit SHA to test
        required: true
        type: string
      runtime:
        description: Gate execution class/runtime
        required: true
        default: docker
        type: choice
        options:
          - static
          - docker
          - podman
      gate:
        description: Atomic gate from baseharbor-demo/tests/gate-resources.json
        required: true
        default: lifecycle
        type: string

permissions:
  contents: read

concurrency:
  group: targeted-atomic-${{ inputs.runtime }}-${{ inputs.gate }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  selected_gate:
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ inputs.ref }}
      demo_ref: ${{ inputs.demo_ref }}
      runtime: ${{ inputs.runtime }}
      gate: ${{ inputs.gate }}
      candidate_artifact: ""
