name: targeted-demo-acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: BaseHarbor ref or commit SHA to test
        required: true
        default: develop
        type: string
      runtime:
        description: Container runtime
        required: true
        default: docker
        type: choice
        options:
          - docker
          - podman
      gate:
        description: Demo gate to run
        required: true
        default: lifecycle
        type: choice
        options:
          - init
          - lifecycle
          - policy
          - capabilities
          - connectivity
          - security
          - reconciliation
          - machine
          - failure
          - recovery

permissions:
  contents: read

jobs:
  selected-gate:
    uses: ./.github/workflows/demo-gate.yml
    with:
      ref: ${{ inputs.ref }}
      runtime: ${{ inputs.runtime }}
      gate: ${{ inputs.gate }}
