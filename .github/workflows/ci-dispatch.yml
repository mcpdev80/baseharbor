name: ci-dispatch

on:
  push:
    branches:
      - 'ci/**'
    paths:
      - '.github/ci-dispatch.env'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Dispatch requested workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          config=".github/ci-dispatch.env"
          test -s "$config"

          workflow=""
          ref="develop"
          declare -a inputs=()

          while IFS='=' read -r key value; do
            case "$key" in
              workflow)
                workflow="$value"
                ;;
              ref)
                ref="$value"
                ;;
              input_*)
                inputs+=("-f" "${key#input_}=${value}")
                ;;
              ""|#*)
                ;;
              *)
                echo "Unsupported dispatch key: $key" >&2
                exit 1
                ;;
            esac
          done < "$config"

          test -n "$workflow" || {
            echo "workflow is required" >&2
            exit 1
          }

          gh workflow run "$workflow" --ref "$ref" "${inputs[@]}"
