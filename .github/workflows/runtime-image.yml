name: runtime-image

on:
  workflow_call:
    inputs:
      ref:
        description: Source ref to build and publish
        required: false
        type: string
      version_tag:
        description: Release tag used for image metadata, for example v0.4.15
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: source
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_REF:-}" ]; then
            ref="${INPUT_REF}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
          else
            ref="${GITHUB_SHA}"
          fi

          if [ -n "${INPUT_VERSION_TAG:-}" ]; then
            version_tag="${INPUT_VERSION_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version_tag="${GITHUB_REF_NAME}"
          else
            version_tag=""
          fi

          if [ -n "${version_tag}" ] && [[ ! "${version_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Runtime release tag must be valid SemVer with a v prefix." >&2
            exit 1
          fi

          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve build metadata
        id: buildmeta
        shell: bash
        env:
          VERSION_TAG: ${{ steps.source.outputs.version_tag }}
        run: |
          set -euo pipefail
          if [ -n "${VERSION_TAG:-}" ]; then
            version="${VERSION_TAG#v}"
          else
            version="edge"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "short_commit=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/mcpdev80/baseharbor-runtime
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ steps.source.outputs.version_tag }},enable=${{ steps.source.outputs.version_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.source.outputs.version_tag }},enable=${{ steps.source.outputs.version_tag != '' }}
            type=raw,value=edge,enable=${{ steps.source.outputs.version_tag == '' }}
            type=raw,value=sha-${{ steps.buildmeta.outputs.short_commit }}

      - name: Build runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT=${{ steps.buildmeta.outputs.commit }}
            DATE=${{ steps.buildmeta.outputs.date }}

      - name: Attest runtime image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/mcpdev80/baseharbor-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
