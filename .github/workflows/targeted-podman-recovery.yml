name: targeted-podman-recovery

on:
  push:
    branches:
      - 'runtime-validation/podman-recovery/**'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 20
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Podman state
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Run recovery acceptance only
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Cleanup Podman state
        if: always()
        run: bash scripts/ci-runtime-reset.sh podman
