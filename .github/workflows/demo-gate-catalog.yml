name: demo-gate-catalog

on:
  workflow_call:
    outputs:
      demo_sha:
        description: Exact baseharbor-demo revision used for the matrix
        value: ${{ jobs.catalog.outputs.demo_sha }}

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      demo_sha: ${{ steps.gates.outputs.demo_sha }}
    steps:
      - name: Read demo gate registry
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git "$tmp/demo"
          demo_sha="$(git -C "$tmp/demo" rev-parse HEAD)"
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              (.name | type == "string" and length > 0) and
              (.requires | type == "array")
            )
          ' "$tmp/demo/tests/gates.json" >/dev/null
          printf 'demo_sha=%s\n' "$demo_sha" >> "$GITHUB_OUTPUT"
