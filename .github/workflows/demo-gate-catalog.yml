name: demo-gate-catalog

on:
  workflow_call:
    inputs:
      ref:
        description: Exact baseharbor-demo commit SHA to validate
        required: true
        type: string
    outputs:
      demo_sha:
        description: Exact baseharbor-demo revision used for the matrix
        value: ${{ jobs.catalog.outputs.demo_sha }}

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      demo_sha: ${{ steps.gates.outputs.demo_sha }}
    steps:
      - name: Read demo gate registry
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          demo_ref="${{ inputs.ref }}"
          [[ "$demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Demo ref must be an exact 40-character commit SHA." >&2
            exit 2
          }
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$tmp/demo"
          git -C "$tmp/demo" fetch --depth 1 origin "$demo_ref"
          git -C "$tmp/demo" checkout --detach FETCH_HEAD
          demo_sha="$(git -C "$tmp/demo" rev-parse HEAD)"
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              (.name | type == "string" and length > 0) and
              (.requires | type == "array")
            )
          ' "$tmp/demo/tests/gates.json" >/dev/null
          jq -e --slurpfile gates "$tmp/demo/tests/gates.json" '
            type == "object" and length > 0 and
            all(to_entries[];
              (.value | type == "array" and length > 0) and
              all(.value[]; type == "string" and length > 0)
            ) and
            ([.[][]] | length) == ($gates[0] | length) and
            ([.[][]] | sort) == ([$gates[0][].name] | sort)
          ' "$tmp/demo/tests/pre-release-suites.json" >/dev/null
          printf 'demo_sha=%s\n' "$demo_sha" >> "$GITHUB_OUTPUT"
