name: R27 prototype focused tests (untrusted)
on:
  pull_request:
    paths:
      - 'scripts/r27_*.py'
      - 'scripts/tests/test_r27_*.py'
      - '.github/workflows/r27-prototype-tests.yml'
permissions:
  contents: read
jobs:
  prototype-tests:
    name: R27 Python prototype regressions (not trusted qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile all prototype modules and test files
        run: |
          python3 -m py_compile scripts/r27_archive_publisher.py scripts/r27_archive_resolver.py scripts/r27_evidence_receipt.py scripts/r27_evidence_coverage.py scripts/r27_verified_coverage.py scripts/tests/test_r27_archive_publisher.py scripts/tests/test_r27_archive_resolver.py scripts/tests/test_r27_evidence_receipt.py scripts/tests/test_r27_evidence_coverage.py scripts/tests/test_r27_verified_coverage.py
      - name: Run focused negative and positive tests
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m unittest -v scripts/tests/test_r27_archive_publisher.py scripts/tests/test_r27_archive_resolver.py scripts/tests/test_r27_evidence_receipt.py scripts/tests/test_r27_evidence_coverage.py scripts/tests/test_r27_verified_coverage.py
