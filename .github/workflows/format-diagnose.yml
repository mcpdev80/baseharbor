name: format-diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Show gofmt diff
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
