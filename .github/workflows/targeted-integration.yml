    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify Core-only installation and retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-bootstrap"
          pattern='^TestCoreOnlyBootstrapRuntimeAcceptance$'
          if [[ '${{ contains(github.event.head_commit.message, '[management-union-runtime]') }}' == 'true' ]]; then
            pattern='^TestCoreOnlyBootstrapRuntimeAcceptance$/development$'
          fi
          go test -race -json ./cmd/baha -run "$pattern" -count=1 -timeout 28m 2>&1 | tee "$RUNNER_TEMP/core-bootstrap/tests.jsonl"
  core_ha_recovery:
