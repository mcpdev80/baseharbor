          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=dev -X main.commit=$candidate_sha -X main.date=unknown" -o "$out/baha" ./cmd/baha
          cp deploy/control-plane/Dockerfile.binary "$out/Dockerfile"
          "$BASEHARBOR_TEST_RUNTIME" build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" "$out"
      - name: Verify selected Secrets add remove re-add with retained actual secret
        if: ${{ !cancelled() && steps.runtime_image.outcome == 'success' && contains(github.event.head_commit.message, '[coreless-selected-secrets]') }}
        env:
          BASEHARBOR_SECRETS_LIFECYCLE_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '${{ contains(github.event.head_commit.message, '[coreless-shared-secrets]') && '^TestSharedSecretsRuntimePreservesSiblingAndRetiresLastConsumer$' || '^TestSelectiveSecretsRuntimeAddRemoveReAdd$' }}' -count=1 -v -timeout 25m 2>&1 | tee "$RUNNER_TEMP/coreless-checks/secrets-lifecycle.log"
      - name: Verify explicit management Core and individual capability reuse
        if: ${{ !cancelled() && steps.runtime_image.outcome == 'success' && !contains(github.event.head_commit.message, '[coreless-selected-secrets]') }}
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '^TestApplicationCapabilityLifecycleExistingCore$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/coreless-checks/managed-capabilities.log"
  shared_provider_contracts:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'work/v0.4.24-core-ha-updates' || github.ref_name == 'work/v0.4.25-contract-minimal-core') && contains(github.event.head_commit.message, '[provider-contracts]') }}
    name: Shared provider unit and contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify all Go contracts and static analysis
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

  focused:
    if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(inputs.gate, 'adoption-') && inputs.gate != 'coreless-runtime' && inputs.gate != 'app-backup-restore-podman' }}
    name: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:targeted-integration

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare isolated rootless Docker
        timeout-minutes: 5
        env:
          BASEHARBOR_TEST_RUNTIME: docker
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Build BaseHarbor control-plane image
        if: inputs.gate == 'app-backup-restore'
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .

      - name: Application backup and restore
        if: inputs.gate == 'app-backup-restore'
        env:
          BASEHARBOR_APP_BACKUP_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestAppBackupRestoreCLIRealDisasterRecovery$' -count=1 -v

      - name: Metrics ingestion
        if: inputs.gate == 'metrics'
        env:
          BASEHARBOR_METRICS_INTEGRATION: "1"
        run: go test ./internal/metrics -run '^TestManagedPrometheusScrapesTwoIsolatedApplications$' -count=1 -v

      - name: OpenBao backup and restore
        if: inputs.gate == 'openbao-backup'
        env:
          BASEHARBOR_OPENBAO_BACKUP_ACCEPTANCE: "true"
        run: go test ./internal/openbao -run '^TestApplicationSecretBackupRestoreRealOpenBao$' -count=1 -v

      - name: OTLP export
        if: inputs.gate == 'otlp'
        env:
          BASEHARBOR_OTLP_INTEGRATION: "1"
        run: go test ./internal/telemetry -run '^TestManagedCollectorRealOTLPExport$' -count=1 -v

      - name: PostgreSQL backup and restore
        if: inputs.gate == 'postgres-backup'
        env:
          BASEHARBOR_POSTGRES_BACKUP_INTEGRATION: "1"
        run: go test ./internal/application -run '^TestPostgresBackupDisasterRecovery$' -count=1 -v

      - name: Shared PostgreSQL formatting
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_postgres_integration_test.go
            internal/application/postgres_backup.go
            internal/application/backend_tls.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared Valkey formatting
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_valkey_integration_test.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared PostgreSQL focused checks
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedPostgres|TestVerifySharedPostgres|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry|TestPostgresBackup|TestPostgresRestore|TestDumpPostgres|TestRestorePostgres)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedPostgresTwoApplicationIsolationBackupRestoreDestroy$' -v

      - name: Shared Valkey focused checks
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedValkey|TestVerifySharedValkey|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry)'
          go test ./internal/capability -count=1 -run '^(TestReference|TestProvider|TestRegistry)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_VALKEY_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedValkeyTwoApplicationIsolationDestroy$' -v

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh docker "$RUNNER_TEMP/targeted-integration-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup Docker runner state
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  app_backup_restore_podman:
    # Focused Podman opt-in: native backup/restore acceptance on Podman/Quadlet.
    # Proves disaster-recovery on Podman (SQL data, secrets, consumer access,
    # token/certificate regeneration and automatic owned cleanup) without
    # Docker/Compose assumptions. Evidence is repeatable via GitHub Actions.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.gate == 'app-backup-restore-podman') || (github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/recovery-podman/')) }}
    name: Application backup · podman
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      GOTOOLCHAIN: local
      BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
      BASEHARBOR_PROVIDER_VALKEY_SCOPE: application

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: false

      - name: Record exact source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/podman-backup-recovery"
          mkdir -p "$out"
          git rev-parse HEAD | tee "$out/source-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$out/source-tree.txt"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          go version | tee "$out/go-version.txt"
          expected_go="$(awk '$1 == "toolchain" {toolchain=$2} $1 == "go" {minimum="go" $2} END {print toolchain != "" ? toolchain : minimum}' go.mod)"
          test -n "$expected_go"
          printf '%s\n' "$expected_go" > "$out/expected-go-version.txt"
          test "$(go env GOVERSION)" = "$expected_go"

      - name: Prepare verified rootless Podman
        timeout-minutes: 5
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Build and verify exact source runtime image
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/podman-backup-recovery"
          build="$RUNNER_TEMP/podman-backup-runtime-build"
          mkdir -p "$build"
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$(cat "$out/source-sha.txt")"
          test "$(go env GOVERSION)" = "$(cat "$out/expected-go-version.txt")"
          image="localhost/baseharbor-runtime:podman-backup-$source_sha"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=dev -X main.commit=$source_sha -X main.date=unknown" \
            -o "$build/baha" ./cmd/baha
          go version -m "$build/baha" | tee "$out/binary-build.txt"
          grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=0$' "$out/binary-build.txt"
          sha256sum "$build/baha" | tee "$out/host-binary.sha256"
          "$build/baha" version --json > "$out/host-version.json"
          cp deploy/control-plane/Dockerfile.binary "$build/Dockerfile"
          sha256sum "$build/Dockerfile" > "$out/runtime-dockerfile.sha256"
          podman build --pull --label "org.opencontainers.image.revision=$source_sha" \
            --iidfile "$out/runtime-image-build-id.txt" --tag "$image" \
            -f "$build/Dockerfile" "$build" 2>&1 | tee "$out/image-build.log"
          printf '%s\n' "$image" > "$out/runtime-image-ref.txt"
          podman image inspect --format '{{.Id}}' "$image" | tee "$out/runtime-image-id.txt"
          podman image inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' "$image" \
            | tee "$out/runtime-image-revision.txt"
          podman run --rm --network none --entrypoint sha256sum "$image" /usr/local/bin/baha \
            | tee "$out/image-binary.sha256"
          podman run --rm --network none "$image" version --json > "$out/image-version.json"
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'podman-backup-recovery'
          source = (out / 'source-sha.txt').read_text().strip()
          def image_id(path):
              value = (out / path).read_text().strip().removeprefix('sha256:')
              if re.fullmatch(r'[0-9a-f]{64}', value) is None:
                  raise SystemExit('Exact runtime image requires a complete image ID.')
              return value
          def binary_hash(path):
              fields = (out / path).read_text().split()
              if not fields or re.fullmatch(r'[0-9a-f]{64}', fields[0]) is None:
                  raise SystemExit('Exact runtime image requires a complete binary SHA-256.')
              return fields[0]
          build_id = image_id('runtime-image-build-id.txt')
          actual_id = image_id('runtime-image-id.txt')
          host_hash = binary_hash('host-binary.sha256')
          image_hash = binary_hash('image-binary.sha256')
          versions = [json.loads((out / name).read_text()) for name in
                      ('host-version.json', 'image-version.json')]
          if (re.fullmatch(r'[0-9a-f]{40}', source) is None or build_id != actual_id
                  or (out / 'runtime-image-revision.txt').read_text().strip() != source
                  or host_hash != image_hash
                  or any(not isinstance(value, dict) or value.get('commit') != source
                         or value.get('version') != 'dev'
                         for value in versions)):
              raise SystemExit('Runtime source mismatch: require exact image ID/revision, identical binary bytes and actual host/image version commits.')
          (out / 'runtime-source-binding.json').write_text(json.dumps({
              'source': source, 'image_id': actual_id, 'binary_sha256': host_hash,
              'image': (out / 'runtime-image-ref.txt').read_text().strip(),
          }, indent=2) + '\n')
          PYTHON
          printf 'BASEHARBOR_RUNTIME_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Application backup and restore on Podman
        env:
          BASEHARBOR_APP_BACKUP_ACCEPTANCE: "true"
        run: |
          set -euo pipefail
          umask 0022
          out="$RUNNER_TEMP/podman-backup-recovery"
          test "$(id -u)" -gt 0
          test "$(id -u)" -le 65000
          podman version | tee "$out/runtime-version.txt"
          podman info --format '{{.Host.Security.Rootless}}' | tee "$out/rootless.txt"
          test "$(cat "$out/rootless.txt")" = true
          "$RUNNER_TEMP/podman-backup-runtime-build/baha" target create podman-backup-restore \
            --provider podman --access podman-backup-restore \
            --reference local --default
          go test ./cmd/baha -run '^TestAppBackupRestoreCLIRealDisasterRecovery$' \
            -count=1 -json -timeout 30m 2>&1 | tee "$out/tests.jsonl"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'podman-backup-recovery/tests.jsonl'
          events = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
          package = 'github.com/mcpdev80/baseharbor/cmd/baha'
          test = 'TestAppBackupRestoreCLIRealDisasterRecovery'
          if (any(event.get('Action') in {'fail', 'skip'} for event in events)
                  or not any(event.get('Package') == package and event.get('Test') == test
                             and event.get('Action') == 'pass' for event in events)
                  or not any(event.get('Package') == package and 'Test' not in event
                             and event.get('Action') == 'pass' for event in events)):
              raise SystemExit('Native Podman backup/recovery requires an executed test PASS and package PASS; missing, skipped or failed tests block.')
          PYTHON

  core_bootstrap:
    if: ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'runtime-validation/ha/core-bootstrap/') || (github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[management-union-runtime]'))) }}
    name: Core bootstrap · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
