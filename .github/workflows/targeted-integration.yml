      - name: Build integrated exact-SHA management runtime image
        id: runtime_image
        if: ${{ !cancelled() && steps.runtime_setup.outcome == 'success' && !contains(github.event.head_commit.message, '[coreless-workload-only]') && !contains(github.event.head_commit.message, '[coreless-selected-identity]') && !contains(github.event.head_commit.message, '[coreless-selected-backends]') && !contains(github.event.head_commit.message, '[coreless-selected-foundations]') && !contains(github.event.head_commit.message, '[coreless-selected-https]') }}
        shell: bash
        run: |
