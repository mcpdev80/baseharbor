  v0421_ha:
    if: ${{ github.event_name == 'push' && ((startsWith(github.ref_name, 'runtime-validation/ha/control-plane/') || startsWith(github.ref_name, 'runtime-validation/ha/control-plane-single/')) || startsWith(github.ref_name, 'runtime-validation/ha/tempo/') || startsWith(github.ref_name, 'runtime-validation/ha/loki/') || startsWith(github.ref_name, 'runtime-validation/ha/keycloak/') || startsWith(github.ref_name, 'runtime-validation/ha/otel/') || startsWith(github.ref_name, 'runtime-validation/ha/gateway/') || startsWith(github.ref_name, 'runtime-validation/ha/shared-postgres/') || startsWith(github.ref_name, 'runtime-validation/ha/owned-volumes/')) }}
    name: Targeted runtime · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Resolve targeted runtime gate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          prefix="runtime-validation/ha/"
          payload="${GITHUB_REF_NAME#"$prefix"}"
          gate="${payload%%/*}"
          case "$gate" in
            control-plane|control-plane-single|keycloak|loki|tempo|otel|gateway|shared-postgres|owned-volumes) ;;
            *) echo "unsupported targeted runtime gate: $gate" >&2; exit 2 ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare verified rootless Docker runtime
        if: matrix.runtime == 'docker'
        shell: bash
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Prepare hosted Podman runtime
        if: matrix.runtime == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman version

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Reset runtime state
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

      - name: Run targeted runtime gate
        shell: bash
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            owned-volumes)
              BASEHARBOR_OWNED_VOLUMES_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestOwnedVolumeDestroyPreservesExternalAndSharedData$' -count=1 -timeout 10m -v
              ;;
            shared-postgres)
              BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -run '^TestSharedPostgres' -count=1 -timeout 12m -v
              ;;
            control-plane-single)
              BASEHARBOR_RUNTIME_SINGLE_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestSingleControlPlaneRestartRotationAndCleanup$' -count=1 -timeout 20m -v
              ;;
            control-plane)
              BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -timeout 20m -v
              ;;
            keycloak)
              BASEHARBOR_KEYCLOAK_HA_ACCEPTANCE=1 go test -p 1 ./internal/identityprovider -run '^TestKeycloakHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 18m -json | tee "$RUNNER_TEMP/keycloak-ha-test.jsonl"
              python3 - <<'PY'
              import json, os, pathlib
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "keycloak-ha-test.jsonl"
              events = [json.loads(line) for line in path.read_text().splitlines() if line.startswith("{")]
              required = "TestKeycloakHARuntimeFailoverAcceptanceInCI"
              if any(event.get("Action") in ("fail", "skip") for event in events):
                  raise SystemExit("required native Keycloak HA test failed or skipped")
              if not any(event.get("Test") == required and event.get("Action") == "pass" for event in events):
                  raise SystemExit("required native Keycloak HA test did not run and pass")
              PY
              ;;
            loki)
              BASEHARBOR_LOKI_HA_ACCEPTANCE=1 go test -p 1 ./internal/logs -run '^TestLokiHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            tempo)
              BASEHARBOR_TEMPO_HA_ACCEPTANCE=1 go test -p 1 ./internal/traces -run '^TestTempoHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 18m -v
              ;;
            otel)
              BASEHARBOR_OTEL_HA_ACCEPTANCE=1 go test -p 1 ./internal/telemetry -run '^TestOTelHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            gateway)
              BASEHARBOR_GATEWAY_ACCEPTANCE=1 go test -p 1 ./internal/devgateway -run '^TestGatewayRuntimeContinuityAcceptanceInCI$' -count=1 -timeout 10m -v
              ;;
          esac

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh "${{ matrix.runtime }}" "$RUNNER_TEMP/targeted-ha-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup runtime state
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

