      BASEHARBOR_PROMETHEUS_HA_ACCEPTANCE: '1'
      BASEHARBOR_OTEL_HA_ACCEPTANCE: '1'
      BASEHARBOR_LOKI_HA_ACCEPTANCE: '1'
      BASEHARBOR_TEMPO_HA_ACCEPTANCE: '1'
