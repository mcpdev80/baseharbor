name: "Targeted · Integration"

run-name: "Targeted · Integration · ${{ inputs.gate || github.ref_name }} · ${{ inputs.ref || github.sha }}"

on:
  push:
    branches:
      - 'runtime-validation/ha/**'
      - 'runtime-validation/recovery-podman/**'
      - 'runtime-validation/compose-isolation/**'
      - 'work/v0.4.24-core-ha-updates'
      - 'work/v0.4.25-contract-minimal-core'
  workflow_dispatch:
    inputs:
      gate:
        description: Focused integration gate
        required: true
        default: app-backup-restore
        type: choice
        options:
          - coreless-runtime
          - app-backup-restore
          - app-backup-restore-podman
          - metrics
          - openbao-backup
          - otlp
          - postgres-backup
          - shared-postgres
          - shared-valkey
          - adoption-conformance
          - adoption-realworld-compose
          - adoption-realworld-quadlet
          - adoption-realworld-kubernetes
      ref:
        description: Git ref or commit SHA to test
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  # Independent exact-source proofs must not evict another candidate pending
  # in GitHub's one-slot concurrency queue. Identical source refs still deduplicate.
  group: targeted-integration-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'work/v0.4.24-core-ha-updates' && github.ref_name != 'work/v0.4.25-contract-minimal-core' }}

jobs:
  compose_isolation_exact:
    name: Compose isolation exact SHA · ${{ matrix.runtime }}
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/compose-isolation/') }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
      DOCKER_CONTEXT: ""
    steps:
      - name: Checkout proof workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact PR candidate identified by proof ref
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_REF_NAME##*/}"
          [[ "$candidate" =~ ^[a-f0-9]{40}$ ]] || { echo "proof ref must end in exact 40-character commit SHA" >&2; exit 2; }
          git fetch --no-tags origin "$candidate"
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          git diff --quiet
          echo "Exact compose-isolation candidate SHA: $candidate"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified isolated native runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Execute four real repository lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_REF_NAME##*/}"
          if [ "$BASEHARBOR_TEST_RUNTIME" = podman ]; then
            docker context use default
            export DOCKER_CONTEXT=
            export DOCKER_HOST=unix:///var/run/docker.sock
          fi
          go test -p 1 ./cmd/baha -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestRepositoryBuildWorkloadRebuildsSourceChangesInCI)  registered_otlp_handoff:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && (contains(github.event.head_commit.message, '[otlp-handoff-runtime]') || contains(github.event.head_commit.message, '[otlp-handoff-podman]')) }}
    name: Native OTLP handoff · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ contains(github.event.head_commit.message, '[otlp-handoff-podman]') && fromJSON('["podman"]') || fromJSON('["docker", "podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_OTLP_HANDOFF_ACCEPTANCE: "1"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify actual workload handoff and independent receiver preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/otlp-handoff-checks"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          go version > "$out/go-version.txt"
          test "$(go env GOVERSION)" = "go1.26.9"
          "$BASEHARBOR_TEST_RUNTIME" version > "$out/runtime-version.txt"
          go test -race -count=1 -json ./cmd/baha -run '^TestManagedRegisteredOTLPNativeConsumerHandoff$' -timeout 15m | tee "$out/handoff.jsonl"
          python3 - "$out/handoff.jsonl" <<'PY'
          import json,pathlib,sys
          events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          assert not any(event.get('Action') in {'fail','skip'} for event in events)
          assert any(event.get('Test')=='TestManagedRegisteredOTLPNativeConsumerHandoff' and event.get('Action')=='pass' for event in events)
          PY
  up_dispatch_source:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[up-dispatch-source]') }}
    name: Repository up source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting, all source tests, vet and actual CLI build
        run: |
          test -z "$(gofmt -l cmd/baha/runtime.go cmd/baha/runtime_repository_up.go cmd/baha/runtime_repository_up_test.go cmd/baha/app_coreless_runtime_test.go)"
          go test ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/baha-source-qualified" ./cmd/baha
      - name: Verify affected application CLI races
        run: go test -race ./cmd/baha
  application_full_reset:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[app-full-reset-runtime]') }}
    name: Application full reset · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_APP_FULL_RESET_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify native selected application data reset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/application-reset-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/application-reset-checks/source.txt"
          go test ./cmd/baha -run '^TestApplicationFullResetRequiresNativeCurrentScopeAndDeletesSelectedData$' -count=1 -v -timeout 12m 2>&1 | tee "$RUNNER_TEMP/application-reset-checks/reset.log"
  core_stop:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && (contains(github.event.head_commit.message, '[core-stop-runtime]') || contains(github.event.head_commit.message, '[core-destroy-ha]')) }}
    name: Selected Core stop · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[core-stop-docker-only]') && '["docker"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_CORE_STOP_ACCEPTANCE: "1"
      BASEHARBOR_CORE_STOP_HA_ACCEPTANCE: ${{ contains(github.event.head_commit.message, '[core-destroy-ha]') && '1' || '0' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify selected stop and original retained data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p "$RUNNER_TEMP/core-stop-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/core-stop-checks/source.txt"
          go version > "$RUNNER_TEMP/core-stop-checks/go-version.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/core-stop-checks/runtime-version.txt"
          go test ./cmd/baha -run '^TestCoreStopRetainsOriginalSQLCredentialsAndRunningSibling$' -count=1 -timeout 18m -v 2>&1 | tee "$RUNNER_TEMP/core-stop-checks/core-stop.log"
  standalone_retirement:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[standalone-retirement-runtime]') }}
    name: Retained standalone data · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[standalone-docker-only]') && '["docker"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_STANDALONE_RETIREMENT_ACCEPTANCE: "1"
      BASEHARBOR_TEMPO_LEGACY_UPGRADE_ACCEPTANCE: ${{ contains(github.event.head_commit.message, '[tempo-legacy-upgrade]') && '1' || '0' }}
      BASEHARBOR_TRACES_INTEGRATION: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify exact source and original authenticated retained data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p "$RUNNER_TEMP/standalone-retirement-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/standalone-retirement-checks/source.txt"
          go version > "$RUNNER_TEMP/standalone-retirement-checks/go-version.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/standalone-retirement-checks/runtime-version.txt"
          status=0
          if [[ "${{ contains(github.event.head_commit.message, '[standalone-trace-only]') }}" != true ]]; then
            go test ./internal/objectstorage -run '^TestSeaweedRetirementRetainsOriginalAuthenticatedObject$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/standalone-retirement-checks/objectstorage.log" || status=1
          fi
          if [[ "$BASEHARBOR_TEST_RUNTIME" == docker || "${{ contains(github.event.head_commit.message, '[standalone-failed-only]') }}" != true ]]; then
            go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/standalone-retirement-checks/traces.log" || status=1
          fi
          exit "$status"
  observability_consumers:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[observability-consumers-runtime]') }}
    name: Observability consumers · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[observability-podman-only]') && '["podman"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_METRICS_INTEGRATION: "1"
      BASEHARBOR_LOGS_INTEGRATION: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify actual metrics logs and registered OTLP consumers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          checks="$RUNNER_TEMP/observability-consumer-checks"
          mkdir -p "$checks"
          git rev-parse HEAD > "$checks/source.txt"
          git rev-parse 'HEAD^{tree}' > "$checks/tree.txt"
          go version > "$checks/go-version.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$checks/runtime-version.txt"
          status=0
          if [[ "${{ contains(github.event.head_commit.message, '[observability-metrics-only]') }}" != true ]]; then
            go test ./internal/telemetry -run '^TestRegisteredOTLP' -count=1 -v 2>&1 | tee "$checks/registered-otlp-local-tls.log" || status=1
          fi
          go test ./internal/metrics -run '^TestManagedPrometheusScrapesTwoIsolatedApplications$' -count=1 -timeout 8m -v 2>&1 | tee "$checks/metrics.log" || status=1
          if [[ "${{ contains(github.event.head_commit.message, '[observability-metrics-only]') }}" != true ]]; then
            go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -timeout 8m -v 2>&1 | tee "$checks/logs.log" || status=1
          fi
          exit "$status"
  installation_destroy:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && (contains(github.event.head_commit.message, '[installation-destroy-runtime]') || contains(github.event.head_commit.message, '[installation-destroy-podman]')) }}
    name: Installation partial destruction · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[installation-destroy-podman]') && '["podman"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_INSTALLATION_DESTROY_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify exact application reset, interrupted native deletion and current-plan retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installation-destroy-checks"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD > "$RUNNER_TEMP/installation-destroy-checks/source.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/installation-destroy-checks/runtime-version.txt"
          go test ./cmd/baha -run '^TestInstallationDestroyCurrentChildrenInterruptedVolumeAndRetry$' -count=1 -v -timeout 15m 2>&1 | tee "$RUNNER_TEMP/installation-destroy-checks/destroy.log"
  shared_network:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[shared-network-runtime]') }}
    name: Retained shared network · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_CORE_SHARED_NETWORK_ACCEPTANCE: "1"
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:shared-network-acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Build exact runtime and record source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shared-network-build"
          mkdir -p "$out" "$RUNNER_TEMP/shared-network-checks"
          candidate_sha="$(git rev-parse HEAD)"
          test "$candidate_sha" = "${{ github.sha }}"
          echo "$candidate_sha" > "$RUNNER_TEMP/shared-network-checks/source.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/shared-network-checks/runtime-version.txt"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.commit=$candidate_sha" -o "$out/baha" ./cmd/baha
          cp deploy/control-plane/Dockerfile.binary "$out/Dockerfile"
          "$BASEHARBOR_TEST_RUNTIME" build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" "$out"
      - name: Verify original network authority and actual TLS data through management recovery
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '^TestCoreBootstrapRetainsApplicationSharedNetworkAndSQL$' -count=1 -v -timeout 20m 2>&1 | tee "$RUNNER_TEMP/shared-network-checks/network.log"
  coreless_runtime:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.gate == 'coreless-runtime') || (github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[coreless-runtime]')) }}
    name: Core-less application · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_CORELESS_ACCEPTANCE: "1"
      BASEHARBOR_BACKEND_PLACEMENT_ACCEPTANCE: ${{ contains(github.event.head_commit.message, '[backend-placement-runtime]') && '1' || '0' }}
      BASEHARBOR_APP_STOP_ACCEPTANCE: ${{ (contains(github.event.head_commit.message, '[app-stop-runtime]') || contains(github.event.head_commit.message, '[app-stop-foundations-only]')) && '1' || '0' }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:coreless-acceptance
    steps:
      - name: Checkout integrated exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify exact SHA input
        env:
          CANDIDATE_SHA: ${{ inputs.ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        id: runtime_setup
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Record exact-SHA runtime environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coreless-checks"
          git rev-parse HEAD > "$RUNNER_TEMP/coreless-checks/candidate-sha.txt"
          go version > "$RUNNER_TEMP/coreless-checks/go-version.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/coreless-checks/runtime-version.txt"
      - name: Verify fresh workload with zero Core containers
        if: ${{ contains(github.event.head_commit.message, '[app-stop-runtime]') || !contains(github.event.head_commit.message, '[coreless-selected-secrets]') && !contains(github.event.head_commit.message, '[coreless-managed-only]') && !contains(github.event.head_commit.message, '[coreless-selected-identity]') && !contains(github.event.head_commit.message, '[coreless-selected-backends]') && !contains(github.event.head_commit.message, '[coreless-selected-foundations]') && !contains(github.event.head_commit.message, '[coreless-selected-https]') }}
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '^TestCorelessFreshWorkloadRuntimeLifecycle$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/coreless-checks/lifecycle.log"
      - name: Verify selected Identity add remove re-add without management Core
        if: ${{ !cancelled() && steps.runtime_setup.outcome == 'success' && contains(github.event.head_commit.message, '[coreless-selected-identity]') }}
        env:
          BASEHARBOR_IDENTITY_LIFECYCLE_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          selection='^TestSelectiveIdentityRuntimeAddRemoveReAdd$'
          if [ '${{ contains(github.event.head_commit.message, '[identity-placement-runtime]') }}' = true ]; then
            selection='^TestManagedIdentityNativePlacementHandoff$'
          fi
          if [ '${{ contains(github.event.head_commit.message, '[coreless-production-identity]') }}' = true ]; then
            selection='^TestProductionIdentityRuntimeRealizedCallbackAndReapply$'
          fi
          go test ./cmd/baha -run "$selection" -count=1 -v -timeout 20m 2>&1 | tee "$RUNNER_TEMP/coreless-checks/identity-lifecycle.log"
      - name: Verify selected SQL and cache add remove re-add without Core
        if: ${{ !cancelled() && steps.runtime_setup.outcome == 'success' && contains(github.event.head_commit.message, '[coreless-selected-backends]') }}
        env:
          BASEHARBOR_BACKEND_LIFECYCLE_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '^TestSelectiveBackendRuntimeAddRemoveReAdd$' -count=1 -v -timeout 25m 2>&1 | tee "$RUNNER_TEMP/coreless-checks/backend-lifecycle.log"
      - name: Verify selected messaging and document database lifecycle without Core
        if: ${{ !cancelled() && steps.runtime_setup.outcome == 'success' && contains(github.event.head_commit.message, '[coreless-selected-foundations]') }}
