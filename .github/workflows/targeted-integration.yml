name: "Targeted · Integration"

run-name: "Targeted · Integration · ${{ inputs.gate }} · ${{ inputs.ref }}"

on:
  push:
    branches:
      - 'runtime-validation/ha/**'
  workflow_dispatch:
    inputs:
      gate:
        description: Focused integration gate
        required: true
        default: app-backup-restore
        type: choice
        options:
          - app-backup-restore
          - metrics
          - openbao-backup
          - otlp
          - postgres-backup
          - shared-postgres
          - shared-valkey
          - adoption-conformance
          - adoption-realworld-compose
          - adoption-realworld-quadlet
          - adoption-realworld-kubernetes
      ref:
        description: Git ref or commit SHA to test
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: targeted-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(inputs.gate, 'adoption-') }}
    name: ${{ inputs.gate }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 20
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:targeted-integration
      GOTOOLCHAIN: local

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Docker runner state
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Build BaseHarbor control-plane image
        if: inputs.gate == 'app-backup-restore'
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .

      - name: Application backup and restore
        if: inputs.gate == 'app-backup-restore'
        env:
          BASEHARBOR_APP_BACKUP_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestAppBackupRestoreCLIRealDisasterRecovery$' -count=1 -v

      - name: Metrics ingestion
        if: inputs.gate == 'metrics'
        env:
          BASEHARBOR_METRICS_INTEGRATION: "1"
        run: go test ./internal/metrics -run '^TestManagedPrometheusScrapesTwoIsolatedApplications$' -count=1 -v

      - name: OpenBao backup and restore
        if: inputs.gate == 'openbao-backup'
        env:
          BASEHARBOR_OPENBAO_BACKUP_ACCEPTANCE: "true"
        run: go test ./internal/openbao -run '^TestApplicationSecretBackupRestoreRealOpenBao$' -count=1 -v

      - name: OTLP export
        if: inputs.gate == 'otlp'
        env:
          BASEHARBOR_OTLP_INTEGRATION: "1"
        run: go test ./internal/telemetry -run '^TestManagedCollectorRealOTLPExport$' -count=1 -v

      - name: PostgreSQL backup and restore
        if: inputs.gate == 'postgres-backup'
        env:
          BASEHARBOR_POSTGRES_BACKUP_INTEGRATION: "1"
        run: go test ./internal/application -run '^TestPostgresBackupDisasterRecovery$' -count=1 -v

      - name: Shared PostgreSQL formatting
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_postgres_integration_test.go
            internal/application/postgres_backup.go
            internal/application/backend_tls.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared Valkey formatting
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_valkey_integration_test.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared PostgreSQL focused checks
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedPostgres|TestVerifySharedPostgres|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry|TestPostgresBackup|TestPostgresRestore|TestDumpPostgres|TestRestorePostgres)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedPostgresTwoApplicationIsolationBackupRestoreDestroy$' -v

      - name: Shared Valkey focused checks
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedValkey|TestVerifySharedValkey|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry)'
          go test ./internal/capability -count=1 -run '^(TestReference|TestProvider|TestRegistry)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_VALKEY_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedValkeyTwoApplicationIsolationDestroy$' -v

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh docker "$RUNNER_TEMP/targeted-integration-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup Docker runner state
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  core_bootstrap:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/core-bootstrap/') }}
    name: Core bootstrap · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:core-bootstrap
      BASEHARBOR_CORE_BOOTSTRAP_ACCEPTANCE: '1'
      BASEHARBOR_BUG_HUNT_LIFECYCLE_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify Core-only installation and retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-bootstrap"
          go test -race -json ./cmd/baha -run '^TestCoreOnlyBootstrapRuntimeAcceptance$' -count=1 -timeout 28m 2>&1 | tee "$RUNNER_TEMP/core-bootstrap/tests.jsonl"
      - name: Retain runtime qualification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-bootstrap-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-bootstrap
          if-no-files-found: warn
          retention-days: 90

  v0421_ha:
    if: ${{ github.event_name == 'push' && ((startsWith(github.ref_name, 'runtime-validation/ha/control-plane/') || startsWith(github.ref_name, 'runtime-validation/ha/control-plane-single/')) || startsWith(github.ref_name, 'runtime-validation/ha/loki/') || startsWith(github.ref_name, 'runtime-validation/ha/keycloak/') || startsWith(github.ref_name, 'runtime-validation/ha/otel/') || startsWith(github.ref_name, 'runtime-validation/ha/gateway/') || startsWith(github.ref_name, 'runtime-validation/ha/shared-postgres/') || startsWith(github.ref_name, 'runtime-validation/ha/owned-volumes/')) }}
    name: Targeted runtime · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Resolve targeted runtime gate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          prefix="runtime-validation/ha/"
          payload="${GITHUB_REF_NAME#"$prefix"}"
          gate="${payload%%/*}"
          case "$gate" in
            control-plane|control-plane-single|keycloak|loki|otel|gateway|shared-postgres|owned-volumes) ;;
            *) echo "unsupported targeted runtime gate: $gate" >&2; exit 2 ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Prepare hosted Podman runtime
        if: matrix.runtime == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman version

      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Reset runtime state
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

      - name: Run targeted runtime gate
        shell: bash
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            owned-volumes)
              BASEHARBOR_OWNED_VOLUMES_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestOwnedVolumeDestroyPreservesExternalAndSharedData$' -count=1 -timeout 10m -v
              ;;
            shared-postgres)
              BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -run '^TestSharedPostgres' -count=1 -timeout 12m -v
              ;;
            control-plane-single)
              BASEHARBOR_RUNTIME_SINGLE_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestSingleControlPlaneRestartRotationAndCleanup$' -count=1 -timeout 20m -v
              ;;
            control-plane)
              BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -timeout 20m -v
              ;;
            keycloak)
              BASEHARBOR_KEYCLOAK_HA_ACCEPTANCE=1 go test -p 1 ./internal/identityprovider -run '^TestKeycloakHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 18m -v
              ;;
            loki)
              BASEHARBOR_LOKI_HA_ACCEPTANCE=1 go test -p 1 ./internal/logs -run '^TestLokiHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            otel)
              BASEHARBOR_OTEL_HA_ACCEPTANCE=1 go test -p 1 ./internal/telemetry -run '^TestOTelHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            gateway)
              BASEHARBOR_GATEWAY_ACCEPTANCE=1 go test -p 1 ./internal/devgateway -run '^TestGatewayRuntimeContinuityAcceptanceInCI$' -count=1 -timeout 10m -v
              ;;
          esac

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh "${{ matrix.runtime }}" "$RUNNER_TEMP/targeted-ha-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup runtime state
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

  adoption:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.gate, 'adoption-') }}
    name: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused adoption gate
        shell: bash
        env:
          GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            adoption-conformance)
              go test ./internal/repositoryinspect -count=1 -run 'TestAdoptionConformanceCorpus|TestInspectionBudget|TestCollectSnapshotSkips|TestKubernetesDocumentLimit|TestWorkloadSourceCrossSourceSemanticParity|TestWorkloadSourceResolution'
              ;;
            adoption-realworld-compose|adoption-realworld-quadlet|adoption-realworld-kubernetes)
              category="${GATE#adoption-realworld-}"
              go build -trimpath -o "$RUNNER_TEMP/baha" ./cmd/baha
              BAHA="$RUNNER_TEMP/baha" CORPUS_CATEGORY="$category" bash scripts/realworld-workload-source-corpus.sh
              ;;
            *)
              echo "unsupported adoption gate: $GATE" >&2
              exit 2
              ;;
          esac

  bug_hunt_templates:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/bug-hunt/') }}
    name: Bug hunt templates · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_TEMPLATE_BUILD_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source regressions and fresh generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug-hunt"
          go test -race -json ./cmd/baha -run 'Test(PreflightNewTargetRecoveryFile|TargetRecoveryFile|RequiredSecret(NullInput|RealPTY)|OverviewUsesCanonical|PromptAndStoreMissingRequiredSecrets)' -count=1 | tee "$RUNNER_TEMP/bug-hunt/source.jsonl"
          go test -json ./internal/development -run '^TestGeneratedTemplates' -count=1 -timeout 40m | tee "$RUNNER_TEMP/bug-hunt/templates.jsonl"
      - name: Retain focused bug hunt evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bug-hunt-templates-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bug-hunt
          if-no-files-found: warn
          retention-days: 90
