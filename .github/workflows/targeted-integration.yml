name: "Targeted · Integration"

run-name: "Targeted · Integration · ${{ inputs.gate || github.ref_name }} · ${{ inputs.ref || github.sha }}"

on:
  push:
    branches:
      - 'runtime-validation/ha/**'
      - 'work/v0.4.24-core-ha-updates'
      - 'work/v0.4.25-contract-minimal-core'
  workflow_dispatch:
    inputs:
      gate:
        description: Focused integration gate
        required: true
        default: app-backup-restore
        type: choice
        options:
          - coreless-runtime
          - app-backup-restore
          - metrics
          - openbao-backup
          - otlp
          - postgres-backup
          - shared-postgres
          - shared-valkey
          - adoption-conformance
          - adoption-realworld-compose
          - adoption-realworld-quadlet
          - adoption-realworld-kubernetes
      ref:
        description: Git ref or commit SHA to test
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: targeted-integration-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'work/v0.4.24-core-ha-updates' }}

jobs:
  coreless_runtime:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.gate == 'coreless-runtime') || (github.event_name == 'push' && github.ref_name == 'work/v0.4.25-contract-minimal-core' && contains(github.event.head_commit.message, '[coreless-runtime]')) }}
    name: Core-less application · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_CORELESS_ACCEPTANCE: "1"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout integrated exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify exact SHA input
        env:
          CANDIDATE_SHA: ${{ inputs.ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify fresh workload with zero Core containers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coreless-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/coreless-evidence/candidate-sha.txt"
          go version > "$RUNNER_TEMP/coreless-evidence/go-version.txt"
          "$BASEHARBOR_TEST_RUNTIME" version > "$RUNNER_TEMP/coreless-evidence/runtime-version.txt"
          go test ./cmd/baha -run '^TestCorelessFreshWorkloadRuntimeLifecycle$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/coreless-evidence/lifecycle.log"
      - name: Qualify changed volume recovery helper
        env:
          BASEHARBOR_RENOVATE_RECOVERY_ACCEPTANCE: "1"
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/runtime -run '^TestRenovateVolumeRecoveryRuntimeAcceptance$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/coreless-evidence/volume-recovery.log"
      - name: Verify explicit management Core and individual capability reuse
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha -run '^TestApplicationCapabilityLifecycleExistingCore$' -count=1 -v 2>&1 | tee "$RUNNER_TEMP/coreless-evidence/managed-capabilities.log"
      - name: Retain exact-SHA runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coreless-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coreless-evidence
          if-no-files-found: warn
          retention-days: 30

  shared_provider_contracts:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && contains(github.event.head_commit.message, '[provider-contracts]') }}
    name: Shared provider unit and contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify all Go contracts and static analysis
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

  focused:
    if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(inputs.gate, 'adoption-') && inputs.gate != 'coreless-runtime' }}
    name: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:targeted-integration
      GOTOOLCHAIN: local

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare isolated rootless Docker
        timeout-minutes: 5
        env:
          BASEHARBOR_TEST_RUNTIME: docker
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Build BaseHarbor control-plane image
        if: inputs.gate == 'app-backup-restore'
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .

      - name: Application backup and restore
        if: inputs.gate == 'app-backup-restore'
        env:
          BASEHARBOR_APP_BACKUP_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestAppBackupRestoreCLIRealDisasterRecovery$' -count=1 -v

      - name: Metrics ingestion
        if: inputs.gate == 'metrics'
        env:
          BASEHARBOR_METRICS_INTEGRATION: "1"
        run: go test ./internal/metrics -run '^TestManagedPrometheusScrapesTwoIsolatedApplications$' -count=1 -v

      - name: OpenBao backup and restore
        if: inputs.gate == 'openbao-backup'
        env:
          BASEHARBOR_OPENBAO_BACKUP_ACCEPTANCE: "true"
        run: go test ./internal/openbao -run '^TestApplicationSecretBackupRestoreRealOpenBao$' -count=1 -v

      - name: OTLP export
        if: inputs.gate == 'otlp'
        env:
          BASEHARBOR_OTLP_INTEGRATION: "1"
        run: go test ./internal/telemetry -run '^TestManagedCollectorRealOTLPExport$' -count=1 -v

      - name: PostgreSQL backup and restore
        if: inputs.gate == 'postgres-backup'
        env:
          BASEHARBOR_POSTGRES_BACKUP_INTEGRATION: "1"
        run: go test ./internal/application -run '^TestPostgresBackupDisasterRecovery$' -count=1 -v

      - name: Shared PostgreSQL formatting
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_postgres_integration_test.go
            internal/application/postgres_backup.go
            internal/application/backend_tls.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared Valkey formatting
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_valkey_integration_test.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || { echo "gofmt required:" >&2; echo "$bad" >&2; exit 1; }

      - name: Shared PostgreSQL focused checks
        if: inputs.gate == 'shared-postgres'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedPostgres|TestVerifySharedPostgres|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry|TestPostgresBackup|TestPostgresRestore|TestDumpPostgres|TestRestorePostgres)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedPostgresTwoApplicationIsolationBackupRestoreDestroy$' -v

      - name: Shared Valkey focused checks
        if: inputs.gate == 'shared-valkey'
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedValkey|TestVerifySharedValkey|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry)'
          go test ./internal/capability -count=1 -run '^(TestReference|TestProvider|TestRegistry)'
          go test ./cmd/baha ./internal/capability -run '^$'
          BASEHARBOR_SHARED_VALKEY_INTEGRATION=1 go test -p 1 ./internal/application -count=1 -run '^TestSharedValkeyTwoApplicationIsolationDestroy$' -v

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh docker "$RUNNER_TEMP/targeted-integration-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup Docker runner state
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  core_bootstrap:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/core-bootstrap/') }}
    name: Core bootstrap · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:core-bootstrap
      BASEHARBOR_CORE_BOOTSTRAP_ACCEPTANCE: '1'
      BASEHARBOR_BUG_HUNT_LIFECYCLE_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify Core-only installation and retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-bootstrap"
          go test -race -json ./cmd/baha -run '^TestCoreOnlyBootstrapRuntimeAcceptance$' -count=1 -timeout 28m 2>&1 | tee "$RUNNER_TEMP/core-bootstrap/tests.jsonl"
      - name: Retain runtime qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-bootstrap-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-bootstrap
          if-no-files-found: warn
          retention-days: 90

  core_ha_recovery:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && contains(github.event.head_commit.message, '[ha-cutover]') }}
    name: HA cutover and SQL rollback · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:ha-recovery
      BASEHARBOR_CORE_HA_CUTOVER_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify native HA roll, failure, DCS cutover and physical SQL rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-recovery"
          go test -race -json ./cmd/baha -run '^TestCoreHACutoverRollbackRuntimeAcceptance$' -count=1 -timeout 25m 2>&1 | tee "$RUNNER_TEMP/ha-recovery/tests.jsonl"
      - name: Retain runtime qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ha-recovery-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ha-recovery
          if-no-files-found: warn
          retention-days: 90

  provider_topology:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && contains(github.event.head_commit.message, '[topology-runtime]') }}
    name: Explicit provider topology · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:provider-topology
      BASEHARBOR_PROVIDER_TOPOLOGY_ACCEPTANCE: '1'
      BASEHARBOR_SEAWEEDFS_HA_ACCEPTANCE: '1'
      BASEHARBOR_PROMETHEUS_HA_ACCEPTANCE: '1'
      BASEHARBOR_OTEL_HA_ACCEPTANCE: '1'
      BASEHARBOR_LOKI_HA_ACCEPTANCE: '1'
      BASEHARBOR_TEMPO_HA_ACCEPTANCE: '1'
      BASEHARBOR_KEYCLOAK_HA_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Prepare native Keycloak database image before bounded readiness checks
        if: matrix.runtime == 'podman'
        timeout-minutes: 10
        run: podman pull ghcr.io/zalando/spilo-18:4.1-p2
      - name: Verify explicit topology, native inventory, reconciliation and affected HA paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-topology"
          go test -p 1 -race -json ./internal/objectstorage ./internal/metrics ./internal/telemetry ./internal/logs ./internal/traces ./internal/identityprovider -run '(DefaultTopologyRuntimeAcceptanceInCI|HARuntime.*AcceptanceInCI)$' -count=1 -timeout 40m 2>&1 | tee "$RUNNER_TEMP/provider-topology/tests.jsonl"
      - name: Retain native topology qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: provider-topology-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-topology
          if-no-files-found: error
          retention-days: 90

  application_provider_topology:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && contains(github.event.head_commit.message, '[application-topology-runtime]') }}
    name: Application providers and HA overrides · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:application-topology
      BASEHARBOR_PROVIDER_TOPOLOGY_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify actual data members, safe retained topology and component-specific storage intent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/application-topology"
          go test -p 1 -race -json ./internal/application ./internal/logs ./internal/traces -run '^(TestApplicationDataDefaultTopologyRuntimeAcceptanceInCI|TestLokiComponentOverrideRuntimeAcceptanceInCI|TestTempoComponentOverrideRuntimeAcceptanceInCI)$' -count=1 -timeout 50m 2>&1 | tee "$RUNNER_TEMP/application-topology/tests.jsonl"
      - name: Retain native role and override qualifications
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: application-topology-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-topology
          if-no-files-found: error
          retention-days: 90

  core_provider_versions:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && (contains(github.event.head_commit.message, '[provider-runtime]') || contains(github.event.head_commit.message, '[provider-docker-runtime]')) }}
    name: Provider versions and SQL recovery · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[provider-docker-runtime]') && '["docker"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:provider-versions
      BASEHARBOR_PROVIDER_UPGRADE_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify real PostgreSQL, OpenBao and Keycloak upgrades and failure recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-versions"
          go test -race -json ./cmd/baha -run '^TestCoreProviderVersionsRuntimeAcceptance$' -count=1 -timeout 35m 2>&1 | tee "$RUNNER_TEMP/provider-versions/tests.jsonl"
      - name: Retain runtime qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: provider-versions-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/provider-versions
            ${{ runner.temp }}/baseharbor-public-image-cache-${{ matrix.runtime }}.log
          if-no-files-found: warn
          retention-days: 90

  core_ha_openbao_versions:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && (contains(github.event.head_commit.message, '[bao-ha-runtime]') || contains(github.event.head_commit.message, '[bao-ha-docker-runtime]')) }}
    name: HA OpenBao versions and SQL recovery · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(contains(github.event.head_commit.message, '[bao-ha-docker-runtime]') && '["docker"]' || '["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:ha-openbao-versions
      BASEHARBOR_HA_OPENBAO_UPGRADE_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact Core runtime image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify real three-member OpenBao rolling upgrade and SQL failure recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ha-openbao-versions"
          go test -race -json ./cmd/baha -run '^TestCoreHAOpenBaoVersionsRuntimeAcceptance$' -count=1 -timeout 35m 2>&1 | tee "$RUNNER_TEMP/ha-openbao-versions/tests.jsonl"
      - name: Retain runtime qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ha-openbao-versions-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ha-openbao-versions
            ${{ runner.temp }}/baseharbor-public-image-cache-${{ matrix.runtime }}.log
          if-no-files-found: warn
          retention-days: 90

  v0421_ha:
    if: ${{ github.event_name == 'push' && ((startsWith(github.ref_name, 'runtime-validation/ha/control-plane/') || startsWith(github.ref_name, 'runtime-validation/ha/control-plane-single/')) || startsWith(github.ref_name, 'runtime-validation/ha/tempo/') || startsWith(github.ref_name, 'runtime-validation/ha/loki/') || startsWith(github.ref_name, 'runtime-validation/ha/keycloak/') || startsWith(github.ref_name, 'runtime-validation/ha/otel/') || startsWith(github.ref_name, 'runtime-validation/ha/gateway/') || startsWith(github.ref_name, 'runtime-validation/ha/shared-postgres/') || startsWith(github.ref_name, 'runtime-validation/ha/owned-volumes/')) }}
    name: Targeted runtime · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
      - name: Resolve targeted runtime gate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          prefix="runtime-validation/ha/"
          payload="${GITHUB_REF_NAME#"$prefix"}"
          gate="${payload%%/*}"
          case "$gate" in
            control-plane|control-plane-single|keycloak|loki|tempo|otel|gateway|shared-postgres|owned-volumes) ;;
            *) echo "unsupported targeted runtime gate: $gate" >&2; exit 2 ;;
          esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Prepare hosted Podman runtime
        if: matrix.runtime == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman version

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Reset runtime state
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

      - name: Run targeted runtime gate
        shell: bash
        env:
          GATE: ${{ steps.resolve.outputs.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            owned-volumes)
              BASEHARBOR_OWNED_VOLUMES_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestOwnedVolumeDestroyPreservesExternalAndSharedData$' -count=1 -timeout 10m -v
              ;;
            shared-postgres)
              BASEHARBOR_SHARED_POSTGRES_INTEGRATION=1 go test -p 1 ./internal/application -run '^TestSharedPostgres' -count=1 -timeout 12m -v
              ;;
            control-plane-single)
              BASEHARBOR_RUNTIME_SINGLE_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestSingleControlPlaneRestartRotationAndCleanup$' -count=1 -timeout 20m -v
              ;;
            control-plane)
              BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE=true go test -p 1 ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -timeout 20m -v
              ;;
            keycloak)
              BASEHARBOR_KEYCLOAK_HA_ACCEPTANCE=1 go test -p 1 ./internal/identityprovider -run '^TestKeycloakHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 18m -v
              ;;
            loki)
              BASEHARBOR_LOKI_HA_ACCEPTANCE=1 go test -p 1 ./internal/logs -run '^TestLokiHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            tempo)
              BASEHARBOR_TEMPO_HA_ACCEPTANCE=1 go test -p 1 ./internal/traces -run '^TestTempoHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 18m -v
              ;;
            otel)
              BASEHARBOR_OTEL_HA_ACCEPTANCE=1 go test -p 1 ./internal/telemetry -run '^TestOTelHARuntimeFailoverAcceptanceInCI$' -count=1 -timeout 12m -v
              ;;
            gateway)
              BASEHARBOR_GATEWAY_ACCEPTANCE=1 go test -p 1 ./internal/devgateway -run '^TestGatewayRuntimeContinuityAcceptanceInCI$' -count=1 -timeout 10m -v
              ;;
          esac

      - name: Runtime diagnostics
        if: failure()
        shell: bash
        run: bash scripts/ci-failure-diagnostics.sh "${{ matrix.runtime }}" "$RUNNER_TEMP/targeted-ha-diagnostics" "$GITHUB_WORKSPACE" || true

      - name: Cleanup runtime state
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

  adoption:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.gate, 'adoption-') }}
    name: ${{ inputs.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused adoption gate
        shell: bash
        env:
          GATE: ${{ inputs.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            adoption-conformance)
              go test ./internal/repositoryinspect -count=1 -run 'TestAdoptionConformanceCorpus|TestInspectionBudget|TestCollectSnapshotSkips|TestKubernetesDocumentLimit|TestWorkloadSourceCrossSourceSemanticParity|TestWorkloadSourceResolution'
              ;;
            adoption-realworld-compose|adoption-realworld-quadlet|adoption-realworld-kubernetes)
              category="${GATE#adoption-realworld-}"
              go build -trimpath -o "$RUNNER_TEMP/baha" ./cmd/baha
              BAHA="$RUNNER_TEMP/baha" CORPUS_CATEGORY="$category" bash scripts/realworld-workload-source-corpus.sh
              ;;
            *)
              echo "unsupported adoption gate: $GATE" >&2
              exit 2
              ;;
          esac

  bug_hunt_templates:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/bug-hunt/') }}
    name: Bug hunt templates · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ endsWith(github.ref_name, '/docker') && fromJSON('["docker"]') || endsWith(github.ref_name, '/podman') && fromJSON('["podman"]') || fromJSON('["docker","podman"]') }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_TEMPLATE_BUILD_ACCEPTANCE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify source regressions and fresh generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug-hunt"
          go test -race -json ./cmd/baha -run 'Test(PreflightNewTargetRecoveryFile|TargetRecoveryFile|RequiredSecret(NullInput|RealPTY)|OverviewUsesCanonical|PromptAndStoreMissingRequiredSecrets)' -count=1 | tee "$RUNNER_TEMP/bug-hunt/source.jsonl"
          go test -json ./internal/development -run '^TestGeneratedTemplates' -count=1 -timeout 40m | tee "$RUNNER_TEMP/bug-hunt/templates.jsonl"
      - name: Retain focused bug hunt evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bug-hunt-templates-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bug-hunt
          if-no-files-found: warn
          retention-days: 90

  rootless_engine_isolation:
    if: ${{ contains(github.event.head_commit.message, '[rootless-runtime]') }}
    name: Engine isolation · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:engine-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated rootless engine alongside System Docker
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify independent active Docker context
        if: matrix.runtime == 'docker'
        run: |
          docker context use rootless
          env -u DOCKER_HOST -u DOCKER_CONTEXT docker info --format '{{json .SecurityOptions}}'
          env -u DOCKER_HOST -u DOCKER_CONTEXT docker --host unix:///var/run/docker.sock info --format '{{json .SecurityOptions}}'
      - name: Build exact Core runtime image
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/engine-isolation-build"
          mkdir -p "$out"
          candidate_sha="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=v0.4.24-candidate -X main.commit=$candidate_sha -X main.date=unknown" -o "$out/baha" ./cmd/baha
          cp deploy/control-plane/Dockerfile.binary "$out/Dockerfile"
          ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" "$out"
      - name: Verify native engine isolation and owned lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine-isolation"
          if [ "$BASEHARBOR_TEST_RUNTIME" = docker ]; then
            export BASEHARBOR_DUAL_DOCKER_ACCEPTANCE=1
            selection='^TestDualDockerEngineRootlessCoreAcceptance$'
          else
            export BASEHARBOR_CORE_BOOTSTRAP_ACCEPTANCE=1
            selection='^TestCoreOnlyBootstrapRuntimeAcceptance$/^development$'
          fi
          go test -p 2 -race -json ./cmd/baha -run "$selection" -count=1 -timeout 24m 2>&1 | tee "$RUNNER_TEMP/engine-isolation/tests.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: engine-isolation-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engine-isolation
          retention-days: 90

  identity_trust:
    if: ${{ contains(github.event.head_commit.message, '[identity-runtime]') || contains(github.event.head_commit.message, '[identity-ha-runtime]') }}
    name: Shared Identity SQL trust · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:identity-trust
      BASEHARBOR_CORE_IDENTITY_SQL_CA_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated rootless engine alongside System Docker
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Build exact Core runtime image
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/identity-trust-build"
          mkdir -p "$out"
          candidate_sha="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=v0.4.24-candidate -X main.commit=$candidate_sha -X main.date=unknown" -o "$out/baha" ./cmd/baha
          cp deploy/control-plane/Dockerfile.binary "$out/Dockerfile"
          ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" "$out"
      - name: Verify native engine isolation and owned lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity-trust"
          selection='^TestCoreSharedIdentitySQLCARotationRuntimeAcceptance$'
          if [ '${{ contains(github.event.head_commit.message, '[identity-ha-runtime]') }}' = true ]; then
            selection='^TestCoreSharedIdentitySQLCARotationRuntimeAcceptance$/^ha$'
          fi
          go test -p 2 -race -json ./cmd/baha -run "$selection" -count=1 -timeout 32m 2>&1 | tee "$RUNNER_TEMP/identity-trust/tests.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: identity-trust-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/identity-trust
          retention-days: 90

  final_bug_acceptance:
    if: ${{ github.event_name == 'push' && github.ref_name == 'work/v0.4.24-core-ha-updates' && contains(github.event.head_commit.message, '[final-bug-runtime]') }}
    name: Final product bug acceptance · ${{ matrix.runtime }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_BUGFIX_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:final-bugs
      BASEHARBOR_CORE_BOOTSTRAP_ACCEPTANCE: '1'
      BASEHARBOR_FINAL_BUG_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare verified rootless engine
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Build exact Core image
        run: ${{ matrix.runtime }} build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Verify final bug regressions and real lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-bugs"
          go test -p 2 -json ./cmd/baha ./internal/deployment ./internal/repositoryinspect ./internal/cli -run 'Test(Bug|CoreOnlyBootstrapRuntimeAcceptance|InspectFailsClosedOnComposeInclude|PreflightRepositoryWorkloadPublishedPorts|TargetRecovery|PreflightNewTargetRecovery)' -count=1 -timeout 25m 2>&1 | tee "$RUNNER_TEMP/final-bugs/tests.jsonl"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: final-product-bugs-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-bugs
          retention-days: 90
