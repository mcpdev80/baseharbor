  kubernetes_core_contract_core_runtime_neutrality:
    name: Core · Runtime Neutrality
    runs-on:
    - self-hosted
    - Linux
    - X64
    - baseharbor
    - k3s
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - name: Verify formatting
      shell: bash
      run: |
        set -euo pipefail
        files="$(gofmt -l internal/application internal/openbao internal/identityprovider internal/capability)"
        test -z "$files" || {
          echo "gofmt required:" >&2
          echo "$files" >&2
          exit 1
        }
    - name: Run focused Core tests
      shell: bash
      run: |
        set -euo pipefail
        go test             ./internal/application             ./internal/openbao             ./internal/identityprovider             ./internal/capability             ./internal/runtime             -count=1
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate == 'kubernetes-core-contract' }}

  kubernetes_adoption_contract_contract:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - baseharbor
    - k3s
    timeout-minutes: 10
    steps:
    - name: Checkout BaseHarbor
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Set up candidate Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - name: Verify Go toolchain
      shell: bash
      run: |
        set -euo pipefail
        go version
        test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
    - name: Run demo portability and target acceptance tests
      shell: bash
      run: |
        set -euo pipefail
        go test ./cmd/baha \
          -run '^(TestKubernetesAdoptionContractReferenceDemoKeepsRepositoryWorkloadUnchanged|TestKubernetesReferenceDemoTargetAcceptance)$' \
          -count=1 -v
    - name: Build candidate CLI
      shell: bash
      run: |
        set -euo pipefail
        go build -trimpath -o "$RUNNER_TEMP/baha" ./cmd/baha
        "$RUNNER_TEMP/baha" version
    - name: Verify pristine external demo remains untouched on ambiguous adoption
      shell: bash
      env:
        DEMO_SHA: b5e428b5e1d9d385ac6be04f3d6ae77d3c4f8887
      run: |
        set -euo pipefail

        demo="$RUNNER_TEMP/baseharbor-demo-k8s-contract"
        rm -rf "$demo"
        git clone --quiet https://github.com/mcpdev80/baseharbor-demo.git "$demo"
        git -C "$demo" checkout --quiet "$DEMO_SHA"

        test ! -e "$demo/baseharbor.yaml"
        test ! -e "$demo/.baseharbor"

        root_before="$(sha256sum "$demo/compose.yaml" | awk '{print $1}')"
        companion_before="$(sha256sum "$demo/companion-app/compose.yaml" | awk '{print $1}')"

        (
          cd "$demo"
          "$RUNNER_TEMP/baha" app inspect . >/tmp/baseharbor-demo-inspect.txt

          if "$RUNNER_TEMP/baha" app init --quick >/tmp/baseharbor-demo-quick.txt 2>&1; then
            echo "expected quick init to fail closed because the reference repo has multiple Compose files" >&2
            exit 1
          fi

          grep -qi "multiple Compose files" /tmp/baseharbor-demo-quick.txt
        )

        test ! -e "$demo/baseharbor.yaml"
        test ! -e "$demo/.baseharbor"

        root_after="$(sha256sum "$demo/compose.yaml" | awk '{print $1}')"
        companion_after="$(sha256sum "$demo/companion-app/compose.yaml" | awk '{print $1}')"

        test "$root_before" = "$root_after"
        test "$companion_before" = "$companion_after"
        test -z "$(git -C "$demo" status --short)"
    - name: Prove planned reference-demo Kubernetes resource shape
      shell: bash
      run: |
        set -euo pipefail

        ns="${BASEHARBOR_K8S_NAMESPACE:-baseharbor-ci}"
        app="baseharbor-demo-shape"

        cleanup() {
          kubectl delete deployment "$app" -n "$ns" --ignore-not-found --wait=true
          kubectl delete service "$app" -n "$ns" --ignore-not-found
          kubectl delete secret "$app-bindings" -n "$ns" --ignore-not-found
          kubectl delete configmap "$app-config" -n "$ns" --ignore-not-found
        }
        trap cleanup EXIT
        cleanup

        kubectl create secret generic "$app-bindings" -n "$ns" \
          --from-literal=DATABASE_URL='postgresql://demo:demo@postgres:5432/demo' \
          --from-literal=REDIS_URL='redis://valkey:6379/0' \
          --from-literal=S3_ENDPOINT='http://object-storage:9000' \
          --from-literal=S3_BUCKET='uploads' \
          --from-literal=APP_SECRET='ci-only'

        kubectl create configmap "$app-config" -n "$ns" \
          --from-literal=PORT='8080'

        cat <<'YAML' | sed "s/__APP__/$app/g; s/__NS__/$ns/g" | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: __APP__
          namespace: __NS__
          labels:
            app.kubernetes.io/name: __APP__
            app.kubernetes.io/managed-by: baseharbor
            baseharbor.io/application: baseharbor-demo
            baseharbor.io/environment: dev
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: __APP__
          template:
            metadata:
              labels:
                app.kubernetes.io/name: __APP__
                app.kubernetes.io/managed-by: baseharbor
                baseharbor.io/application: baseharbor-demo
                baseharbor.io/environment: dev
            spec:
              containers:
                - name: demo-app
                  image: registry.k8s.io/pause:3.10
                  envFrom:
                    - configMapRef:
                        name: __APP__-config
                    - secretRef:
                        name: __APP__-bindings
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: __APP__
          namespace: __NS__
          labels:
            app.kubernetes.io/managed-by: baseharbor
            baseharbor.io/application: baseharbor-demo
            baseharbor.io/environment: dev
        spec:
          selector:
            app.kubernetes.io/name: __APP__
          ports:
            - name: http
              port: 8080
              targetPort: 8080
        YAML

        kubectl rollout status deployment/"$app" -n "$ns" --timeout=120s

        test "$(kubectl get deployment "$app" -n "$ns" -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}')" = "baseharbor"
        test "$(kubectl get deployment "$app" -n "$ns" -o jsonpath='{.metadata.labels.baseharbor\.io/application}')" = "baseharbor-demo"
        test "$(kubectl get deployment "$app" -n "$ns" -o jsonpath='{.metadata.labels.baseharbor\.io/environment}')" = "dev"

        test "$(kubectl get service "$app" -n "$ns" -o jsonpath='{.spec.ports[0].port}')" = "8080"
        test "$(kubectl get secret "$app-bindings" -n "$ns" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)" = "postgresql://demo:demo@postgres:5432/demo"
        test "$(kubectl get configmap "$app-config" -n "$ns" -o jsonpath='{.data.PORT}')" = "8080"

        # The target realization must stay within the pre-existing namespace.
        test "$(kubectl auth can-i create namespaces 2>/dev/null || true)" = "no"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate == 'kubernetes-adoption-contract' }}

