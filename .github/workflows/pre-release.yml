  v0421_ha_groups:
    name: v0421 ha groups · All runtime results
    needs: [source, v0421_ha_groups_docker, v0421_ha_groups_podman]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both runtime matrices
        env:
          DOCKER_RESULT: ${{ needs.v0421_ha_groups_docker.result }}
          PODMAN_RESULT: ${{ needs.v0421_ha_groups_podman.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DOCKER_COUNT: ${{ needs.source.outputs.ha_docker_count }}
          PODMAN_COUNT: ${{ needs.source.outputs.ha_podman_count }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$DOCKER_RESULT" = success || { test "$DOCKER_RESULT" = skipped && test "$DOCKER_COUNT" = 0; }
          test "$PODMAN_RESULT" = success || { test "$PODMAN_RESULT" = skipped && test "$PODMAN_COUNT" = 0; }

  reference_journey:
    if: ${{ needs.source.result == 'success' && needs.source.outputs.journey_count != '0' }}
    name: Reference Journey · ${{ matrix.runtime }} · Full E2E
    needs: [source, runtime_candidate]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ fromJSON(needs.source.outputs.journey) }}

    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_RUNTIME_IMAGE: localhost/baseharbor-runtime:pre-release

    steps:
      - name: Prepare hosted Podman runtime
        if: matrix.runtime == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman version
          podman info

      - name: Verify Podman Quadlet runtime
        id: quadlet
        if: matrix.runtime == 'podman'
        shell: bash
        run: |
          set -euo pipefail
          podman info >/tmp/atomic-podman-info.txt
          generator=""
          for candidate in             "$(command -v podman-system-generator 2>/dev/null || true)"             /usr/lib/systemd/system-generators/podman-system-generator             /usr/libexec/podman/quadlet
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              generator="$candidate"
              break
            fi
          done
          test -n "$generator"
          verify_units="$RUNNER_TEMP/atomic-quadlet-verify"
          rm -rf "$verify_units"
          mkdir -p "$verify_units"
          QUADLET_UNIT_DIRS="$verify_units" "$generator" --user --dryrun >/tmp/atomic-podman-quadlet.txt
          cat >"$RUNNER_TEMP/baseharbor-no-compose" <<'EOF'
          #!/bin/sh
          echo "podman compose is forbidden in BaseHarbor Podman acceptance" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-no-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/baseharbor-no-compose" >> "$GITHUB_ENV"

      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.candidate_sha }}

      - name: Reset journey runtime
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@v6
        with:
          name: pre-release-runtime-candidate
          path: ${{ runner.temp }}/pre-release-candidate

      - name: Load exact runtime image
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/pre-release-candidate/baha"
          archive="$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
          test -s "$archive"
          "${{ matrix.runtime }}" load -i "$archive"
          "${{ matrix.runtime }}" image inspect "$BASEHARBOR_RUNTIME_IMAGE" >/dev/null
          "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ needs.source.outputs.candidate_sha }}"

      - name: Checkout exact demo revision
        id: demo
        shell: bash
        env:
          DEMO_REF: ${{ needs.source.outputs.demo_ref }}
        run: |
          set -euo pipefail
          [[ "$DEMO_REF" =~ ^[0-9a-f]{40}$ ]]
          workdir="$RUNNER_TEMP/baseharbor-demo-reference"
          rm -rf "$workdir"
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          git -C "$workdir" fetch --depth 1 origin "$DEMO_REF"
          git -C "$workdir" checkout --detach FETCH_HEAD
          test "$(git -C "$workdir" rev-parse HEAD)" = "$DEMO_REF"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

      - name: Run complete reference journey
        id: journey
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/gate-output.log") 2>&1
          export XDG_CONFIG_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/cache"
          export ARTIFACT_DIR="$RUNNER_TEMP/baseharbor-reference-artifacts"
          workdir="${{ steps.demo.outputs.workdir }}"
          cd "$workdir"
          started=$(date +%s)
          set +e
          BASEHARBOR_PREBUILT_BINARY="$RUNNER_TEMP/pre-release-candidate/baha" \
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
          BASEHARBOR_RUNTIME_IMAGE="$BASEHARBOR_RUNTIME_IMAGE" \
          BASEHARBOR_TEST_RUNTIME="${{ matrix.runtime }}" \
            bash scripts/acceptance.sh
          result=$?
          set -e
          echo "duration_seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Collect reference journey diagnostics
        if: failure()
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/cache"
          bash scripts/ci-failure-diagnostics.sh \
            "${{ matrix.runtime }}" \
            "$RUNNER_TEMP/reference-journey-diagnostics" \
            "${{ steps.demo.outputs.workdir }}" \
            "$RUNNER_TEMP/pre-release-candidate/baha" || true

      - name: Show original assertion before cleanup
        if: failure()
        shell: bash
        run: python scripts/ci-assertion-summary.py "$RUNNER_TEMP/gate-output.log" "$RUNNER_TEMP/assertion-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup journey runtime
        id: cleanup
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

      - name: Generate reference journey evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reference-journey-evidence"
          mkdir -p "$out"
          if [ -f "$RUNNER_TEMP/assertion-summary.json" ]; then cp "$RUNNER_TEMP/assertion-summary.json" "$out/"; fi
          cp -a "$RUNNER_TEMP/baseharbor-reference-artifacts" "$out/demo" 2>/dev/null || true
          cp -a "$RUNNER_TEMP/reference-journey-diagnostics" "$out/diagnostics" 2>/dev/null || true
          jq -n \
            --arg schema "baseharbor.pre-release.reference-journey/v1" \
            --arg candidate_sha "${{ needs.source.outputs.candidate_sha }}" \
            --arg demo_ref "${{ needs.source.outputs.demo_ref }}" \
            --arg outcome "${{ steps.journey.outcome }}" \
            --arg cleanup_outcome "${{ steps.cleanup.outcome }}" \
            --arg runtime "${{ matrix.runtime }}" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg duration_seconds "${{ steps.journey.outputs.duration_seconds }}" \
            '{
              schema: $schema,
              candidate_sha: $candidate_sha,
              demo_ref: $demo_ref,
              runtime: $runtime,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              cleanup_outcome: $cleanup_outcome,
              duration_seconds: (if $duration_seconds == "" then null else ($duration_seconds | tonumber) end),
              outcome: $outcome
            }' > "$out/manifest.json"

      - name: Summarize journey groups and duration
        if: always()
        shell: bash
        run: |
          python - <<'PY_SUMMARY'
          import csv, os, pathlib
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'baseharbor-reference-artifacts/groups.tsv'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Full journey · ${{ matrix.runtime }}\n\n')
              output.write('Duration: ${{ steps.journey.outputs.duration_seconds }} seconds. Cleanup: ${{ steps.cleanup.outcome }}.\n\n')
              output.write('| Group | Result |\n| --- | --- |\n')
              if report.is_file():
                  for row in csv.reader(report.open(), delimiter='\t'):
                      if len(row) >= 2 and row[0].startswith('demo-') and row[1] in ('PASS', 'FAIL', 'ERROR', 'BLOCKED', 'SKIP'):
                          name = ''.join(c for c in row[0] if c.isalnum() or c == '-')[:80]
                          output.write(f'| {name} | {row[1]} |\n')
              else:
                  output.write('| Setup | No group report; inspect the first failed step |\n')
          PY_SUMMARY

      - name: Upload reference journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-reference-journey-evidence-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-journey-evidence
          if-no-files-found: error
          retention-days: 30

