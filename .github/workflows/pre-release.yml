name: "Release · Pre-Release Validation"

run-name: "Pre-Release · ${{ inputs.tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.19
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
      demo_ref:
        description: Exact baseharbor-demo commit SHA to validate
        required: true
        type: string
  push:
    branches:
      - 'release-candidate/**'
      - 'validation/pre-release/**'

permissions:
  contents: read

jobs:
  source:
    name: Source · Contracts · Docs
    runs-on: [self-hosted, Linux, X64, baseharbor, k3s]
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      demo_ref: ${{ steps.release.outputs.demo_ref }}

    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Enforce workflow policy
        id: workflow_policy
        run: bash scripts/ci-workflow-policy.sh

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DEMO_REF: ${{ inputs.demo_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE] or stable vMAJOR.MINOR.PATCH.HOTFIX." >&2
            exit 1
          fi

          git fetch origin main develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "Candidate follows the normal develop release line."
          elif git merge-base --is-ancestor origin/main HEAD; then
            echo "Candidate follows the released main hotfix line."
          else
            echo "Pre-release candidate must either be contained in develop or descend from released main." >&2
            exit 1
          fi

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          demo_ref_file="docs/releases/${tag}.demo-ref"
          test -s "$demo_ref_file" || {
            echo "Exact demo revision file is missing: $demo_ref_file" >&2
            exit 1
          }
          pinned_demo_ref="$(tr -d '[:space:]' < "$demo_ref_file")"
          [[ "$pinned_demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Pinned demo revision must be an exact 40-character commit SHA, got: $pinned_demo_ref" >&2
            exit 1
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Demo revision must be an exact 40-character commit SHA, got: $INPUT_DEMO_REF" >&2
              exit 1
            }
            test "$INPUT_DEMO_REF" = "$pinned_demo_ref" || {
              echo "Requested demo revision does not match $demo_ref_file." >&2
              exit 1
            }
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "demo_ref=$pinned_demo_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install validation tooling
        id: tooling
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Validate source readability
        id: source_readability
        run: bash scripts/source-readability-audit.sh

      - name: Run release-source tests
        id: source_tests
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/pre-release-source-logs"
          mkdir -p "$logs"
          go test ./internal/... ./spec/... 2>&1 | tee "$logs/go-test-internal-spec.log"
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha 2>&1 | tee "$logs/go-test-cmd-baha.log"
          go vet ./... 2>&1 | tee "$logs/go-vet.log"

      - name: Validate documentation
        id: docs
        shell: bash
        run: |
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: "$RUNNER_TEMP/bin/actionlint -shellcheck="

      - name: Build release snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        id: snapshot_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build exact candidate binary
        id: candidate_binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-release-candidate"
          CGO_ENABLED=0 go build -trimpath             -ldflags="-s -w -X main.version=${{ steps.release.outputs.tag }} -X main.commit=${{ steps.release.outputs.candidate_sha }} -X main.date=unknown"             -o "$RUNNER_TEMP/pre-release-candidate/baha" ./cmd/baha
          "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ steps.release.outputs.candidate_sha }}"

      - name: Upload source candidate
        id: source_candidate
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-source-candidate
          path: ${{ runner.temp }}/pre-release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Generate source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/pre-release-source-evidence.tsv"
          cat >"$rows" <<EOF
          Candidate resolution	${{ steps.release.outcome }}	release metadata, exact candidate SHA and pinned demo SHA
          Workflow policy	${{ steps.workflow_policy.outcome }}	fixed reviewed workflow surface
          Go formatting	${{ steps.formatting.outcome }}	gofmt cmd internal spec
          Source readability	${{ steps.source_readability.outcome }}	production source guard
          Release-source tests	${{ steps.source_tests.outcome }}	unit/package tests and vet
          Documentation	${{ steps.docs.outcome }}	strict EN/DE docs and audit
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint
          Release snapshot	${{ steps.snapshot.outcome }}	GoReleaser snapshot
          Snapshot verification	${{ steps.snapshot_verify.outcome }}	linux amd64/arm64 archives
          Candidate binary	${{ steps.candidate_binary.outcome }}	exact SHA-stamped binary
          Source candidate	${{ steps.source_candidate.outcome }}	shared binary for static/runtime gates
          EOF
          mkdir -p "$RUNNER_TEMP/pre-release-source-evidence/source-logs"
          cp -a "$RUNNER_TEMP/pre-release-source-logs/." "$RUNNER_TEMP/pre-release-source-evidence/source-logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/pre-release-source-evidence"             "BaseHarbor Source Pre-Release Evidence"             "pre-release/source"             "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"             "${{ steps.release.outputs.candidate_sha || github.sha }}"             "$rows"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-source-evidence
          if-no-files-found: error
          retention-days: 30

  runtime_candidate:
    name: Candidate · Runtime Image
    needs: source
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.candidate_sha }}

      - name: Reset Docker runner state
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Download source candidate
        uses: actions/download-artifact@v6
        with:
          name: pre-release-source-candidate
          path: ${{ runner.temp }}/pre-release-candidate

      - name: Build runtime image once
        id: runtime_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: localhost/baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ needs.source.outputs.tag }}
            COMMIT=${{ needs.source.outputs.candidate_sha }}

      - name: Export runtime image
        id: export
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect localhost/baseharbor-runtime:pre-release >/dev/null
          docker save localhost/baseharbor-runtime:pre-release             -o "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
          test -s "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"

      - name: Upload shared runtime candidate
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-runtime-candidate
          path: ${{ runner.temp }}/pre-release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup Docker runner state
        if: always()
        run: bash scripts/ci-runtime-reset.sh docker

  static_gates:
    name: Static · ${{ matrix.gate }}
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        gate:
          - config-matrix
          - init
          - mcp
          - agent
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: static
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-source-candidate

  runtime_gates:
    name: ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs: [source, runtime_candidate]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [docker, podman]
        gate:
          - guided
          - shell-ux
          - lifecycle
          - data-capabilities
          - observability
          - policy
          - identity
          - connectivity
          - security
          - reconciliation
          - failure
          - backup-restore
          - full-destroy
          - rabbitmq-runtime
          - mongodb-runtime
          - durable-key-value
          - control-plane-recovery
          - loki-runtime
          - tempo-runtime
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate

  evidence:
    name: Evidence · Candidate Manifest
    if: always()
    needs: [source, runtime_candidate, static_gates, runtime_gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.candidate_sha || github.sha }}

      - name: Download gate evidence
        uses: actions/download-artifact@v6
        with:
          pattern: pre-release-gate-*-evidence-*
          path: ${{ runner.temp }}/gate-evidence

      - name: Verify complete atomic evidence set
        id: manifest
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.source.outputs.candidate_sha }}
          DEMO_REF: ${{ needs.source.outputs.demo_ref }}
        run: |
          set -euo pipefail
          expected_ids="$RUNNER_TEMP/expected-gate-ids.txt"
          actual_ids="$RUNNER_TEMP/actual-gate-ids.txt"
          manifests="$RUNNER_TEMP/gate-manifests.json"

          {
            for gate in config-matrix init mcp agent; do
              printf 'static/%s\n' "$gate"
            done
            for runtime in docker podman; do
              for gate in guided shell-ux lifecycle data-capabilities observability policy identity connectivity security reconciliation failure backup-restore full-destroy rabbitmq-runtime mongodb-runtime durable-key-value control-plane-recovery loki-runtime tempo-runtime; do
                printf '%s/%s\n' "$runtime" "$gate"
              done
            done
          } | sort > "$expected_ids"

          mapfile -d '' manifest_files < <(find "$RUNNER_TEMP/gate-evidence" -type f -name manifest.json -print0 | sort -z)
          test "${#manifest_files[@]}" -eq 42
          jq -s '.' "${manifest_files[@]}" > "$manifests"

          jq -e \
            --arg candidate "$CANDIDATE_SHA" \
            --arg demo "$DEMO_REF" \
            '
              length == 42 and
              all(.[];
                .schema == "baseharbor.pre-release.gate-evidence/v1" and
                .candidate_sha == $candidate and
                .demo_ref == $demo and
                .outcome == "success"
              ) and
              ([.[].id] | unique | length) == 42
            ' "$manifests" >/dev/null

          jq -r '.[].id' "$manifests" | sort > "$actual_ids"
          diff -u "$expected_ids" "$actual_ids"

          summary_count="$(find "$RUNNER_TEMP/gate-evidence" -type f -name summary.md | wc -l)"
          test "$summary_count" -eq 42

          mkdir -p "$RUNNER_TEMP/pre-release-final-evidence/gates"
          cp -a "$RUNNER_TEMP/gate-evidence/." "$RUNNER_TEMP/pre-release-final-evidence/gates/"
          cp "$manifests" "$RUNNER_TEMP/pre-release-final-evidence/gate-manifests.json"
          cp "$actual_ids" "$RUNNER_TEMP/pre-release-final-evidence/gate-evidence-ids.txt"

      - name: Generate immutable release approval
        id: approval
        if: >-
          steps.manifest.outcome == 'success' &&
          needs.source.result == 'success' &&
          needs.runtime_candidate.result == 'success' &&
          needs.static_gates.result == 'success' &&
          needs.runtime_gates.result == 'success'
        shell: bash
        env:
          TAG: ${{ needs.source.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.source.outputs.candidate_sha }}
          DEMO_SHA: ${{ needs.source.outputs.demo_ref }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pre-release-approval"
          mkdir -p "$out"
          jq -n \
            --arg schema "baseharbor.pre-release.approval/v1" \
            --arg tag "$TAG" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg demo_sha "$DEMO_SHA" \
            --arg workflow "pre-release.yml" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg result "success" \
            --argjson gate_count 42 \
            '{
              schema: $schema,
              tag: $tag,
              candidate_sha: $candidate_sha,
              tested_sha: $candidate_sha,
              demo_sha: $demo_sha,
              workflow: $workflow,
              workflow_run_id: ($run_id | tonumber),
              workflow_run_attempt: ($run_attempt | tonumber),
              gate_evidence_schema: "baseharbor.pre-release.gate-evidence/v1",
              gate_count: $gate_count,
              result: $result
            }' > "$out/release-approved.json"
          cp "$RUNNER_TEMP/pre-release-final-evidence/gate-manifests.json" "$out/gate-manifests.json"
          cp "$RUNNER_TEMP/pre-release-final-evidence/gate-evidence-ids.txt" "$out/gate-evidence-ids.txt"

      - name: Upload immutable release approval
        if: steps.approval.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-approval
          if-no-files-found: error
          retention-days: 90

      - name: Generate final pre-release evidence
        if: always()
        shell: bash
        run: |
          rows="$RUNNER_TEMP/pre-release-final.tsv"
          cat >"$rows" <<EOF
          Source	${{ needs.source.result }}	exact candidate source/contracts/docs
          Runtime candidate	${{ needs.runtime_candidate.result }}	one runtime image built and shared
          Static gates	${{ needs.static_gates.result }}	4 independently rerunnable static gates
          Runtime gates	${{ needs.runtime_gates.result }}	38 independently rerunnable Docker/Podman gates
          Evidence manifest	${{ steps.manifest.outcome }}	42 gate evidence bundles bound to the candidate SHA
          EOF
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/pre-release-final-evidence"             "BaseHarbor Final Pre-Release Evidence"             "pre-release/final"             "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"             "${{ needs.source.outputs.candidate_sha || github.sha }}"             "$rows"

      - name: Upload final pre-release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-final-evidence
          if-no-files-found: error
          retention-days: 30
