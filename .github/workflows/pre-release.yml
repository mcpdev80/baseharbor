name: Release · Pre-Release Validation
run-name: Pre-Release · ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.develop_mode && format('baseharbor-develop-{0}', github.run_id) || 'baseharbor-release-qualification' }}
  cancel-in-progress: false
jobs:
  source:
    name: Source · Contracts · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      demo_ref: ${{ steps.release.outputs.demo_ref }}
      consumer_ref: ${{ steps.release.outputs.consumer_ref }}
      adoption: ${{ steps.selection.outputs.adoption }}
      adoption_count: ${{ steps.selection.outputs.adoption_count }}
      static: ${{ steps.selection.outputs.static }}
      static_count: ${{ steps.selection.outputs.static_count }}
      light_docker: ${{ steps.selection.outputs.light_docker }}
      light_docker_count: ${{ steps.selection.outputs.light_docker_count }}
      light_podman: ${{ steps.selection.outputs.light_podman }}
      light_podman_count: ${{ steps.selection.outputs.light_podman_count }}
      heavy_docker: ${{ steps.selection.outputs.heavy_docker }}
      heavy_docker_count: ${{ steps.selection.outputs.heavy_docker_count }}
      heavy_podman: ${{ steps.selection.outputs.heavy_podman }}
      heavy_podman_count: ${{ steps.selection.outputs.heavy_podman_count }}
      ha_docker: ${{ steps.selection.outputs.ha_docker }}
      ha_docker_count: ${{ steps.selection.outputs.ha_docker_count }}
      ha_podman: ${{ steps.selection.outputs.ha_podman }}
      ha_podman_count: ${{ steps.selection.outputs.ha_podman_count }}
      journey: ${{ steps.selection.outputs.journey }}
      journey_count: ${{ steps.selection.outputs.journey_count }}
      integration: ${{ steps.selection.outputs.integration }}
      integration_count: ${{ steps.selection.outputs.integration_count }}
      console_ref: ${{ steps.release.outputs.console_ref }}
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Enforce workflow policy
      id: workflow_policy
      run: bash scripts/ci-workflow-policy.sh
    - name: Resolve release candidate
      id: release
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_DEMO_REF: ${{ inputs.demo_ref }}
        INPUT_CONSUMER_REF: ${{ inputs.consumer_ref }}
        INPUT_CONSOLE_REF: ${{ inputs.console_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.develop_mode }}" = true ]; then
          test "$EVENT_NAME" = workflow_call
          core_sha="$(git rev-parse HEAD)"
          [[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]
          test "$core_sha" = "${{ inputs.ref }}"
          [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CONSOLE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CONSUMER_REF" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/develop-ecosystem-source.py \
            --core "$core_sha" --demo "$INPUT_DEMO_REF" \
            --console "$INPUT_CONSOLE_REF" --connector "$INPUT_CONSUMER_REF"
          {
            echo "tag=develop"
            echo "candidate_sha=$core_sha"
            echo "demo_ref=$INPUT_DEMO_REF"
            echo "consumer_ref=$INPUT_CONSUMER_REF"
            echo "console_ref=$INPUT_CONSOLE_REF"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$INPUT_TAG" ]; then
          tag="$INPUT_TAG"
        else
          version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
          test -n "$version"
          tag="v$version"
        fi

        if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE] or stable vMAJOR.MINOR.PATCH.HOTFIX." >&2
          exit 1
        fi

        git fetch origin main develop
        release_ref="refs/remotes/origin/release/$tag"
        git fetch origin "refs/heads/release/$tag:$release_ref" || true
        if git merge-base --is-ancestor origin/develop HEAD; then
          echo "Candidate follows the current develop release line."
        elif git merge-base --is-ancestor origin/main HEAD; then
          echo "Candidate follows the current released main line."
        elif git show-ref --verify --quiet "$release_ref" && [ "$(git rev-parse "$release_ref")" = "$(git rev-parse HEAD)" ]; then
          echo "Candidate exactly matches the current release/$tag branch tip."
        else
          echo "Pre-release candidate must follow current develop/main or exactly match release/$tag." >&2
          exit 1
        fi

        version="${tag#v}"
        grep -Fq "## [${version}]" CHANGELOG.md
        test -s "docs/releases/${tag}.md"

        if [ "$tag" = v0.4.24 ] || [ "$tag" = v0.4.25 ] || [ "$tag" = v0.4.26 ]; then
          python3 scripts/ecosystem_release_pins.py --tag "$tag" --core "$(git rev-parse HEAD)" \
            --connector "$INPUT_CONSUMER_REF" --demo "$INPUT_DEMO_REF" \
            --output "docs/releases/$tag.consumer-pins.json" > "$RUNNER_TEMP/v024-consumers.json"
          pinned_demo_ref="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["demo_ref"])' "$RUNNER_TEMP/v024-consumers.json")"
          consumer_ref="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["connector_ref"])' "$RUNNER_TEMP/v024-consumers.json")"
          echo "consumer_ref=$consumer_ref" >> "$GITHUB_OUTPUT"
          echo "console_ref=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["console_ref"])' "$RUNNER_TEMP/v024-consumers.json")" >> "$GITHUB_OUTPUT"
        else
          demo_ref_file="docs/releases/${tag}.demo-ref"
          test -s "$demo_ref_file" || {
            echo "Exact demo revision file is missing: $demo_ref_file" >&2
            exit 1
          }
          pinned_demo_ref="$(tr -d '[:space:]' < "$demo_ref_file")"
          [[ "$pinned_demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Pinned demo revision must be an exact 40-character commit SHA, got: $pinned_demo_ref" >&2
            exit 1
          }

          if [ -n "$INPUT_DEMO_REF" ]; then
            [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Demo revision must be an exact 40-character commit SHA, got: $INPUT_DEMO_REF" >&2
              exit 1
            }
            test "$INPUT_DEMO_REF" = "$pinned_demo_ref" || {
              echo "Requested demo revision does not match $demo_ref_file." >&2
              exit 1
            }
          fi
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "demo_ref=$pinned_demo_ref" >> "$GITHUB_OUTPUT"
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - name: Install validation tooling
      id: tooling
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r requirements-docs.txt
        GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - name: Check Go formatting
      id: formatting
      shell: bash
      run: |
        set -euo pipefail
        files="$(gofmt -l cmd internal spec contracts)"
        test -z "$files" || {
          echo "gofmt required:" >&2
          echo "$files" >&2
          exit 1
        }
    - name: Validate source readability
      id: source_readability
      run: bash scripts/source-readability-audit.sh
    - name: Run release-source tests
      id: source_tests
      shell: bash
      run: |
        set -euo pipefail
        logs="$RUNNER_TEMP/pre-release-source-logs"
        mkdir -p "$logs"
        go test ./contracts/... ./internal/... ./spec/... ./conformance/... 2>&1 | tee "$logs/go-test-internal-spec.log"
        BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha 2>&1 | tee "$logs/go-test-cmd-baha.log"
        go vet ./... 2>&1 | tee "$logs/go-vet.log"
    - name: Validate documentation
      id: docs
      shell: bash
      run: |
        mkdocs build --strict --config-file mkdocs.yml
        mkdocs build --strict --config-file mkdocs.de.yml
        bash scripts/documentation-audit.sh
    - name: Validate v0.4.20 release-note hygiene
      id: v0420_hygiene
      if: steps.release.outputs.tag == 'v0.4.20'
      shell: bash
      run: |
        set -euo pipefail
        release_internal="$(
          grep -n -Ei 'corpus|unit test|conformance|schema_version|fingerprint|adapter v1|candidate sha|gofmt|go test|go vet|implementation evidence|validation|CI gate' docs/releases/v0.4.20.md || true
        )"
        test -z "$release_internal" || {
          echo "Internal validation detail leaked into user-facing release notes:" >&2
          echo "$release_internal" >&2
          exit 1
        }
    - name: Validate v0.4.21 release readiness
      id: v0421_readiness
      if: steps.release.outputs.tag == 'v0.4.21'
      shell: bash
      run: bash scripts/v0.4.21-readiness.sh
    - name: Validate workflow syntax
      id: workflow_syntax
      shell: bash
      run: $RUNNER_TEMP/bin/actionlint -shellcheck=
    - name: Build release snapshot
      id: snapshot
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: ~> v2
        args: release --snapshot --clean
    - name: Verify release snapshot
      id: snapshot_verify
      shell: bash
      run: |
        set -euo pipefail
        test -f dist/checksums.txt
        test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
        grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
        grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt
    - name: Build exact candidate binary
      id: candidate_binary
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pre-release-candidate"
        CGO_ENABLED=0 go build -trimpath             -ldflags="-s -w -X main.version=${{ steps.release.outputs.tag }} -X main.commit=${{ steps.release.outputs.candidate_sha }} -X main.date=unknown"             -o "$RUNNER_TEMP/pre-release-candidate/baha" ./cmd/baha
        "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ steps.release.outputs.candidate_sha }}"
    - name: Upload source candidate
      id: source_candidate
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: pre-release-source-candidate
        path: ${{ runner.temp }}/pre-release-candidate
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Select normal release checks
      id: selection
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ONLY_GATES: ${{ inputs.only_gates }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF_NAME" == validation/pre-release/selected/gates/* ]]; then
          ONLY_GATES="${GITHUB_REF_NAME#validation/pre-release/selected/gates/}"
          test -n "$ONLY_GATES"
        elif [[ "$GITHUB_REF_NAME" == validation/pre-release/selected/* ]]; then
          ONLY_GATES="$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))))' "docs/releases/$TAG.selected-gates.json")"
          test -n "$ONLY_GATES"
        fi
        if [ "${{ inputs.develop_mode }}" = true ]; then
          # v0.4.26 is the existing gate-inventory baseline, NOT the build/release identity.
          test "$ONLY_GATES" = "integration/docker/remote-target,integration/podman/remote-target,integration/static/live-console"
          TAG=v0.4.26
        fi
        python3 scripts/pre-release-check-plan.py --tag "$TAG" --only-gates "$ONLY_GATES" >> "$GITHUB_OUTPUT"
  runtime_candidate:
    name: Candidate · Runtime Image
    needs: source
    if: needs.source.outputs.light_docker_count != '0' || needs.source.outputs.light_podman_count != '0' || needs.source.outputs.heavy_docker_count
      != '0' || needs.source.outputs.heavy_podman_count != '0' || needs.source.outputs.journey_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.candidate_sha }}
    - name: Reset Docker runner state
      run: bash scripts/ci-runtime-reset.sh docker
    - name: Download source candidate
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: pre-release-source-candidate
        path: ${{ runner.temp }}/pre-release-candidate
    - name: Build runtime image once
      id: runtime_image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: deploy/control-plane/Dockerfile
        platforms: linux/amd64
        push: false
        load: true
        tags: localhost/baseharbor-runtime:pre-release
        build-args: |
          VERSION=${{ needs.source.outputs.tag }}
          COMMIT=${{ needs.source.outputs.candidate_sha }}
    - name: Export runtime image
      id: export
      shell: bash
      run: |
        set -euo pipefail
        docker image inspect localhost/baseharbor-runtime:pre-release >/dev/null
        docker save localhost/baseharbor-runtime:pre-release             -o "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
        test -s "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
    - name: Upload shared runtime candidate
      id: upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: pre-release-runtime-candidate
        path: ${{ runner.temp }}/pre-release-candidate
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Cleanup Docker runner state
      if: always()
      run: bash scripts/ci-runtime-reset.sh docker
  adoption:
    if: ${{ needs.source.result == 'success' && needs.source.outputs.adoption_count != '0' }}
    name: Adoption · ${{ matrix.gate }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gate: ${{ fromJSON(needs.source.outputs.adoption) }}
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.candidate_sha }}
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
    - name: Run adoption gate
      id: adoption_gate
      shell: bash
      env:
        GATE: ${{ matrix.gate }}
      run: |
        set -euo pipefail
        case "$GATE" in
          conformance)
            go test ./internal/repositoryinspect -run 'TestAdoptionConformanceCorpus|TestInspectionBudget|TestCollectSnapshotSkips|TestKubernetesDocumentLimit|TestWorkloadSourceCrossSourceSemanticParity|TestWorkloadSourceResolution' -count=1
            legacy="$(
              find cmd internal docs -type f \( -name '*.go' -o -name '*.md' -o -name '*.yaml' -o -name '*.yml' \) -print0 |
                xargs -0 grep -n -E -- '--workload-compose|--workload-service|workload\\.compose|workload\\.services|Manifest\\.Workload\\.(Compose|Services)' || true
            )"
            if [ -n "$legacy" ]; then
              echo "$legacy" >&2
              exit 1
            fi
            ;;
          realworld-compose)
            go build -trimpath -o /tmp/baha ./cmd/baha
            BAHA=/tmp/baha CORPUS_CATEGORY=compose bash scripts/realworld-workload-source-corpus.sh
            ;;
          realworld-quadlet)
            go build -trimpath -o /tmp/baha ./cmd/baha
            BAHA=/tmp/baha CORPUS_CATEGORY=quadlet bash scripts/realworld-workload-source-corpus.sh
            ;;
          realworld-kubernetes)
            go build -trimpath -o /tmp/baha ./cmd/baha
            BAHA=/tmp/baha CORPUS_CATEGORY=kubernetes bash scripts/realworld-workload-source-corpus.sh
            ;;
        esac
  static_gates:
    name: Static · ${{ matrix.gate }}
    needs: source
    if: ${{ needs.source.result == 'success' && needs.source.outputs.static_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        gate: ${{ fromJSON(needs.source.outputs.static) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: static
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-source-candidate
  runtime_light_gates_docker:
    name: Light · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs:
    - source
    - runtime_candidate
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success'
      && needs.source.outputs.light_docker_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime:
        - docker
        gate: ${{ fromJSON(needs.source.outputs.light_docker) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate
  runtime_light_gates_podman:
    name: Light · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs:
    - source
    - runtime_candidate
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success'
      && needs.source.outputs.light_podman_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime:
        - podman
        gate: ${{ fromJSON(needs.source.outputs.light_podman) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate
  runtime_light_gates:
    name: runtime light gates · All runtime results
    needs:
    - source
    - runtime_light_gates_docker
    - runtime_light_gates_podman
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both runtime matrices
      env:
        DOCKER_RESULT: ${{ needs.runtime_light_gates_docker.result }}
        PODMAN_RESULT: ${{ needs.runtime_light_gates_podman.result }}
        SOURCE_RESULT: ${{ needs.source.result }}
        DOCKER_COUNT: ${{ needs.source.outputs.light_docker_count }}
        PODMAN_COUNT: ${{ needs.source.outputs.light_podman_count }}
      run: |
        test "$SOURCE_RESULT" = success
        test "$DOCKER_RESULT" = success || { test "$DOCKER_RESULT" = skipped && test "$DOCKER_COUNT" = 0; }
        test "$PODMAN_RESULT" = success || { test "$PODMAN_RESULT" = skipped && test "$PODMAN_COUNT" = 0; }
  runtime_heavy_gates_docker:
    name: Heavy · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs:
    - source
    - runtime_candidate
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success'
      && needs.source.outputs.heavy_docker_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime:
        - docker
        gate: ${{ fromJSON(needs.source.outputs.heavy_docker) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate
  runtime_heavy_gates_podman:
    name: Heavy · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs:
    - source
    - runtime_candidate
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success'
      && needs.source.outputs.heavy_podman_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime:
        - podman
        gate: ${{ fromJSON(needs.source.outputs.heavy_podman) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate
  runtime_heavy_gates:
    name: runtime heavy gates · All runtime results
    needs:
    - source
    - runtime_heavy_gates_docker
    - runtime_heavy_gates_podman
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both runtime matrices
      env:
        DOCKER_RESULT: ${{ needs.runtime_heavy_gates_docker.result }}
        PODMAN_RESULT: ${{ needs.runtime_heavy_gates_podman.result }}
        SOURCE_RESULT: ${{ needs.source.result }}
        DOCKER_COUNT: ${{ needs.source.outputs.heavy_docker_count }}
        PODMAN_COUNT: ${{ needs.source.outputs.heavy_podman_count }}
      run: |
        test "$SOURCE_RESULT" = success
        test "$DOCKER_RESULT" = success || { test "$DOCKER_RESULT" = skipped && test "$DOCKER_COUNT" = 0; }
        test "$PODMAN_RESULT" = success || { test "$PODMAN_RESULT" = skipped && test "$PODMAN_COUNT" = 0; }
  v0421_ha_groups_docker:
    name: v0.4.21 HA · ${{ matrix.group }} · ${{ matrix.runtime }}
    needs: source
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.source.outputs.ha_docker_count
      != '0' }}
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime:
        - docker
        group: ${{ fromJSON(needs.source.outputs.ha_docker) }}
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
    steps:
    - name: Checkout exact candidate
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.candidate_sha }}
    - name: Prepare verified rootless runtime
      run: bash scripts/ci-core-rootless-runtime.sh
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Reset runtime before HA group
      shell: bash
      timeout-minutes: 3
      run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"
    - name: Run grouped HA acceptance
      id: ha
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee "$RUNNER_TEMP/gate-output.log") 2>&1
        bash scripts/v0.4.21-ha-acceptance.sh "${{ matrix.group }}"
    - name: Show original assertion before cleanup
      if: failure()
