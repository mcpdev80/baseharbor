name: "Release · Pre-Release Validation"

run-name: "Pre-Release · ${{ inputs.tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.20
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
      demo_ref:
        description: Exact baseharbor-demo commit SHA to validate
        required: true
        type: string
  push:
    branches:
      - 'release-candidate/**'
      - 'validation/pre-release/**'
      - 'validation/evidence/**'

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: ${{ !startsWith(github.ref_name, 'validation/evidence/') }}
    name: Source · Contracts · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      demo_ref: ${{ steps.release.outputs.demo_ref }}
      adoption: ${{ steps.resume.outputs.adoption }}
      adoption_count: ${{ steps.resume.outputs.adoption_count }}
      static: ${{ steps.resume.outputs.static }}
      static_count: ${{ steps.resume.outputs.static_count }}
      light_docker: ${{ steps.resume.outputs.light_docker }}
      light_docker_count: ${{ steps.resume.outputs.light_docker_count }}
      light_podman: ${{ steps.resume.outputs.light_podman }}
      light_podman_count: ${{ steps.resume.outputs.light_podman_count }}
      heavy_docker: ${{ steps.resume.outputs.heavy_docker }}
      heavy_docker_count: ${{ steps.resume.outputs.heavy_docker_count }}
      heavy_podman: ${{ steps.resume.outputs.heavy_podman }}
      heavy_podman_count: ${{ steps.resume.outputs.heavy_podman_count }}
      ha_docker: ${{ steps.resume.outputs.ha_docker }}
      ha_docker_count: ${{ steps.resume.outputs.ha_docker_count }}
      ha_podman: ${{ steps.resume.outputs.ha_podman }}
      ha_podman_count: ${{ steps.resume.outputs.ha_podman_count }}
      journey: ${{ steps.resume.outputs.journey }}
      journey_count: ${{ steps.resume.outputs.journey_count }}
      integration: ${{ steps.resume.outputs.integration }}
      integration_count: ${{ steps.resume.outputs.integration_count }}

    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Enforce workflow policy
        id: workflow_policy
        run: bash scripts/ci-workflow-policy.sh

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DEMO_REF: ${{ inputs.demo_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE] or stable vMAJOR.MINOR.PATCH.HOTFIX." >&2
            exit 1
          fi

          git fetch origin main develop
          release_ref="refs/remotes/origin/release/$tag"
          git fetch origin "refs/heads/release/$tag:$release_ref" || true
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "Candidate follows the current develop release line."
          elif git merge-base --is-ancestor origin/main HEAD; then
            echo "Candidate follows the current released main line."
          elif git show-ref --verify --quiet "$release_ref" && [ "$(git rev-parse "$release_ref")" = "$(git rev-parse HEAD)" ]; then
            echo "Candidate exactly matches the current release/$tag branch tip."
          else
            echo "Pre-release candidate must follow current develop/main or exactly match release/$tag." >&2
            exit 1
          fi

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          demo_ref_file="docs/releases/${tag}.demo-ref"
          test -s "$demo_ref_file" || {
            echo "Exact demo revision file is missing: $demo_ref_file" >&2
            exit 1
          }
          pinned_demo_ref="$(tr -d '[:space:]' < "$demo_ref_file")"
          [[ "$pinned_demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Pinned demo revision must be an exact 40-character commit SHA, got: $pinned_demo_ref" >&2
            exit 1
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Demo revision must be an exact 40-character commit SHA, got: $INPUT_DEMO_REF" >&2
              exit 1
            }
            test "$INPUT_DEMO_REF" = "$pinned_demo_ref" || {
              echo "Requested demo revision does not match $demo_ref_file." >&2
              exit 1
            }
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "demo_ref=$pinned_demo_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install validation tooling
        id: tooling
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec contracts)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Validate source readability
        id: source_readability
        run: bash scripts/source-readability-audit.sh

      - name: Validate partial-rerun evidence selection
        run: |
          python scripts/test_select_evidence_attempts.py
          python scripts/test_verify_journey_evidence.py
          python scripts/test_verify_attempt_bindings.py
          python scripts/test_ci_assertion_summary.py
          python scripts/test_ci_run_metrics.py
          python scripts/test_pre_release_resume.py
          python scripts/test_private_consumer_evidence.py
          python scripts/test_private_integration_producer.py
          python scripts/test_pre_release_integration.py

      - name: Run release-source tests
        id: source_tests
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/pre-release-source-logs"
          mkdir -p "$logs"
          go test ./contracts/... ./internal/... ./spec/... ./conformance/... 2>&1 | tee "$logs/go-test-internal-spec.log"
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha 2>&1 | tee "$logs/go-test-cmd-baha.log"
          go vet ./... 2>&1 | tee "$logs/go-vet.log"

      - name: Validate documentation
        id: docs
        shell: bash
        run: |
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate v0.4.20 release-note hygiene
        id: v0420_hygiene
        if: steps.release.outputs.tag == 'v0.4.20'
        shell: bash
        run: |
          set -euo pipefail
          release_internal="$(
            grep -n -Ei 'corpus|unit test|conformance|schema_version|fingerprint|adapter v1|candidate sha|gofmt|go test|go vet|implementation evidence|validation|CI gate' docs/releases/v0.4.20.md || true
          )"
          test -z "$release_internal" || {
            echo "Internal validation detail leaked into user-facing release notes:" >&2
            echo "$release_internal" >&2
            exit 1
          }

      - name: Validate v0.4.21 release readiness
        id: v0421_readiness
        if: steps.release.outputs.tag == 'v0.4.21'
        shell: bash
        run: bash scripts/v0.4.21-readiness.sh

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: "$RUNNER_TEMP/bin/actionlint -shellcheck="

      - name: Build release snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        id: snapshot_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build exact candidate binary
        id: candidate_binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-release-candidate"
          CGO_ENABLED=0 go build -trimpath             -ldflags="-s -w -X main.version=${{ steps.release.outputs.tag }} -X main.commit=${{ steps.release.outputs.candidate_sha }} -X main.date=unknown"             -o "$RUNNER_TEMP/pre-release-candidate/baha" ./cmd/baha
          "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ steps.release.outputs.candidate_sha }}"

      - name: Upload source candidate
        id: source_candidate
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-source-candidate
          path: ${{ runner.temp }}/pre-release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Resolve reusable gate evidence
        id: resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASEHARBOR_PRIVATE_EVIDENCE_JSON: ${{ secrets.BASEHARBOR_PRIVATE_EVIDENCE_PINS }}
          BASEHARBOR_PRIVATE_EVIDENCE_TOKEN: ${{ secrets.BASEHARBOR_PRIVATE_EVIDENCE_TOKEN }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          DEMO_REF: ${{ steps.release.outputs.demo_ref }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$RUNNER_TEMP/resume-demo"
          python scripts/pre-release-resume.py plan --candidate "$CANDIDATE_SHA" --demo "$DEMO_REF" --tag "$TAG" \
            --demo-repo "$RUNNER_TEMP/resume-demo" --runs "docs/releases/$TAG.evidence-runs" \
            --output "$RUNNER_TEMP/evidence-plan" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload authenticated evidence plan
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-evidence-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence-plan
          if-no-files-found: error
          retention-days: 30

      - name: Generate source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/pre-release-source-evidence.tsv"
          cat >"$rows" <<EOF
          Candidate resolution	${{ steps.release.outcome }}	release metadata, exact candidate SHA and pinned demo SHA
          Workflow policy	${{ steps.workflow_policy.outcome }}	fixed reviewed workflow surface
          Go formatting	${{ steps.formatting.outcome }}	gofmt cmd internal spec contracts
          Source readability	${{ steps.source_readability.outcome }}	production source guard
          Release-source tests	${{ steps.source_tests.outcome }}	unit/package tests and vet
          Documentation	${{ steps.docs.outcome }}	strict EN/DE docs and audit
          v0.4.20 release-note hygiene	${{ steps.v0420_hygiene.outcome }}	user-facing release notes exclude internal validation details
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint
          Release snapshot	${{ steps.snapshot.outcome }}	GoReleaser snapshot
          Snapshot verification	${{ steps.snapshot_verify.outcome }}	linux amd64/arm64 archives
          Candidate binary	${{ steps.candidate_binary.outcome }}	exact SHA-stamped binary
          Source candidate	${{ steps.source_candidate.outcome }}	shared binary for static/runtime gates
          EOF
          mkdir -p "$RUNNER_TEMP/pre-release-source-evidence/source-logs"
          cp -a "$RUNNER_TEMP/pre-release-source-logs/." "$RUNNER_TEMP/pre-release-source-evidence/source-logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/pre-release-source-evidence"             "BaseHarbor Source Pre-Release Evidence"             "pre-release/source"             "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"             "${{ steps.release.outputs.candidate_sha || github.sha }}"             "$rows"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-source-evidence
          if-no-files-found: error
          retention-days: 30


  runtime_candidate:
    name: Candidate · Runtime Image
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.candidate_sha }}

      - name: Reset Docker runner state
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Download source candidate
        uses: actions/download-artifact@v6
        with:
          name: pre-release-source-candidate
          path: ${{ runner.temp }}/pre-release-candidate

      - name: Build runtime image once
        id: runtime_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: localhost/baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ needs.source.outputs.tag }}
            COMMIT=${{ needs.source.outputs.candidate_sha }}

      - name: Export runtime image
        id: export
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect localhost/baseharbor-runtime:pre-release >/dev/null
          docker save localhost/baseharbor-runtime:pre-release             -o "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
          test -s "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"

      - name: Upload shared runtime candidate
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-runtime-candidate
          path: ${{ runner.temp }}/pre-release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup Docker runner state
        if: always()
        run: bash scripts/ci-runtime-reset.sh docker

  adoption:
    if: ${{ needs.source.result == 'success' && needs.source.outputs.adoption_count != '0' }}
    name: Adoption · ${{ matrix.gate }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gate: ${{ fromJSON(needs.source.outputs.adoption) }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.candidate_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run adoption gate
        id: adoption_gate
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          case "$GATE" in
            conformance)
              go test ./internal/repositoryinspect -run 'TestAdoptionConformanceCorpus|TestInspectionBudget|TestCollectSnapshotSkips|TestKubernetesDocumentLimit|TestWorkloadSourceCrossSourceSemanticParity|TestWorkloadSourceResolution' -count=1
              legacy="$(
                find cmd internal docs -type f \( -name '*.go' -o -name '*.md' -o -name '*.yaml' -o -name '*.yml' \) -print0 |
                  xargs -0 grep -n -E -- '--workload-compose|--workload-service|workload\\.compose|workload\\.services|Manifest\\.Workload\\.(Compose|Services)' || true
              )"
              if [ -n "$legacy" ]; then
                echo "$legacy" >&2
                exit 1
              fi
              ;;
            realworld-compose)
              go build -trimpath -o /tmp/baha ./cmd/baha
              BAHA=/tmp/baha CORPUS_CATEGORY=compose bash scripts/realworld-workload-source-corpus.sh
              ;;
            realworld-quadlet)
              go build -trimpath -o /tmp/baha ./cmd/baha
              BAHA=/tmp/baha CORPUS_CATEGORY=quadlet bash scripts/realworld-workload-source-corpus.sh
              ;;
            realworld-kubernetes)
              go build -trimpath -o /tmp/baha ./cmd/baha
              BAHA=/tmp/baha CORPUS_CATEGORY=kubernetes bash scripts/realworld-workload-source-corpus.sh
              ;;
          esac

      - name: Generate adoption evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/adoption-evidence"
          mkdir -p "$out"
          if [ -f "$RUNNER_TEMP/assertion-summary.json" ]; then cp "$RUNNER_TEMP/assertion-summary.json" "$out/"; fi
          jq -n \
            --arg schema "baseharbor.pre-release.adoption-evidence/v1" \
            --arg gate "${{ matrix.gate }}" \
            --arg candidate_sha "${{ needs.source.outputs.candidate_sha }}" \
            --arg outcome "${{ steps.adoption_gate.outcome }}" \
            --arg demo_ref "${{ needs.source.outputs.demo_ref }}" \
            --arg cleanup_outcome "${{ 'skipped' }}" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: $schema,
              gate: $gate,
              candidate_sha: $candidate_sha,
              outcome: $outcome,
              demo_ref: $demo_ref,
              cleanup_outcome: $cleanup_outcome,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt
            }' > "$out/manifest.json"

      - name: Upload adoption evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-adoption-${{ matrix.gate }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adoption-evidence
          if-no-files-found: error
          retention-days: 30

  static_gates:
    name: Static · ${{ matrix.gate }}
    needs: source
    if: ${{ needs.source.result == 'success' && needs.source.outputs.static_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        gate: ${{ fromJSON(needs.source.outputs.static) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: static
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-source-candidate

  runtime_light_gates_docker:
    name: Light · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs: [source, runtime_candidate]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success' && needs.source.outputs.light_docker_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: [docker]
        gate: ${{ fromJSON(needs.source.outputs.light_docker) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate

  runtime_light_gates_podman:
    name: Light · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs: [source, runtime_candidate]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success' && needs.source.outputs.light_podman_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: [podman]
        gate: ${{ fromJSON(needs.source.outputs.light_podman) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate

  runtime_light_gates:
    name: runtime light gates · All runtime results
    needs: [source, runtime_light_gates_docker, runtime_light_gates_podman]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both runtime matrices
        env:
          DOCKER_RESULT: ${{ needs.runtime_light_gates_docker.result }}
          PODMAN_RESULT: ${{ needs.runtime_light_gates_podman.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DOCKER_COUNT: ${{ needs.source.outputs.light_docker_count }}
          PODMAN_COUNT: ${{ needs.source.outputs.light_podman_count }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$DOCKER_RESULT" = success || { test "$DOCKER_RESULT" = skipped && test "$DOCKER_COUNT" = 0; }
          test "$PODMAN_RESULT" = success || { test "$PODMAN_RESULT" = skipped && test "$PODMAN_COUNT" = 0; }

  runtime_heavy_gates_docker:
    name: Heavy · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs: [source, runtime_candidate, reference_journey, runtime_light_gates]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success' && needs.source.outputs.heavy_docker_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: [docker]
        gate: ${{ fromJSON(needs.source.outputs.heavy_docker) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate

  runtime_heavy_gates_podman:
    name: Heavy · ${{ matrix.runtime }} · ${{ matrix.gate }}
    needs: [source, runtime_candidate, reference_journey, runtime_light_gates]
    if: ${{ always() && !cancelled() && needs.source.result == 'success' && needs.runtime_candidate.result == 'success' && needs.source.outputs.heavy_podman_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: [podman]
        gate: ${{ fromJSON(needs.source.outputs.heavy_podman) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ needs.source.outputs.candidate_sha }}
      demo_ref: ${{ needs.source.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      candidate_artifact: pre-release-runtime-candidate

  runtime_heavy_gates:
    name: runtime heavy gates · All runtime results
    needs: [source, runtime_heavy_gates_docker, runtime_heavy_gates_podman]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both runtime matrices
        env:
          DOCKER_RESULT: ${{ needs.runtime_heavy_gates_docker.result }}
          PODMAN_RESULT: ${{ needs.runtime_heavy_gates_podman.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DOCKER_COUNT: ${{ needs.source.outputs.heavy_docker_count }}
          PODMAN_COUNT: ${{ needs.source.outputs.heavy_podman_count }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$DOCKER_RESULT" = success || { test "$DOCKER_RESULT" = skipped && test "$DOCKER_COUNT" = 0; }
          test "$PODMAN_RESULT" = success || { test "$PODMAN_RESULT" = skipped && test "$PODMAN_COUNT" = 0; }

  v0421_ha_groups_docker:
    name: v0.4.21 HA · ${{ matrix.group }} · ${{ matrix.runtime }}
    needs: [source, runtime_heavy_gates]
