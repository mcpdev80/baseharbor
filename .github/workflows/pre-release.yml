    name: Integration · integration/static/live-console
    needs: source
    if: ${{ needs.source.result == 'success' && contains(fromJSON(needs.source.outputs.integration), 'integration/static/live-console')
      }}
    steps:
    - name: Validate immutable consumer inputs
      env:
        CORE: ${{ needs.source.outputs.candidate_sha }}
        CONSOLE: ${{ needs.source.outputs.console_ref }}
        CONNECTOR: ${{ needs.source.outputs.consumer_ref }}
        DEMO: ${{ needs.source.outputs.demo_ref }}
      working-directory: .
      run: |
        set -euo pipefail
        for sha in "$CORE" "$CONSOLE" "$CONNECTOR" "$DEMO"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
    - name: Checkout exact Connector
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source.outputs.consumer_ref }}
        persist-credentials: false
        repository: mcpdev80/baseharbor-node-connector
        path: consumer-connector
    - name: Checkout exact normal Console qualification harness
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: mcpdev80/baseharbor-console
        ref: ${{ needs.source.outputs.console_ref }}
        path: consumer-console
        persist-credentials: false
    - name: Bind isolated fixture directory
      run: echo "BASEHARBOR_BROWSER_FIXTURE=$RUNNER_TEMP/baseharbor-browser" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: mcpdev80/baseharbor
        ref: ${{ needs.source.outputs.candidate_sha }}
        path: consumer-console/.browser-core-source
        persist-credentials: false
    - name: Checkout exact reference Demo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: mcpdev80/baseharbor-demo
        ref: ${{ needs.source.outputs.demo_ref }}
        path: consumer-console/.release-demo-source
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.2
        cache: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24.14.0
    - name: Install exact consumer dependencies
      run: npm ci --no-audit --no-fund
    - name: Check browser candidate source and fixture syntax
      run: |
        npm run check
        node --check scripts/browser/prepare-realm.mjs
        node --check scripts/browser/https-proxy.mjs
        node --check scripts/browser/live-browser.mjs
        node --check scripts/browser/application-journey.mjs
        bash -n scripts/browser/start-fixture.sh
        bash -n scripts/browser/stop-fixture.sh
        bash -n scripts/browser/start-terminal-fixture.sh
    - name: Build Console with the actual HTTPS authority
      run: npm run build
    - name: Install pinned browser runner
      run: |
        npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
        npx playwright install --with-deps chromium
    - name: Prepare verified rootless Docker
      env:
        BASEHARBOR_TEST_RUNTIME: docker
      run: bash .browser-core-source/scripts/ci-core-rootless-runtime.sh
    - name: Build exact Core runtime and warm its declared provider images
      shell: bash
      run: |
        set -euo pipefail
        image="localhost/baseharbor-runtime:browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker build -f .browser-core-source/deploy/control-plane/Dockerfile -t "$image" .browser-core-source
        echo "BASEHARBOR_RUNTIME_IMAGE=$image" >> "$GITHUB_ENV"
        awk '/^[[:space:]]+image:/ {print $2}' .browser-core-source/internal/runtime/assets/compose-single.yaml | sort -u | while read -r provider; do docker pull "$provider"; done
    - name: Pin the repository's native Keycloak image
      shell: bash
      run: |
        set -euo pipefail
        identity="$(awk '/KeycloakImage[[:space:]]*=/ {gsub(/"/,"",$3);print $3}' .browser-core-source/internal/identityprovider/keycloak_files.go)"
        [[ "$identity" =~ ^quay.io/keycloak/keycloak:26[.]8[.]0@sha256:[0-9a-f]{64}$ ]]
        docker pull "$identity"
        image="quay.io/keycloak/keycloak@${identity##*@}"
        echo "BASEHARBOR_BROWSER_KEYCLOAK_IMAGE=$image" >> "$GITHUB_ENV"
    - name: Build exact Connector and pin remote workload
      shell: bash
      run: |
        set -euo pipefail
        binary="$RUNNER_TEMP/baseharbor-node-connector"
        (cd "$GITHUB_WORKSPACE/consumer-connector"; go build -trimpath -o "$binary" ./cmd/baseharbor-node-connector)
        echo "BASEHARBOR_TEST_CONNECTOR_BIN=$binary" >> "$GITHUB_ENV"
        "$BASEHARBOR_CONNECTOR_RUNTIME_KIND" pull docker.io/library/alpine:3.23
        image="$("$BASEHARBOR_CONNECTOR_RUNTIME_KIND" image inspect docker.io/library/alpine:3.23 --format '{{index .RepoDigests 0}}')"
        [[ "$image" == *@sha256:* ]]
        echo "BASEHARBOR_CONNECTOR_RUNTIME_IMAGE=$image" >> "$GITHUB_ENV"
    - name: Prepare generated SQL native provider
      shell: bash
      run: |
        set -euo pipefail
        "$BASEHARBOR_CONNECTOR_RUNTIME_KIND" pull docker.io/library/postgres:18-alpine
        image="$("$BASEHARBOR_CONNECTOR_RUNTIME_KIND" image inspect docker.io/library/postgres:18-alpine --format '{{index .RepoDigests 0}}')"
        [[ "$image" == *@sha256:* ]]
        echo "BASEHARBOR_CONNECTOR_SQL_IMAGE=$image" >> "$GITHUB_ENV"
    - name: Pin actual reference Identity for operator authorization
      shell: bash
      run: |
        set -euo pipefail
        identity="$(awk '/KeycloakImage[[:space:]]*=/ {gsub(/"/,"",$3);print $3}' .browser-core-source/internal/identityprovider/keycloak_files.go)"
        [[ "$identity" =~ ^quay.io/keycloak/keycloak:26[.]8[.]0@sha256:[0-9a-f]{64}$ ]]
        "$BASEHARBOR_CONNECTOR_RUNTIME_KIND" pull "$identity"
        image="quay.io/keycloak/keycloak@${identity##*@}"
        echo "BASEHARBOR_CONNECTOR_IDENTITY_IMAGE=$image" >> "$GITHUB_ENV"
    - name: Prepare actual isolated OpenBao and PostgreSQL authority
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y postgresql
        sudo systemctl start postgresql
        sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE baseharbor_fixture LOGIN PASSWORD 'fixture-native-pki-only';"
        sudo -u postgres createdb --owner=baseharbor_fixture baseharbor_native_pki_fixture
        echo '127.0.0.1 openbao-member-1' | sudo tee -a /etc/hosts >/dev/null
        mkdir -p "$RUNNER_TEMP/native-bao-bin"
        curl --fail --location --retry 3 https://github.com/openbao/openbao/releases/download/v2.7.0/openbao_2.7.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/openbao.tar.gz"
        echo "c3ab5de9e778223445487ccbfb16c291bf491642b688f3a3df5aeba23d9b3667  $RUNNER_TEMP/openbao.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/openbao.tar.gz" -C "$RUNNER_TEMP/native-bao-bin"
        echo "$RUNNER_TEMP/native-bao-bin" >> "$GITHUB_PATH"
    - name: Exercise production managed enrollment with actual outbound Connector
      id: native
      working-directory: consumer-console/.browser-core-source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = $BASEHARBOR_BROWSER_CORE_COMMIT
        go test -race ./internal/openbao -run '^TestNativeOpenBaoManagedCoreAndNodeCSRRotation$' -count=1 -v | tee "$RUNNER_TEMP/enrollment.log"
        python3 - <<'PY'
        import os,pathlib
        log=pathlib.Path(os.environ['RUNNER_TEMP'],'enrollment.log').read_text()
        assert 'actual Keycloak operator authorization/denials, Connector managed enrollment' in log, 'actual operator enrollment proof was not completed'
        assert 'managed Core project staging, apply, observed running state, repair and destroy preserved foreign fixture' in log, 'managed Core project realization was not completed'
        assert 'actual enrolled Core-managed provider snapshot publish-restore-apply-repair-destroy preserved immutable TLS source' in log, 'scoped managed provider adapter was not qualified'
        assert 'managed generated SQL project preserved protected TLS material, native UID 70, verified TLS SELECT 1 and immutable repair; owned containers destroyed and foreign fixture preserved' in log, 'generated remote SQL was not qualified'
        assert 'protected deployment registry round-trip restored the same immutable SQL project without restaging' in log, 'durable generated SQL project was not qualified'
        assert 'private Core publication snapshot restored SQL repair and owned teardown after original Core source changed; exact registry receipt retained; full Application engine not qualified' in log, 'private immutable publication restoration was not qualified'
        assert 'fresh execution-node memory evidence obtained over exact enrolled scope; Core-host fallback not used' in log, 'authenticated node capacity evidence was not qualified'
        assert 'actual enrolled remote Application engine published provider and prebuilt repository workload together, verified TLS SQL before workload activation, detected lost workload, restored immutable source for repair without restarting provider, verified status and owned reset/cleanup with foreign preservation; complete operator HTTP and Console journey not qualified' in log, 'remote Application engine was not qualified'
        if os.environ['BASEHARBOR_CONNECTOR_RUNTIME_KIND'] == 'docker':
            assert 'actual enrolled Docker immutable project activated provider before workload and repaired workload without restarting provider' in log, 'selected application activation phases were not qualified'
        if os.environ['BASEHARBOR_CONNECTOR_RUNTIME_KIND'] == 'podman':
            assert 'ordinary generated SQL destroy/reapply reused the exact owned data volume and verified TLS SELECT 1' in log, 'retained Podman SQL provider reuse was not qualified'
            assert 'actual enrolled rootless Quadlet graph published both units before activation, started dependency before application' in log, 'dependency graph activation was not qualified'
            assert 'actual enrolled rootless Quadlet completion verified current source over mTLS, restored exact commitment, denied changed, failed, unstarted and removed units' in log, 'authenticated source-bound completion was not qualified'
            assert 'actual enrolled Podman explicit owned SQL data reset removed exact provider volume, verified absence and reconciled retry without starting containers' in log, 'owned Podman data reset was not qualified'
            assert 'actual enrolled rootless Core-managed init graph has no default-target automatic activation' in log, 'Core managed activation was not qualified'
            assert 'actual enrolled rootless generated init graph verified exact completion before dependent activation, refused failed init without activating application, did not rerun successful init' in log, 'generated init dependency sequencing was not qualified'
        PY
    - name: Verify exact runtime fixture cleanup
      id: native_cleanup
      run: test -z "$("$BASEHARBOR_CONNECTOR_RUNTIME_KIND" ps -aq --filter label=baseharbor.enrollment-qualification=true)"
    - name: Start native Core and real issuer
      run: bash scripts/browser/start-fixture.sh
    - name: Start built Console
      shell: bash
      run: |
        set -euo pipefail
        npm run start -- --hostname 127.0.0.1 --port 13000 > "$BASEHARBOR_BROWSER_FIXTURE/next.log" 2>&1 &
        echo "$!" > "$BASEHARBOR_BROWSER_FIXTURE/next.pid"
        ready=false
        for attempt in $(seq 1 60); do
          if curl --silent --fail http://127.0.0.1:13000/applications >/dev/null; then ready=true; break; fi
          sleep 1
        done
        $ready
    - name: Run actual Chromium login and live-read checks
      run: node scripts/browser/live-browser.mjs
    - name: Stop owned test services and remove generated private keys
      if: always()
      run: bash scripts/browser/stop-fixture.sh
  checks:
    name: Pre-Release Checks
    needs:
    - source
    - runtime_candidate
    - adoption
    - static_gates
    - runtime_light_gates_docker
    - runtime_light_gates_podman
    - runtime_light_gates
    - runtime_heavy_gates_docker
    - runtime_heavy_gates_podman
    - runtime_heavy_gates
    - v0421_ha_groups_docker
    - v0421_ha_groups_podman
    - v0421_ha_groups
    - reference_journey
    - integration_public_contracts
    - integration_configuration_policy
    - integration_browser_terminal
    - integration_core_docker
    - integration_core_podman
    - integration_coreless_docker
    - integration_coreless_podman
    - integration_remote_target_docker
    - integration_remote_target_podman
    - integration_live_console
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require selected checks to succeed
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYTHON'
        import json, os
        jobs = json.loads(os.environ['JOB_RESULTS'])
        source = jobs['source']
        assert source['result'] == 'success', 'source checks failed'
        out = source['outputs']
        required = {'source', 'runtime_light_gates', 'runtime_heavy_gates', 'v0421_ha_groups'}
        for key, count in [('adoption','adoption_count'), ('static_gates','static_count'),
                           ('runtime_light_gates_docker','light_docker_count'), ('runtime_light_gates_podman','light_podman_count'),
                           ('runtime_heavy_gates_docker','heavy_docker_count'), ('runtime_heavy_gates_podman','heavy_podman_count'),
                           ('v0421_ha_groups_docker','ha_docker_count'), ('v0421_ha_groups_podman','ha_podman_count'),
                           ('reference_journey','journey_count')]:
            value = int(out[count])
            assert value >= 0, 'invalid selected count'
            if value: required.add(key)
        if any(int(out[key]) for key in ['light_docker_count','light_podman_count','heavy_docker_count','heavy_podman_count','journey_count']):
            required.add('runtime_candidate')
        for gate in json.loads(out['integration']):
            _, runtime, name = gate.split('/')
            key = {'core-bootstrap':'core', 'coreless-lifecycle':'coreless', 'remote-target':'remote_target'}.get(name)
            required.add('integration_' + key + '_' + runtime if key else 'integration_' + name.replace('-','_'))
        assert required <= jobs.keys(), 'selected check has no job'
        for key, job in jobs.items():
            expected = 'success' if key in required else 'skipped'
            assert job['result'] == expected, key + ': expected ' + expected + ', got ' + job['result']
        print('All selected Pre-Release checks passed.')
        PYTHON
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.20
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
      demo_ref:
        description: Exact baseharbor-demo commit SHA to validate
        required: true
        type: string
      consumer_ref:
        description: Optional exact Connector candidate SHA; defaults to the reviewed integration branch
        required: false
        default: ''
        type: string
      only_gates:
        description: Optional comma-separated exact check IDs for targeted execution
        required: false
        default: ''
        type: string
  push:
    branches:
    - release-candidate/**
    - validation/pre-release/**
  workflow_call:
    inputs:
      develop_mode:
        description: Run exact-source develop acceptance using existing consumer integration gates
        required: false
        default: false
        type: boolean
      console_ref:
        description: Exact Console SHA (required for develop acceptance)
        required: false
        default: ''
        type: string
      tag:
        required: true
        type: string
      ref:
        required: true
        type: string
      demo_ref:
        required: true
        type: string
      consumer_ref:
        required: false
        default: ''
        type: string
      only_gates:
        required: false
        default: ''
        type: string
