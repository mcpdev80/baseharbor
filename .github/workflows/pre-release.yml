name: "Release · Pre-Release Validation"

run-name: "Pre-Release · ${{ inputs.tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.17 or v0.4.17.1
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
      demo_ref:
        description: Exact baseharbor-demo commit SHA to validate
        required: true
        type: string
  push:
    branches:
      - 'release-candidate/**'
      - 'validation/pre-release/**'

permissions:
  contents: read

jobs:
  validate:
    name: Source · Build & Contracts
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/release-candidate/') || startsWith(github.ref, 'refs/heads/validation/pre-release/')) || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      demo_ref: ${{ steps.release.outputs.demo_ref }}

    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
          fetch-depth: 0

      - name: Reset persistent runner state
        id: reset
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DEMO_REF: ${{ inputs.demo_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE] or stable vMAJOR.MINOR.PATCH.HOTFIX." >&2
            exit 1
          fi

          git fetch origin main develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo "Candidate follows the normal develop release line."
          elif git merge-base --is-ancestor origin/main HEAD; then
            echo "Candidate follows the released main hotfix line."
          else
            echo "Pre-release candidate must either be contained in develop or descend from released main." >&2
            exit 1
          fi

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          demo_ref_file="docs/releases/${tag}.demo-ref"
          test -s "$demo_ref_file" || {
            echo "Exact demo revision file is missing: $demo_ref_file" >&2
            exit 1
          }
          pinned_demo_ref="$(tr -d '[:space:]' < "$demo_ref_file")"
          [[ "$pinned_demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Pinned demo revision must be an exact 40-character commit SHA, got: $pinned_demo_ref" >&2
            exit 1
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Demo revision must be an exact 40-character commit SHA, got: $INPUT_DEMO_REF" >&2
              exit 1
            }
            if [ "$INPUT_DEMO_REF" != "$pinned_demo_ref" ]; then
              echo "Requested demo revision does not match $demo_ref_file." >&2
              echo "requested: $INPUT_DEMO_REF" >&2
              echo "pinned:    $pinned_demo_ref" >&2
              exit 1
            fi
          fi
          demo_ref="$pinned_demo_ref"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "demo_ref=$demo_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Validate source readability
        id: source_readability
        run: bash scripts/source-readability-audit.sh

      - name: Run release-source tests
        id: source_tests
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/pre-release-source-logs"
          mkdir -p "$logs"
          go test ./internal/... ./spec/... 2>&1 | tee "$logs/go-test-internal-spec.log"
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha 2>&1 | tee "$logs/go-test-cmd-baha.log"
          go vet ./... 2>&1 | tee "$logs/go-vet.log"
          go build ./cmd/baha 2>&1 | tee "$logs/go-build.log"

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Validate documentation
        id: docs
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Build release snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        id: snapshot_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build pre-release candidate binary
        id: candidate_binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-release-candidate"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.release.outputs.tag }} -X main.commit=${{ steps.release.outputs.candidate_sha }} -X main.date=unknown" \
            -o "$RUNNER_TEMP/pre-release-candidate/baha" ./cmd/baha
          "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ steps.release.outputs.candidate_sha }}"

      - name: Build runtime image without publishing
        id: runtime_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: localhost/baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.candidate_sha }}

      - name: Export reusable runtime candidate
        id: candidate_export
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect localhost/baseharbor-runtime:pre-release >/dev/null
          docker save localhost/baseharbor-runtime:pre-release \
            -o "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"
          test -s "$RUNNER_TEMP/pre-release-candidate/baseharbor-runtime-pre-release.tar"

      - name: Upload reusable runtime candidate
        id: candidate_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pre-release-runtime-candidate
          path: ${{ runner.temp }}/pre-release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup persistent runner state
        id: cleanup
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Generate Source/Build pre-release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/pre-release-source-evidence.tsv"
          cat >"$rows" <<EOF
          Candidate resolution	${{ steps.release.outcome }}	release tag, changelog, release notes, exact demo SHA and develop/main-hotfix ancestry
          Go formatting	${{ steps.formatting.outcome }}	gofmt cmd internal spec
          Source readability	${{ steps.source_readability.outcome }}	production file/function size guard
          Release-source tests	${{ steps.source_tests.outcome }}	unit/package tests, vet and CLI build
          Documentation	${{ steps.docs.outcome }}	strict EN/DE MkDocs builds plus documentation architecture audit
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint
          Release snapshot	${{ steps.snapshot.outcome }}	GoReleaser snapshot
          Snapshot verification	${{ steps.snapshot_verify.outcome }}	linux amd64/arm64 archives and checksums
          Candidate binary	${{ steps.candidate_binary.outcome }}	linux/amd64 baha binary stamped with exact candidate commit
          Runtime image build	${{ steps.runtime_image.outcome }}	linux/amd64 runtime image built once and loaded locally
          Candidate export	${{ steps.candidate_export.outcome }}	runtime image exported once for all four runtime workers
          Candidate upload	${{ steps.candidate_upload.outcome }}	prebuilt binary and runtime image shared with runtime suites
          Runner cleanup	${{ steps.cleanup.outcome }}	persistent Docker runner reset
          EOF
          mkdir -p "$RUNNER_TEMP/pre-release-evidence/source-logs"
          cp -a "$RUNNER_TEMP/pre-release-source-logs/." "$RUNNER_TEMP/pre-release-evidence/source-logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/pre-release-evidence" \
            "BaseHarbor Source/Build Pre-Release Evidence" \
            "pre-release/source-build" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}" \
            "${{ steps.release.outputs.candidate_sha || github.sha }}" \
            "$rows"

      - name: Upload Source/Build pre-release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pre-release-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-evidence
          if-no-files-found: error
          retention-days: 1


  docker_normal:
    name: Docker · Core Journey
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/release-candidate/') || startsWith(github.ref, 'refs/heads/validation/pre-release/')) || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
      demo_ref: ${{ needs.validate.outputs.demo_ref }}
      runtime: docker
      suite: normal

  docker_operations:
    name: Docker · Operations
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/release-candidate/') || startsWith(github.ref, 'refs/heads/validation/pre-release/')) || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
      demo_ref: ${{ needs.validate.outputs.demo_ref }}
      runtime: docker
      suite: operations

  podman_normal:
    name: Podman · Core Journey
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/release-candidate/') || startsWith(github.ref, 'refs/heads/validation/pre-release/')) || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
      demo_ref: ${{ needs.validate.outputs.demo_ref }}
      runtime: podman
      suite: normal

  podman_operations:
    name: Podman · Operations
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/heads/release-candidate/') || startsWith(github.ref, 'refs/heads/validation/pre-release/')) || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
      demo_ref: ${{ needs.validate.outputs.demo_ref }}
      runtime: podman
      suite: operations
