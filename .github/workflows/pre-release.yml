name: pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.14
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - 'release-candidate/**'

permissions:
  contents: read

jobs:
  validate:
    name: pre-release-validation
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 75

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
          fetch-depth: 0

      - name: Reset persistent runner state
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be valid SemVer with a v prefix." >&2
            exit 1
          fi

          git fetch origin develop
          git merge-base --is-ancestor HEAD origin/develop || {
            echo "Pre-release candidate must be contained in develop." >&2
            exit 1
          }

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run release-source tests
        run: |
          go test ./internal/... ./spec/...
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha
          go vet ./...
          go build ./cmd/baha

      - name: Run runtime integration tests serially
        env:
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
        run: go test -p 1 ./cmd/baha ./internal/application -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestMultiInstanceComposeLifecycleInCI)$' -count=1 -v

      - name: Verify control-plane recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real workload log ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real trace ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Validate documentation
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml

      - name: Validate workflow syntax
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build runtime image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          tags: baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.candidate_sha }}

      - name: Run external demo acceptance against candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          ARTIFACT_DIR: /tmp/baseharbor-demo-acceptance
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-demo
          cd /tmp/baseharbor-demo
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Pre-release summary
        shell: bash
        run: |
          echo "Pre-release gate passed."
          echo "tag=${{ steps.release.outputs.tag }}"
          echo "sha=${{ steps.release.outputs.candidate_sha }}"
          echo "external_demo_acceptance=PASS"

      - name: Cleanup persistent runner state
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker
