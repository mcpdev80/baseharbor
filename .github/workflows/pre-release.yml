        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v0421-ha-evidence"
          mkdir -p "$out"
          if [ -f "$RUNNER_TEMP/assertion-summary.json" ]; then cp "$RUNNER_TEMP/assertion-summary.json" "$out/"; fi
          jq -n \
            --arg schema "baseharbor.pre-release.v0.4.21-ha-evidence/v1" \
            --arg group "${{ matrix.group }}" \
            --arg runtime "${{ matrix.runtime }}" \
            --arg candidate_sha "${{ needs.source.outputs.candidate_sha }}" \
            --arg outcome "${{ steps.ha.outcome }}" \
            --arg demo_ref "${{ needs.source.outputs.demo_ref }}" \
            --arg cleanup_outcome "${{ steps.cleanup.outcome }}" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: $schema,
              group: $group,
              runtime: $runtime,
              candidate_sha: $candidate_sha,
              outcome: $outcome,
              demo_ref: $demo_ref,
              cleanup_outcome: $cleanup_outcome,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt
            }' > "$out/manifest.json"

      - name: Upload HA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-v0421-ha-${{ matrix.runtime }}-${{ matrix.group }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v0421-ha-evidence
          if-no-files-found: error
