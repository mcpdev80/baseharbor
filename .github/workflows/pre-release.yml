name: "Release · Pre-Release Validation"

run-name: "Pre-Release · ${{ inputs.tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.14
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
  push:
    branches:
      - 'release-candidate/**'

permissions:
  contents: read

jobs:
  validate:
    name: pre-release-source-build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}

    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
          fetch-depth: 0

      - name: Reset persistent runner state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be valid SemVer with a v prefix." >&2
            exit 1
          fi

          git fetch origin develop
          git merge-base --is-ancestor HEAD origin/develop || {
            echo "Pre-release candidate must be contained in develop." >&2
            exit 1
          }

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run release-source tests
        id: source_tests
        run: |
          go test ./internal/... ./spec/...
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha
          go vet ./...
          go build ./cmd/baha

      - name: Verify control-plane restart and operator-held unseal recovery
        id: recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real Loki and Alloy workload log ingestion
        id: log_ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real OpenTelemetry to Tempo trace ingestion
        id: trace_ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate documentation
        id: docs
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Build release snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        id: snapshot_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build runtime image without publishing
        id: runtime_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          tags: baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.candidate_sha }}

      - name: Cleanup persistent runner state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Generate Source/Build pre-release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/pre-release-source-evidence.tsv"
          cat >"$rows" <<EOF
          Candidate resolution	${{ steps.release.outcome }}	SemVer, changelog, release notes and develop ancestry
          Go formatting	${{ steps.formatting.outcome }}	gofmt cmd internal spec
          Release-source tests	${{ steps.source_tests.outcome }}	unit/package tests, vet and CLI build
          Control-plane recovery	${{ steps.recovery.outcome }}	operator-held unseal recovery
          Log ingestion	${{ steps.log_ingestion.outcome }}	managed Loki and Alloy ingestion
          Trace ingestion	${{ steps.trace_ingestion.outcome }}	OpenTelemetry to managed Tempo
          Documentation	${{ steps.docs.outcome }}	strict EN/DE MkDocs builds plus documentation architecture audit
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint
          Release snapshot	${{ steps.snapshot.outcome }}	GoReleaser snapshot
          Snapshot verification	${{ steps.snapshot_verify.outcome }}	linux amd64/arm64 archives and checksums
          Runtime image build	${{ steps.runtime_image.outcome }}	linux/amd64 image build without publish
          Runner cleanup	${{ steps.cleanup.outcome }}	persistent Docker runner reset
          EOF
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/pre-release-evidence" \
            "BaseHarbor Source/Build Pre-Release Evidence" \
            "pre-release/source-build" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}" \
            "${{ steps.release.outputs.candidate_sha || github.sha }}" \
            "$rows"

      - name: Upload Source/Build pre-release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-evidence
          if-no-files-found: error
          retention-days: 30

  docker_runtime:
    name: pre-release-docker-runtime
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/docker-runtime-acceptance.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}

  podman:
    name: pre-release-podman
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/podman-acceptance.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}

  demo_catalog:
    name: pre-release-demo-catalog
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/demo-gate-catalog.yml

  demo_docker:
    name: Docker · ${{ matrix.gate }}
    needs: demo_catalog
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.demo_catalog.outputs.matrix) }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - baseharbor
      - docker
    timeout-minutes: 60
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      DEMO_GATE: ${{ matrix.gate }}
      ARTIFACT_DIR: /tmp/baseharbor-demo-docker-${{ matrix.gate }}

    steps:
      - name: Checkout BaseHarbor
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset runtime state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Run demo gate
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          workdir="/tmp/baseharbor-demo-${BASEHARBOR_TEST_RUNTIME}-${DEMO_GATE}-repo"
          rm -rf "$workdir" "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          cd "$workdir"
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME="$BASEHARBOR_TEST_RUNTIME" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh "$DEMO_GATE"

      - name: Cleanup runtime state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Generate gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/demo-gate-evidence"
          rows="$RUNNER_TEMP/demo-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested BaseHarbor ref
          Go setup	${{ steps.setup_go.outcome }}	Go from go.mod; remote cache disabled
          Runtime reset	${{ steps.reset.outcome }}	Clean docker runner state
          Demo ${{ matrix.gate }}	${{ steps.demo.outcome }}	Selected product-contract gate
          Cleanup	${{ steps.cleanup.outcome }}	Runner returned to clean state
          EOF
          mkdir -p "$out/demo"
          cp -a "$ARTIFACT_DIR/." "$out/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$out" \
            "BaseHarbor Demo Gate Evidence" \
            "demo/docker/${{ matrix.gate }}" \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}" \
            "${{ steps.candidate.outputs.sha || github.sha }}" \
            "$rows"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-docker-${{ matrix.gate }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-gate-evidence
          if-no-files-found: error
          retention-days: 30

  demo_podman:
    name: Podman · ${{ matrix.gate }}
    needs: demo_catalog
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.demo_catalog.outputs.matrix) }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - baseharbor
      - podman
    timeout-minutes: 60
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      DEMO_GATE: ${{ matrix.gate }}
      ARTIFACT_DIR: /tmp/baseharbor-demo-podman-${{ matrix.gate }}

    steps:
      - name: Checkout BaseHarbor
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset runtime state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Run demo gate
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          workdir="/tmp/baseharbor-demo-${BASEHARBOR_TEST_RUNTIME}-${DEMO_GATE}-repo"
          rm -rf "$workdir" "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          cd "$workdir"
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME="$BASEHARBOR_TEST_RUNTIME" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh "$DEMO_GATE"

      - name: Cleanup runtime state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Generate gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/demo-gate-evidence"
          rows="$RUNNER_TEMP/demo-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested BaseHarbor ref
          Go setup	${{ steps.setup_go.outcome }}	Go from go.mod; remote cache disabled
          Runtime reset	${{ steps.reset.outcome }}	Clean podman runner state
          Demo ${{ matrix.gate }}	${{ steps.demo.outcome }}	Selected product-contract gate
          Cleanup	${{ steps.cleanup.outcome }}	Runner returned to clean state
          EOF
          mkdir -p "$out/demo"
          cp -a "$ARTIFACT_DIR/." "$out/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$out" \
            "BaseHarbor Demo Gate Evidence" \
            "demo/podman/${{ matrix.gate }}" \
            "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}" \
            "${{ steps.candidate.outputs.sha || github.sha }}" \
            "$rows"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-podman-${{ matrix.gate }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-gate-evidence
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: pre-release-evidence
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs:
      - validate
      - docker_runtime
      - podman
      - demo_docker
      - demo_podman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence generator
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.candidate_sha || github.sha }}

      - name: Generate combined release-gate evidence
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/release-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Source/build validation	${{ needs.validate.result }}	Formatting, source tests, docs, workflow syntax, snapshot and runtime image build
          Docker runtime core	${{ needs.docker_runtime.result }}	Runtime integration, recovery and observability
          Podman runtime core	${{ needs.podman.result }}	Runtime integration, recovery and observability
          Docker demo gates	${{ needs.demo_docker.result }}	Independent consumer-contract gate matrix
          Podman demo gates	${{ needs.demo_podman.result }}	Independent consumer-contract gate matrix
          EOF
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/release-gate-evidence" \
            "BaseHarbor Release Gate Evidence" \
            "pre-release/combined" \
            "${{ github.ref_name }}" \
            "${{ needs.validate.outputs.candidate_sha || github.sha }}" \
            "$rows"

      - name: Upload combined release-gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-gate-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete release gate
        shell: bash
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.docker_runtime.result }}" = "success"
          test "${{ needs.podman.result }}" = "success"
          test "${{ needs.demo_docker.result }}" = "success"
          test "${{ needs.demo_podman.result }}" = "success"

      - name: Create immutable release approval manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-release-approval"
          cat >"$RUNNER_TEMP/pre-release-approval/release-approved.json" <<EOF
          {
            "schema": 1,
            "tag": "${{ needs.validate.outputs.tag }}",
            "candidate_sha": "${{ needs.validate.outputs.candidate_sha }}",
            "pre_release_run_id": ${{ github.run_id }},
            "pre_release_run_attempt": ${{ github.run_attempt }},
            "workflow": ".github/workflows/pre-release.yml",
            "result": "success"
          }
          EOF

      - name: Upload immutable release approval manifest
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-approval
          if-no-files-found: error
          retention-days: 90
