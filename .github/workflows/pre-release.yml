name: "Release · v0.4.25 Evidence API Recovery"
run-name: "Evidence only · v0.4.25 · frozen f325b93c"
on:
  push:
    branches: ['validation/evidence/v0.4.25-api-recovery']
permissions:
  contents: read
  actions: read
concurrency:
  group: baseharbor-release-qualification
  cancel-in-progress: false
jobs:
  evidence:
    name: Evidence · Candidate Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: f325b93c589d8b807f44dd0086636aabe83fcd65
      DEMO_REF: ff758a29037d2f2a94c366b3bf11b4cc1b53a1a8
      BASEHARBOR_CONSUMER_REF: 29214e6c07502ea6a2f4582650e49d9951a626e9
      BASEHARBOR_PUBLIC_EVIDENCE_FILE: docs/releases/v0.4.25.consumer-pins.json
    steps:
      - name: Checkout isolated evidence control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify frozen product and unchanged evidence validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$CANDIDATE_SHA" HEAD > "$RUNNER_TEMP/control-diff.txt"
          unexpected="$(grep -Ev '^(\.github/workflows/pre-release\.yml|scripts/(evidence_api_transport|test_evidence_api_transport)\.py)$' "$RUNNER_TEMP/control-diff.txt" || true)"
          test -z "$unexpected"
          git show "$CANDIDATE_SHA:scripts/pre-release-resume.py" | cmp - scripts/pre-release-resume.py
          git show "$CANDIDATE_SHA:scripts/private_consumer_evidence.py" | cmp - scripts/private_consumer_evidence.py
          git show "$CANDIDATE_SHA:scripts/release-requirements.json" | cmp - scripts/release-requirements.json
      - name: Install candidate evidence parser
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Verify transport and unchanged evidence security regressions
        run: |
          git show "$CANDIDATE_SHA:.github/workflows/pre-release.yml" > .github/workflows/pre-release.yml
          python -m unittest discover -s scripts -p 'test_evidence_api_transport.py'
          python -m unittest discover -s scripts -p 'test_pre_release_resume.py'
          python -m unittest discover -s scripts -p 'test_private_consumer_evidence.py'
          python -m unittest discover -s scripts -p 'test_public_consumer_evidence.py'
      - name: Resolve exact frozen ecosystem sources
        run: >-
          python scripts/ecosystem_release_pins.py --tag v0.4.25 --core "$CANDIDATE_SHA"
          --connector "$BASEHARBOR_CONSUMER_REF" --demo "$DEMO_REF"
          --output "$BASEHARBOR_PUBLIC_EVIDENCE_FILE"
      - name: Authenticate all original proofs without executing gates
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$RUNNER_TEMP/approval-demo"
          printf '[38742758645]\n' > "$RUNNER_TEMP/evidence-origins.json"
          python scripts/evidence_api_transport.py approve --candidate "$CANDIDATE_SHA" --demo "$DEMO_REF" --tag v0.4.25 \
            --demo-repo "$RUNNER_TEMP/approval-demo" --runs "$RUNNER_TEMP/evidence-origins.json" \
            --output "$RUNNER_TEMP/pre-release-approval" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable release approval
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pre-release-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-approval
          if-no-files-found: error
          retention-days: 90
      - name: Retain partial diagnostics even on API failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pre-release-evidence-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/control-diff.txt
            ${{ runner.temp }}/pre-release-approval
          if-no-files-found: error
          retention-days: 30
