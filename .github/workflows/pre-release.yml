name: pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.4.14
        required: true
        type: string
      ref:
        description: Source ref to validate before tagging
        required: true
        default: develop
        type: string
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - 'release-candidate/**'

permissions:
  contents: read

jobs:
  validate:
    name: pre-release-validation
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}

    steps:
      - name: Checkout candidate source
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}
          fetch-depth: 0

      - name: Reset persistent runner state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Resolve release candidate
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
            test -n "$version"
            tag="v$version"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be valid SemVer with a v prefix." >&2
            exit 1
          fi

          git fetch origin develop
          git merge-base --is-ancestor HEAD origin/develop || {
            echo "Pre-release candidate must be contained in develop." >&2
            exit 1
          }

          version="${tag#v}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test -s "docs/releases/${tag}.md"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            exit 1
          }

      - name: Run release-source tests
        id: source_tests
        run: |
          go test ./internal/... ./spec/...
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha
          go vet ./...
          go build ./cmd/baha

      - name: Run runtime integration tests serially
        id: runtime_integration
        env:
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
        run: go test -p 1 ./cmd/baha ./internal/application -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestMultiInstanceComposeLifecycleInCI)$' -count=1 -v

      - name: Verify control-plane recovery
        id: recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real workload log ingestion
        id: log_ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real trace ingestion
        id: trace_ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate documentation
        id: docs
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Build release snapshot
        id: snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        id: snapshot_verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build runtime image without publishing
        id: runtime_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control-plane/Dockerfile
          platforms: linux/amd64
          push: false
          tags: baseharbor-runtime:pre-release
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.candidate_sha }}

      - name: Run external demo acceptance against candidate SHA
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          ARTIFACT_DIR: /tmp/baseharbor-demo-acceptance
        run: |
          set -euo pipefail
          rm -rf /tmp/baseharbor-demo "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-demo
          cd /tmp/baseharbor-demo
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Cleanup persistent runner state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Generate Docker pre-release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/pre-release-evidence.tsv"
          cat >"$rows" <<EOF
          Candidate resolution	${{ steps.release.outcome }}	SemVer, changelog, release notes and develop ancestry
          Go formatting	${{ steps.formatting.outcome }}	gofmt cmd internal spec
          Release-source tests	${{ steps.source_tests.outcome }}	unit/package tests, vet and CLI build
          Runtime integration	${{ steps.runtime_integration.outcome }}	real repository and Compose lifecycle integration
          Control-plane recovery	${{ steps.recovery.outcome }}	operator-held recovery/unseal behavior
          Log ingestion	${{ steps.log_ingestion.outcome }}	real workload logs into managed Loki
          Trace ingestion	${{ steps.trace_ingestion.outcome }}	real OTLP trace into managed Tempo
          Documentation	${{ steps.docs.outcome }}	strict EN/DE MkDocs builds plus documentation architecture audit
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint
          Release snapshot	${{ steps.snapshot.outcome }}	GoReleaser snapshot
          Snapshot verification	${{ steps.snapshot_verify.outcome }}	linux amd64/arm64 archives and checksums
          Runtime image build	${{ steps.runtime_image.outcome }}	linux/amd64 image build without publish
          External demo acceptance	${{ steps.demo.outcome }}	consumer acceptance against exact candidate SHA
          Runner cleanup	${{ steps.cleanup.outcome }}	persistent Docker runner reset
          EOF
          mkdir -p "$RUNNER_TEMP/pre-release-evidence/demo"
          cp -a /tmp/baseharbor-demo-acceptance/. "$RUNNER_TEMP/pre-release-evidence/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/pre-release-evidence" \
            "BaseHarbor Pre-Release Evidence" \
            "pre-release/docker" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}" \
            "${{ steps.release.outputs.candidate_sha || github.sha }}" \
            "$rows"

      - name: Upload Docker pre-release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-docker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-release-evidence
          if-no-files-found: error
          retention-days: 30

  podman:
    name: pre-release-podman
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/podman-acceptance.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.ref || github.sha) }}

  evidence:
    name: pre-release-evidence
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-candidate/') || (github.event_name == 'pull_request' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs:
      - validate
      - podman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence generator
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.candidate_sha || github.sha }}

      - name: Generate combined release-gate evidence
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/release-gate-evidence.tsv"
          cat >"$rows" <<EOF
          Docker pre-release validation	${{ needs.validate.result }}	Full source, runtime, docs, build and external consumer validation
          Podman acceptance	${{ needs.podman.result }}	Full application lifecycle on dedicated Podman runner
          EOF
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/release-gate-evidence" \
            "BaseHarbor Release Gate Evidence" \
            "pre-release/combined" \
            "${{ github.ref_name }}" \
            "${{ needs.validate.outputs.candidate_sha || github.sha }}" \
            "$rows"

      - name: Upload combined release-gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: pre-release-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-gate-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete release gate
        shell: bash
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.podman.result }}" = "success"
