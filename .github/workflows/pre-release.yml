name: Release · Pre-Release Validation
run-name: Pre-Release · ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
  actions: read
concurrency:
  # Run-unique, non-cancelling orchestrator group (card 0428-249 accepted edit
  # set): the candidate SHA is not resolvable at workflow level, so each
  # evidence job below keys its own group by source_prepare's candidate_sha.
  group: pre-release-orchestrator-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source_prepare:
    name: Source · Candidate and Gate Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      develop_sha: ${{ steps.release.outputs.develop_sha }}
      demo_ref: ${{ steps.release.outputs.demo_ref }}
      consumer_ref: ${{ steps.release.outputs.consumer_ref }}
      adoption: ${{ steps.selection.outputs.adoption }}
      adoption_count: ${{ steps.selection.outputs.adoption_count }}
      static: ${{ steps.runtime_reuse.outputs.static }}
      static_count: ${{ steps.selection.outputs.static_count }}
      light_docker: ${{ steps.runtime_reuse.outputs.light_docker }}
      light_docker_count: ${{ steps.selection.outputs.light_docker_count }}
      light_docker_execute_count: ${{ steps.runtime_reuse.outputs.light_docker_execute_count }}
      light_podman: ${{ steps.runtime_reuse.outputs.light_podman }}
      light_podman_count: ${{ steps.selection.outputs.light_podman_count }}
      light_podman_execute_count: ${{ steps.runtime_reuse.outputs.light_podman_execute_count }}
      heavy_docker: ${{ steps.runtime_reuse.outputs.heavy_docker }}
      heavy_docker_count: ${{ steps.selection.outputs.heavy_docker_count }}
      heavy_docker_execute_count: ${{ steps.runtime_reuse.outputs.heavy_docker_execute_count }}
      heavy_podman: ${{ steps.runtime_reuse.outputs.heavy_podman }}
      heavy_podman_count: ${{ steps.selection.outputs.heavy_podman_count }}
      heavy_podman_execute_count: ${{ steps.runtime_reuse.outputs.heavy_podman_execute_count }}
      ha_docker: ${{ steps.selection.outputs.ha_docker }}
      ha_docker_count: ${{ steps.selection.outputs.ha_docker_count }}
      ha_podman: ${{ steps.selection.outputs.ha_podman }}
      ha_podman_count: ${{ steps.selection.outputs.ha_podman_count }}
      journey: ${{ steps.selection.outputs.journey }}
      journey_count: ${{ steps.selection.outputs.journey_count }}
      integration: ${{ steps.selection.outputs.integration }}
      integration_count: ${{ steps.selection.outputs.integration_count }}
      console_ref: ${{ steps.release.outputs.console_ref }}
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Resolve release candidate
      id: release
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_DEMO_REF: ${{ inputs.demo_ref }}
        INPUT_CONSUMER_REF: ${{ inputs.consumer_ref }}
        INPUT_CONSOLE_REF: ${{ inputs.console_ref }}
        INPUT_DEVELOP_SHA: ${{ inputs.develop_sha }}
        RELEASE_MODE: ${{ inputs.release_mode }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "${{ inputs.develop_mode }}" = true ]; then
          test "$EVENT_NAME" = workflow_call
          git fetch --no-tags origin develop
          core_sha="$(git rev-parse HEAD)"
          develop_sha="$(git rev-parse origin/develop)"
          [[ "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]
          test "$core_sha" = "${{ inputs.ref }}"
          git merge-base --is-ancestor "$develop_sha" "$core_sha" || {
            echo "REJECT: develop validation candidate does not contain fetched develop tip $develop_sha (drift)." >&2
            exit 1
          }
          [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CONSOLE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CONSUMER_REF" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/develop-ecosystem-source.py \
            --core "$core_sha" --demo "$INPUT_DEMO_REF" \
            --console "$INPUT_CONSOLE_REF" --connector "$INPUT_CONSUMER_REF"
          {
            echo "tag=develop"
            echo "candidate_sha=$core_sha"
            echo "develop_sha=$develop_sha"
            echo "demo_ref=$INPUT_DEMO_REF"
            echo "consumer_ref=$INPUT_CONSUMER_REF"
            echo "console_ref=$INPUT_CONSOLE_REF"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$INPUT_TAG" ]; then
          tag="$INPUT_TAG"
        else
          version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
          test -n "$version"
          tag="v$version"
        fi

        if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "Release tag must use vMAJOR.MINOR.PATCH[-PRERELEASE] or stable vMAJOR.MINOR.PATCH.HOTFIX." >&2
          exit 1
        fi

        git fetch origin main develop
        develop_sha="$(git rev-parse origin/develop)"
        release_ref="refs/remotes/origin/release/$tag"
        git fetch origin "refs/heads/release/$tag:$release_ref" || true
        if [ "$RELEASE_MODE" = true ]; then
          [[ "$INPUT_DEVELOP_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "REJECT: Publish must provide the exact develop SHA checked by its tag job." >&2
            exit 1
          }
          git merge-base --is-ancestor "$INPUT_DEVELOP_SHA" "$develop_sha" || {
            echo "REJECT: Publish's checked develop SHA is no longer on the fetched develop line." >&2
            exit 1
          }
          develop_sha="$INPUT_DEVELOP_SHA"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Hotfix flow via main; develop integration follows after publish. See docs/reference/releases.md#hotfix-releases.
            git merge-base --is-ancestor origin/main HEAD || {
              echo "REJECT: hotfix candidate must descend from the released main line." >&2
              exit 1
            }
            echo "Hotfix candidate follows the documented main-based hotfix path."
          else
            git merge-base --is-ancestor HEAD "$develop_sha" || {
              echo "REJECT: release tag is not integrated into develop; refusing publication." >&2
              exit 1
            }
            echo "Release candidate is integrated into develop."
          fi
        elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # Hotfix flow via main; develop integration follows after publish. See docs/reference/releases.md#hotfix-releases.
          git merge-base --is-ancestor origin/main HEAD || {
            echo "REJECT: hotfix candidate must descend from the released main line." >&2
            exit 1
          }
          echo "Hotfix candidate follows the documented main-based hotfix path."
        else
          if [ -n "$INPUT_DEVELOP_SHA" ]; then
            [[ "$INPUT_DEVELOP_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "develop_sha input must be an exact 40-character commit SHA." >&2
              exit 1
            }
            test "$INPUT_DEVELOP_SHA" = "$develop_sha" || {
              echo "REJECT: supplied develop SHA does not match the fetched develop tip." >&2
              exit 1
            }
          fi
        fi
        if [ "$RELEASE_MODE" != true ] && [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          if git merge-base --is-ancestor "$develop_sha" HEAD; then
            echo "Candidate contains the checked develop tip $develop_sha."
          else
            echo "REJECT: pre-release candidate does not contain develop tip $develop_sha (drift)." >&2
            exit 1
          fi
        fi

        version="${tag#v}"
        grep -Fq "## [${version}]" CHANGELOG.md
        test -s "docs/releases/${tag}.md"

        if [ "$tag" = v0.4.24 ] || [ "$tag" = v0.4.25 ] || [ "$tag" = v0.4.26 ]; then
          python3 scripts/ecosystem_release_pins.py --tag "$tag" --core "$(git rev-parse HEAD)" \
            --connector "$INPUT_CONSUMER_REF" --demo "$INPUT_DEMO_REF" \
            --output "docs/releases/$tag.consumer-pins.json" > "$RUNNER_TEMP/v024-consumers.json"
          pinned_demo_ref="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["demo_ref"])' "$RUNNER_TEMP/v024-consumers.json")"
          consumer_ref="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["connector_ref"])' "$RUNNER_TEMP/v024-consumers.json")"
          echo "consumer_ref=$consumer_ref" >> "$GITHUB_OUTPUT"
          echo "console_ref=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["console_ref"])' "$RUNNER_TEMP/v024-consumers.json")" >> "$GITHUB_OUTPUT"
        else
          demo_ref_file="docs/releases/${tag}.demo-ref"
          test -s "$demo_ref_file" || {
            echo "Exact demo revision file is missing: $demo_ref_file" >&2
            exit 1
          }
          pinned_demo_ref="$(tr -d '[:space:]' < "$demo_ref_file")"
          [[ "$pinned_demo_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Pinned demo revision must be an exact 40-character commit SHA, got: $pinned_demo_ref" >&2
            exit 1
          }

          if [ -n "$INPUT_DEMO_REF" ]; then
            [[ "$INPUT_DEMO_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Demo revision must be an exact 40-character commit SHA, got: $INPUT_DEMO_REF" >&2
              exit 1
            }
            test "$INPUT_DEMO_REF" = "$pinned_demo_ref" || {
              echo "Requested demo revision does not match $demo_ref_file." >&2
              exit 1
            }
          fi
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        candidate_sha="$(git rev-parse HEAD)"
        echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
        echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"
        echo "demo_ref=$pinned_demo_ref" >> "$GITHUB_OUTPUT"
    - name: Select normal release checks
      id: selection
      env:
        TAG: ${{ steps.release.outputs.tag }}
        ONLY_GATES: ${{ inputs.only_gates }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF_NAME" == validation/pre-release/selected/gates/* ]]; then
          ONLY_GATES="${GITHUB_REF_NAME#validation/pre-release/selected/gates/}"
          test -n "$ONLY_GATES"
        elif [[ "$GITHUB_REF_NAME" == validation/pre-release/selected/* ]]; then
          ONLY_GATES="$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))))' "docs/releases/$TAG.selected-gates.json")"
          test -n "$ONLY_GATES"
        fi
        if [ "${{ inputs.develop_mode }}" = true ]; then
          # v0.4.26 is the existing gate-inventory baseline, NOT the build/release identity.
          test "$ONLY_GATES" = "integration/docker/remote-target,integration/podman/remote-target,integration/static/live-console"
          TAG=v0.4.26
        fi
        python3 scripts/pre-release-check-plan.py --tag "$TAG" --only-gates "$ONLY_GATES" >> "$GITHUB_OUTPUT"
        echo "only_gates=$ONLY_GATES" >> "$GITHUB_OUTPUT"
    - name: Plan fail-closed reuse for runtime matrix gates
      id: runtime_reuse
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        TAG: ${{ steps.release.outputs.tag }}
        CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        DEMO_REF: ${{ steps.release.outputs.demo_ref }}
        ONLY_GATES: ${{ steps.selection.outputs.only_gates }}
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/pre-release-runtime-reuse.py \
          --repo "$REPO" --run-id "$RUN_ID" --tag "$TAG" \
          --candidate-sha "$CANDIDATE_SHA" --demo-ref "$DEMO_REF" \
          --only-gates "$ONLY_GATES" --token "$GH_TOKEN" \
          --temp-dir "$RUNNER_TEMP/pre-release-runtime-reuse" \
          --output "$GITHUB_OUTPUT"
    - name: Record qualification source binding
      id: qualification_binding
      env:
        TAG: ${{ steps.release.outputs.tag }}
        CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        DEVELOP_SHA: ${{ steps.release.outputs.develop_sha }}
        DEMO_SHA: ${{ steps.release.outputs.demo_ref }}
        ONLY_GATES: ${{ steps.selection.outputs.only_gates }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$DEVELOP_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$DEMO_SHA" =~ ^[0-9a-f]{40}$ ]]
        suite="$ONLY_GATES"
        if [ -z "$suite" ]; then
          suite="full:$TAG"
        fi
        printf 'Qualification binding: tag=%s candidate_sha=%s develop_tip_sha=%s demo_sha=%s suite=%s\n' \
          "$TAG" "$CANDIDATE_SHA" "$DEVELOP_SHA" "$DEMO_SHA" "$suite" \
          >> "$GITHUB_STEP_SUMMARY"
        printf 'candidate_sha=%s\ndevelop_sha=%s\nsuite=%s\n' \
          "$CANDIDATE_SHA" "$DEVELOP_SHA" "$suite" >> "$GITHUB_OUTPUT"

  source_format:
    name: Source · Format and Readability
    needs: source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Check Go formatting
      id: formatting
      shell: bash
      run: |
        set -euo pipefail
        files="$(gofmt -l cmd internal spec contracts)"
        test -z "$files" || {
          echo "gofmt required:" >&2
          echo "$files" >&2
          exit 1
        }
    - name: Validate source readability
      id: source_readability
      run: bash scripts/source-readability-audit.sh

  source_tests:
    name: Source · Go Tests · ${{ matrix.shard }}
    needs: source_prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [cli-0, cli-1, cli-2, cli-3, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baseharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseharbor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BASEHARBOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baseharbor_test?sslmode=disable
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Install shells for the shell-wrapper test path
      if: matrix.shard == 'cli-3'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y zsh fish
        echo "zsh: $(command -v zsh)"
        echo "fish: $(command -v fish)"
    - name: Run discovered release-source test shard
      id: source_tests
      shell: bash
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        set -euo pipefail
        if [[ "$SHARD" == cli-* ]]; then
          export BASEHARBOR_LOGS_ENABLED=false
        fi
        python3 scripts/pr-go-unit-shard.py --mode "$SHARD"

  source_vet:
    name: Source · Go Vet
    needs: source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Vet all Go packages
      id: source_vet
      run: go vet ./...

  source_docs:
    name: Docs · Workflow and Release Validation
    needs: source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.14'
    - name: Install validation tooling
      id: tooling
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r requirements-docs.txt
        GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - name: Enforce workflow policy
      id: workflow_policy
      run: bash scripts/ci-workflow-policy.sh
    - name: Validate documentation
      id: docs
      shell: bash
      run: |
        mkdocs build --strict --config-file mkdocs.yml
        mkdocs build --strict --config-file mkdocs.de.yml
        bash scripts/documentation-audit.sh
    - name: Validate v0.4.20 release-note hygiene
      id: v0420_hygiene
      if: needs.source_prepare.outputs.tag == 'v0.4.20'
      shell: bash
      run: |
        set -euo pipefail
        release_internal="$(
          grep -n -Ei 'corpus|unit test|conformance|schema_version|fingerprint|adapter v1|candidate sha|gofmt|go test|go vet|implementation evidence|validation|CI gate' docs/releases/v0.4.20.md || true
        )"
        test -z "$release_internal" || {
          echo "Internal validation detail leaked into user-facing release notes:" >&2
          echo "$release_internal" >&2
          exit 1
        }
    - name: Validate release readiness
      id: release_readiness
      if: needs.source_prepare.outputs.tag == 'v0.4.21'
      shell: bash
      run: bash scripts/v0.4.21-readiness.sh
    - name: Validate workflow syntax
      id: workflow_syntax
      shell: bash
      run: $RUNNER_TEMP/bin/actionlint -shellcheck=

  release_snapshot:
    name: Release · Snapshot Build
    needs: source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Build release snapshot
      id: snapshot
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: ~> v2
        args: release --snapshot --clean
    - name: Verify release snapshot
      id: snapshot_verify
      shell: bash
      run: |
        set -euo pipefail
        test -f dist/checksums.txt
        test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
        grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
        grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

  release_candidate:
    name: Release · Candidate Artifact
    needs: source_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout candidate source
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.source_prepare.outputs.candidate_sha }}
        fetch-depth: 0
    - name: Set up Go
      id: setup_go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - name: Build exact candidate binary
      id: candidate_binary
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pre-release-candidate"
        CGO_ENABLED=0 go build -trimpath             -ldflags="-s -w -X main.version=${{ needs.source_prepare.outputs.tag }} -X main.commit=${{ needs.source_prepare.outputs.candidate_sha }} -X main.date=unknown"             -o "$RUNNER_TEMP/pre-release-candidate/baha" ./cmd/baha
        "$RUNNER_TEMP/pre-release-candidate/baha" version | grep -F "${{ needs.source_prepare.outputs.candidate_sha }}"
    - name: Produce baha-ci-operator-testonly candidate binary
      id: operator_testonly
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pre-release-candidate"
        CGO_ENABLED=0 go build -trimpath -tags=baseharbor_ci_operator_testonly             -ldflags="-s -w -X main.version=${{ needs.source_prepare.outputs.tag }} -X main.commit=${{ needs.source_prepare.outputs.candidate_sha }} -X main.date=unknown"             -o "$RUNNER_TEMP/pre-release-candidate/baha-ci-operator-testonly" ./cmd/baha
        chmod +x "$RUNNER_TEMP/pre-release-candidate/baha-ci-operator-testonly"
        test -s "$RUNNER_TEMP/pre-release-candidate/baha-ci-operator-testonly"
        # Build-info proof: the artifact's build settings must carry the test-only tag.
        # The release build strips the symbol table (-s), so 'go tool nm' cannot be used here;
        # 'go version -m' embeds build settings (including -tags) regardless of -s -w.
        # The proof must fail closed, so it filters only the build-settings line.
        go version -m "$RUNNER_TEMP/pre-release-candidate/baha-ci-operator-testonly" | tee "$RUNNER_TEMP/baha-ci-operator-testonly-buildinfo.txt"
        grep -E '^[[:space:]]*build[[:space:]]' "$RUNNER_TEMP/baha-ci-operator-testonly-buildinfo.txt" \
          | grep -q -- '-tags=baseharbor_ci_operator_testonly'
    - name: Upload source candidate
      id: source_candidate
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: pre-release-source-candidate
        path: ${{ runner.temp }}/pre-release-candidate
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  source:
    name: Source · Qualified
    needs: [source_prepare, source_format, source_tests, source_vet, source_docs, release_snapshot, release_candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ needs.source_prepare.outputs.tag }}
      candidate_sha: ${{ needs.source_prepare.outputs.candidate_sha }}
      demo_ref: ${{ needs.source_prepare.outputs.demo_ref }}
      consumer_ref: ${{ needs.source_prepare.outputs.consumer_ref }}
      adoption: ${{ needs.source_prepare.outputs.adoption }}
      adoption_count: ${{ needs.source_prepare.outputs.adoption_count }}
      static: ${{ needs.source_prepare.outputs.static }}
      static_count: ${{ needs.source_prepare.outputs.static_count }}
      light_docker: ${{ needs.source_prepare.outputs.light_docker }}
