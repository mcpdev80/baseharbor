      run: |
        set -euo pipefail
        exec > >(tee "$RUNNER_TEMP/gate-output.log") 2>&1
        export XDG_CONFIG_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/config"
        export XDG_DATA_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/data"
        export XDG_CACHE_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/cache"
        export ARTIFACT_DIR="$RUNNER_TEMP/baseharbor-reference-artifacts"
        workdir="${{ steps.demo.outputs.workdir }}"
        cd "$workdir"
        started=$(date +%s)
        set +e
        BASEHARBOR_PREBUILT_BINARY="$RUNNER_TEMP/pre-release-candidate/baha" \
        BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
        BASEHARBOR_RUNTIME_IMAGE="$BASEHARBOR_RUNTIME_IMAGE" \
        BASEHARBOR_TEST_RUNTIME="${{ matrix.runtime }}" \
          bash scripts/acceptance.sh
        result=$?
        set -e
        echo "duration_seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
        exit "$result"
    - name: Collect reference journey diagnostics
      if: failure()
      shell: bash
      run: |
        export XDG_CONFIG_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/config"
        export XDG_DATA_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/data"
        export XDG_CACHE_HOME="$RUNNER_TEMP/baseharbor-reference-xdg/cache"
        bash scripts/ci-failure-diagnostics.sh \
          "${{ matrix.runtime }}" \
          "$RUNNER_TEMP/reference-journey-diagnostics" \
          "${{ steps.demo.outputs.workdir }}" \
          "$RUNNER_TEMP/pre-release-candidate/baha" || true
    - name: Show original assertion before cleanup
      if: failure()
      shell: bash
      run: python scripts/ci-assertion-summary.py "$RUNNER_TEMP/gate-output.log" "$RUNNER_TEMP/assertion-summary.json"
        | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Cleanup journey runtime
      id: cleanup
      if: always()
      shell: bash
      timeout-minutes: 3
      run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"
    - name: Summarize journey groups and duration
      if: always()
      shell: bash
      run: |
        python - <<'PY_SUMMARY'
        import csv, os, pathlib
        report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'baseharbor-reference-artifacts/groups.tsv'
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write('### Full journey · ${{ matrix.runtime }}\n\n')
            output.write('Duration: ${{ steps.journey.outputs.duration_seconds }} seconds. Cleanup: ${{ steps.cleanup.outcome }}.\n\n')
            output.write('| Group | Result |\n| --- | --- |\n')
            if report.is_file():
                for row in csv.reader(report.open(), delimiter='\t'):
                    if len(row) >= 2 and row[0].startswith('demo-') and row[1] in ('PASS', 'FAIL', 'ERROR', 'BLOCKED', 'SKIP'):
                        name = ''.join(c for c in row[0] if c.isalnum() or c == '-')[:80]
                        output.write(f'| {name} | {row[1]} |\n')
            else:
                output.write('| Setup | No group report; inspect the first failed step |\n')
        PY_SUMMARY
