name: targeted-podman-journal

on:
  push:
    branches:
      - 'runtime-validation/podman-journal/**'

permissions:
  contents: read

jobs:
  journal:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect Podman journald metadata
        shell: bash
        run: |
          set -euo pipefail
          marker="baseharbor-journal-probe-$GITHUB_RUN_ID"
          podman rm -f baseharbor-journal-probe >/dev/null 2>&1 || true
          podman run --name baseharbor-journal-probe --log-driver journald docker.io/library/busybox:1.37 sh -c "echo $marker"
          sleep 1
          echo "=== exact marker ==="
          journalctl --no-pager --since '-2 minutes' -o json | grep "$marker" | tail -n 5
          echo "=== container-name selector ==="
          journalctl --no-pager --since '-2 minutes' -o json CONTAINER_NAME=baseharbor-journal-probe | tail -n 5 || true
          podman inspect baseharbor-journal-probe --format '{{json .HostConfig.LogConfig}}'
          podman rm -f baseharbor-journal-probe >/dev/null
