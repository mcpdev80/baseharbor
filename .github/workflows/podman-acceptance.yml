name: podman-acceptance

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: develop
        type: string
  push:
    branches:
      - 'runtime-validation/podman/**'

permissions:
  contents: read

jobs:
  podman-compose:
    runs-on: [self-hosted, Linux, X64, baseharbor, podman]
    timeout-minutes: 75

    steps:
      - name: Checkout requested ref
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate workflow syntax
        id: workflow_syntax
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

      - name: Reset persistent runner state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Verify Podman runner
        id: verify_runner
        shell: bash
        run: |
          set -euo pipefail
          podman info >/tmp/podman-info.txt
          podman compose version
          mkdir -p "$RUNNER_TEMP/baseharbor-runtime-path"
          cat >"$RUNNER_TEMP/baseharbor-runtime-path/docker" <<'EOF'
          #!/bin/sh
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-runtime-path/docker"
          echo "$RUNNER_TEMP/baseharbor-runtime-path" >> "$GITHUB_PATH"

      - name: Build BaseHarbor
        id: build
        run: go build -trimpath -o /tmp/baha ./cmd/baha

      - name: Verify Podman runtime detection
        id: runtime_detection
        shell: bash
        run: |
          set -euo pipefail
          /tmp/baha doctor | tee /tmp/podman-doctor.txt
          grep -Eq '^  OK +podman' /tmp/podman-doctor.txt
          grep -Eq '^  OK +compose' /tmp/podman-doctor.txt
          grep -q '^READY$' /tmp/podman-doctor.txt

      - name: Verify application lifecycle on Podman Compose
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          printf '%s\n' "$workdir" >/tmp/baseharbor-podman-workdir
          cd "$workdir"

          /tmp/baha app create podman-ci --postgres --redis | tee /tmp/podman-create.txt
          /tmp/baha app plan podman-ci | tee /tmp/podman-plan.txt
          grep -q "dedicated PostgreSQL service" /tmp/podman-plan.txt

          /tmp/baha app preflight podman-ci | tee /tmp/podman-preflight.txt
          /tmp/baha app apply podman-ci | tee /tmp/podman-apply.txt

          /tmp/baha app status podman-ci --verbose | tee /tmp/podman-status.txt
          grep -q "authenticated SELECT 1 succeeded" /tmp/podman-status.txt
          grep -q "authenticated PING returned PONG" /tmp/podman-status.txt

          /tmp/baha app doctor podman-ci | tee /tmp/podman-app-doctor.txt
          grep -q '^READY$' /tmp/podman-app-doctor.txt

          /tmp/baha app down podman-ci | tee /tmp/podman-down.txt
          /tmp/baha app up podman-ci | tee /tmp/podman-up.txt
          /tmp/baha app doctor podman-ci | tee /tmp/podman-resume-doctor.txt
          grep -q '^READY$' /tmp/podman-resume-doctor.txt

          /tmp/baha app destroy podman-ci --yes | tee /tmp/podman-destroy.txt

      - name: Run runtime integration tests serially on Podman
        id: runtime_integration
        env:
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
        run: go test -p 1 ./cmd/baha ./internal/application -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestMultiInstanceComposeLifecycleInCI)
      - name: Generate Podman evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint validates all GitHub Actions workflows
          Runner reset	${{ steps.reset.outcome }}	Podman state reset before validation
          Podman runner	${{ steps.verify_runner.outcome }}	podman info and podman compose available
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runtime detection	${{ steps.runtime_detection.outcome }}	Doctor detects Podman and Compose and reports READY
          Application lifecycle	${{ steps.lifecycle.outcome }}	create, plan, preflight, apply, status, doctor, down/up, destroy
          Runtime integration	${{ steps.runtime_integration.outcome }}	real repository and Compose lifecycle integration
          Control-plane recovery	${{ steps.recovery.outcome }}	operator-held recovery/unseal behavior
          Log ingestion	${{ steps.log_ingestion.outcome }}	real workload logs into managed Loki
          Trace ingestion	${{ steps.trace_ingestion.outcome }}	real OTLP trace into managed Tempo
          External demo acceptance	${{ steps.demo.outcome }}	full consumer acceptance against exact candidate SHA
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Podman runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/podman-evidence/logs" "$RUNNER_TEMP/podman-evidence/demo"
          cp /tmp/podman-*.txt "$RUNNER_TEMP/podman-evidence/logs/" 2>/dev/null || true
          cp -a /tmp/baseharbor-demo-podman-acceptance/. "$RUNNER_TEMP/podman-evidence/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/podman-evidence"             "BaseHarbor Podman Acceptance Evidence"             "podman-acceptance"             "$EVIDENCE_REF"             "$(git rev-parse HEAD)"             "$rows"

      - name: Upload Podman evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podman-evidence
          if-no-files-found: error
          retention-days: 30
 -count=1 -v

      - name: Verify control-plane recovery on Podman
        id: recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile
      - name: Generate Podman evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint validates all GitHub Actions workflows
          Runner reset	${{ steps.reset.outcome }}	Podman state reset before validation
          Podman runner	${{ steps.verify_runner.outcome }}	podman info and podman compose available
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runtime detection	${{ steps.runtime_detection.outcome }}	Doctor detects Podman and Compose and reports READY
          Application lifecycle	${{ steps.lifecycle.outcome }}	create, plan, preflight, apply, status, doctor, down/up, destroy
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Podman runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/podman-evidence/logs"
          cp /tmp/podman-*.txt "$RUNNER_TEMP/podman-evidence/logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/podman-evidence"             "BaseHarbor Podman Acceptance Evidence"             "podman-acceptance"             "$EVIDENCE_REF"             "$(git rev-parse HEAD)"             "$rows"

      - name: Upload Podman evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podman-evidence
          if-no-files-found: error
          retention-days: 30
 -count=1 -v

      - name: Verify real workload log ingestion on Podman
        id: log_ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs
      - name: Generate Podman evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint validates all GitHub Actions workflows
          Runner reset	${{ steps.reset.outcome }}	Podman state reset before validation
          Podman runner	${{ steps.verify_runner.outcome }}	podman info and podman compose available
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runtime detection	${{ steps.runtime_detection.outcome }}	Doctor detects Podman and Compose and reports READY
          Application lifecycle	${{ steps.lifecycle.outcome }}	create, plan, preflight, apply, status, doctor, down/up, destroy
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Podman runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/podman-evidence/logs"
          cp /tmp/podman-*.txt "$RUNNER_TEMP/podman-evidence/logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/podman-evidence"             "BaseHarbor Podman Acceptance Evidence"             "podman-acceptance"             "$EVIDENCE_REF"             "$(git rev-parse HEAD)"             "$rows"

      - name: Upload Podman evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podman-evidence
          if-no-files-found: error
          retention-days: 30
 -count=1 -v

      - name: Verify real trace ingestion on Podman
        id: trace_ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector
      - name: Generate Podman evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint validates all GitHub Actions workflows
          Runner reset	${{ steps.reset.outcome }}	Podman state reset before validation
          Podman runner	${{ steps.verify_runner.outcome }}	podman info and podman compose available
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runtime detection	${{ steps.runtime_detection.outcome }}	Doctor detects Podman and Compose and reports READY
          Application lifecycle	${{ steps.lifecycle.outcome }}	create, plan, preflight, apply, status, doctor, down/up, destroy
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Podman runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/podman-evidence/logs"
          cp /tmp/podman-*.txt "$RUNNER_TEMP/podman-evidence/logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/podman-evidence"             "BaseHarbor Podman Acceptance Evidence"             "podman-acceptance"             "$EVIDENCE_REF"             "$(git rev-parse HEAD)"             "$rows"

      - name: Upload Podman evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podman-evidence
          if-no-files-found: error
          retention-days: 30
 -count=1 -v

      - name: Run external demo acceptance on Podman
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.ref || github.sha }}
          ARTIFACT_DIR: /tmp/baseharbor-demo-podman-acceptance
          BASEHARBOR_TEST_RUNTIME: podman
        run: |
          set -euo pipefail
          rm -rf /tmp/baseharbor-demo-podman "$ARTIFACT_DIR"
          git clone --depth 1 --branch main https://github.com/mcpdev80/baseharbor-demo.git /tmp/baseharbor-demo-podman
          cd /tmp/baseharbor-demo-podman
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME=podman \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Cleanup Podman runtime
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Generate Podman evidence
        if: always()
        shell: bash
        env:
          EVIDENCE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested ref checked out
          Go setup	${{ steps.setup_go.outcome }}	Persistent runner; remote Go cache disabled
          Workflow syntax	${{ steps.workflow_syntax.outcome }}	actionlint validates all GitHub Actions workflows
          Runner reset	${{ steps.reset.outcome }}	Podman state reset before validation
          Podman runner	${{ steps.verify_runner.outcome }}	podman info and podman compose available
          BaseHarbor build	${{ steps.build.outcome }}	baha built from tested source
          Runtime detection	${{ steps.runtime_detection.outcome }}	Doctor detects Podman and Compose and reports READY
          Application lifecycle	${{ steps.lifecycle.outcome }}	create, plan, preflight, apply, status, doctor, down/up, destroy
          Cleanup	${{ steps.cleanup.outcome }}	Persistent Podman runner returned to clean state
          EOF
          mkdir -p "$RUNNER_TEMP/podman-evidence/logs"
          cp /tmp/podman-*.txt "$RUNNER_TEMP/podman-evidence/logs/" 2>/dev/null || true
          bash scripts/ci-evidence.sh             "$RUNNER_TEMP/podman-evidence"             "BaseHarbor Podman Acceptance Evidence"             "podman-acceptance"             "$EVIDENCE_REF"             "$(git rev-parse HEAD)"             "$rows"

      - name: Upload Podman evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podman-evidence
          if-no-files-found: error
          retention-days: 30
