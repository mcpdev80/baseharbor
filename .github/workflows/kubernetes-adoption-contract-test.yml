name: "Test · Kubernetes Adoption Contract"

on:
  push:
    branches:
      - 'test/kubernetes-adoption-contract-demo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: [self-hosted, Linux, X64, baseharbor, kubernetes, k3s]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION)" = "go1.25.0"

      - name: Run demo portability contract test
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/baha             -run '^TestKubernetesAdoptionContractReferenceDemoKeepsRepositoryWorkloadUnchanged$'             -count=1 -v
