name: PR impact planner isolated pilot
on:
  push:
    branches:
      - pilot/pr-impact-924
permissions:
  contents: read
jobs:
  planner:
    name: Exact PR planner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a56655669b6ec7850c0ef585715399ef0959bd0
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = '3a56655669b6ec7850c0ef585715399ef0959bd0'
      - name: Python syntax
        run: python3 -m py_compile scripts/pr-gate-plan.py scripts/test_pr_gate_plan.py
      - name: Focused regressions
        run: python3 -m unittest discover -s scripts -p 'test_pr_gate_plan.py' -v
      - name: Exercise selected CLI and verifier checks
        run: |
          go test ./cmd/baha -run '^TestGuided' -count=1
          go vet ./cmd/baha
          go build -o "$RUNNER_TEMP/baha-pr-impact" ./cmd/baha
          PYTHONPATH=scripts python3 -m unittest scripts/test_pre_release_resume.py scripts/test_evidence_api_transport.py scripts/test_select_evidence_attempts.py
