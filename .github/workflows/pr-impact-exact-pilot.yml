name: PR impact planner isolated pilot
on:
  push:
    branches:
      - pilot/pr-impact-924
permissions:
  contents: read
jobs:
  planner:
    name: Exact PR planner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4394edd2dc16805bf5c2663d141f3303c460ab21
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = '4394edd2dc16805bf5c2663d141f3303c460ab21'
      - name: Python syntax
        run: python3 -m py_compile scripts/pr-gate-plan.py scripts/test_pr_gate_plan.py
      - name: Focused regressions
        run: python3 -m unittest discover -s scripts -p 'test_pr_gate_plan.py' -v
