name: "Demo · Docker + Podman Acceptance"

run-name: "Demo Acceptance · Docker + Podman · ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: BaseHarbor ref or commit SHA to test
        required: true
        default: develop
        type: string
  push:
    branches:
      - 'runtime-validation/demo/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: demo-revision
    uses: ./.github/workflows/demo-gate-catalog.yml

  docker:
    name: Docker · full acceptance suite
    needs: catalog
    runs-on:
      - self-hosted
      - Linux
      - X64
      - baseharbor
      - docker
    timeout-minutes: 90
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      ARTIFACT_DIR: /tmp/baseharbor-demo-docker-acceptance
      DEMO_SHA: ${{ needs.catalog.outputs.demo_sha }}

    steps:
      - name: Checkout BaseHarbor
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset runtime state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Run full demo acceptance suite
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          workdir="/tmp/baseharbor-demo-${BASEHARBOR_TEST_RUNTIME}-acceptance-repo"
          rm -rf "$workdir" "$ARTIFACT_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          git -C "$workdir" fetch --depth 1 origin "$DEMO_SHA"
          git -C "$workdir" checkout --detach FETCH_HEAD
          cd "$workdir"
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME="$BASEHARBOR_TEST_RUNTIME" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Cleanup runtime state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Generate Docker demo evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/demo-docker-evidence"
          rows="$RUNNER_TEMP/demo-docker-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested BaseHarbor ref
          Go setup	${{ steps.setup_go.outcome }}	Go from go.mod; remote cache disabled
          Runtime reset	${{ steps.reset.outcome }}	Clean Docker runner state
          Demo revision	success	${{ needs.catalog.outputs.demo_sha }}
          Full demo acceptance	${{ steps.demo.outcome }}	All registered gates executed once in registry order on one persistent environment
          Cleanup	${{ steps.cleanup.outcome }}	Runner returned to clean state
          EOF
          mkdir -p "$out/demo"
          cp -a "$ARTIFACT_DIR/." "$out/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$out" \
            "BaseHarbor Docker Demo Acceptance Evidence" \
            "demo/docker" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}" \
            "${{ steps.candidate.outputs.sha || github.sha }}" \
            "$rows"

      - name: Upload Docker demo evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-docker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-docker-evidence
          if-no-files-found: error
          retention-days: 30

  podman:
    name: Podman · full acceptance suite
    needs: catalog
    runs-on:
      - self-hosted
      - Linux
      - X64
      - baseharbor
      - podman
    timeout-minutes: 90
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      ARTIFACT_DIR: /tmp/baseharbor-demo-podman-acceptance
      DEMO_SHA: ${{ needs.catalog.outputs.demo_sha }}

    steps:
      - name: Checkout BaseHarbor
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reset runtime state
        id: reset
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Verify Podman Quadlet runtime
        id: quadlet
        shell: bash
        run: |
          set -euo pipefail
          podman info >/tmp/demo-podman-info.txt

          generator=""
          for candidate in \
            "$(command -v podman-system-generator 2>/dev/null || true)" \
            /usr/lib/systemd/system-generators/podman-system-generator \
            /usr/libexec/podman/quadlet
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              generator="$candidate"
              break
            fi
          done
          test -n "$generator"
          "$generator" --user --dryrun >/tmp/demo-podman-quadlet-generator.txt

          cat >"$RUNNER_TEMP/baseharbor-no-compose" <<'EOF'
          #!/bin/sh
          echo "podman compose is forbidden in Podman Quadlet demo acceptance" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-no-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/baseharbor-no-compose" >> "$GITHUB_ENV"

      - name: Run full demo acceptance suite
        id: demo
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          workdir="/tmp/baseharbor-demo-${BASEHARBOR_TEST_RUNTIME}-acceptance-repo"
          rm -rf "$workdir" "$ARTIFACT_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$workdir"
          git -C "$workdir" fetch --depth 1 origin "$DEMO_SHA"
          git -C "$workdir" checkout --detach FETCH_HEAD
          cd "$workdir"
          BASEHARBOR_SOURCE_REF="$CANDIDATE_SHA" \
            BASEHARBOR_TEST_RUNTIME="$BASEHARBOR_TEST_RUNTIME" \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            bash scripts/acceptance.sh

      - name: Cleanup runtime state
        id: cleanup
        if: always()
        shell: bash
        run: bash scripts/ci-runtime-reset.sh "$BASEHARBOR_TEST_RUNTIME"

      - name: Generate Podman demo evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/demo-podman-evidence"
          rows="$RUNNER_TEMP/demo-podman-evidence.tsv"
          cat >"$rows" <<EOF
          Checkout	${{ steps.checkout.outcome }}	Exact requested BaseHarbor ref
          Go setup	${{ steps.setup_go.outcome }}	Go from go.mod; remote cache disabled
          Runtime reset	${{ steps.reset.outcome }}	Clean Podman runner and Quadlet state
          Podman Quadlet runtime	${{ steps.quadlet.outcome }}	Quadlet generator required; podman compose provider explicitly blocked
          Demo revision	success	${{ needs.catalog.outputs.demo_sha }}
          Full demo acceptance	${{ steps.demo.outcome }}	All registered gates executed once in registry order on one persistent environment
          Cleanup	${{ steps.cleanup.outcome }}	Runner returned to clean state
          EOF
          mkdir -p "$out/demo"
          cp -a "$ARTIFACT_DIR/." "$out/demo/" 2>/dev/null || true
          bash scripts/ci-evidence.sh \
            "$out" \
            "BaseHarbor Podman Demo Acceptance Evidence" \
            "demo/podman" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}" \
            "${{ steps.candidate.outputs.sha || github.sha }}" \
            "$rows"

      - name: Upload Podman demo evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-podman-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-podman-evidence
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: demo-acceptance-evidence
    if: always()
    needs:
      - docker
      - podman
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Generate demo acceptance summary
        shell: bash
        run: |
          set -euo pipefail
          rows="$RUNNER_TEMP/demo-acceptance-summary.tsv"
          cat >"$rows" <<EOF
          Docker demo acceptance	${{ needs.docker.result }}	All registered gates once on one persistent Docker environment
          Podman demo acceptance	${{ needs.podman.result }}	All registered gates once on one persistent Podman/Quadlet environment
          EOF
          bash scripts/ci-evidence.sh \
            "$RUNNER_TEMP/demo-acceptance-evidence" \
            "BaseHarbor Demo Acceptance Evidence" \
            "demo/all" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}" \
            "${{ github.sha }}" \
            "$rows"

      - name: Upload demo acceptance summary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-acceptance-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete demo acceptance
        shell: bash
        run: |
          test "${{ needs.docker.result }}" = "success"
          test "${{ needs.podman.result }}" = "success"
