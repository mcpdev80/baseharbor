name: "Release · Supplemental Validation"

run-name: "Supplemental Validation · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - 'supplemental-validation/**'

permissions:
  contents: read

jobs:
  validate:
    name: supplemental-release-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify control-plane restart and operator-held unseal recovery
        id: recovery
        env:
          BASEHARBOR_RUNTIME_RESTART_ACCEPTANCE: "true"
        run: go test ./cmd/baha -run '^TestExistingControlPlaneRestartRequiresAndUsesRecoveryFile$' -count=1 -v

      - name: Verify real Loki and Alloy workload log ingestion
        id: log_ingestion
        env:
          BASEHARBOR_LOGS_INTEGRATION: "1"
        run: go test ./internal/logs -run '^TestManagedLokiIngestsRealComposeWorkloadLogs$' -count=1 -v

      - name: Verify real OpenTelemetry to Tempo trace ingestion
        id: trace_ingestion
        env:
          BASEHARBOR_TRACES_INTEGRATION: "1"
        run: go test ./internal/traces -run '^TestManagedTempoReceivesVerificationTraceThroughCollector$' -count=1 -v

      - name: Create supplemental validation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/supplemental-release-validation"
          mkdir -p "$out"

          rows="$RUNNER_TEMP/supplemental-release-validation.tsv"
          cat >"$rows" <<EOF
          Control-plane recovery	${{ steps.recovery.outcome }}	operator-held unseal recovery
          Log ingestion	${{ steps.log_ingestion.outcome }}	managed Loki and Alloy ingestion
          Trace ingestion	${{ steps.trace_ingestion.outcome }}	OpenTelemetry to managed Tempo
          EOF

          bash scripts/ci-evidence.sh             "$out"             "BaseHarbor Supplemental Release Validation"             "release/supplemental"             "${GITHUB_REF_NAME}"             "${GITHUB_SHA}"             "$rows"

          cat >"$out/supplemental-approved.json" <<EOF
          {
            "schema": 1,
            "candidate_sha": "${GITHUB_SHA}",
            "workflow": ".github/workflows/supplemental-release-validation.yml",
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "result": "success"
          }
          EOF

      - name: Upload supplemental validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supplemental-release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supplemental-release-validation
          if-no-files-found: error
          retention-days: 90
