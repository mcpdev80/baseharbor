# Reusable shadow consumer triggered by the approval job (G5b).
#
# Retained-only consumption of one published, Owner-approved receipt after the
# approval publication is durable. This replaces the earlier PR-open,
# live-fallback design that consumed evidence before it existed: the consumer
# now reads exactly the approved receipt path, plan revision and candidate that
# the trusted approval job published, verifies them offline against the full
# protected Planning history, and never calls the GitHub API for a live fallback.
#
# The producer workflow that triggers publication is asynchronous and cannot be
# awaited by the producer; the shadow is therefore a reusable workflow that the
# trusted approval job (receipt-approval.yml) runs from protected main, not a
# PR-open job that waits for after-the-fact evidence.
#
# G5b: activation cutover — the approval job now dispatches this reusable
# workflow with the exact published receipt/plan/candidate/publication outputs.
#
# R27-F6 (shadow part): consumption is exclusively the verified approval-flow
# results, including the EXACT final durable publication commit. There is no
# job-level skip guard: a missing or malformed input fails this job explicitly
# (required inputs plus step-level validation), so "no consumption because an
# output was empty" can never masquerade as a successful chain. The retained
# verification runs at exactly the publication revision — never at whatever
# Planning main HEAD happens to be at execution time. The verifier code is
# checked out at the authenticated run SHA (github.sha), never at an
# event-derived or caller-chosen ref. The result never gates any merge
# (informational only).

name: "Receipt · Shadow Final Check"

on:
  workflow_call:
    inputs:
      receipt:
        description: Exact published receipt path relative to the Planning checkout
        type: string
        required: true
      plan:
        description: Exact approved plan revision (full Planning commit SHA)
        type: string
        required: true
      candidate:
        description: Exact approved candidate SHA the receipt binds
        type: string
        required: true
      publication:
        description: Exact final durable publication commit (Planning commit containing the approved receipt and card evidence)
        type: string
        required: true
    secrets:
      PLANNING_RECEIPT_WRITE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  receipt_shadow:
    name: PR · Receipt Shadow Consumption
    # R27-F6: the registered job-level Owner-gated dispatch dormancy guard is
    # the ONLY job-level condition. It deliberately does NOT inspect the
    # inputs: missing or malformed approval outputs fail this job EXPLICITLY
    # (required-input enforcement at the call plus the step-level validation
    # below), never by silently skipping — skipping would fake chain success.
    # It cannot be steered by manual run/SHA/path/plan inputs either.
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mcpdev80'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verifier from the authenticated run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Authenticated run SHA of the trusted approval context, evaluated by
          # GitHub; never github.event.pull_request.* (empty for this
          # workflow_dispatch chain) and never a caller-chosen ref.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected Planning history read-only (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcpdev80/baseharbor-plan
          ref: main
          path: planning
          fetch-depth: 0
          persist-credentials: false

      - name: Verify this candidate's published receipt with the frozen interface
        env:
          RECEIPT: ${{ inputs.receipt }}
          PLAN: ${{ inputs.plan }}
          CANDIDATE: ${{ inputs.candidate }}
          PUBLICATION: ${{ inputs.publication }}
        shell: bash
        run: |
          set -euo pipefail
          # The candidate is the exact published candidate the Owner approved,
          # never the PR head: a live fallback to any apparently-green candidate
          # is not trusted. Retained verification uses no GitHub API.
          # Fail closed on malformed values: the inputs must be complete
          # approval-flow outputs (receipt path, plan revision, candidate SHA),
          # never manual or empty substitutions.
          case "$RECEIPT" in evidence/receipts/*.json) ;; *)
            echo "approved receipt path output missing or malformed" >&2; exit 1 ;; esac
          [[ "$CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "approved candidate output missing or not a full SHA" >&2; exit 1; }
          [[ "$PLAN" =~ ^[0-9a-fA-F]{7,40}$ ]] || {
            echo "approved plan revision output missing or malformed" >&2; exit 1; }
          # R27-F6: the final durable publication is a required approval-flow
          # output; missing or malformed here is an explicit failure.
          [[ "$PUBLICATION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "final publication output missing or not a full SHA" >&2; exit 1; }
          # The approved plan revision must exist in the protected Planning
          # history: consumption starts only after the verified publication.
          plan_rev="$(git -C planning rev-parse --verify "${PLAN}^{commit}")" || {
            echo "approved plan revision is not in the protected Planning history" >&2; exit 1; }
          # R27-F6: consume EXACTLY the final durable publication commit —
          # never whatever Planning main HEAD happens to be at execution time.
          revision="$(git -C planning rev-parse --verify "${PUBLICATION}^{commit}")" || {
            echo "final publication is not in the protected Planning history" >&2; exit 1; }
          python3 scripts/receipt_verifier.py retained \
            --planning planning --revision "$revision" \
            --receipt "$RECEIPT" --candidate "$CANDIDATE" --plan "$plan_rev"
          {
            echo "## Receipt shadow consumption (informational, never required)"
            echo "- receipt: \`$RECEIPT\`"
            echo "- plan revision: \`$plan_rev\`"
            echo "- candidate: \`$CANDIDATE\`"
            echo "- final publication: \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"
