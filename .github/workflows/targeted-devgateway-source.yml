name: "Targeted · Devgateway Source"

on:
  push:
    branches:
      - fix/v0418-gofmt-devgateway-test

permissions:
  contents: read

concurrency:
  group: targeted-devgateway-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: "Source · Devgateway"
    runs-on: [self-hosted, Linux, X64, baseharbor, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/devgateway/gateway_test.go)"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Devgateway tests
        shell: bash
        run: go test ./internal/devgateway
