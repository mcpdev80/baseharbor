name: Onboarding branch focused verification
on:
  push:
    branches:
      - feat/0427-zero-friction-core-workstation-onboarding
permissions:
  contents: read
concurrency:
  group: onboarding-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    name: Workstation invitation and CLI compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test invitation and compile Core CLI
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./internal/onboardingbundle ./internal/workstationenrollment/http ./internal/onboardingwizard ./internal/operatorauth
          go test -p 1 ./internal/database -run '^CompileOnlyNeverRuns$'
          go test -p 1 ./cmd/baha -run '^(TestDeviceOnlyRemoteMachineDiscoveryMakesRequest|TestDeviceOnlySourceUploadMakesRequest|TestWriteExclusiveOnboardingProfile|TestWriteExclusiveOnboardingProfileRejectsSymlink|TestPrivateOnboardingDirectoryPreflight|TestEnsurePrivateOnboardingDirectory)$'
          go test -p 1 ./internal/controlplaneruntime -run '^TestWorkstationOnlyEnrollmentUsesLocalCoreAuthority$'
      - name: Validate Go formatting without modifying sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            cmd/baha/management_remote_connection.go
            cmd/baha/management_remote_machine.go
            cmd/baha/management_remote_source_upload.go
            cmd/baha/serve_managed_tls.go
            cmd/baha/onboarding_import_command.go
            cmd/baha/onboarding_import_preflight_test.go
            cmd/baha/management_remote_machine_device_test.go
            internal/controlplaneruntime/server.go
            internal/controlplaneruntime/server_run.go
            internal/controlplaneruntime/server_test.go
            internal/database/operator_bootstrap.go
            internal/onboardingbundle/bundle_test.go
            internal/onboardingbundle/redeem_test.go
            internal/onboardingwizard/onboardingwizard.go
            internal/onboardingwizard/wizard_test.go
            internal/operatorauth/authorization_test.go
          )
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          fi
