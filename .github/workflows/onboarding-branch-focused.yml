name: Onboarding branch focused verification
on:
  push:
    branches:
      - feat/0427-zero-friction-core-workstation-onboarding
permissions:
  contents: read
concurrency:
  group: onboarding-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    name: Workstation invitation and CLI compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test invitation and compile Core CLI
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 ./internal/onboardingbundle ./internal/workstationenrollment/http
          go test -p 1 ./internal/database -run '^CompileOnlyNeverRuns'
          go test -p 1 ./cmd/baha -run '^CompileOnlyNeverRuns'
          go test -p 1 ./internal/controlplaneruntime -run '^CompileOnlyNeverRuns'
      - name: Canonical formatting of touched Go files
        shell: bash
        run: |
          set -euo pipefail
          for file in internal/onboardingbundle/*.go internal/workstationenrollment/http/delegated_enroll*.go internal/database/local_tenant_bootstrap.go cmd/baha/onboarding_local_grant.go cmd/baha/onboarding_initial_tenant.go cmd/baha/onboarding_invite_command.go cmd/baha/onboarding_import_command.go cmd/baha/workstation_revocation.go cmd/baha/onboarding_command.go internal/controlplaneruntime/workstation_auth.go; do
            gofmt -w "$file"
            printf 'FMTFILE|%s|%s\n' "$file" "$(base64 -w0 "$file")"
          done
