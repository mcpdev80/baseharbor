name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baseharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseharbor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BASEHARBOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baseharbor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate compose
        run: |
          cat > /tmp/baseharbor-runtime.env <<'EOF'
          BASEHARBOR_POSTGRES_DB=baseharbor
          BASEHARBOR_POSTGRES_USER=baseharbor
          BASEHARBOR_POSTGRES_PASSWORD=ci-only
          BASEHARBOR_POSTGRES_PORT=15432
          BASEHARBOR_OPENBAO_PORT=18200
          EOF
          docker compose --file internal/runtime/assets/compose.yaml --env-file /tmp/baseharbor-runtime.env config --quiet
      - name: Build baha
        run: go build -o /tmp/baha ./cmd/baha
      - name: Smoke test baha binary
        run: |
          /tmp/baha --help >/tmp/baha-help.txt
          grep -q "Usage:" /tmp/baha-help.txt
          /tmp/baha app --help >/tmp/baha-app-help.txt
          grep -q "apply" /tmp/baha-app-help.txt
          grep -q "status" /tmp/baha-app-help.txt
          grep -q "doctor" /tmp/baha-app-help.txt
          /tmp/baha app create --help >/tmp/baha-app-create-help.txt
          grep -q -- "--environment" /tmp/baha-app-create-help.txt
          /tmp/baha app apply --help >/tmp/baha-app-apply-help.txt
          grep -q "plan, preflight, apply and verification" /tmp/baha-app-apply-help.txt
          /tmp/baha app status --help | grep -q "actual PostgreSQL readiness"
          /tmp/baha app doctor --help | grep -q "without mutating"
          /tmp/baha version | grep -q '^baha '
          set +e
          /tmp/baha does-not-exist >/tmp/baha-invalid.out 2>/tmp/baha-invalid.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "unknown command" /tmp/baha-invalid.err
      - name: Verify application PostgreSQL vertical slice
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          /tmp/baha app create ci-demo --postgres
          /tmp/baha app plan ci-demo | grep -q "dedicated PostgreSQL service"
          /tmp/baha app preflight ci-demo | grep -q "Preflight passed"
          /tmp/baha app apply ci-demo | grep -q "Application ci-demo is ready"
          /tmp/baha app status ci-demo | grep -q "authenticated SELECT 1 succeeded"
          /tmp/baha app doctor ci-demo | grep -q "Application runtime is healthy"
          test -f .baseharbor/apps/ci-demo/runtime/compose.yaml
          ! grep -q "ports:" .baseharbor/apps/ci-demo/runtime/compose.yaml
          docker compose --project-name baseharbor-ci-demo-dev --file .baseharbor/apps/ci-demo/runtime/compose.yaml --env-file .baseharbor/apps/ci-demo/runtime/runtime.env down -v
