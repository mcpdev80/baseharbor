name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baseharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseharbor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BASEHARBOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baseharbor_test?sslmode=disable
      BASEHARBOR_RUNTIME_IMAGE: baseharbor-runtime:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate compose
        run: |
          cat > /tmp/baseharbor-runtime.env <<'EOF'
          BASEHARBOR_POSTGRES_DB=baseharbor
          BASEHARBOR_POSTGRES_USER=baseharbor
          BASEHARBOR_POSTGRES_PASSWORD=ci-only
          BASEHARBOR_POSTGRES_PORT=15432
          BASEHARBOR_OPENBAO_PORT=18200
          EOF
          docker compose --file internal/runtime/assets/compose.yaml --env-file /tmp/baseharbor-runtime.env config --quiet
      - name: Build baha
        run: go build -o /tmp/baha ./cmd/baha
      - name: Build runtime broker image
        run: docker build --pull -t "$BASEHARBOR_RUNTIME_IMAGE" -f deploy/control-plane/Dockerfile .
      - name: Smoke test baha binary
        run: |
          /tmp/baha --help >/tmp/baha-help.txt
          grep -q "Usage:" /tmp/baha-help.txt
          grep -q "openbao" /tmp/baha-help.txt
          /tmp/baha app --help >/tmp/baha-app-help.txt
          grep -q "init" /tmp/baha-app-help.txt
          grep -q "apply" /tmp/baha-app-help.txt
          grep -q "down" /tmp/baha-app-help.txt
          grep -q "up" /tmp/baha-app-help.txt
          grep -q "destroy" /tmp/baha-app-help.txt
          grep -q "secret" /tmp/baha-app-help.txt
          /tmp/baha app init --help >/tmp/baha-app-init-help.txt
          grep -q "baseharbor.yaml" /tmp/baha-app-init-help.txt
          grep -q -- "--postgres-instance" /tmp/baha-app-init-help.txt
          grep -q -- "--redis-instance" /tmp/baha-app-init-help.txt
          grep -q -- "--require-secret" /tmp/baha-app-init-help.txt
          /tmp/baha app create --help >/tmp/baha-app-create-help.txt
          grep -q -- "--redis" /tmp/baha-app-create-help.txt
          grep -q -- "--require-secret" /tmp/baha-app-create-help.txt
          /tmp/baha app apply --help | grep -q "secrets.required"
          /tmp/baha app status --help | grep -q "present and readable"
          /tmp/baha app doctor --help | grep -q "presence/usability"
          /tmp/baha app down --help | grep -q "preserving persistent data"
          /tmp/baha app up --help | grep -q "required application secrets"
          /tmp/baha app destroy --help | grep -q -- "--yes"
          /tmp/baha openbao --help | grep -q "Bootstrap and operate"
          /tmp/baha openbao bootstrap --help | grep -q -- "--recovery-file"
          /tmp/baha openbao unseal --help | grep -q "host command argument list"
          /tmp/baha version | grep -q '^baha '
          set +e
          /tmp/baha does-not-exist >/tmp/baha-invalid.out 2>/tmp/baha-invalid.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "unknown command" /tmp/baha-invalid.err
      - name: Verify application PostgreSQL and Valkey lifecycle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          /tmp/baha app create ci-demo --postgres --redis
          /tmp/baha app plan ci-demo | grep -q "dedicated PostgreSQL service"
          /tmp/baha app plan ci-demo | grep -q "authenticated Valkey service"
          /tmp/baha app preflight ci-demo | grep -q "Preflight passed"
          /tmp/baha app apply ci-demo | grep -q "Application ci-demo is ready"
          /tmp/baha app status ci-demo | grep -q "authenticated SELECT 1 succeeded"
          /tmp/baha app status ci-demo | grep -q "authenticated PING returned PONG"
          /tmp/baha app doctor ci-demo | grep -q "Application runtime is healthy"
          test -f .baseharbor/apps/ci-demo/runtime/compose.yaml
          ! grep -q "ports:" .baseharbor/apps/ci-demo/runtime/compose.yaml

          docker compose --project-name baseharbor-ci-demo-dev --file .baseharbor/apps/ci-demo/runtime/compose.yaml --env-file .baseharbor/apps/ci-demo/runtime/runtime.env exec -T postgres psql -U baseharbor -d ci_demo_dev -c "CREATE TABLE lifecycle_probe (value text NOT NULL); INSERT INTO lifecycle_probe VALUES ('preserved');"
          docker compose --project-name baseharbor-ci-demo-dev --file .baseharbor/apps/ci-demo/runtime/compose.yaml --env-file .baseharbor/apps/ci-demo/runtime/runtime.env exec -T valkey sh -ec 'VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli set lifecycle_probe preserved' | grep -q '^OK$'
          env_hash_before=$(sha256sum .baseharbor/apps/ci-demo/runtime/runtime.env | awk '{print $1}')

          /tmp/baha app down ci-demo | grep -q "Persistent data is preserved"
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-demo-dev)"
          docker volume inspect baseharbor-ci-demo-dev_postgres-data >/dev/null
          docker volume inspect baseharbor-ci-demo-dev_valkey-data >/dev/null

          /tmp/baha app up ci-demo | grep -q "running and ready"
          env_hash_after=$(sha256sum .baseharbor/apps/ci-demo/runtime/runtime.env | awk '{print $1}')
          test "$env_hash_before" = "$env_hash_after"
          /tmp/baha app status ci-demo | grep -q "authenticated SELECT 1 succeeded"
          /tmp/baha app status ci-demo | grep -q "authenticated PING returned PONG"
          docker compose --project-name baseharbor-ci-demo-dev --file .baseharbor/apps/ci-demo/runtime/compose.yaml --env-file .baseharbor/apps/ci-demo/runtime/runtime.env exec -T postgres psql -U baseharbor -d ci_demo_dev -tAc "SELECT value FROM lifecycle_probe" | grep -q '^preserved$'
          docker compose --project-name baseharbor-ci-demo-dev --file .baseharbor/apps/ci-demo/runtime/compose.yaml --env-file .baseharbor/apps/ci-demo/runtime/runtime.env exec -T valkey sh -ec 'VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli get lifecycle_probe' | grep -q '^preserved$'

          /tmp/baha app destroy ci-demo | grep -q "No changes were made"
          test -d .baseharbor/apps/ci-demo
          docker volume inspect baseharbor-ci-demo-dev_postgres-data >/dev/null
          docker volume inspect baseharbor-ci-demo-dev_valkey-data >/dev/null

          /tmp/baha app destroy ci-demo --yes | grep -q "permanently destroyed"
          test ! -e .baseharbor/apps/ci-demo
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-ci-demo-dev)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=baseharbor-ci-demo-dev)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=baseharbor-ci-demo-dev)"
      - name: Verify OpenBao bootstrap, required secrets, generated secrets and manual unseal lifecycle
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          mkdir -p .baseharbor/runtime
          chmod 700 .baseharbor .baseharbor/runtime
          cat > .baseharbor/runtime/runtime.env <<'EOF'
          BASEHARBOR_POSTGRES_DB=baseharbor
          BASEHARBOR_POSTGRES_USER=baseharbor
          BASEHARBOR_POSTGRES_PASSWORD=ci-control-plane-only
          BASEHARBOR_POSTGRES_PORT=15432
          BASEHARBOR_OPENBAO_PORT=18200
          EOF
          chmod 600 .baseharbor/runtime/runtime.env

          /tmp/baha up | grep -q "control-plane runtime started"

          set +e
          /tmp/baha openbao status >/tmp/openbao-before.out 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "not initialized" /tmp/openbao-before.out

          recovery="$workdir/openbao-recovery.json"
          /tmp/baha openbao bootstrap --recovery-file "$recovery" | tee /tmp/openbao-bootstrap.out
          test "$(stat -c '%a' "$recovery")" = "600"
          test "$(stat -c '%a' .baseharbor/runtime/openbao-admin.env)" = "600"
          ! grep -q 'root_token' "$recovery"
          ! grep -Eq 'ROOT|UNSEAL' .baseharbor/runtime/openbao-admin.env
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

          /tmp/baha app create required-demo --postgres --require-secret API_TOKEN
          /tmp/baha app show required-demo | tee /tmp/required-show.out
          grep -q 'Application: required-demo' /tmp/required-show.out
          grep -q 'Status: NOT READY' /tmp/required-show.out
          grep -Eq '^  required +1$' /tmp/required-show.out
          ! grep -q 'API_TOKEN' /tmp/required-show.out
          ! grep -q 'postgres://' /tmp/required-show.out
          /tmp/baha app plan required-demo | grep -q "secret:API_TOKEN"
          /tmp/baha app preflight required-demo | tee /tmp/required-preflight.out
          grep -q $'API_TOKEN\tunknown - secret scope not materialized yet\tbaha app secret set API_TOKEN --stdin' /tmp/required-preflight.out

          set +e
          /tmp/baha app apply required-demo >/tmp/required-missing.out 2>&1
          required_code=$?
          set -e
          test "$required_code" -eq 1
          grep -q "required secrets check failed" /tmp/required-missing.out
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-required-demo-dev)"

          /tmp/baha app preflight required-demo >/tmp/required-preflight-missing.out 2>&1 || true
          grep -q $'API_TOKEN\tmissing - user input required\tbaha app secret set API_TOKEN --stdin' /tmp/required-preflight-missing.out
          grep -q "No application secrets have been configured yet." /tmp/required-preflight-missing.out

          printf '%s' 'integration-secret' | /tmp/baha app secret set required-demo API_TOKEN --stdin
          /tmp/baha app apply required-demo | grep -q "Application required-demo is ready"
          /tmp/baha app status required-demo | tee /tmp/required-status.out
          grep -q $'API_TOKEN\tpresent\t-' /tmp/required-status.out
          grep -q "all required secret values are present and readable" /tmp/required-status.out
          /tmp/baha app doctor required-demo | tee /tmp/required-doctor.out
          grep -q $'API_TOKEN\tpresent\t-' /tmp/required-doctor.out
          grep -q "Application runtime is healthy" /tmp/required-doctor.out

          /tmp/baha app down required-demo | grep -q "Persistent data is preserved"
          /tmp/baha app secret delete required-demo API_TOKEN --yes | grep -q "permanently deleted"
          set +e
          /tmp/baha app up required-demo >/tmp/required-up-missing.out 2>&1
          required_up_code=$?
          set -e
          test "$required_up_code" -eq 1
          grep -q "required application secrets" /tmp/required-up-missing.out
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=baseharbor-required-demo-dev)"

          printf '%s' 'integration-secret-2' | /tmp/baha app secret set required-demo API_TOKEN --stdin
          /tmp/baha app up required-demo | grep -q "running and ready"
          /tmp/baha app destroy required-demo --yes | grep -q "permanently destroyed"

          mkdir generated-app
          cd generated-app
          cat > baseharbor.yaml <<'EOF'
          version: 1
          app:
            name: generated-demo
            environment: dev
          services:
            postgres:
              enabled: true
            redis:
              enabled: false
            secrets:
              enabled: true
          secrets:
            required:
              - name: SECRET_KEY
                generate:
                  type: random
                  length: 64
              - name: EXTERNAL_TOKEN
          EOF

          export BASEHARBOR_STATE_DIR="$workdir/.baseharbor/runtime"
          /tmp/baha app preflight | tee /tmp/generated-preflight-before.out
          grep -q "SECRET_KEY" /tmp/generated-preflight-before.out
          grep -q "EXTERNAL_TOKEN" /tmp/generated-preflight-before.out

          set +e
          /tmp/baha app apply >/tmp/generated-first-apply.out 2>&1
          generated_code=$?
          set -e
          test "$generated_code" -eq 1
          grep -q $'\[OK\] generated-secret  SECRET_KEY materialized in managed secret storage' /tmp/generated-first-apply.out
          grep -q "required secrets check failed" /tmp/generated-first-apply.out
          grep -q "EXTERNAL_TOKEN" /tmp/generated-first-apply.out

          /tmp/baha app preflight >/tmp/generated-preflight-after.out 2>&1 || true
          grep -q $'SECRET_KEY\tpresent\t-' /tmp/generated-preflight-after.out
          grep -q $'EXTERNAL_TOKEN\tmissing - user input required\tbaha app secret set EXTERNAL_TOKEN --stdin' /tmp/generated-preflight-after.out

          /tmp/baha app secret list | grep -q '^SECRET_KEY$'
          printf '%s' 'external-integration-token' | /tmp/baha app secret set EXTERNAL_TOKEN --stdin
          /tmp/baha app apply | tee /tmp/generated-second-apply.out
          grep -q "Application generated-demo is ready" /tmp/generated-second-apply.out
          ! grep -q "generated-secret" /tmp/generated-second-apply.out
          /tmp/baha app status | tee /tmp/generated-status.out
          grep -q $'SECRET_KEY\tpresent\t-' /tmp/generated-status.out
          grep -q $'EXTERNAL_TOKEN\tpresent\t-' /tmp/generated-status.out
          /tmp/baha app doctor | grep -q "Application runtime is healthy"
          /tmp/baha app destroy --yes | grep -q "permanently destroyed"
          cd "$workdir"
          unset BASEHARBOR_STATE_DIR

          docker compose --project-name baseharbor --file .baseharbor/runtime/compose.yaml --env-file .baseharbor/runtime/runtime.env restart openbao
          for i in $(seq 1 20); do
            set +e
            docker compose --project-name baseharbor --file .baseharbor/runtime/compose.yaml --env-file .baseharbor/runtime/runtime.env exec -T openbao bao status >/dev/null 2>&1
            code=$?
            set -e
            if [ "$code" -eq 2 ]; then
              break
            fi
            sleep 1
          done
          test "$code" -eq 2

          set +e
          /tmp/baha openbao status >/tmp/openbao-sealed.out 2>&1
          status_code=$?
          set -e
          test "$status_code" -eq 1
          grep -q "sealed" /tmp/openbao-sealed.out

          /tmp/baha openbao unseal --recovery-file "$recovery" | grep -q "manager AppRole authentication succeeded"
          /tmp/baha openbao status | grep -q "AppRole login succeeded"

          docker compose --project-name baseharbor --file .baseharbor/runtime/compose.yaml --env-file .baseharbor/runtime/runtime.env down -v
