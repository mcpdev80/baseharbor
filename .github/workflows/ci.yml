name: "CI · Source & Quality"

run-name: "CI · ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - 'runtime-validation/ci/**'
      - 'runtime-validation/source-preflight/**'
      - 'runtime-validation/ha/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow_policy:
    name: Workflow policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Enforce fixed workflow surface
        run: bash scripts/ci-workflow-policy.sh

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

  release_source_preflight:
    name: Release Source Preflight
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/source-preflight/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASEHARBOR_TEST_DATABASE_URL: postgres://postgres:source-test-password@127.0.0.1:5432/baseharbor_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baseharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: source-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseharbor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce workflow policy
        run: bash scripts/ci-workflow-policy.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install validation tooling
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec contracts)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            for path in $files; do
              echo "PUBLIC_FORMAT_PATH:$path"
              gofmt "$path" | base64 -w 0 | fold -w 3072 | sed 's/^/PUBLIC_FORMAT_CHUNK:/'
            done
            exit 1
          }

      - name: Validate source readability
        run: bash scripts/source-readability-audit.sh

      - name: Run release-source tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./contracts/... ./internal/... ./spec/...
          BASEHARBOR_LOGS_ENABLED=false go test ./cmd/baha
          go vet ./...

      - name: Exercise enrollment and operator boundary races
        shell: bash
        run: |
          go test -race -p 2 ./internal/coreinstallation ./internal/operatorauth ./internal/machinehttp ./internal/targetenrollment ./internal/targetsession ./internal/runtimeexplorer ./internal/runtime/terminal -count=1
          go test -race ./internal/runtime/terminal -run TestPTYInputResizeExitAndCancellation -count=25
          go test -race -p 2 ./cmd/baha -run '^TestNodeDisconnect' -count=1

      - name: Validate documentation
        shell: bash
        run: |
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Validate v0.4.21 release readiness
        shell: bash
        run: bash scripts/v0.4.21-readiness.sh

      - name: Validate workflow syntax
        shell: bash
        run: "$RUNNER_TEMP/bin/actionlint -shellcheck="

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Verify release snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt

      - name: Build exact candidate binary
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath             -ldflags="-s -w -X main.version=v0.4.21 -X main.commit=$candidate_sha -X main.date=unknown"             -o "$RUNNER_TEMP/baha" ./cmd/baha
          "$RUNNER_TEMP/baha" version | grep -F "$candidate_sha"

  targeted_ha_docker:
    name: Targeted HA · docker
    concurrency:
      group: baseharbor-release-qualification
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/') && (contains(github.ref_name, '/docker/') || contains(github.ref_name, '/both/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASEHARBOR_TEST_RUNTIME: docker
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve HA group
        id: group
        shell: bash
        run: |
          set -euo pipefail
          rest="${GITHUB_REF_NAME#runtime-validation/ha/}"
          group="${rest%%/*}"
          case "$group" in data|control-plane|valkey|rabbitmq|seaweedfs|identity|observability|routing) ;; *) exit 2 ;; esac
          echo "value=$group" >> "$GITHUB_OUTPUT"
      - name: Reset Docker runtime
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker
      - name: Run targeted HA acceptance
        shell: bash
        run: bash scripts/v0.4.21-ha-acceptance.sh "${{ steps.group.outputs.value }}"
      - name: Cleanup Docker runtime
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  targeted_ha_podman:
    name: Targeted HA · podman
    concurrency:
      group: baseharbor-release-qualification
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref_name, 'runtime-validation/ha/') && (contains(github.ref_name, '/podman/') || contains(github.ref_name, '/both/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BASEHARBOR_TEST_RUNTIME: podman
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve HA group
        id: group
        shell: bash
        run: |
          set -euo pipefail
          rest="${GITHUB_REF_NAME#runtime-validation/ha/}"
          group="${rest%%/*}"
          case "$group" in data|control-plane|valkey|rabbitmq|seaweedfs|identity|observability|routing) ;; *) exit 2 ;; esac
          echo "value=$group" >> "$GITHUB_OUTPUT"
      - name: Reset Podman runtime
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh podman
      - name: Run targeted HA acceptance
        shell: bash
        run: bash scripts/v0.4.21-ha-acceptance.sh "${{ steps.group.outputs.value }}"
      - name: Cleanup Podman runtime
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh podman

  validate:
    if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'runtime-validation/source-preflight/') && !startsWith(github.ref_name, 'runtime-validation/ha/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: baseharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseharbor_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      BASEHARBOR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baseharbor_test?sslmode=disable
      BASEHARBOR_TEST_RUNTIME: docker

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Prepare verified rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Reset persistent runner state
        id: reset
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Install validation tooling
        id: tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflow syntax
        id: workflow_syntax
        run: "$(go env GOPATH)/bin/actionlint -shellcheck="

      - name: Validate documentation
        id: docs
        run: |
          mkdocs build --strict --config-file mkdocs.yml
          mkdocs build --strict --config-file mkdocs.de.yml
          bash scripts/documentation-audit.sh

      - name: Check formatting
        id: formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal spec contracts)"
          test -z "$files" || {
            echo "gofmt required:" >&2
            echo "$files" >&2
            gofmt -d $files >&2
            exit 1
          }

      - name: Validate source readability
        id: source_readability
        run: bash scripts/source-readability-audit.sh

      - name: Run unit and package tests
        id: unit_tests
        run: go test ./...

      # The package suite may provision a test Core using the shared docker-dev
      # engine. Native lifecycle tests must start from a clean, independently
      # owned CI runtime. Use the dedicated runner's existing reset contract,
      # never relax the production same-engine Core ownership guard.
      - name: Reset dedicated CI runtime before native integration
        shell: bash
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Run runtime integration tests serially
        id: runtime_integration
        env:
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
          BASEHARBOR_PROVIDER_POSTGRESQL_SCOPE: application
          BASEHARBOR_PROVIDER_VALKEY_SCOPE: application
          BASEHARBOR_PROVIDER_OPENBAO_SCOPE: application
        run: |
          set -euo pipefail
          go test -p 1 ./cmd/baha ./internal/application -run '^(TestRepositoryWorkflowRealLifecycle|TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI|TestRepositoryComposeWorkloadOnlyLifecycleInCI|TestRepositoryComposePinnedWorkloadLifecycleInCI|TestRepositoryBuildWorkloadRebuildsSourceChangesInCI|TestMultiInstanceComposeLifecycleInCI)$' -count=1 -json | tee "$RUNNER_TEMP/runtime-integration.jsonl"
          python3 - "$RUNNER_TEMP/runtime-integration.jsonl" <<'PY'
          import json, pathlib, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          required = {
              'TestRepositoryWorkflowRealLifecycle',
              'TestRepositoryComposeWorkloadUsesBaseHarborBackendsInCI',
              'TestRepositoryComposeWorkloadOnlyLifecycleInCI',
              'TestRepositoryComposePinnedWorkloadLifecycleInCI',
              'TestRepositoryBuildWorkloadRebuildsSourceChangesInCI',
              'TestMultiInstanceComposeLifecycleInCI',
          }
          if any(e.get('Action') in {'skip', 'fail'} for e in events):
              raise SystemExit('Required native runtime test skipped or failed')
          for name in sorted(required):
              if sum(e.get('Test') == name and e.get('Action') == 'pass' for e in events) != 1:
                  raise SystemExit(f'Required native runtime test missing exact PASS: {name}')
          packages = {'github.com/mcpdev80/baseharbor/cmd/baha',
                      'github.com/mcpdev80/baseharbor/internal/application'}
          for package in packages:
              if not any(e.get('Package') == package and 'Test' not in e
                         and e.get('Action') == 'pass' for e in events):
                  raise SystemExit(f'Required native runtime package did not PASS: {package}')
          print('PASS: all six native runtime tests and both package teardowns')
          PY

      - name: Run Go vet
        id: vet
        run: go vet ./...

      - name: Validate Compose model
        id: compose_model
        shell: bash
        run: |
          cat > /tmp/baseharbor-runtime.env <<'EOF'
          BASEHARBOR_POSTGRES_DB=baseharbor
          BASEHARBOR_POSTGRES_USER=baseharbor
          BASEHARBOR_POSTGRES_PASSWORD=ci-only
          BASEHARBOR_POSTGRES_PORT=15432
          BASEHARBOR_OPENBAO_PORT=18200
          EOF
          docker compose             --file internal/runtime/assets/compose.yaml             --env-file /tmp/baseharbor-runtime.env             config --quiet

      - name: Build and smoke-test CLI
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/baha ./cmd/baha
          /tmp/baha --help >/tmp/baha-help.txt
          /tmp/baha app --help >/tmp/baha-app-help.txt
          /tmp/baha agent describe -o json >/tmp/baha-agent.json
          grep -q "Usage:" /tmp/baha-help.txt
          grep -q "init" /tmp/baha-app-help.txt
          grep -q '"contract_version":"v1"' /tmp/baha-agent.json
          /tmp/baha version | grep -q '^baha '

      - name: Cleanup persistent runner state
        id: cleanup
        if: always()
        shell: bash
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

  pr_native_impact:
    name: PR · Native impact selection
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - name: Checkout trusted develop policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact PR native impact
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          changed="$(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")"
          required="$(printf '%s\n' "$changed" | bash scripts/ci-single-default-impact.sh)"
          # Conservative fallback: unknown CLI source edits must run rather than silently skip.
          if [ "$required" != true ] && printf '%s\n' "$changed" | grep -Eq '^cmd/baha/.*\.go$'; then
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Native runtime acceptance required: $required" >> "$GITHUB_STEP_SUMMARY"

  pr_native_destroy:
    name: PR · Native destroy retry · ${{ matrix.runtime }}
    needs: pr_native_impact
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_native_impact.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: docker
            runner: ubuntu-latest
          - runtime: podman
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_SINGLE_DEFAULT_NATIVE_ACCEPTANCE: "1"
    steps:
      - name: Checkout exact PR integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare isolated rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Verify actual native destroy and retry, fail on SKIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/ci-native-installation-destroy.sh
      - name: Prove isolated Greenfield Core lifecycle on actual engine
        env:
          BASEHARBOR_GREENFIELD_NATIVE_ACCEPTANCE: "1"
          BASEHARBOR_CI_RUNTIME_INTEGRATION: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -p 1 ./cmd/baha -run '^TestGreenfieldIsolatedCoreNativeInCI$' -count=1 -timeout 16m -json | tee greenfield.jsonl
          git rev-parse HEAD > greenfield.jsonl.sha
      - name: Publish exact Greenfield report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: greenfield-proof-${{ matrix.runtime }}
          path: |
            greenfield.jsonl
            greenfield.jsonl.sha
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup native runtime
        if: always()
        run: bash scripts/ci-runtime-reset.sh "${{ matrix.runtime }}"

  pr_native_greenfield_proof:
    name: PR · Native Greenfield two-engine proof
    needs: [pr_native_impact, pr_native_destroy]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_native_impact.outputs.required == 'true' && needs.pr_native_destroy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: greenfield-proof-docker
          path: greenfield/docker
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: greenfield-proof-podman
          path: greenfield/podman
      - name: Verify both exact-head native reports and teardown
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci-greenfield-isolation-proof.py --sha "$GITHUB_SHA" --docker greenfield/docker/greenfield.jsonl --podman greenfield/podman/greenfield.jsonl

  source_format:
    name: PR · Source format
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check source format and readability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"
          read -r -a source_parents <<< "$(git rev-list --parents -n 1 "$INTEGRATION_SHA")"
          if [ "${#source_parents[@]}" -eq 3 ] && [ "${source_parents[2]}" = "$HEAD_SHA" ]; then
            format_base="${source_parents[1]}"
            git merge-base --is-ancestor "$BASE_SHA" "$format_base"
          elif [ "${#source_parents[@]}" -eq 2 ] && [ "$INTEGRATION_SHA" = "$HEAD_SHA" ]; then
            format_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          else
            echo "format candidate has unexpected PR source parents" >&2
            exit 1
          fi
          git diff --name-only -z --diff-filter=ACMRT "$format_base" "$INTEGRATION_SHA" -- '*.go' > "$RUNNER_TEMP/format-paths"
          mapfile -d '' -t go_files < "$RUNNER_TEMP/format-paths"
          if [ "${#go_files[@]}" -gt 0 ]; then
            files="$(gofmt -l -- "${go_files[@]}")"
            test -z "$files" || { echo "$files"; exit 1; }
          fi
          bash scripts/source-readability-audit.sh

  pr_plan:
    name: PR · Trusted Plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.unit_split.outputs.validation_matrix }}
      unit_scope: ${{ steps.unit_split.outputs.unit_scope }}
      unit_matrix: ${{ steps.unit_split.outputs.unit_matrix }}
      consumer_mode: ${{ steps.plan.outputs.consumer_mode }}
      runtime_matrix: ${{ steps.incremental.outputs.runtime_matrix || steps.plan.outputs.runtime_matrix }}
      runtime_required: ${{ steps.plan.outputs.runtime_required }}
      owner_node_required: ${{ steps.owner_node.outputs.required }}
      demo_ref: ${{ steps.demo_source.outputs.sha }}
      public_contracts_required: ${{ steps.plan.outputs.public_contracts_required }}
      trusted_base_sha: ${{ steps.plan.outputs.trusted_base_sha }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect owner/node changes from the exact PR source diff
        id: owner_node
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/owner-node-paths"
          if grep -Eq '^(cmd/baha/(onboarding|operator_|node|serve_operator_oidc|control_plane_single_native_ci_test[.]go$)|internal/(onboardingwizard/|targetenrollment/|database/operator_bootstrap|identityprovider/operator))' "$RUNNER_TEMP/owner-node-paths"; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve exact immutable PR inputs using trusted base policy
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
          MIGRATION_CONTROLLER: a6756c5cd0f2a8ec43b0b7f777bf215bff2b9248
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" "$INTEGRATION_SHA" refs/heads/develop:refs/remotes/origin/pr-target-tip
          target_tip="$(git rev-parse refs/remotes/origin/pr-target-tip)"
          # Bootstrap only from the candidate's base parent after proving it
          # belongs to the fetched target history and follows the event base.
          # The event base itself may predate the current resolver interface.
          read -r -a parents <<< "$(git rev-list --parents -n 1 "$INTEGRATION_SHA")"
          if [ "${#parents[@]}" -eq 3 ] && [ "${parents[2]}" = "$HEAD_SHA" ]; then
            effective_base="${parents[1]}"
          elif [ "${#parents[@]}" -eq 2 ] && [ "$INTEGRATION_SHA" = "$HEAD_SHA" ]; then
            effective_base="$target_tip"
            git merge-base --is-ancestor "$effective_base" "$HEAD_SHA"
          else
            echo "candidate does not have the expected integration parents" >&2
            exit 1
          fi
          [[ "$effective_base" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASE_SHA" "$effective_base"
          git merge-base --is-ancestor "$effective_base" "$target_tip"
          git checkout --detach "$effective_base"
          # Resolver independently checks exact parents, clean tree and diff.
          if [ "$INTEGRATION_SHA" = "$HEAD_SHA" ]; then
            python3 scripts/pr-diff-base.py --target-base "$effective_base" --head "$HEAD_SHA" --integration "$INTEGRATION_SHA" --base-tip "$effective_base" > "$RUNNER_TEMP/pr-diff.json"
          else
            python3 scripts/pr-diff-base.py --target-base "$effective_base" --head "$HEAD_SHA" --integration "$INTEGRATION_SHA" > "$RUNNER_TEMP/pr-diff.json"
          fi
          # One immutable, locally checked controller deploys the simplification.
          # Once merged, ordinary trusted-target policy is used automatically.
          git fetch --no-tags origin "$MIGRATION_CONTROLLER"
          controller="$effective_base"
          if ! git merge-base --is-ancestor "$MIGRATION_CONTROLLER" "$effective_base"; then
            controller="$MIGRATION_CONTROLLER"
          fi
          echo "controller_sha=$controller" >> "$GITHUB_OUTPUT"
          git show "$controller:scripts/pr-gate-plan.py" > "$RUNNER_TEMP/pr-gate-plan.py"
          git show "$controller:scripts/pr-check-runner.py" > "$RUNNER_TEMP/pr-check-runner.py"
          python3 "$RUNNER_TEMP/pr-gate-plan.py" --diff "$RUNNER_TEMP/pr-diff.json" --requirements scripts/release-requirements.json --mapping scripts/pr-gate-map-v1.json > pr-plan.json
          python3 -c 'import json; p=json.load(open("pr-plan.json")); print("::warning::No narrow mapping: conservative checks selected.") if p.get("fallback_used") else None'
          echo "trusted_base_sha=$(python3 -c 'import json; print(json.load(open("pr-plan.json"))["target_base_sha"])')" >> "$GITHUB_OUTPUT"
          # Run the check-runner from the same trusted base checkout as the
          # planner, so a validation id emitted by the planner is always an id
          # the runner whitelist accepts. The base is pinned to base.sha with
          # persist-credentials:false, keeping the runner out of PR control.
          echo "matrix=$(python3 "$RUNNER_TEMP/pr-check-runner.py" matrix --plan pr-plan.json)" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin aa8caaa571a1b3a374ae37af43b224d234c7b6a0
          git show aa8caaa571a1b3a374ae37af43b224d234c7b6a0:scripts/pr-gate-dependencies.py > "$RUNNER_TEMP/pr-gate-dependencies.py"
          python3 "$RUNNER_TEMP/pr-gate-dependencies.py" --plan pr-plan.json --requirements scripts/release-requirements.json > "$RUNNER_TEMP/pr-gate-dependencies.json"
          python3 -c 'import json,sys; path=sys.argv[1]; plan=json.load(open(path)); dependencies=json.load(open(sys.argv[2])); plan["required_consumer_dependencies"]=dependencies["dependencies"]; open(path,"w").write(json.dumps(plan))' pr-plan.json "$RUNNER_TEMP/pr-gate-dependencies.json"
          mode="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' "$RUNNER_TEMP/pr-gate-dependencies.json")"
          # Cross-repository dependencies remain recorded in pr-plan.json, but
          # cannot gate independent PR merges. develop/release owns integration.
          echo "consumer_mode=none" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin 45500525aa65957a22e6076ac28fe5cb6c6f9610
          git show 45500525aa65957a22e6076ac28fe5cb6c6f9610:scripts/pr-selected-runtime-matrix.py > "$RUNNER_TEMP/pr-selected-runtime-matrix.py"
          python3 "$RUNNER_TEMP/pr-selected-runtime-matrix.py" --plan pr-plan.json --requirements scripts/release-requirements.json > "$RUNNER_TEMP/pr-runtime-matrix.json"
          echo "runtime_matrix=$(python3 -c 'import json,sys; print(json.dumps({"include":json.load(open(sys.argv[1]))["include"]},separators=(",",":")))' "$RUNNER_TEMP/pr-runtime-matrix.json")" >> "$GITHUB_OUTPUT"
          # Bootstrap only from this immutable Maintainer-authored commit until
          # pr-stage-boundary.py is in trusted develop. Never execute a PR copy.
          stage_controller="$controller"
          if ! git cat-file -e "$stage_controller:scripts/pr-stage-boundary.py" 2>/dev/null; then
            stage_controller=62178875c9e793bb3a269345c0c4c11945563880
            git fetch --no-tags origin "$stage_controller"
          fi
          git show "$stage_controller:scripts/pr-stage-boundary.py" > "$RUNNER_TEMP/pr-stage-boundary.py"
          python3 "$RUNNER_TEMP/pr-stage-boundary.py" --plan pr-plan.json
          # PR results require all self-contained validations, not the
          # cross-repo gates. Those remain visible as deferred integration.
          echo "runtime_required=false" >> "$GITHUB_OUTPUT"
          echo "public_contracts_required=false" >> "$GITHUB_OUTPUT"
      - name: Pin immutable Demo source for safe native result reuse
        id: demo_source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPLICIT_PR_DEMO_SHA: ${{ vars.BASEHARBOR_PR_DEMO_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.plan.outputs.runtime_required }}" != true ] && [ "${{ steps.plan.outputs.public_contracts_required }}" != true ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$EXPLICIT_PR_DEMO_SHA" ]; then
            demo_sha="$EXPLICIT_PR_DEMO_SHA"
          else
            demo_sha="$(gh api repos/mcpdev80/baseharbor-demo/git/ref/heads/main --jq '.object.sha')"
          fi
          [[ "$demo_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$demo_sha" >> "$GITHUB_OUTPUT"
      - name: Select incremental checks from authenticated previous PR run
        id: incremental
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
          CONTROLLER_SHA: ${{ steps.plan.outputs.controller_sha }}
          DEMO_REF: ${{ steps.demo_source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "$CONTROLLER_SHA:scripts/pr-incremental-reuse.py" 2>/dev/null; then
            git show "$CONTROLLER_SHA:scripts/pr-incremental-reuse.py" > "$RUNNER_TEMP/pr-incremental-reuse.py"
            python3 "$RUNNER_TEMP/pr-incremental-reuse.py" \
              --repo "$REPO" --branch "$BRANCH" --pr-number "$PR_NUMBER" \
              --head "$HEAD_SHA" --integration "$INTEGRATION_SHA" \
              --run-id "$RUN_ID" \
              --token "$GH_TOKEN" --demo-ref "$DEMO_REF" \
              --plan pr-plan.json --runtime-matrix "$RUNNER_TEMP/pr-runtime-matrix.json" \
              --output "$GITHUB_OUTPUT"
          else
            echo "::notice::Incremental controller not integrated yet: full normal checks"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-pr-plan
          path: pr-plan.json
          retention-days: 30

      - name: Route only required Go tests into mandatory parallel shards
        id: unit_split
        shell: bash
        env:
          SELECTED_MATRIX: ${{ steps.incremental.outputs.matrix || steps.plan.outputs.matrix }}
          VERIFIED_BASE: ${{ steps.plan.outputs.trusted_base_sha }}
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          plan = json.load(open('pr-plan.json'))
          requested = {row['id'] for row in plan['required_validation_checks']}
          selected = json.loads(os.environ['SELECTED_MATRIX'])
          rows = selected['include']
          if not isinstance(rows, list) or not rows or any(
              not isinstance(row, dict) or not isinstance(row.get('check'), str)
              for row in rows
          ):
              raise SystemExit('malformed PR validation matrix; refusing missing tests')
          keys = [row['check'] for row in rows]
          if len(set(keys)) != len(keys):
              raise SystemExit('duplicate PR validation check')
          if any(check != 'not-required' and check not in requested for check in keys):
              raise SystemExit('matrix selected a validation absent from trusted plan')
          # The exact verified source diff controls the executor's own full
          # regression even before the new planner policy reaches develop.
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT',
               os.environ['VERIFIED_BASE'], os.environ['VERIFIED_HEAD']],
              text=True).splitlines()
          unit_executor = {
              'scripts/pr-go-unit-shard.py',
              'scripts/pr-unit-database.sh',
              'scripts/test_pr_go_unit_shard.py',
              'scripts/test_pr_unit_database_route.py',
          }
          scope = 'full' if ('go-unit-tests' in requested or
                             unit_executor.intersection(changed)) else (
              'cli' if 'cli-package-tests' in requested else 'none')
          remaining = [row for row in rows
                       if row['check'] not in ('go-unit-tests', 'cli-package-tests')]
          if not remaining:
              remaining = [{'check': 'not-required'}]
          shards = ['cli-0', 'cli-1', 'cli-2']
          if scope == 'full':
              shards.extend(('packages', 'owner'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('validation_matrix=' + json.dumps(
                  {'include': remaining}, separators=(',', ':')) + '\n')
              output.write('unit_scope=' + scope + '\n')
              output.write('unit_matrix=' + json.dumps(
                  {'include': [{'shard': shard} for shard in shards]},
                  separators=(',', ':')) + '\n')
          print('Required Go scope:', scope, 'original selections:', keys)
          PY

  pr_runner_interface:
    name: PR · Runner Interface
    needs: pr_plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr_plan.outputs.trusted_base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integrated #896 isolation interface from trusted base
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_pr_runner_isolation.py -v
          python3 -m py_compile scripts/pr-runner-isolation.py
          echo "Verified integrated #896 in trusted PR base $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  pr_consumer_pins:
    name: PR · Consumer Pins
    needs: pr_plan
    outputs:
      demo_ref: ${{ steps.resolve.outputs.demo_ref }}
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.consumer_mode == 'ecosystem'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr_plan.outputs.trusted_base_sha }}
          persist-credentials: false
      - name: Resolve verified immutable v0.4.26 consumer graph
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ecosystem_release_pins.py --tag v0.4.26 --core "$INTEGRATION_SHA" --output "$RUNNER_TEMP/pr-consumer-pins.json" > "$RUNNER_TEMP/pr-consumer-result.json"
          test -s "$RUNNER_TEMP/pr-consumer-pins.json"
          echo "demo_ref=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["demo_ref"])' "$RUNNER_TEMP/pr-consumer-result.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-consumer-pins
          path: ${{ runner.temp }}/pr-consumer-pins.json
          if-no-files-found: error
          retention-days: 30

  pr_demo_pin:
    name: PR · Demo Pin
    needs: pr_plan
    outputs:
      demo_ref: ${{ steps.verify.outputs.demo_ref }}
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && (needs.pr_plan.outputs.runtime_required == 'true' || needs.pr_plan.outputs.public_contracts_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify exact Demo dependency against integration source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CORE_SHA: ${{ github.sha }}
          EXPLICIT_PR_DEMO_SHA: ${{ vars.BASEHARBOR_PR_DEMO_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          # PR qualification chooses an immutable Demo *source*; it never
          # rewrites or validates the Demo release-candidate Core pin.
          # A trusted repository variable can select a reviewed Demo SHA.
          # Otherwise resolve main ONCE, then verify that exact commit.
          demo_sha="${{ needs.pr_plan.outputs.demo_ref }}"
          [[ "$demo_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout https://github.com/mcpdev80/baseharbor-demo.git "$RUNNER_TEMP/pr-demo"
          git -C "$RUNNER_TEMP/pr-demo" fetch --depth=1 origin "$demo_sha"
          git -C "$RUNNER_TEMP/pr-demo" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pr-demo" rev-parse HEAD)" = "$demo_sha"
          test -s "$RUNNER_TEMP/pr-demo/baseharbor-core.ref"
          # BASEHARBOR_SOURCE_REF in existing demo/tests/acceptance.sh
          # forces the exact PR candidate; actual gate compatibility and
          # actual gate tests remain mandatory.
          echo "PR demo source $demo_sha paired with exact Core $EXPECTED_CORE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "$demo_sha" > "$RUNNER_TEMP/verified-demo.sha"
          echo "demo_ref=$demo_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-pr-demo-pin
          path: ${{ runner.temp }}/verified-demo.sha
          if-no-files-found: error
          retention-days: 30

  pr_candidate:
    name: PR · Exact Candidate
    needs: pr_plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.runtime_required == 'true' && github.event.pull_request.user.id == github.event.repository.owner.id && github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare candidate binary and image independently of Docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          out="$RUNNER_TEMP/pr-exact-candidate"
          mkdir -p "$out"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.commit=$GITHUB_SHA -X main.date=unknown" -o "$out/baha" ./cmd/baha
          "$out/baha" version | grep -F "$GITHUB_SHA"
          cp deploy/control-plane/Dockerfile.binary "$out/Dockerfile"
          docker build --pull -t localhost/baseharbor-runtime:pre-release "$out"
          docker image inspect localhost/baseharbor-runtime:pre-release >/dev/null
          docker save -o "$out/baseharbor-runtime-pre-release.tar" localhost/baseharbor-runtime:pre-release
          (cd "$out" && sha256sum baha baseharbor-runtime-pre-release.tar > checksums.sha256)
          printf '%s\n' "$GITHUB_SHA" > "$out/candidate.sha"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-exact-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-exact-candidate
          if-no-files-found: error
          retention-days: 30

  pr_focused:
    name: PR · Focused Python
    needs: pr_plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Focused source regressions (owner checks run only when selected)
        run: |
          set -euo pipefail
          python3 scripts/test_pr_diff_base.py
          python3 scripts/test_pr_required_final.py
          python3 scripts/test_pr_stage_boundary.py
          python3 scripts/test_pr_consumer_followup.py
          python3 scripts/test_pr_check_runner.py
          python3 scripts/test_pr_wizard_workflow_route.py
          python3 scripts/test_pr_runtime_request.py
          python3 scripts/test_pr_runner_isolation.py
          python3 scripts/test_ci_check_routes.py
          python3 scripts/test_ci_single_default_route.py
          python3 scripts/test_ci_keycloak_single_route.py
          python3 scripts/test_pr_ci_fallback.py
          python3 scripts/test_pr_unit_database_route.py
           python3 scripts/test_pr_go_unit_shard.py
          python3 scripts/test_pr_runtime_source.py
          python3 scripts/test_pr_gate_dependencies.py
          python3 scripts/test_pr_incremental_reuse.py
          python3 scripts/test_pr_draft_go_packages.py
          python3 scripts/test_pr_runtime_workflow_shape.py
          git fetch --no-tags origin 45500525aa65957a22e6076ac28fe5cb6c6f9610
          python3 scripts/test_pr_selected_runtime_matrix.py
          python3 scripts/test_ecosystem_release_pins.py
          python3 scripts/test_develop_ecosystem_source.py
          python3 scripts/test_develop_targeted_workflow.py
          python3 scripts/test_develop_ecosystem_final.py
          python3 scripts/test_targeted_gate_ref.py

  pr_unit_shards:
    name: PR · Go unit · ${{ matrix.shard }}
    needs: pr_plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.unit_scope != 'none'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pr_plan.outputs.unit_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute selected Go tests with isolated PostgreSQL
        shell: bash
        run: bash scripts/pr-unit-database.sh "${{ matrix.shard }}"

  pr_validations:
    name: PR · Validation · ${{ matrix.check }}
    needs: pr_plan
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pr_plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute existing validation owner without publication
        env:
          VALIDATION: ${{ matrix.check }}
          BASE_SHA: ${{ needs.pr_plan.outputs.controller_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VALIDATION" in
            not-required) echo 'NOT REQUIRED (not PASS)' ;;
            documentation-audit) bash scripts/documentation-audit.sh ;;
            mkdocs-en-strict|mkdocs-de-strict|pages-candidate-build)
              python -m pip install --disable-pip-version-check -r requirements-docs.txt
              case "$VALIDATION" in
                mkdocs-en-strict) mkdocs build --strict --config-file mkdocs.yml ;;
                mkdocs-de-strict) mkdocs build --strict --config-file mkdocs.de.yml ;;
                pages-candidate-build)
                  mkdocs build --strict --config-file mkdocs.yml
                  mkdocs build --strict --config-file mkdocs.de.yml
                  test -f site/index.html
                  ;;
              esac ;;
            go-unit-tests) bash scripts/pr-unit-database.sh ;;
            go-vet) go vet ./... ;;
            go-build) go build ./... ;;
            source-contracts)
              go test ./internal/application/... ./contracts/... -count=1 ;;
            cli-guided-tests) go test ./cmd/baha -run '^TestGuided' -count=1 ;;
            cli-gofmt) test -z "$(gofmt -l cmd/baha)" ;;
            pins-data-validation)
              git fetch --no-tags origin "$BASE_SHA"
              trusted_pins=$(mktemp -d "$RUNNER_TEMP/pins-validator.XXXXXX")
              for helper in pr-check-runner.py ecosystem_release_pins.py consumer_source_pins.py; do
                git show "$BASE_SHA:scripts/$helper" > "$trusted_pins/$helper"
              done
              python3 "$trusted_pins/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            wizard-*-tests)
              git fetch --no-tags origin "$BASE_SHA"
              git show "$BASE_SHA":scripts/pr-check-runner.py > "$RUNNER_TEMP/pr-check-runner.py"
              python3 "$RUNNER_TEMP/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            cli-vet) go vet ./cmd/baha ;;
            cli-build) go build -o "$RUNNER_TEMP/baha-validation" ./cmd/baha ;;
            capability-package-tests) go test ./internal/capability/... -count=1 ;;
            runtime-provider-package-tests)
              go test ./internal/runtime/... ./internal/health ./internal/providers/runtime/podman -count=1 -v | tee "$RUNNER_TEMP/runtime-provider-package-tests.log"
              grep -q '^--- PASS: TestPortableCoreRuntimeBoundary ' "$RUNNER_TEMP/runtime-provider-package-tests.log"
              grep -q '^--- PASS: TestRuntimeProviderPackageBoundaries ' "$RUNNER_TEMP/runtime-provider-package-tests.log"
              grep -q '^--- PASS: TestLocalAuthorityRequiresActualCompleteNativeInfo ' "$RUNNER_TEMP/runtime-provider-package-tests.log"
              go test ./cmd/baha -run '^(TestPodmanRuntimeDoctorChecksEmitsPodmanAndQuadlet|TestCollectControlPlaneDoctorChecksOmitsPodmanForDockerTarget|TestCollectControlPlaneDoctorChecksOmitsDockerEngineForPodmanTarget)$' -count=1 -v | tee "$RUNNER_TEMP/runtime-provider-doctor-tests.log"
              grep -q '^--- PASS: TestPodmanRuntimeDoctorChecksEmitsPodmanAndQuadlet ' "$RUNNER_TEMP/runtime-provider-doctor-tests.log"
              grep -q '^--- PASS: TestCollectControlPlaneDoctorChecksOmitsPodmanForDockerTarget ' "$RUNNER_TEMP/runtime-provider-doctor-tests.log"
              grep -q '^--- PASS: TestCollectControlPlaneDoctorChecksOmitsDockerEngineForPodmanTarget ' "$RUNNER_TEMP/runtime-provider-doctor-tests.log"
              ;;
            inspect-gofmt) test -z "$(gofmt -l internal/repositoryinspect)" ;;
            inspect-package-tests) go test ./internal/repositoryinspect/ -count=1 ;;
            inspect-vet) go vet ./internal/repositoryinspect/ ;;
            inspect-consumer-tests) go test ./cmd/baha -run 'Inspect|Reconcile' -count=1 ;;
            inspect-consumer-build) go build -o "$RUNNER_TEMP/baha-inspect" ./cmd/baha ;;
            resolver-gofmt) test -z "$(gofmt -l internal/runtime/resolver)" ;;
            resolver-package-tests)
              go test ./internal/runtime/resolver/ -count=1 -v | tee "$RUNNER_TEMP/resolver-package-tests.log"
              grep -q '^--- PASS: Test' "$RUNNER_TEMP/resolver-package-tests.log"
              ;;
            resolver-vet) go vet ./internal/runtime/resolver/ ;;
            resolver-consumer-build) go build -o "$RUNNER_TEMP/baha-resolver" ./cmd/baha ;;
            pr-planner-tests)
              python3 -m unittest scripts/test_pr_gate_plan.py ;;
            ci-policy) bash scripts/ci-workflow-policy.sh ;;
            ci-actionlint) go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= ;;
            ci-executor-tests|authority-package-tests|delivery-package-tests|deployment-package-tests|broker-package-tests|cli-package-tests|identity-provider-package-tests)
              if [ "$VALIDATION" = ci-executor-tests ]; then
                git fetch --no-tags origin 45500525aa65957a22e6076ac28fe5cb6c6f9610
              fi
              git fetch --no-tags origin "$BASE_SHA"
              git show "$BASE_SHA":scripts/pr-check-runner.py > "$RUNNER_TEMP/pr-check-runner.py"
              python3 "$RUNNER_TEMP/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            receipt-execution-tests)
              # Test commit binding and safe publication without CI evidence.
              git fetch --no-tags origin "$BASE_SHA"
              git show "$BASE_SHA":scripts/pr-check-runner.py > "$RUNNER_TEMP/pr-check-runner.py"
              python3 "$RUNNER_TEMP/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            openbao-package-tests)
              git fetch --no-tags origin "$BASE_SHA"
              git show "$BASE_SHA":scripts/pr-check-runner.py > "$RUNNER_TEMP/pr-check-runner.py"
              python3 "$RUNNER_TEMP/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            logs-package-tests)
              git fetch --no-tags origin "$BASE_SHA"
              git show "$BASE_SHA":scripts/pr-check-runner.py > "$RUNNER_TEMP/pr-check-runner.py"
              python3 "$RUNNER_TEMP/pr-check-runner.py" execute --check "$VALIDATION" --repository "$GITHUB_WORKSPACE"
              ;;
            *) exit 2 ;;
          esac

  pr_public_contracts:
    name: PR · Public Contracts
    needs: [pr_plan, pr_demo_pin]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.public_contracts_required == 'true' && needs.pr_demo_pin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute original public-contracts integration owner
        shell: bash
        env:
          CORE_SHA: ${{ github.sha }}
          DEMO_SHA: ${{ needs.pr_demo_pin.outputs.demo_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          [[ "$DEMO_SHA" =~ ^[a-f0-9]{40}$ ]]
          python3 scripts/pre-release-integration.py \
            --gate integration/static/public-contracts \
            --candidate "$CORE_SHA" --demo "$DEMO_SHA" --tag v0.4.26 \
            --output "$RUNNER_TEMP/integration-public-contracts"
  pr_runtime_selected:
    name: PR · Selected Runtime
    needs: [pr_plan, pr_candidate, pr_demo_pin, pr_consumer_pins, pr_runner_interface]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.runtime_required == 'true' && needs.pr_candidate.result == 'success' && needs.pr_runner_interface.result == 'success' && (needs.pr_demo_pin.result == 'success' || needs.pr_consumer_pins.result == 'success')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.pr_plan.outputs.runtime_matrix) }}
    uses: ./.github/workflows/pre-release-runtime-suite.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      demo_ref: ${{ needs.pr_demo_pin.outputs.demo_ref || needs.pr_consumer_pins.outputs.demo_ref }}
      runtime: ${{ matrix.runtime }}
      gate: ${{ matrix.gate }}
      trusted_base_sha: ${{ needs.pr_plan.outputs.trusted_base_sha }}
      candidate_artifact: pr-exact-candidate-${{ github.event.pull_request.head.sha }}
      reuse_from: ${{ matrix.reuse_from || '' }}

  pr_owner_node_native:
    name: PR · Native Keycloak/Core · ${{ matrix.runtime }}
    needs: [pr_plan]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false && needs.pr_plan.outputs.owner_node_required == 'true'
    runs-on: ${{ matrix.runtime == 'podman' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      BASEHARBOR_TEST_RUNTIME: ${{ matrix.runtime }}
      BASEHARBOR_KEYCLOAK_SINGLE_NATIVE_ACCEPTANCE: '1'
      BASEHARBOR_SINGLE_DEFAULT_NATIVE_ACCEPTANCE: '1'
      DOCKER_CONTEXT: ''
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare native rootless runtime
        run: bash scripts/ci-core-rootless-runtime.sh
      - name: Execute mandatory native Keycloak/Core acceptance
        run: bash scripts/ci-owner-node-native.sh
      - name: Clean runtime
        if: always()
        run: bash scripts/ci-runtime-reset.sh ${{ matrix.runtime }}

  pr_selected_final:
    name: PR Selected Checks
    needs: [workflow_policy, source_format, pr_plan, pr_focused, pr_validations, pr_candidate, pr_consumer_pins, pr_demo_pin, pr_runner_interface, pr_runtime_selected, pr_public_contracts, pr_owner_node_native, pr_native_impact, pr_native_destroy, pr_native_greenfield_proof, pr_unit_shards]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.pr_plan.result == 'success'
        with:
          name: trusted-pr-plan
      - name: Require selected native acceptance before merge
        shell: bash
        env:
          NATIVE_SELECTION: ${{ needs.pr_native_impact.result }}
          NATIVE_REQUIRED: ${{ needs.pr_native_impact.outputs.required }}
          NATIVE_RESULT: ${{ needs.pr_native_destroy.result }}
        run: |
          set -euo pipefail
          test "$NATIVE_SELECTION" = success
          case "$NATIVE_REQUIRED" in
            true) test "$NATIVE_RESULT" = success ;;
            false) test "$NATIVE_RESULT" = skipped ;;
            *) echo "REJECT: no authoritative native impact classification" >&2; exit 1 ;;
          esac
      - name: Require complete selected Go shard coverage
        shell: bash
        env:
          UNIT_SCOPE: ${{ needs.pr_plan.outputs.unit_scope }}
          UNIT_RESULT: ${{ needs.pr_unit_shards.result }}
        run: |
          set -euo pipefail
          case "$UNIT_SCOPE" in
            full|cli) test "$UNIT_RESULT" = success ;;
            none) test "$UNIT_RESULT" = skipped ;;
            *) echo "REJECT: Go test selection missing or invalid" >&2; exit 1 ;;
          esac
      - name: Require normal selected job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_BASE: ${{ needs.pr_plan.outputs.trusted_base_sha }}
          CONTROLLER_SHA: ${{ needs.pr_plan.outputs.controller_sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_INTEGRATION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EVENT_BASE" "$EXPECTED_HEAD" "$EXPECTED_INTEGRATION" refs/heads/develop:refs/remotes/origin/final-target-tip
          target_tip="$(git rev-parse refs/remotes/origin/final-target-tip)"
          read -r -a parents <<< "$(git rev-list --parents -n 1 "$EXPECTED_INTEGRATION")"
          if [ "${#parents[@]}" -eq 3 ] && [ "${parents[2]}" = "$EXPECTED_HEAD" ]; then
            EXPECTED_BASE="${parents[1]}"
          elif [ "${#parents[@]}" -eq 2 ] && [ "$EXPECTED_INTEGRATION" = "$EXPECTED_HEAD" ]; then
            # Keep the plan's proven base if the branch advances again while
            # this run is in flight; ancestry is independently checked below.
            EXPECTED_BASE="$PLAN_BASE"
            [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_HEAD"
          else
            echo "candidate does not have the expected integration parents" >&2
            exit 1
          fi
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$EVENT_BASE" "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" "$target_tip"
          test "$EXPECTED_BASE" = "$PLAN_BASE"
          export EXPECTED_BASE
          python3 -c 'import json,os; p=json.load(open("pr-plan.json")); pairs=(("target_base_sha","EXPECTED_BASE"),("head_sha","EXPECTED_HEAD"),("integration_sha","EXPECTED_INTEGRATION")); assert all(p.get(k)==os.environ[v] for k,v in pairs), "stale PR integration inputs: replan required"'
          git fetch --no-tags origin "$CONTROLLER_SHA"
          git show "$CONTROLLER_SHA:scripts/pr-required-final.py" > "$RUNNER_TEMP/pr-required-final.py"
          python3 "$RUNNER_TEMP/pr-required-final.py" --plan pr-plan.json
      - name: Show consumer follow-up without blocking PR
        if: always() && needs.pr_plan.result == 'success'
        continue-on-error: true
        run: python3 scripts/pr-consumer-followup.py --plan pr-plan.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Show normal job results
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("| Job | Result |\n| --- | --- |\n")
              for name, job in json.loads(os.environ["CI_NEEDS"]).items():
                  out.write(f"| {name} | {job['result']} |\n")
          PYTHON

  pr_draft_focused:
    name: PR · Draft focused checks
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test only changed Go packages and CI routing
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mapfile -d '' -t changed < <(git diff --name-only -z --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          go_files=()
          packages=()
          module_changed=false
          ci_changed=false
          for file in "${changed[@]}"; do
            case "$file" in
              go.mod|go.sum) module_changed=true ;;
              .github/workflows/*|scripts/pr-*.py|scripts/test_pr_*.py|scripts/ci-*.sh|scripts/test_ci_*.py)
                ci_changed=true ;;
            esac
            case "$file" in
              *.go)
                if [ -f "$file" ]; then go_files+=("$file"); fi
                directory="${file%/*}"
                if [ "$directory" = "$file" ]; then
                  directory="."
                fi
                packages+=("$file")
                ;;
            esac
          done
          if [ "${#go_files[@]}" -gt 0 ]; then
            unformatted="$(gofmt -l "${go_files[@]}")"
            test -z "$unformatted" || { printf 'Unformatted Go source: %s\n' "$unformatted" >&2; exit 1; }
          fi
          if [ "$module_changed" = true ]; then
            go build ./...
          elif [ "${#packages[@]}" -gt 0 ]; then
            mapfile -t selected < <(python3 scripts/pr-draft-go-packages.py "${packages[@]}")
            test "${#selected[@]}" -gt 0
            go test "${selected[@]}" -count=1
          fi
          if [ "$ci_changed" = true ]; then
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
            python3 scripts/test_pr_incremental_reuse.py
            python3 scripts/test_pr_required_final.py
            python3 scripts/test_ci_check_routes.py
            python3 scripts/test_pr_gate_plan.py
            python3 scripts/test_pr_draft_go_packages.py
          fi
          echo "Draft checks completed for changed sources." >> "$GITHUB_STEP_SUMMARY"
