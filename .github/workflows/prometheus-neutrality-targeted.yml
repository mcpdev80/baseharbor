name: "Prometheus Runtime Neutrality Targeted"

run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - 'runtime-validation/targeted-prometheus-neutrality'
    paths:
      - '.ci/prometheus-neutrality-trigger'

permissions:
  contents: read

jobs:
  prometheus:
    name: Core · Prometheus Runtime Neutrality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/metrics/prometheus.go internal/metrics/realization.go
          if ! git diff --exit-code -- internal/metrics/prometheus.go internal/metrics/realization.go; then
            echo "Prometheus runtime-neutrality changes require gofmt; diff shown above." >&2
            exit 1
          fi

      - name: Compile focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/metrics ./internal/application ./internal/capability -run '^$' -count=1

      - name: Run Prometheus focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/metrics -count=1
