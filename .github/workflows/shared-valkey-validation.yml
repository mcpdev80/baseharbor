name: "Validation · Shared Valkey"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git ref or commit SHA to test
        required: true
        type: string
  push:
    branches:
      - runtime-validation/shared-valkey
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-valkey-validation
  cancel-in-progress: true

jobs:
  focused:
    runs-on: [self-hosted, Linux, X64, docker, baseharbor]
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset Docker runner state
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Check focused formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/application/shared_backends.go
            internal/application/shared_backends_test.go
            internal/application/shared_valkey_integration_test.go
            internal/application/runtime_postgres.go
            internal/application/runtime_lifecycle.go
            internal/application/runtime_contract.go
            internal/application/workload.go
            internal/application/provider_placement.go
            internal/application/provider_placement_test.go
            internal/application/provider_registry_test.go
            internal/capability/reference.go
            cmd/baha/app_apply.go
            cmd/baha/app_apply_lifecycle.go
            cmd/baha/app_doctor_collect.go
            cmd/baha/app_status_collect.go
          )
          bad="$(gofmt -l "${files[@]}")"
          test -z "$bad" || {
            echo "gofmt required:" >&2
            echo "$bad" >&2
            exit 1
          }

      - name: Run shared provider unit tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application -count=1 -run '^(TestSharedValkey|TestVerifySharedValkey|TestResolveProviderPlacement|TestReferenceProviderRegistry|TestRegisterReferenceProviders|TestProviderRegistry)'
          go test ./internal/capability -count=1 -run '^(TestReference|TestProvider|TestRegistry)'

      - name: Build affected CLI packages
        run: go test ./cmd/baha ./internal/capability -run '^$'

      - name: Run two-application shared Valkey integration
        env:
          BASEHARBOR_SHARED_VALKEY_INTEGRATION: "1"
        run: go test -p 1 ./internal/application -count=1 -run '^TestSharedValkeyTwoApplicationIsolationDestroy$' -v

      - name: Cleanup Docker runner state
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker
