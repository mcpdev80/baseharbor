name: "Test · Kubernetes Runtime Foundation"

on:
  push:
    branches:
      - 'feature/kubernetes-runtime-foundation'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: [self-hosted, Linux, X64, baseharbor, kubernetes, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          diff="$(gofmt -d \
            internal/workload \
            internal/artifact \
            internal/providers/runtime/kubernetes \
            internal/runtime/contract \
            internal/runtime/model \
            internal/application/workload_model.go \
            internal/application/workload_model_test.go)"
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            exit 1
          fi

      - name: Run foundation compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          go test \
            ./internal/artifact \
            ./internal/runtime \
            ./internal/workload \
            ./internal/providers/runtime/kubernetes \
            ./internal/application \
            ./internal/deployment \
            -count=1 -v

          go test ./cmd/baha \
            -run '^(TestRuntime|TestProvider|Test.*Workload.*)' \
            -count=1

      - name: Run real k3s provider lifecycle acceptance
        shell: bash
        env:
          BASEHARBOR_KUBERNETES_INTEGRATION: "1"
        run: |
          set -euo pipefail
          go test ./internal/providers/runtime/kubernetes \
            -run '^TestKubernetesRenderedWorkloadLifecycleOnCI$' \
            -count=1 -v
