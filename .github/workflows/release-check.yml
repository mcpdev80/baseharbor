name: release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Validate GoReleaser configuration
        run: goreleaser check

      - name: Validate curated release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{line=$0; sub(/^## \[/, "", line); sub(/\].*$/, "", line); print line; exit}' CHANGELOG.md)"
          test -n "$version"
          notes="docs/releases/v${version}.md"
          test -s "$notes"
          grep -Fq '# BaseHarbor v' "$notes"
          grep -Fq '## Added' "$notes"
          grep -Fq '## Changed' "$notes"
          grep -Fq '## Security' "$notes"
          grep -Fq '## Deprecated' "$notes"
          grep -Fq '## Removed' "$notes"
          grep -Fq '## Compatibility & upgrade notes' "$notes"

      - name: Build release snapshot
        run: goreleaser release --snapshot --clean --skip=publish

      - name: Verify release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name 'baseharbor_linux_*.tar.gz' | wc -l)" -eq 2
          grep -q 'baseharbor_linux_amd64.tar.gz' dist/checksums.txt
          grep -q 'baseharbor_linux_arm64.tar.gz' dist/checksums.txt
