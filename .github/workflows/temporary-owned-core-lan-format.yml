name: Temporary one-shot Core LAN TLS formatting
on:
  push:
    branches:
      - feat/0427-zero-friction-core-workstation-onboarding
    paths:
      - .github/workflows/temporary-owned-core-lan-format.yml
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/0427-zero-friction-core-workstation-onboarding
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Format owned-Core LAN implementation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          files=(
            cmd/baha/serve_managed_tls.go
            cmd/baha/serve_managed_lan_endpoint.go
            cmd/baha/serve_managed_lan_defaults.go
            cmd/baha/serve.go
            cmd/baha/onboarding_invite_command.go
            cmd/baha/onboarding_managed_service.go
            cmd/baha/workstation_enrollment.go
            internal/controlplaneruntime/server.go
            internal/controlplaneruntime/server_run.go
            internal/controlplaneruntime/workstation_only.go
            cmd/baha/serve_managed_tls_test.go
            cmd/baha/serve_managed_lan_endpoint_test.go
            internal/controlplaneruntime/server_test.go
            cmd/baha/serve_operator_oidc.go
          )
          gofmt -w "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
          git rm .github/workflows/temporary-owned-core-lan-format.yml
          git add -- "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No formatting changes"; exit 1; }
          git commit -m "style(onboard): format automatic Core LAN TLS and workstation-only API"
          git push origin HEAD:feat/0427-zero-friction-core-workstation-onboarding
