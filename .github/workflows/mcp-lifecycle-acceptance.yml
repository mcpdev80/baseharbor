name: "Acceptance · MCP Lifecycle"

run-name: "Acceptance · MCP Lifecycle · ${{ inputs.ref || github.ref_name }}"

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git ref or commit SHA to test
        required: true
        type: string
      all_runtimes:
        description: Run Docker and Podman jobs when used as a release gate
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: develop
        type: string
  push:
    branches:
      - 'runtime-validation/mcp/**'

concurrency:
  # Run-unique, non-cancelling orchestrator group: a workflow-level expression
  # cannot read the resolver job's output, so the resolved candidate SHA is
  # keyed only in the evidence jobs below (card 0428-249 accepted edit set).
  group: mcp-orchestrator-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Accepted edit set (card 0428-249): the resolver is the only place where a
  # branch-shaped input becomes a verified commit SHA. Resolution failure or a
  # checkout that differs from the resolver output fails every gate.
  resolve_candidate:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANDIDATE_REF"
          candidate_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  docker:
    needs: resolve_candidate
    concurrency:
      group: mcp-${{ needs.resolve_candidate.outputs.candidate_sha }}-docker-${{ github.run_id }}
      cancel-in-progress: false
    if: ${{ inputs.all_runtimes || !contains(github.ref_name, '/podman/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASEHARBOR_TEST_RUNTIME: docker
      BASEHARBOR_MCP_LIFECYCLE_ACCEPTANCE: "true"

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_candidate.outputs.candidate_sha }}
      - name: Assert exact candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

      - name: Prepare verified rootless runtime
        timeout-minutes: 10
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset persistent runner state
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh docker

      - name: Run generic-client lifecycle acceptance
        run: go test -p 1 ./cmd/baha -run '^TestMCPGenericClientRealApplicationLifecycle$' -count=1 -v

      - name: Show runtime diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          for id in $(docker ps -aq); do
            docker logs "$id" || true
          done

      - name: Cleanup persistent runner state
        if: always()
        run: bash scripts/ci-runtime-reset.sh docker

  podman:
    needs: resolve_candidate
    concurrency:
      group: mcp-${{ needs.resolve_candidate.outputs.candidate_sha }}-podman-${{ github.run_id }}
      cancel-in-progress: false
    if: ${{ inputs.all_runtimes || contains(github.ref_name, '/podman/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BASEHARBOR_TEST_RUNTIME: podman
      BASEHARBOR_MCP_LIFECYCLE_ACCEPTANCE: "true"

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve_candidate.outputs.candidate_sha }}
      - name: Assert exact candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.resolve_candidate.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"

      - name: Prepare verified rootless runtime
        timeout-minutes: 10
        run: bash scripts/ci-core-rootless-runtime.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reset persistent runner state
        timeout-minutes: 3
        run: bash scripts/ci-runtime-reset.sh podman

      - name: Verify Quadlet-only runtime
        shell: bash
        run: |
          set -euo pipefail
          podman info >/dev/null
          generator=""
          for candidate in             "$(command -v podman-system-generator 2>/dev/null || true)"             /usr/lib/systemd/system-generators/podman-system-generator             /usr/libexec/podman/quadlet
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              generator="$candidate"
              break
            fi
          done
          test -n "$generator"
          verify_unit_dir="$RUNNER_TEMP/mcp-quadlet-verify"
          rm -rf "$verify_unit_dir"
          mkdir -p "$verify_unit_dir"
          QUADLET_UNIT_DIRS="$verify_unit_dir" "$generator" --user --dryrun >/dev/null

          mkdir -p "$RUNNER_TEMP/baseharbor-runtime-path"
          cat >"$RUNNER_TEMP/baseharbor-runtime-path/docker" <<'EOF'
          #!/bin/sh
          exit 127
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-runtime-path/docker"
          echo "$RUNNER_TEMP/baseharbor-runtime-path" >> "$GITHUB_PATH"

          cat >"$RUNNER_TEMP/baseharbor-no-compose" <<'EOF'
          #!/bin/sh
          echo "podman compose is forbidden in Quadlet MCP lifecycle acceptance" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/baseharbor-no-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/baseharbor-no-compose" >> "$GITHUB_ENV"

      - name: Create Podman test target
        run: go run ./cmd/baha target create podman-ci --provider podman --access podman-ci --reference local --default

      - name: Run generic-client lifecycle acceptance
        run: go test -p 1 ./cmd/baha -run '^TestMCPGenericClientRealApplicationLifecycle$' -count=1 -v

      - name: Show Quadlet diagnostics on failure
        if: failure()
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}"
          systemctl --user --failed --no-pager || true
          systemctl --user list-units 'baseharbor*' --all --no-pager || true
          podman ps -a || true

      - name: Cleanup persistent runner state
        if: always()
        run: bash scripts/ci-runtime-reset.sh podman
