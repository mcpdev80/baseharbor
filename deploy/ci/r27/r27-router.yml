# Dormant proposal. Install only after independent qualification and v0.4.26 closeout.
name: R27 Candidate Router
on:
  pull_request_target:
    branches: [develop]
    types: [opened, ready_for_review, labeled]
  push:
    branches: [develop]
permissions: {}
jobs:
  dispatch:
    if: >-
      vars.R27_CI_ENABLED == 'true' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:validate')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.R27_TRUSTED_EXECUTOR_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r deploy/ci/r27/requirements.txt
      - name: Dispatch fixed-source candidate executor
        env:
          GH_TOKEN: ${{ github.token }}
          R27_CI_ENABLED: ${{ vars.R27_CI_ENABLED }}
          R27_TRUSTED_EXECUTOR_SHA: ${{ vars.R27_TRUSTED_EXECUTOR_SHA }}
          R27_POLICY_DIGEST: ${{ vars.R27_POLICY_DIGEST }}
        run: python3 scripts/r27-ci.py dispatch
