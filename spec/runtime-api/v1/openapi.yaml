openapi: 3.1.0
info:
  title: BaseHarbor Runtime Resource API
  version: 1.0.0
  description: |
    Provider-neutral application-time resource API for BaseHarbor workloads.
    This API is independent from any concrete capability provider.
servers:
  - url: http://localhost
    description: Local runtime endpoint; concrete transport address is deployment state.
paths:
  /v1/capabilities:
    get:
      operationId: listRuntimeCapabilities
      summary: List runtime capabilities available to the authenticated application
      responses:
        '200':
          description: Available runtime capabilities and allowed operations.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Capability'
        default:
          $ref: '#/components/responses/Problem'
  /v1/resources:
    post:
      operationId: createRuntimeResource
      summary: Request an application-owned logical resource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '200':
          description: Existing idempotent resource returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOperation'
        '202':
          description: Resource provisioning accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getRuntimeResource
      summary: Get an application-owned logical resource
      responses:
        '200':
          description: Resource state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRuntimeResource
      summary: Request deletion of an application-owned logical resource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOperation'
        '204':
          description: Resource already absent.
        default:
          $ref: '#/components/responses/Problem'
  /v1/resources/{resourceId}/binding:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getRuntimeResourceBinding
      summary: Get the application-facing binding for a ready resource
      responses:
        '200':
          description: Provider-neutral binding metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        default:
          $ref: '#/components/responses/Problem'
  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getRuntimeOperation
      summary: Get asynchronous operation state
      responses:
        '200':
          description: Operation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable caller-generated key used to make mutating requests idempotent.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Opaque BaseHarbor logical resource identifier.
      schema:
        type: string
        minLength: 1
  responses:
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Capability:
      type: object
      additionalProperties: false
      required: [capability, operations]
      properties:
        capability:
          type: string
          examples: [object-storage.s3]
        operations:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [runtime.create, runtime.get, runtime.delete, runtime.rotate]
    CreateResourceRequest:
      type: object
      additionalProperties: false
      required: [capability, name]
      properties:
        capability:
          type: string
          minLength: 1
          examples: [object-storage.s3]
        name:
          type: string
          minLength: 1
          maxLength: 128
          examples: [user-4711]
        parameters:
          type: object
          additionalProperties: true
          description: Capability-versioned portable parameters only; provider-specific fields are forbidden.
    ResourceOperation:
      type: object
      additionalProperties: false
      required: [resource, operation]
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        operation:
          $ref: '#/components/schemas/Operation'
    Resource:
      type: object
      additionalProperties: false
      required: [id, capability, name, state]
      properties:
        id:
          type: string
          minLength: 1
          examples: [object-storage.s3/user-4711]
        capability:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        state:
          type: string
          enum: [provisioning, ready, deleting, failed]
    Binding:
      type: object
      description: |
        Provider-neutral application-facing binding metadata. Secret material must not be returned
        through normal metadata fields; credentials use the BaseHarbor secure-binding/runtime-identity path.
      additionalProperties: true
      required: [resource_id, capability]
      properties:
        resource_id:
          type: string
        capability:
          type: string
        endpoint:
          type: string
        metadata:
          type: object
          additionalProperties: true
    Operation:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id:
          type: string
          minLength: 1
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        resource_id:
          type: string
        error:
          $ref: '#/components/schemas/Problem'
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
