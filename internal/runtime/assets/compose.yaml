services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    user: "postgres"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev
    environment:
      POSTGRES_DB: ${BASEHARBOR_POSTGRES_DB}
      POSTGRES_USER: ${BASEHARBOR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BASEHARBOR_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASEHARBOR_POSTGRES_USER} -d ${BASEHARBOR_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao:
    image: docker.io/openbao/openbao:2.7.0
    restart: unless-stopped
    user: "100"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /openbao/config:rw,noexec,nosuid,nodev,mode=1777
    command: server
    environment:
      SKIP_CHOWN: "1"
      BAO_ADDR: http://127.0.0.1:8200
      BAO_LOCAL_CONFIG: >-
        {"ui":true,"disable_mlock":true,"storage":{"raft":{"path":"/openbao/raft","node_id":"baseharbor-1"}},"listener":{"tcp":{"address":"0.0.0.0:8200","cluster_address":"0.0.0.0:8201","tls_disable":true}},"api_addr":"http://127.0.0.1:8200","cluster_addr":"http://openbao:8201"}
    volumes:
      - openbao-data:/openbao/raft
    networks:
      - default
      - secrets
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  openbao-data:

networks:
  default: {}
  secrets:
    name: baseharbor-secrets
    internal: true
