services:
  postgres-etcd-1:
    image: gcr.io/etcd-development/etcd:v3.7.2
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/etcd", "--name=postgres-etcd-1", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://postgres-etcd-1:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://postgres-etcd-1:2380", "--initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380", "--initial-cluster-token=baseharbor-postgres", "--initial-cluster-state=new"]
    volumes:
      - postgres-etcd-data-1:/etcd-data

  postgres-etcd-2:
    image: gcr.io/etcd-development/etcd:v3.7.2
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/etcd", "--name=postgres-etcd-2", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://postgres-etcd-2:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://postgres-etcd-2:2380", "--initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380", "--initial-cluster-token=baseharbor-postgres", "--initial-cluster-state=new"]
    volumes:
      - postgres-etcd-data-2:/etcd-data

  postgres-etcd-3:
    image: gcr.io/etcd-development/etcd:v3.7.2
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/etcd", "--name=postgres-etcd-3", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://postgres-etcd-3:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://postgres-etcd-3:2380", "--initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380", "--initial-cluster-token=baseharbor-postgres", "--initial-cluster-state=new"]
    volumes:
      - postgres-etcd-data-3:/etcd-data

  postgres-member-1:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    hostname: postgres-member-1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o postgres -g postgres -m 0700 /run/baseharbor/tls-runtime
        install -o postgres -g postgres -m 0600 /run/baseharbor/tls-source/server-key.pem /run/baseharbor/tls-runtime/server-key.pem
        exec /bin/sh /launch.sh
    environment:
      SPILO_PROVIDER: local
      SCOPE: baseharbor-control-postgres
      PGROOT: /home/postgres/pgdata/pgroot
      PGVERSION: "18"
      ETCD3_HOSTS: "'postgres-etcd-1:2379','postgres-etcd-2:2379','postgres-etcd-3:2379'"
      PGUSER_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_USER:-postgres}
      PGPASSWORD_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_PASSWORD}
      PGUSER_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication}
      PGPASSWORD_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_PASSWORD}
      SSL_CERTIFICATE_FILE: /run/baseharbor/tls/server-cert.pem
      SSL_PRIVATE_KEY_FILE: /run/baseharbor/tls-runtime/server-key.pem
      SSL_TEST_RELOAD: "true"
      SPILO_CONFIGURATION: '{"postgresql":{"pg_hba":["local all all trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} trust","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} all scram-sha-256","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} all scram-sha-256","hostssl all all all scram-sha-256","hostnossl all all all reject"],"connect_address":"postgres-member-1:5432"},"restapi":{"connect_address":"postgres-member-1:8008"}}'
    tmpfs:
      - /run/baseharbor/tls-runtime:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - postgres-data-1:/home/postgres/pgdata/pgroot
      - ./providers/postgresql/runtime/server-cert.pem:/run/baseharbor/tls/server-cert.pem:ro
      - ./providers/postgresql/runtime/server-key.pem:/run/baseharbor/tls-source/server-key.pem:ro

  postgres-member-2:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    hostname: postgres-member-2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o postgres -g postgres -m 0700 /run/baseharbor/tls-runtime
        install -o postgres -g postgres -m 0600 /run/baseharbor/tls-source/server-key.pem /run/baseharbor/tls-runtime/server-key.pem
        exec /bin/sh /launch.sh
    environment:
      SPILO_PROVIDER: local
      SCOPE: baseharbor-control-postgres
      PGROOT: /home/postgres/pgdata/pgroot
      PGVERSION: "18"
      ETCD3_HOSTS: "'postgres-etcd-1:2379','postgres-etcd-2:2379','postgres-etcd-3:2379'"
      PGUSER_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_USER:-postgres}
      PGPASSWORD_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_PASSWORD}
      PGUSER_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication}
      PGPASSWORD_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_PASSWORD}
      SSL_CERTIFICATE_FILE: /run/baseharbor/tls/server-cert.pem
      SSL_PRIVATE_KEY_FILE: /run/baseharbor/tls-runtime/server-key.pem
      SSL_TEST_RELOAD: "true"
      SPILO_CONFIGURATION: '{"postgresql":{"pg_hba":["local all all trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} trust","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} all scram-sha-256","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} all scram-sha-256","hostssl all all all scram-sha-256","hostnossl all all all reject"],"connect_address":"postgres-member-2:5432"},"restapi":{"connect_address":"postgres-member-2:8008"}}'
    tmpfs:
      - /run/baseharbor/tls-runtime:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - postgres-data-2:/home/postgres/pgdata/pgroot
      - ./providers/postgresql/runtime/server-cert.pem:/run/baseharbor/tls/server-cert.pem:ro
      - ./providers/postgresql/runtime/server-key.pem:/run/baseharbor/tls-source/server-key.pem:ro

  postgres-member-3:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    hostname: postgres-member-3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o postgres -g postgres -m 0700 /run/baseharbor/tls-runtime
        install -o postgres -g postgres -m 0600 /run/baseharbor/tls-source/server-key.pem /run/baseharbor/tls-runtime/server-key.pem
        exec /bin/sh /launch.sh
    environment:
      SPILO_PROVIDER: local
      SCOPE: baseharbor-control-postgres
      PGROOT: /home/postgres/pgdata/pgroot
      PGVERSION: "18"
      ETCD3_HOSTS: "'postgres-etcd-1:2379','postgres-etcd-2:2379','postgres-etcd-3:2379'"
      PGUSER_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_USER:-postgres}
      PGPASSWORD_SUPERUSER: ${BASEHARBOR_POSTGRES_INTERNAL_PASSWORD}
      PGUSER_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication}
      PGPASSWORD_STANDBY: ${BASEHARBOR_POSTGRES_REPLICATION_PASSWORD}
      SSL_CERTIFICATE_FILE: /run/baseharbor/tls/server-cert.pem
      SSL_PRIVATE_KEY_FILE: /run/baseharbor/tls-runtime/server-key.pem
      SSL_TEST_RELOAD: "true"
      SPILO_CONFIGURATION: '{"postgresql":{"pg_hba":["local all all trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} trust","local replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} trust","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_USER:-baseharbor_replication} all scram-sha-256","hostssl replication ${BASEHARBOR_POSTGRES_REPLICATION_PREVIOUS_USER:-baseharbor_replication} all scram-sha-256","hostssl all all all scram-sha-256","hostnossl all all all reject"],"connect_address":"postgres-member-3:5432"},"restapi":{"connect_address":"postgres-member-3:8008"}}'
    tmpfs:
      - /run/baseharbor/tls-runtime:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - postgres-data-3:/home/postgres/pgdata/pgroot
      - ./providers/postgresql/runtime/server-cert.pem:/run/baseharbor/tls/server-cert.pem:ro
      - ./providers/postgresql/runtime/server-key.pem:/run/baseharbor/tls-source/server-key.pem:ro

  postgres:
    image: docker.io/library/haproxy:3.2.23-alpine
    restart: unless-stopped
    depends_on:
      postgres-member-1:
        condition: service_started
      postgres-member-2:
        condition: service_started
      postgres-member-3:
        condition: service_started
    user: "99:99"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    ports:
      - "127.0.0.1:${BASEHARBOR_POSTGRES_PORT}:5432"
    volumes:
      - ./providers/postgresql/runtime/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  postgres-admin:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-ec", "trap : TERM INT; sleep infinity & wait"]
    environment:
      PGPASSWORD: ${BASEHARBOR_POSTGRES_PASSWORD}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev
    volumes:
      - ./providers/postgresql/runtime/ca.pem:/run/baseharbor/postgres-ca/ca.pem:ro

  postgres-init:
    image: docker.io/library/postgres:18-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${BASEHARBOR_POSTGRES_INTERNAL_USER:-postgres}
      POSTGRES_DB: postgres
      PGPASSWORD: ${BASEHARBOR_POSTGRES_INTERNAL_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/baseharbor/postgres-ca/ca.pem
      PGCONNECT_TIMEOUT: "1"
      BASEHARBOR_POSTGRES_USER: ${BASEHARBOR_POSTGRES_USER}
      BASEHARBOR_POSTGRES_PASSWORD: ${BASEHARBOR_POSTGRES_PASSWORD}
      BASEHARBOR_POSTGRES_DB: ${BASEHARBOR_POSTGRES_DB}
      BASEHARBOR_OPENBAO_DB_USER: ${BASEHARBOR_OPENBAO_DB_USER:-openbao}
      BASEHARBOR_OPENBAO_DB_PASSWORD: ${BASEHARBOR_OPENBAO_DB_PASSWORD}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev
    volumes:
      - ./providers/postgresql/runtime/ca.pem:/run/baseharbor/postgres-ca/ca.pem:ro
      - ./providers/postgresql/runtime/openbao-init.sh:/run/baseharbor/openbao-init.sh:ro
    command:
      - /bin/sh
      - -ec
      - |
        attempts=0
        until /bin/sh /run/baseharbor/openbao-init.sh; do
          attempts=$$((attempts+1))
          if [ "$${attempts}" -ge 90 ]; then
            echo "BaseHarbor PostgreSQL HA endpoint did not become SQL-ready for initialization" >&2
            exit 1
          fi
          sleep 1
        done

  openbao-member-1:
    image: docker.io/openbao/openbao:2.7.0
    restart: unless-stopped
    user: "100"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /openbao/config:rw,noexec,nosuid,nodev,mode=1777
    command: ["server", "-config=/run/baseharbor/openbao/openbao.hcl"]
    environment:
      SKIP_CHOWN: "1"
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /run/baseharbor/openbao/ca.pem
      BAO_CLUSTER_ADDR: https://openbao-member-1:8201
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./providers/openbao/runtime/openbao.hcl:/run/baseharbor/openbao/openbao.hcl:ro
      - ./providers/openbao/runtime/ca.pem:/run/baseharbor/openbao/ca.pem:ro
      - ./providers/openbao/runtime/server-cert.pem:/run/baseharbor/openbao/server-cert.pem:ro
      - ./providers/openbao/runtime/server-key.pem:/run/baseharbor/openbao/server-key.pem:ro
      - ./providers/postgresql/runtime/ca.pem:/run/baseharbor/postgres-ca/ca.pem:ro
    networks:
      - default
      - secrets

  openbao-member-2:
    image: docker.io/openbao/openbao:2.7.0
    restart: unless-stopped
    user: "100"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /openbao/config:rw,noexec,nosuid,nodev,mode=1777
    command: ["server", "-config=/run/baseharbor/openbao/openbao.hcl"]
    environment:
      SKIP_CHOWN: "1"
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /run/baseharbor/openbao/ca.pem
      BAO_CLUSTER_ADDR: https://openbao-member-2:8201
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./providers/openbao/runtime/openbao.hcl:/run/baseharbor/openbao/openbao.hcl:ro
      - ./providers/openbao/runtime/ca.pem:/run/baseharbor/openbao/ca.pem:ro
      - ./providers/openbao/runtime/server-cert.pem:/run/baseharbor/openbao/server-cert.pem:ro
      - ./providers/openbao/runtime/server-key.pem:/run/baseharbor/openbao/server-key.pem:ro
      - ./providers/postgresql/runtime/ca.pem:/run/baseharbor/postgres-ca/ca.pem:ro
    networks:
      - default
      - secrets

  openbao-member-3:
    image: docker.io/openbao/openbao:2.7.0
    restart: unless-stopped
    user: "100"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /openbao/config:rw,noexec,nosuid,nodev,mode=1777
    command: ["server", "-config=/run/baseharbor/openbao/openbao.hcl"]
    environment:
      SKIP_CHOWN: "1"
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /run/baseharbor/openbao/ca.pem
      BAO_CLUSTER_ADDR: https://openbao-member-3:8201
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./providers/openbao/runtime/openbao.hcl:/run/baseharbor/openbao/openbao.hcl:ro
      - ./providers/openbao/runtime/ca.pem:/run/baseharbor/openbao/ca.pem:ro
      - ./providers/openbao/runtime/server-cert.pem:/run/baseharbor/openbao/server-cert.pem:ro
      - ./providers/openbao/runtime/server-key.pem:/run/baseharbor/openbao/server-key.pem:ro
      - ./providers/postgresql/runtime/ca.pem:/run/baseharbor/postgres-ca/ca.pem:ro
    networks:
      - default
      - secrets

  openbao:
    image: docker.io/library/haproxy:3.2.23-alpine
    restart: unless-stopped
    depends_on:
      openbao-member-1:
        condition: service_started
      openbao-member-2:
        condition: service_started
      openbao-member-3:
        condition: service_started
    user: "99:99"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    ports:
      - "127.0.0.1:${BASEHARBOR_OPENBAO_PORT}:8200"
    volumes:
      - ./providers/openbao/runtime/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      default:
        aliases:
          - openbao
      secrets:
        aliases:
          - openbao

  openbao-admin:
    image: docker.io/openbao/openbao:2.7.0
    restart: unless-stopped
    user: "100"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/baseharbor/openbao/ca.pem
    volumes:
      - ./providers/openbao/runtime/ca.pem:/run/baseharbor/openbao/ca.pem:ro
    networks:
      - default

volumes:
  postgres-data-1:
  postgres-data-2:
  postgres-data-3:
  postgres-etcd-data-1:
  postgres-etcd-data-2:
  postgres-etcd-data-3:

networks:
  default: {}
  secrets:
    name: baseharbor-secrets
    internal: true
